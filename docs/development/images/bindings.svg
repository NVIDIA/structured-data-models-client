<title id="title">Bindings and ownership</title>
<rect width="900" height="760" fill="white"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
<text x="450" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#222">Bindings and ownership</text>
<rect x="70" y="80" width="355" height="130" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="2"/>
<text x="247.5" y="109" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Python</text>
<text x="247.5" y="134" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">PyO3 / sdm-py</text>
<text x="247.5" y="159" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">maturin wheel, abi3</text>
<text x="247.5" y="184" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">Arrow admission through PyCapsule</text>
<rect x="475" y="80" width="355" height="130" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="2"/>
<text x="652.5" y="109" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Java</text>
<text x="652.5" y="134" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">JNI / sdm-jni</text>
<text x="652.5" y="159" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">JAR + platform native library</text>
<text x="652.5" y="184" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">Arrow Java C Data admission</text>
<rect x="165" y="280" width="570" height="155" rx="10" fill="#fdf3e6" stroke="#c9781c" stroke-width="2"/>
<text x="450.0" y="309" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">sdm-host: native boundary machinery</text>
<text x="450.0" y="334" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">Versioned messages, Arrow admission and resource ownership</text>
<text x="450.0" y="359" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">Run lifetime, busy-state checks and panic containment</text>
<text x="450.0" y="384" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">Bindings depend on sdm-host and sdm-contract</text>
<rect x="165" y="500" width="570" height="105" rx="10" fill="#fdf3e6" stroke="#c9781c" stroke-width="2"/>
<text x="450.0" y="529" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">sdm-core and engine crates</text>
<text x="450.0" y="554" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">Run state machine, schema, sampling, requests and results</text>
<text x="450.0" y="579" text-anchor="middle" font-size="17" font-weight="normal" fill="#222">Current PQL implementation: repository Rust sdm-pql</text>
<path d="M247,210 L247,280" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M652,210 L652,280" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M450,435 L450,500" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
<text x="535" y="472" text-anchor="middle" font-size="15" fill="#444">typed operations</text>
<text x="450" y="650" text-anchor="middle" font-size="16" fill="#444">Typed attachments retain their owners until consumed or released.</text>
<text x="450" y="678" text-anchor="middle" font-size="16" fill="#444">Arrow exchange can share buffers; input normalization and algorithms may allocate.</text>
<text x="450" y="706" text-anchor="middle" font-size="16" fill="#444">Bindings adapt runtime objects and logging; engine policy has no Python/Java dependency.</text>
<text x="450" y="734" text-anchor="middle" font-size="16" fill="#444">No user sorting callbacks or external C++ PQL runtime are part of this engine.</text>
</svg>
