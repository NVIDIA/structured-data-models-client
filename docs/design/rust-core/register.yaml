# --- Determinism fixes of the reference (T0.3) --------------------------------

- id: DF-1
  title: Stable neighbor sort, whether or not torch is installed
  kind: change
  old_behavior: >-
    On main, neighbors sharing a parent and a timestamp were ordered by torch's
    sort when torch was importable and by numpy's quicksort otherwise.
  new_behavior: >-
    The reference (d1590a1, from bdc4f2d4) orders them by a stable numpy sort,
    so by source row, in both cases; the core reproduces the reference.
  affected_inputs: >-
    In-memory relational requests whose sampled neighbors tie on parent and
    timestamp, without torch installed.
  cases: [T0.3]
  refs: [bdc4f2d4]
  status: approved
  approved_by: reviewer
  decision_ref: null
  notes: >-
    On the tie fixture, two of two scenarios send a different neighbor without
    torch; with torch 2.14.1 the old and new answers are equal. The recorded
    wire payloads have no such ties. Recommendation: approve; it removes a
    dependency on an optional install and refuses nothing, so the reviewer can
    approve it. Approved by the independent reviewer, who re-ran the evidence;
    the entry refuses no input Python accepted.

- id: DF-2
  title: Seeded SQLite entity draw
  kind: change
  old_behavior: >-
    A seeded SQLite request drew with ORDER BY RANDOM() LIMIT n, ignoring the
    seed, so every call drew different rows.
  new_behavior: >-
    The rows whose integer key, or else rowid, hashes lowest under a cubic
    polynomial modulo 2**31 - 1, with coefficients from
    random_state(seed).randint(0, 2**31 - 1, size=4); ties by key, then rowid
    (f0f324c). The exact stream is RS-2.
  affected_inputs: >-
    SQLite push-down requests with a seed and without explicit entity ids;
    unseeded requests are unchanged.
  cases: [T0.3]
  refs: [2e48359f, 100872a9]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-0/decisions.md, row: 28}
  notes: D2. There was no repeatable old answer to preserve.

- id: DF-3
  title: No seed warning on SQLite
  kind: change
  old_behavior: A seeded SQLite sample warned once that random_seed is ignored.
  new_behavior: >-
    SQLite does not warn, since it now honors the seed; Snowflake still warns,
    and the random_seed docstrings in rfm.py say so.
  affected_inputs: Seeded SQLite push-down requests.
  cases: [T0.3]
  refs: [f0f324c]
  status: approved
  approved_by: reviewer
  decision_ref: null
  notes: >-
    Follows from DF-2 (the warning would be false). Recommendation: approve with
    DF-2; the reviewer can approve it. Approved by the independent reviewer, who
    re-ran the evidence; the entry refuses no input Python accepted.

- id: DF-4
  title: Seeds of 2**32 and above for the SQLite draw
  kind: change
  old_behavior: >-
    The seed did not reach the SQLite draw; RandomState(seed) would raise for
    seeds of 2**32 and above.
  new_behavior: >-
    random_state seeds MT19937 with the seed's 32-bit words, least significant
    first (init_by_array), so every non-negative seed is accepted on SQLite.
  affected_inputs: SQLite push-down requests with a seed of 2**32 or more.
  cases: [T0.3]
  refs: [f0f324c]
  status: approved
  approved_by: reviewer
  decision_ref: null
  notes: >-
    Accepts more, refuses nothing. Recommendation: approve; the seed range
    across backends is RS-7. Approved by the independent reviewer, who re-ran
    the evidence; the entry refuses no input Python accepted.

- id: DF-5
  title: RandomState example shuffle (not adopted)
  kind: change
  old_behavior: The example shuffle in sample_target draws from numpy default_rng.
  new_behavior: >-
    Proposed by 508845fe (with f2f5b86c and c9695f3c): draw it from a
    RandomState stream, which reorders the relational/pql-count-aggregation
    golden payload under a fixed seed.
  affected_inputs: Every relational request on every backend that samples training or test examples.
  cases: [T0.3]
  refs: [508845fe, f2f5b86c, c9695f3c]
  status: rejected
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-0/decisions.md, row: 27}
  notes: D1. The reference keeps default_rng, so the core ports it (RS-1).

# --- Random streams (T0.6) ----------------------------------------------------

- id: RS-1
  title: The example shuffle (default_rng)
  kind: keep
  old_behavior: >-
    sample_target makes one np.random.default_rng(random_seed) per call and
    shuffles candidate positions in place, in its fixed call order; None draws
    OS entropy.
  new_behavior: >-
    The same stream: SeedSequence(seed).generate_state(4, uint64), PCG64 in
    setseq order, 32-bit draws from halves of 64-bit outputs, masked rejection
    for bounded draws, and Fisher-Yates from n - 1 down to 1, in
    sample_target's call order; any non-negative seed, including 2**64 and
    above; None draws OS entropy.
  affected_inputs: Every relational request that samples training, test or forecast entities.
  cases: [T0.6]
  refs: [G1]
  status: approved
  approved_by: reviewer
  decision_ref: {file: docs/design/rust-core/phase-0/decisions.md, row: 27}
  notes: >-
    Required by D1 and PK-1; verified in plain Python against numpy 2.5.3.
    Recommendation: approve. Approved by the independent reviewer, who re-ran
    the evidence; the entry refuses no input Python accepted.

- id: RS-2
  title: The SQLite seeded entity draw
  kind: keep
  old_behavior: >-
    The reference's draw of DF-2: MT19937 coefficients from random_state(seed),
    the cubic hash written in decimal in the SQL, and the integer key or rowid
    fallback.
  new_behavior: >-
    The same coefficients, the same SQL text (ORDER BY hash, key, rowid LIMIT n,
    or hash of rowid, rowid), and the same key choice; seeds of any size.
  affected_inputs: SQLite push-down requests with a seed and without explicit entity ids.
  cases: [T0.6]
  refs: [G2]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-0/decisions.md, row: 28}
  notes: D2 makes this a stream the core must reproduce. Unseeded SQLite stays ORDER BY RANDOM().

- id: RS-3
  title: The in-memory neighbor draw (std::mt19937)
  kind: keep
  old_behavior: >-
    NeighborSampler seeds std::mt19937 with 123 by default; with a seed it
    reseeds before every subgraph, without one the stream continues across
    batches and requests on the model; Floyd's draw with rng() % (i + 1),
    only on static hops larger than their count.
  new_behavior: The same stream, including the modulo bias and the continuing unseeded stream.
  affected_inputs: In-memory relational requests with static hops larger than their neighbor count.
  cases: [T0.6]
  refs: [G4]
  status: approved
  approved_by: reviewer
  decision_ref: null
  notes: >-
    std::mt19937 seeding equals numpy init_genrand, checked on raw draws.
    Recommendation: approve. Approved by the independent reviewer, who re-ran
    the evidence; the entry refuses no input Python accepted.

- id: RS-4
  title: The in-memory entity sample (DataFrame.sample)
  kind: change
  old_behavior: >-
    pkey_map.sample(n, random_state=seed) equals
    RandomState(seed).permutation(len)[:n] in drawn order; with None, pandas
    draws from numpy's process-wide global RandomState, which np.random.seed
    moves.
  new_behavior: >-
    Seeded: the same permutation, in drawn order. None: draws from OS
    entropy, since the core cannot see numpy's global stream.
  affected_inputs: >-
    In-memory relational requests without entity ids on tables larger than the
    sample; the change concerns only random_seed=None.
  cases: [T0.6]
  refs: [G3]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-0/decisions.md, row: 30}
  notes: >-
    Owner decision 30 chose OS entropy for None; the only loss is that a
    user's np.random.seed no longer makes an unseeded request repeatable. The
    seeded part is a plain keep.

- id: RS-5
  title: The tabular context sample
  kind: keep
  old_behavior: >-
    A single-table request with more context rows than the endpoint accepts
    keeps RandomState(42).permutation(len)[:wanted], returned in table order;
    random_seed does not reach it.
  new_behavior: The same.
  affected_inputs: Tabular materialize with more context rows than the endpoint accepts.
  cases: [T0.6]
  refs: [G5]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: "Recommendation: approve."

- id: RS-6
  title: Warehouse sampling SQL text
  kind: keep
  old_behavior: >-
    DuckDB USING SAMPLE reservoir(n ROWS) REPEATABLE (seed); PostgreSQL
    setseed(x) with x = 2 * v / (2**64 - 1) - 1 from blake2b of the decimal
    seed; Snowflake SAMPLE ROW (n ROWS), capped at 1,000,000, warning once that
    the seed is ignored; Databricks TABLESAMPLE (p PERCENT) REPEATABLE (seed)
    with p written as Python's repr of a float, then LIMIT n.
  new_behavior: >-
    The same SQL text and bound values, with p formatted as Python's repr (Rust
    prints 1e-05 as 0.00001).
  affected_inputs: Push-down entity samples on DuckDB, PostgreSQL, Snowflake and Databricks.
  cases: [T0.6]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    The draws themselves belong to each database; Snowflake, Databricks LIMIT
    and PostgreSQL across servers are known non-repeatable. Independently
    executed nondeterministic draws are not required to select identical rows.
    Compare SQL, bound parameters and warnings exactly where specified, and
    check membership, cardinality and sampling invariants on the draws. Compare
    inference, payloads and results using the same captured or scripted input
    rows on both implementations; restrict exclusions to explicitly named
    nondeterministic fields. This is a Phase 1a comparator requirement.
    Recommendation: approve, formatting p as Python does rather than
    registering a SQL text change.

- id: RS-7
  title: The seed range per backend
  kind: keep
  old_behavior: >-
    In-memory accepts 0 to 2**31 - 1 (larger seeds refused with INVALID_REQUEST
    carrying pybind11's text, or ValueError from pandas from 2**32); DuckDB's
    parser rejects seeds from 2**31; SQLite and PostgreSQL accept any
    non-negative integer; Snowflake ignores the seed; Databricks not checked
    live.
  new_behavior: >-
    Keep the same ranges, refusing seeds from 2**31 on in-memory and DuckDB
    with a named INVALID_REQUEST.
  affected_inputs: Requests with random_seed of 2**31 or more on in-memory frames or DuckDB.
  cases: [T0.6]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-0/decisions.md, row: 30}
  notes: >-
    Owner decision 30 keeps today's refusals, with no regression and no new
    stream to define. The refusal message changes from pybind11's or pandas'
    text to a named one. As built at T1.22 (decision E58): the range is the
    provider's declared capability (max_seed), which sdm-data gives DuckDB
    (2**31 - 1) and the core reads, refusing a larger seed with
    INVALID_REQUEST naming the seed and max_seed. Measured at T1.22 on the
    reference: its client raises DuckDB's parser error for such a seed as
    INTERNAL_ERROR, so the code moves to the INVALID_REQUEST this entry
    names.

# --- Dates and time zones (T0.6) ----------------------------------------------

- id: DT-1
  title: Zone rules keep applying after 2099
  kind: keep
  old_behavior: >-
    pandas 3 with zoneinfo applies each zone's rule for every later year, so
    New York on 2100-07-01 12:00 UTC is 08:00 at UTC-4.
  new_behavior: >-
    The core continues applying each zone's recurring rules after 2099,
    including gaps and folds, as the reference using zoneinfo does; the 2099
    cutoff of the tested chrono-tz version is not accepted.
  affected_inputs: >-
    Local wall times and localization of instants from 2100 on (128 of 1,404
    zone answers in the check).
  cases: [T0.6]
  refs: [M4]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-0/decisions.md, row: 30}
  notes: >-
    Owner decision 30 requires continuation; the tested chrono-tz
    implementation does not satisfy this requirement.

- id: DT-2
  title: Zone database from the host, as today, with a bundled fallback
  kind: keep
  old_behavior: >-
    pandas 3 reads the host's zone database (2026c on the reference host),
    falling back to the tzdata package only when the host has none.
  new_behavior: >-
    The core also uses the host's zone database, falling back to a bundled
    copy only where the host has none (for example Windows); tests pin the
    database version so comparisons stay stable, and the version is recorded
    with every run.
  affected_inputs: >-
    Zones whose rules differ between database versions; in the check, all 88
    differences were Africa/Casablanca from 2036 on.
  cases: [T0.6]
  refs: [M5]
