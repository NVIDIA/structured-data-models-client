- id: P1B-2
  title: Schema.from_source on the core route refuses what T1.11b's thin describe_source does not infer yet
  kind: change
  old_behavior: >-
    The reference describes any DuckDB source Schema.from_source can read:
    tables named or every table, keys, time columns and relationships given,
    keys that repeat or miss values (warned, declined or refused by its
    rules), text that holds dates or several categories, a tie between key
    candidates, several timestamps, a time-of-day (TIME) column (refused as
    a time column for its values, with a warning), a preview of a whole
    1,000 rows, a table keyed by the column declared foreign keys refer to;
    an empty table is refused with a RuntimeError.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, a
    DuckDB source's Schema.from_source with no tables named runs on the
    core's describe_source (T1.11b), which infers by the reference's rules
    only on the paths it ports and refuses every other input with
    UNSUPPORTED_REQUEST naming the rule, never a value (fields operation and
    rule): column_type (a struct or a map, P1B-10, and a list of other
    than integers, floats or text, P1B-51; from T1.32c binary and a
    duration are left out with the reference's warning, as the reference
    leaves them out, a duration by the reference's _WIRE_DTYPE, which no
    DuckDB source reaches), float_nan, float_signed_zero,
    text_time, multicategorical, key_type, key_name_order, key_tie,
    composite_key (a key of several columns named) and empty_table
    (P1B-11). T1.21d removed
    key_by_reference and time_name (E55); T1.23 removed tables_named,
    primary_keys, time_columns, time_of_day, time_values and time_several
    (E59): tables named beside their source names, keys and time columns
    named and relationships given are taken, a timestamp is passed over
    for its values, a creation stamp or the earliest of several is taken,
    a time of day is passed over as holding no time, and a list column is
    left out, as the reference does. From T1.24 (E61) a call with tables
    named has a core route (schema.from-source/tables/duckdb), and the
    schema bridge refuses neither relationships nor a time column cleared
    (None), which the core takes (contract version 13): the rules
    relationships and time_column_cleared are gone. From T1.25 the core
    read text as dates as the reference's engine does (DT-7), over
    date-rules.md's shapes, refusing text_time where that reading took a
    rule outside them; from T1.25b (E68) it reads text by its own list of
    formats (date-rules.md, "The core's text formats"), and text_time
    refuses, in inference, text the list does not read that could make the
    score (under a name that says time, any such value; under another, one
    in the client's shapes), and in materialize a value outside the list
    (DT-15); offsets mixed are refused by name (text_time_zones, DT-11), and
    an order of day and month the values leave open by text_time_order
    (DT-16). Measured at T1.25b over the T0.6 corpus's 121 column cases as
    source columns under two names, neither saying time to the score: the
    core describes 60 of the 242 as the reference does, warnings included;
    on 36 it decides, as the reference does, that the text is no timestamp
    and then refuses multicategorical; it refuses 98 by text_time (DT-15)
    and 14 by text_time_zones (6 of them the reference refuses unnamed,
    DT-11); 34 it reads otherwise in the list (DT-16). DuckDB system views
    named as a table (pg_class; duckdb_columns over a source of one table),
    which the core refused by text_time at T1.24 and T1.25, are described
    from T1.25b as the reference describes them (pinned by the client's
    tests/test_the_schema_route.py). A key of one column given as
    a sequence (['user_id'] or ('user_id',)), which the reference keeps as
    a tuple and infers no link to by name, is the column's name on the core
    route, whose description says no key's form, and a link to it is
    inferred (from T1.23 with every table, from T1.24 with tables named too;
    measured at T1.24's review, pinned with the materialize that follows by
    the client's tests/test_the_materialize_route.py); that reading is
    P1B-15's from T1.26b, approved by the owner for now. From T1.32e (E83)
    time_whole_table is gone: a preview of a whole 1,000 rows has its
    timestamps read over every row, as the reference reads them, and a
    named time column is taken on a table of any size (the test author's
    104 vectors of contract/time-inference-vectors.json, matched on both
    hosts); what remains different is P1B-38 and P1B-39. From T1.32e too
    (E84; the owner moved them out of Phase 2 on 2026-10-13) key_missing and
    key_repeats are gone: the keys counted are held to the reference's
    rules (_check_source_keys): a named key holding a null, or a named or
    declared key repeating in more than 1% of its rows, refused
    INVALID_REQUEST; an inferred key under 99% distinct declined; a key
    kept with nulls or repeats said (KEY_NO_VALUE, KEY_REPEATS, KEY_DECLINED)
    and its repeats counted (the test author's 45 vectors of
    contract/key-inference-vectors.json, matched on both hosts but
    P1B-40's). The default route is unchanged.
  affected_inputs: >-
    Schema.from_source over DuckDB under a forced core route, with any of the
    inputs above; base.regression is none of them, and its schema is the
    reference's.
  cases: []
  refs: [docs/design/rust-core/phase-1/not-yet-refusals.md, E92]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E88}
  notes: >-
    Proposed by the implementer of T1.11b (Phase 1 decisions row E38), for
    the owner: each is a refusal of an input the reference accepts, or, for
    an empty table, a named refusal in place of a RuntimeError (a time of
    day was taken as the time column before T1.11b's first review round
    found it; it is refused now), so it waits
    for the owner (P1B-1 process) and is never self-approved; the route is
    not a default anywhere, so no caller meets it. The tests that pin the
    refusals are diagnostic (base.regression is diagnostic until T1.29).
    Recommendation: approve as temporary, as DT-9 was for T1.6a; T1.23
    (inference and the catalog requests), T1.24 (the bridge with overrides
    and tables named) and T1.25 (text dates, DT-7) remove each rule's
    refusal, and this entry is set to rejected when the last one goes.
    T1.21b's refusal map (contract/refusal-maps/base.adventureworks.json)
    records which of these E27's AdventureWorks journey reaches and which
    task removes each, and T1.21e's family maps which the inventory's cases
    reach; they approve nothing. Approved by the owner on 2026-10-13, relayed by the orchestrator (E92), for the Phase 2 class only: composite_key, float_nan, float_signed_zero, key_name_order, key_tie stay refused by name until Phase 2 (docs/design/rust-core/phase-1/not-yet-refusals.md); key_missing and key_repeats left the class, moved by the owner into T1.32e part 1 the same day and ported there (E84). The entry's other rules stay proposed: time_whole_table, a bug fixed at T1.32e (E83), and multicategorical, to be ported, are T1.32e's by the owner's decisions of 2026-10-13; column_type is its family's (P1B-10 for a struct or a map, P1B-51 for a list), empty_table P1B-11's and key_type the keys family's (T1.32a); text_time is DT-15's.
    Closed as superseded by the owner on 2026-10-13 (night; the owner's
    answers, item 12, E88), recorded as approved by the owner since the
    register has no superseded status; it approves no outcome of its own. Its
    rules are E92's Phase 2 class (approved above), lifted at T1.32e
    (time_whole_table, multicategorical, key_missing, key_repeats: E83, E84,
    E86), or their families' entries (column_type: P1B-10 for a struct or a
    map, P1B-51 for a list; empty_table: P1B-11; key_type: the keys family,
    T1.32a) and text_time DT-15's. One question stays with the
    owner, on T1.33's list (as-built, T1.33): free text under a time-like name
    (rel-trial's outcomes.time_frame and designs.time_perspective), refused
    text_time by the core and described by the reference, as a Phase 2 refusal
    or as DT-17's permanent reading. Relayed by the orchestrator, recorded at
    T1.33 part 2; never the implementer's approval. The owner answered it on
    2026-10-14 (item 24, E120): a column whose values are not times is text
    under any name, and T1.33 part 3 reads it so.
    Its cases are emptied at T1.33 fix 3 (the orchestrator's decision):
    per-case entries now name every inventory case, and an approved entry
    listing a case in its cases would excuse that case's every difference from
    the reference, where this entry approves only E92's Phase 2 class. They
    were [base.regression, base.adventureworks, T1.11b, T1.21b, T1.21d,
    T1.21e, T1.23, T1.24, T1.25, T1.25b, T1.26a, T1.32c, T1.32d, T1.32e].

- id: P1B-3
  title: materialize on the core route refuses what T1.11c's thin route does not port yet
  kind: change
  old_behavior: >-
    The reference materializes any query its relational engine answers over
    a DuckDB source: every task kind (binary, multiclass, regression,
    forecasting, link prediction, ranking), any aggregation and window
    (months included), entity filters, ASSUMING and named entities, EXPLAIN
    and EVALUATE, any graph of tables (tables the entity table refers to,
    hops past the first, a keyless table's neighbors), composite keys, keys
    of any type, text columns (normalized), every sampling option
    (num_neighbors, num_hops, context_anchor_time, lag_timesteps,
    max_pq_iterations, use_prediction_time, inference_config,
    exclude_cols_dict, return_embeddings, top_k, num_context_samples, the
    anchor time 'entity', a random_seed of None, which samples unseeded),
    any column type in the payload, a seed of any size, and a schema edited
    after Schema.from_source, a table mapped to another source table
    included; when a large entity table yields fewer than
    half the context examples asked for, it warns once per process.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, a
    DuckDB source's PredictiveQuery.materialize with indices runs on the
    core's materialize (T1.11c), which materializes a regression over a
    windowed SUM for each entity of a table that only tables referring to
    it link, with the reference's defaults or the anchor time and seed
    given, by the reference's rules, and refuses every other input with
    UNSUPPORTED_REQUEST naming the rule, never a value (fields operation and
    rule). In the core: composite_key, evaluate, explain, problem_type,
    assuming, entity_ids, entity_filter, static_target, aggregation,
    target_filter, open_window, month_window, entity_key, parent_table,
    key_type, target_type, wire_dtype and seed_size (indices_type lifted
    at T1.32a, the core casting the entities; keyless_neighbors at T1.32e,
    a table without a key read by foreign key in the reference's order,
    _neighbor_order_by: its time column, latest first, then every other
    column but lists in name order); from
    T1.26b the subgraph is walked as the reference walks
    it, hops past the first and a second table referring to an entity
    included (deeper_hop and parent_lookup lifted), a text feature is sent
    as the reference's words (text_column lifted), the coverage warning is
    given on every run that meets it and once in a process by sdm-host
    (context_coverage lifted, decision E52), and a provider declaring no
    null order (null_order) or not one of the requests the sampler asks
    (named by the request) is refused before anything is fetched; a null
    where the walk tells rows apart is P1B-13's;
    from T1.25, a time column of any type the reference reads is read (a
    date, a timestamp with a zone, text), time_type lifted, a zoned anchor
    time read at its UTC instant (anchor_zone lifted), and text the
    fetches return is read as the provider declares (DT-7): refused where
    the provider declares no reading (text_times), declares the client's
    rules, which no map needs yet (text_time_rules), or holds a value
    whose reading takes a rule outside date-rules.md's shapes (text_time);
    offsets mixed are DT-11's;
    in the core from T1.24, the call's options, which the bridge passes
    through (contract version 13, E61), before anything is fetched: each
    sampling option by its name (the first in name order), unseeded (a
    random_seed given as None), num_context_samples and anchor_entity,
    each raised as the core's UnsupportedRequestError where the bridge
    raised StructuredDataError with the same code until T1.24; T1.23's
    table_source is lifted at T1.24, a table the schema names otherwise
    than its source sampled by its source name, as the reference samples
    it; in the bridge, before the core runs: key_type; in the core from
    T1.24b, before materialize's run exists, schema_edited (a table or
    column the description lacks, a column retyped, or a table mapped to
    another source table than the description's: the core reads the
    schema as the host holds it beside the description it last answered,
    sdm_schema::edit::read_held, and refuses such a schema there and at an
    edit, P1B-17), until T1.24b the bridge's;
    from T1.27 the labels are the core's (sdm_engine::labels, E19): a
    windowed SUM, COUNT, AVG, MIN or MAX, a comparison of one, or of a
    column of the entity's own row, with a number or NULL, and a static
    column (static_target, aggregation, month_window and a decimal sum's
    target_type lifted), and, from T1.28a, the classification and static
    tasks are materialized as the reference materializes them
    (classification_task and target_leakage lifted); still refused by name:
    logical_target (AND, OR, NOT), target_filter (a target with WHERE),
    condition (another comparison: IN, LIKE and its kin, text or a
    boolean compared, a condition of a condition), condition_value (a
    constant the target's type cannot read, an integer past int64 against
    an integer column, where the reference raises), target_stype (a
    static target of another meaning than ID, categorical or numerical,
    where the reference raises NotImplementedError), every other
    aggregation (aggregation) and target_type for a label of another type
    (a time, a decimal's average, a static decimal target, P1B-18); a
    decimal sum past 38 digits is INVALID_REQUEST, as the reference's
    grouped sum fails it (T1.27's fix round 1).
    From T1.28a: a DECIMAL(38, s) feature and a time of day have the
    reference's wire dtype (wire_dtype lifted for them; a decimal of another
    precision still refused by name, since the reference's decimal sums
    fail at the column's declared precision, which this core does not check
    yet, and such a feature is sent beside them); num_context_samples and
    inference_config lifted, the options' values read as the client and
    the engine read them, but a value the engine's validation coerces from
    text (inference_config_text) and a null target transform
    (target_transform_null) refused by name, and an inference config that
    is not a mapping refused INVALID_REQUEST, where the reference takes its
    engine's own config object; an average compared with NULL refused by
    name (average_null, P1B-21; from T1.36 fix 2 only where the reference
    crashes, and MIN and MAX alike, min_max_null); a multiclass target of floats refused
    target_type, its classes' text being Python's repr of a float32's
    double.
    The entities are cast to the key's type as the
    reference casts them (pandas, to the key's Arrow dtype), so none the
    reference takes is refused. A schema not described on the core has no core route
    (RouteError, the seam's own failure). A seed DuckDB's parser refuses,
    from 2**31, is INVALID_REQUEST naming the field, under RS-7. The default
    route is unchanged.
  affected_inputs: >-
    PredictiveQuery.materialize with indices over a DuckDB source's schema
    under a forced core route, with any of the inputs above; base.regression
    is none of them, and its payload is the reference's.
  cases: []
  refs: [docs/design/rust-core/phase-1/not-yet-refusals.md, E92]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E88}
  notes: >-
    Proposed by the implementer of T1.11c (Phase 1 decisions row E41), for
    the owner: each is a refusal of an input the reference accepts, so it
    waits for the owner (P1B-1 process) and is never self-approved; the
