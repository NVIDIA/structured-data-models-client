- id: P2B-18
  title: A lag reaching outside what a time holds is refused VALUE_OUT_OF_RANGE naming lag_timesteps, where the reference fails INTERNAL_ERROR
  kind: change
  old_behavior: >-
    The reference's engine multiplies the target's window by
    lag_timesteps and moves each anchor back by it (anchor_time -
    lag_timesteps * offset); a lag that leaves pandas' nanosecond range
    (10,000 thirty-day windows) or that the offset cannot be multiplied by
    (2**63 and more) raises OverflowError, which the client refuses
    INTERNAL_ERROR ("the relational engine failed while building this
    request"), after the context is labelled.
  new_behavior: >-
    The core refuses the same lags at the same point, before the lag's
    read, VALUE_OUT_OF_RANGE naming lag_timesteps, as it refuses every
    time outside what nanoseconds since the epoch hold (sdm_engine's
    out_of_range; a value past u64 in sdm-request's AskedLag::refusal, a
    step count or time past range in sdm-core's lag module). The same
    statements run before it.
  affected_inputs: >-
    PredictiveQuery.materialize of a temporal query on the core route with a
    lag_timesteps whose windows reach outside 1677 to 2262, or of 2**63 or
    more.
  cases: []
  refs: ['packages/structured-data-models-relational-engine/src/sdm_relational_engine/rfm/base/sampler.py#Sampler.sample_lagged_target', P1B-3]
  status: approved
  approved_by: reviewer
  decision_ref: null
  notes: >-
    Approved by both of T2.9's round 1 reviewers, recorded by the
    orchestrator (reviews/T2.9-r1-claude.md, codex-reports/T2.9-r1.md):
    both refuse the input at the same point, after the same statements;
    the core names the field and a code that says what is wrong
    ("lag_timesteps reaches further back than a time can be held (before
    1677); ask for fewer steps"), where the reference reports its own
    failure. Measured at T2.9 by its differential (lag_timesteps 10,000 and
    2**64 on the shop base, reference INTERNAL_ERROR, core
    VALUE_OUT_OF_RANGE); no contract case asks such a lag.

- id: P2B-19
  title: A NaN or infinite lag_timesteps is refused on the core route by name, where the reference adds no lag for a NaN and refuses an infinity after labelling
  kind: change
  old_behavior: >-
    The reference compares lag_timesteps with zero (lag < 0, then lag > 0)
    once the context is labelled: a float NaN is neither, so it adds no
    lagged column and answers; +inf is refused INVALID_REQUEST when the
    window is multiplied by it (a TypeError, "unsupported operand type(s)
    for *: 'float' and 'DateOffset'"), and -inf as negative.
  new_behavior: >-
    On the core route the call's option values travel to the core as JSON
    (Materialize.values, contract v27), which holds no NaN and no infinity,
    so the Python host refuses each INVALID_REQUEST before anything is
    read, naming the option (details field lag_timesteps, "lag_timesteps
    carries a value that cannot be sent as JSON (a NaN, an infinity, or a
    type JSON has no form for)"; codec.attachment names the first option
    value it cannot write). The infinities keep the reference's code; the
    NaN is refused where the reference answers.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route with lag_timesteps a
    float NaN or infinity, or a Decimal NaN or infinity (which the
    reference fails INTERNAL_ERROR on).
  cases: []
  refs: ['packages/structured-data-models-client/src/sdm_client/_rust/codec.py#attachment', 'packages/structured-data-models-client/tests/test_the_materialize_route.py#test_a_nan_lag_is_refused_on_the_core_route_only']
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-70}
  notes: >-
    Approved as a permanent difference by the orchestrator under the
    owner's standing delegation (KO2-70) on 2026-10-19: a NaN or an
    infinity is no number of steps, so a caller who passes one has made a
    mistake the reference hides (a NaN adds no lag) or reports in Python's
