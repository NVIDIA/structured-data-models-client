    is read back by predict's result as text (key.decimal-38-10). Approved by the owner on 2026-10-13, relayed by the orchestrator.

- id: P1B-34
  title: An entity pandas coerces to the key's type is refused, where the reference accepts it changed
  kind: change
  old_behavior: >-
    The reference's pandas cast accepts entities by changing them: a float
    or decimal with a fraction truncated to an integer key (1.5 as 1), hex
    text read as a number ('0x1' as 1), bytes read as a number (b'1' as 1),
    a timestamp read as its count of microseconds by an int64 key, and
    [True, 1] read as [1, 1].
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    core's rule table rounds and coerces nothing into an exact key: each is
    refused, StructuredDataError, code INVALID_REQUEST, at materialize,
    with field indices, the position and the reason (inexact,
    not_a_number or type). A float key still takes the nearest float of a
    float, a decimal or text, and an integer within 2**24 (32 bits) or 2**53
    (64) of zero, refusing one past it as the reference does. The default
    route is unchanged.
  affected_inputs: >-
    PredictiveQuery.materialize with indices over a DuckDB source under a
    forced core route, an entity a float or decimal with a fraction for an
    integer or whole-decimal key, hex text, bytes, a timestamp, or booleans
    mixed with integers.
  cases: [T1.32a]
  refs:
  - 'contract/key-cast-vectors.json#*.bytes.digit success -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#*.decimal.half success -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#*.float.half success -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#*.mixed.bool-int success -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#*.mixed.int-half success -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#*.numpy.float64-half success -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#*.text.hex success -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#int64.time.timestamp-1us success -> refusal INVALID_REQUEST'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E82}
  notes: >-
    Refuses inputs the reference accepts, so it needs the owner (checkpoint
    8's direction: no pandas coercion quirks, clear errors); never
    self-approved. A truncated entity predicts for another entity than the
    one given, which is why the core refuses it. Approved by the owner on 2026-10-13, relayed by the orchestrator.

- id: P1B-35
  title: Numbers mixed with text are cast as their text, where the reference refuses the mix
  kind: change
  old_behavior: >-
