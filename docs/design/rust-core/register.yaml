# --- Orderings ----------------------------------------------------------------

- id: ORD-1
  title: Tie order of the shared train set by entity time
  kind: change
  old_behavior: >-
    sample_target sorts a shared train set by entity time with
    sort_values(ascending=False), numpy's unstable quicksort, so rows tying on
    time come out in introsort's order. It sorts only when the anchor is
    'entity' (base/sampler.py:777-783): a static query materialized with
    anchor_time='entity', whose entity table has a time column. On the
    reference host (arm64, numpy 2.5.3, pandas 3.0.6) a shared train set of
    up to 16 entities keeps its tied rows in their shuffled order, and one
    of more than 16 entities may not: the threshold is on the length of the
    train set sorted, not on the number of rows that tie.
  new_behavior: >-
    Proposed: the core orders the shared train set by entity time, newest
    first, with tied rows in their shuffled order (RS-1's draw), the order
    sort_values(ascending=False, kind='stable') gives; for a shared train
    set of up to 16 entities that is also the reference's order on its
    host.
  affected_inputs: >-
    Static queries materialized with anchor_time='entity' over a shared
    train set of more than 16 entities in which any two tie on time: the
    order of the context rows, and which tied rows fill the context when
    more qualify than it holds. No case of the Phase 1b inventory or of
    contract/cases.
  cases: [T0.6, T1.21]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Measured at T1.21 by contract/tests/test_register_probes.py, which
    passes against the reference checkout (b413e9a) and on the candidate's
    default route. The tie order reaches no inventory payload: the case
    schema takes an ISO date as materialize's anchor_time, so no case can
    name 'entity'; running the 40 inventory cases and the three of
    contract/cases, 32 cases (31 distinct ids, base.regression appears
    twice, in the inventory and in contract/cases) reach sample_target with
    one call each (30 temporal, 2 static), every one anchored at a
    timestamp, so none takes the sort. From T1.21b contract/cases holds a
    fourth case, base.adventureworks, which reaches it once more, temporal
    and at a timestamp: 33 cases, 32 distinct ids. The control, a public materialize on DuckDB with
    anchor_time='entity' over 40 users tying on two times, reaches it; run
    by hand on the reference, its context rows came out in another order
    than with kind='stable', so the tie order does reach a payload when a
    caller asks for that anchor. The core route refuses that anchor in
    Phase 1 (anchor_entity, T1.24), so no Phase 1 answer depends on this
    entry. Recommendation, as random-streams.md and Phase 1 decision Q3
    propose when no inventory payload shows the order: register a stable
    order as this change. Reproducing it would mean porting numpy's introsort
    for datetime64, and the order is the host's: only the reference host was
    measured. A change, so the owner decides; until then the comparator does
    not normalize tie order (Q3).

- id: ORD-2
  title: NULL times and emit order of the latest-neighbor fetch
  kind: keep
  old_behavior: >-
    The reference's two samplers disagree: the SQL push-down drops rows whose
    time is NULL and returns neighbors newest first (ties by time, then
    primary key); the in-memory sampler keeps NULL-time rows and returns them
    oldest first in stable row order.
  new_behavior: >-
    Proposed: each path keeps its own reference policy until the disagreement
    is settled. Phase 1 runs only the SQL path; its policy is stated in the
    Neighbors request's window (NULL window times not returned) and TieBreak,
    and pinned by L1 vectors in T1.26.
  affected_inputs: Relational requests whose neighbor tables have NULL or tied times.
  cases: [T1.26]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Phase 1 decisions F2 and H15. Settling which policy both paths follow is
    S3 work in Phase 4, as its own change entry. The time-window fetch
    (_by_time) is unordered and feeds order-sensitive float32 group sums; the
    inventory's values are exact in float32, so no case shows it, and it
    becomes its own entry (ORD-3) if one ever does.

