# --- Orderings ----------------------------------------------------------------

- id: DT-15
  title: Text outside the core's list of formats refused by name
  kind: change
  old_behavior: >-
    The reference reads text times with pandas' to_datetime: dateutil reads
    dates in words (March 3 2020, Jan 5), packed digits (20240101), dots
    (15.01.2024), short fields (2024-1-5), the clock's words (now, today); a
    second of 60 rolls over under a format guessed from the first value;
    another value (a code, a value naming no date such as 2024-02-30, an
    offset of a day or more, a zone named other than UTC or GMT) reads as
    NaT, which materialize drops and warns of, and which inference counts as
    no time; minutes past 59 in an offset count on.
  new_behavior: >-
    The core reads text by its fixed list of formats only (date-rules.md,
    "The core's text formats"; sdm_engine::time::text): a value outside it
    is refused, UNSUPPORTED_REQUEST with rule text_time, by materialize when
    a fetched text time column or text timestamp feature holds one, and by
    the time column's choice where it asks where such a column starts.
    Inference counts such a value as no time under any name, so a column
    whose values the list does not read is text (from T1.33 part 3, the
    owner's item 24 of 2026-10-14: values that are not times are text
    regardless of the column's name; before, inference refused text_time
    where such values could make the score, under a name that says time
    every value outside the list, under another the ones in the client's
    shapes). Where the reference reads such a value as a time, the core's
    text is a changed answer this entry covers: an offset with minutes past
    59 (2024-01-01T01:02:03+01:99, +0160), which the reference counts on and
    reads as a time column, is text on the core. An order of day and month
    the values in the list leave open is still text_time_order (DT-16). A
    value is outside the list in both orders, the year written as well as
    the instant in the years 1 to 9999 (from fix round 1:
    0000-12-31T23:00-02:00 is outside).
  affected_inputs: >-
    Sources holding text times outside the list: the classes above. Over the
    13,456 columns T1.25 recorded pandas' readings of
    (rust/crates/sdm-engine/tests/text-times-differential.json, class a):
    10,623 materialize readings, 10,623 time-column readings and, before
    T1.33 part 3, 18,815 of 26,908 inference decisions (now text, not
    refused); over T1.25b's 60 generated DuckDB sources, a zone named EST,
    dates in words, dots, packed digits and codes under a name that says
    time, and a text feature holding a junk value, a value naming no date
    or a leap second. From T1.33 part 3: RelBench rel-trial's
    outcomes.time_frame ("up to 12 weeks") and designs.time_perspective
    ("Prospective"), described string and categorical as the reference
    describes them, where the core refused text_time; the schema route's
    offsets past a day (+24:00, +99:00, +2360, -25:00), whose column the
    reference reads as text too, and +01:99 and +0160, which it reads as a
    time column (packages/structured-data-models-client/tests/
    test_the_schema_route.py).
  cases: [T1.25b]
  refs: [DT-6, DT-7, P1B-2]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E66}
  notes: >-
    Approved by the owner's T1.25b answer of 2026-10-11, relayed by the
    orchestrator (E66(h)): "A named refusal of text outside the documented
    formats is approved by the owner's T1.25b answer (2026-10-11)." Each
    refusal here is made by a value outside the documented list in both
