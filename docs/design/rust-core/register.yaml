    reaches back before the data: "Context anchor timestamp is too early or
    aggregation time range is too large. To form proper input data, we would
    need data back to '<time>', however, your data only contains data back to
    '<min time>'."; and when the anchor time is more than a day after the
    data: "Anchor timestamp '<anchor>' is after the latest timestamp '<max
    time>' in the data. Please make sure this is intended."
    (sdm_relational_engine rfm.py).
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    core warns under the same conditions with the codes CONTEXT_BEFORE_DATA
    and ANCHOR_AFTER_DATA (sdm-core's materialize.rs), and the Python host
    shows them as the same class, UserWarning, in the core's words
    (_rust/errors.py): "[CONTEXT_BEFORE_DATA] the context's anchor time is too
    early, or the aggregation's window too long, for the data to reach back as
    far as the examples need" and "[ANCHOR_AFTER_DATA] the anchor time is
    after the latest time in the data", naming no time. The condition, the
    class and when the warning shows are unchanged; only the text differs.
    The default route is unchanged.
  affected_inputs: >-
    materialize under a forced core route with a context anchor time or an
    aggregation window reaching before the earliest time in the data, or an
    anchor time more than a day after the latest. No contract case reaches
    either warning.
  cases: [T1.25]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E141}
  notes: >-
    Found by the P3 scan of T1.25's review reports (M4): E59 gave the
    reference's words to the warnings T1.26 ported, and these two kept the
    core's, with no entry. It changes the text of a warning the reference
    gives, which is not E66(b)'s class, so it was the owner's. Approved by the
    owner on 2026-10-14 (the orchestrator's record of the owner's decisions,
    item 38(a): the core's wording for these two warnings is accepted for
    Phase 1, matching the old wording a Phase 2 row), relayed by the
