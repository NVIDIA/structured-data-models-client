- id: P1B-71
  title: A float compared with a static decimal column of a scale of 28 or more is read exactly, where the reference's pyarrow approximates it
  kind: change
  old_behavior: >-
    The reference's executor reads a condition's constant at the static
    column's decimal128(p, s) (pd.Series([value], dtype=left.dtype)) and
    compares exactly; pyarrow reads a float at the scale exactly, rounded
    half to even, through scale 22 (Arrow's Decimal128::FromReal multiplies
    at once there) and, measured, through scale 27; from scale 28 its
    iterative approximation can differ from the exact value in the last
    digits, and the call reaches predict's result.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, a
    float constant is read at the column's scale from its exact binary
    value, rounded half to even, at every scale from 0 to 38
    (sdm_engine::labels::decimal_constant and float_at_scale, the product
    held in 256 bits), never refused for its scale: through scale 27 that
    is the reference's value; from scale 28 the core is exact where the
    reference approximates, so a constant whose exact and approximate
    digits differ can label an example otherwise. Both answer success, the
    same outcome class. A constant the type does not hold is
    INVALID_REQUEST at materialize, as the reference refuses it. The
    default route is unchanged.
  affected_inputs: >-
    PredictiveQuery.materialize over a DuckDB source under a forced core
    route, a static target held in a DECIMAL column of a scale of 28 to 38
    compared with a float constant (PREDICT users.f > 0.7 at DECIMAL(38,
    30)).
  cases: [T1.32b, T1.32g]
  status: approved
  approved_by: owner
