- id: P2C-6
  title: On Postgres a seed past 2**64 - 1 is refused by name, where the reference hashes any integer
  kind: change
  old_behavior: >-
    The reference's Postgres sampler maps any integer seed into setseed's
    range by hashing its decimal text (_postgres_seed), so a seed of 10**38
    samples as any other.
  new_behavior: >-
    The Postgres dialect declares the largest seed a provider may declare,
    max_seed 2**64 - 1 (ProviderCapabilities::max_seed is a u64, with no
    "any seed" value, design choice 1), and the core refuses a larger seed
    INVALID_REQUEST naming the seed and max_seed before the sample is
    planned; every seed up to it maps as the reference maps it.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route over a Postgres source
    with a random_seed past 2**64 - 1.
  cases: [T2.3]
  refs: [RS-6, RS-7, KO2-28]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-59}
