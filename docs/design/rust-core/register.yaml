- id: P2C-1
  title: On Postgres a table named alone that a temporary or pg_catalog relation shadows is refused by name
  kind: change
  old_behavior: >-
    The reference reads a Postgres table named without a schema in
    current_schema() only (PostgresTable's schema), and qualifies every
    read with that schema ("public"."t"), so a temporary table or a
    pg_catalog relation of the same name, which an unqualified name finds
    first on the search path, never shadows it.
  new_behavior: >-
    The core finds a table named alone as the reference does, in
    current_schema() only (a table of a later schema of the search path is
    not found, INVALID_REQUEST, as on the reference), but its reads name
    the table alone, since a plan is rendered without the schema's name;
    where a temporary or pg_catalog relation of the name would be read in
    its place, the catalog answers no columns and the core refuses the
    table as not found (INVALID_REQUEST), never reading another relation.
  affected_inputs: >-
    Schema.from_source on the core route over a Postgres source, a table
    named alone whose name a temporary table of the session or a
    pg_catalog relation also has.
  cases: [T2.3]
  refs: [KO2-39, KO2-28]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-63}
  notes: >-
    Approved by the owner on 2026-10-17 as KO2-63, relayed by the
    orchestrator; the full fix needs a schema field in a later contract. A
    plan would have to name current_schema()'s schema, which the core does
    not know when it plans, and Postgres reads an unqualified name by the
    search path. Probed at T2.3 on Postgres 17 (search_path = public,
    other): a view in public is read on both routes; a table only in other
    and a name nowhere are refused INVALID_REQUEST on both; a public table
    shadowed by a temporary table of its name is read on the old route,
    which qualifies it ("public"."t"), and refused INVALID_REQUEST on the
    core.

- id: P2C-2
  title: On Postgres the core runs fewer statements than the reference, without its unused reads
  kind: change
  old_behavior: >-
    The reference's Postgres engine reads current_schema() once before it
    reads a source's tables, and, when its sampler is built, counts every
    table's rows (SELECT COUNT(*) FROM each table, kept as num_rows_dict,
    which no Postgres read uses): from_source runs one statement more and
    materialize one more per table than the core's requests.
  new_behavior: >-
    The core asks Postgres one statement per request it makes, as on
    DuckDB, and names the current schema inside its catalog statements
    (current_schema() in the table list, to_regclass for a named table),
    so neither read is made. Every other statement answers the same step
    with the same rows; the statement count per public call differs
    (compare.py's sql.count, and the key matrix's counts), which shifts
    the positional sql.result comparison too.
  affected_inputs: >-
    Every Schema.from_source and PredictiveQuery.materialize over a
    Postgres source on the core route.
  cases: [T2.3]
  refs:
  - KO2-20
  - 'contract/postgres-key-vectors.json#* statements'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-58}
  notes: >-
    Approved by the owner on 2026-10-17 as KO2-58, relayed by the
    orchestrator: a permanent registered difference, every answer equal.
    Measured on all 86 cases on Postgres 17: the per-call counts differ
    and no statement's answer to its own request does.

- id: P2C-3
