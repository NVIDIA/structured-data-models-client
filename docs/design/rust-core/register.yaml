- id: P1B-12
  title: Schema.from_source's keys and time columns of the wrong type are refused by the core, by name, where the reference refuses them or fails unnamed
  kind: change
  old_behavior: >-
    The reference reads each key it is given with _as_key_tuple, after the
    source is read and the key's table is found: None names no column,
    refused as an empty key; a name, one column; an ordered iterable of
    names, read once with list(), its columns; anything else (a number, a
    set, a mapping, bytes, a nested list, a member that is not a name) is
    refused, all StructuredDataError INVALID_REQUEST, and an exception
    raised while reading the iterable propagates. A time column that is
    not a name is refused as a column the table lacks where it is hashable
    (a number, a tuple, INVALID_REQUEST), and fails unnamed where it is
    not (a list, a set, a mapping, a pd.Index or an ndarray: TypeError
    unhashable type). A table named by a non-str is refused
    INVALID_REQUEST as a table the schema lacks; text JSON cannot hold (a
    lone surrogate) is refused INVALID_REQUEST.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    the Python bridge writes each key and time column as contract 23's
    Given (T1.32h, decision E101): a value the contract's type holds as
    {"value": ...}, any other "unreadable", by the codec's one classifier
    the edit setters use too. The core refuses each after the source is
    read, as the reference does: an unreadable key INVALID_REQUEST
    {field: primary_keys, table, rule: key_not_names}; a None key as an
    empty key {field, table}; an unreadable time column INVALID_REQUEST
    {field: time_columns, table, rule: time_column_not_a_name}; a column
    the table lacks {field, table, column}, as before. Every input the
    reference refuses INVALID_REQUEST is refused INVALID_REQUEST. What
    differs from the reference: (1) a time column the reference fails
    unnamed (a list, a set, a mapping, a pd.Index, an ndarray) is the
    core's named refusal (decision E66(b)'s class); (2) the host's own
    steps, reading an iterable key (an iterable whose reading raises lets
    its exception out unchanged, KeyboardInterrupt included) and encoding
    (a lone surrogate, the codec's INVALID_REQUEST with no fields), run
    before the source is read, where the reference reads the key after
    it, so with a source that also fails the host's step is seen first;
    (3) a table named by a non-str is written by JSON's coercion of an
    object key (3 is the table "3", None "null"), refused as a table the
    schema lacks with that name, or taken if the source holds such a
    table; a tuple is the codec's refusal (P1B-74 proposes the host's
    refusal instead); (4) in several tables, the core takes the tables in
    the order of their names, the reference in the caller's mapping order
    (the multi-fault class, E41(k)). The default route is unchanged.
  affected_inputs: >-
    Schema.from_source over a DuckDB source under a forced core route,
    with primary_keys or time_columns holding a value of another type than
    a name or a sequence of names, an iterable key, or a table named by
    anything but a str.
  cases: [T1.23, T1.24, T1.24b, T1.32h, base.adventureworks, time.text-declared]
  refs:
  - 'contract/given-vectors.json#time.list refusal UNNAMED -> refusal INVALID_REQUEST'
  - 'contract/given-vectors.json#time.mapping refusal UNNAMED -> refusal INVALID_REQUEST'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E101}
  notes: >-
    Found by T1.24's round-1 review (subagent P3-3), pre-existing from
    T1.23. The owner said on 2026-10-13 that P1B-12 must be fixed, asked
    for a design of where the rule lives and of the interface, and
    allowed the bridge to grow for it (owner decisions of 2026-10-13,
    item 18, relayed by the orchestrator; never the implementer's
    approval). The design of 2026-10-13, revised after Codex's review,
    puts every refusal of a value in the core (sdm-schema's
    apply_keys_and_times, sharing edit_schema's refusals, E101) and
    leaves the host only the reading of its own argument's type, the
    stays-host class: the frozen _rust/schema.py::from_source is declared
    moved, naming T1.32h. Held by contract/given-vectors.json on
    python-core and rust-host (contract/tests/test_t132h_given_vectors.py,
    sdm-testkit's tests/t132h_given.rs) and the client's
    tests/test_t132h_keys_and_times.py, every Python type. Before T1.32h
    a key of None or a number failed with a raw TypeError, a set or a
    mapping was read as its members or keys and taken, and a nested list
    or a time column that is not a name reached the decoder,
    INVALID_MESSAGE. A key naming one column twice is the reference's
    success and the core's composite_key (E92) unless P1B-73 is approved.
    A 0-d NumPy array as a key (np.array('order_id')) is an iterable whose
    reading raises: TypeError (iteration over a 0-d array) on both routes,
    the caller's exception let out unchanged, as the iteration policy
    says (measured at T1.32h's review, P3-1).
    Contract 23 changes the shape of two cases' core inputs, their
    describe_source spec's keys and time columns now written as Given;
    their outcomes are unchanged on every runner, and their reference
    lines are recorded again for the new case files (identity only).
  case_outcomes:
  - {case: base.adventureworks, cell: ref-pandas3, runner: python-ref, old: 'success at predict', new: 'success at predict', summary: 'case file only: the core spec written as contract 23 Given; the outcome unchanged'}
  - {case: time.text-declared, cell: ref-pandas3, runner: python-ref, old: 'success at predict', new: 'success at predict', summary: 'case file only: the core spec written as contract 23 Given; the outcome unchanged'}

- id: P1B-13
  title: A null where the sampler's walk tells rows apart is no link on the core route
  kind: change
  old_behavior: >-
    The reference's SQL sampler numbers each row it reaches by its key and
    its example (Mapper). A foreign key it looks up holding a null is taken
    for the last key it looked up (pandas' factorize gives the null -1, and
    the mask of keys found is read at -1) whenever that key was found, so a
    row of the table referred to is added for it; a null key of a table it
    reads by foreign key numbers every such row as one row, whatever its
    example. Either way the rows it adds are numbered out of step with the
    rows it keeps: the request sends rows nothing refers to, and links
    rows to rows of other examples (measured at T1.26b on generated DuckDB
    sources: of 4 with a null foreign key, every one sends rows of the
    table referred to that no row refers to, and one links 3,690 rows
    across examples; of 6 with a null key, 5 link rows across examples).
    Where its numbering does not go astray it is clean: every foreign key
    it looks up null, for one, it looks up no key (one statement of no
    row) and sends each as null.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, a
    null is no link: a null foreign key the walk looks up adds no row and
    is sent as null (an integer key column holding one as float64, as
    pandas types it), the lookup still made, of the keys that are not null
    (of none when every one is null), as the reference makes it; and a row
    of a table read by foreign key whose key is null is no other row's,
    reached anew and never merged. Measured at T1.26b's fix round 1: on
    the 112 generated sources the core's request is the reference's with
    its null handling corrected (null dropped before its factorize, each
    null key read as a key of its own) on every call, statements included,
    and the reference's own where it is clean (every foreign key looked up
    null); held by the client's tests/test_the_materialize_route.py
    (test_a_null_key_the_walk_reaches_links_nothing, the old route's
    crossing links against none on the core, for both;
    test_every_foreign_key_looked_up_null_is_the_reference_s_request).
    The default route is unchanged.
  affected_inputs: >-
    PredictiveQuery.materialize with indices over a DuckDB source under a
    forced core route whose sampled tables hold a null foreign key reached
    at the second hop or a null key in a table referring to a sampled one.
  cases: [T1.26b, T1.32e]
  refs:
  - 'contract/sampled-null-key-vectors.json#two-nulls-text success -> success'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E94}
  notes: >-
    Found by T1.26b's old-against-core differential (E49); proposed as a
    refusal by name (null_foreign_key, null_key) at T1.26b. The owner's
    decision (b) of 2026-10-11, relayed by the orchestrator (E66(a)): a
    null is no link, in place of the refusals, then conditional on all
    cases passing and model accuracy holding (E73(a)'s benchmark).
    Re-approved by the owner on 2026-10-13, relayed by the orchestrator
    (E94), on correctness grounds, the condition dropped: T1.29's
    investigation showed the reference corrupts requests when keys are
    null (null order keys collapse into one row, linked to an arbitrary
    user; a null foreign key becomes pandas' code -1, a phantom "last
    item" row that shifts later links, 44 of 58 item links wrong in one
    request), where the core sends each row and no link for a null
    foreign key, which is correct. E73(a)'s benchmark on generated data
    is set aside as having no signal; a real-data parity benchmark
    (AdventureWorks and RelBench H&M) runs after the time_whole_table fix
    as a sanity check, not a gate. From T1.32e the vector two-nulls-text (contract/sampled-null-key-vectors.json, two null text keys of one example reached, which the reference numbers as one row and the core as two) is named in refs with its transition; the entry is owner-approved, for the reviewers to hold the ref to its approved meaning.

- id: P1B-14
  title: A schema's keys, links or time column edited between two materialize calls is followed on the core route
  kind: change
  old_behavior: >-
    The reference builds its model, and with it its sampler, once per
    materializer (RelationalMaterializer._get_model), from the schema as it
    stood at the first call; a key, a link or a time column edited on the
    same schema before a later call of the same query is not followed: the
    later call reads neither the indexes nor the time bounds again, warns
    of no missing index, and sends the request the first schema gives.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    sampler state a call leaves is made under the provider and each table's
    key, time column and unique columns and the links (E64); a later call
    of the same query whose schema's keys, links or time column were
    edited does not read it: it checks the indexes and reads the time
    bounds afresh, warns of missing indexes again, and sends the request a
    new materializer of the edited schema sends (measured at T1.26b's fix
    round 1 on the shop with a second time column, a second key and a
    second table referring to the users: the core's second call 7, 7 and
    6 statements with one warning each, the reference's 5 with none and
    its first request; the core's request equal to a fresh old-route
    materializer's of the edited schema each time). A column's type or
    meaning edited is not in the state's fingerprint and changes nothing of
    this. Of the two halves, the payload differs from before T1.26b (the
    core has always read the schema as it is at the call), and the second
    check and warning are T1.26b's (until it, the bridge's once-flag kept
    the second call quiet). The default route is unchanged.
  affected_inputs: >-
    Two or more materialize calls of one PredictiveQuery over a DuckDB
    source under a forced core route, the schema's keys, relationships or a
    table's time column edited between them.
  cases: [T1.26b, T1.24b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E78}
  notes: >-
    Approved by the owner on 2026-10-12, relayed by the orchestrator during T1.28b (E78(l)).
    Found by T1.26b's review round 1 (Codex P2). Following the edit is the
    proposed behavior: the reference's request after such an edit is the
    first schema's, which the caller's edit says is not the one asked for;
    keeping it would mean holding the first schema's sampling in the state.
    Which edits the core route takes at all is T1.24b's (the edit
    semantics, schema_edited), so the owner decides this with it. Pinned
    by the client's tests/test_the_materialize_route.py,
    test_a_schema_edited_between_two_calls_is_sampled_as_edited, on both
    routes. Never self-approved. T1.24b leaves it as registered: an edit is
    the core's edit_schema, made on the schema the host holds and stored
    there, and materialize reads that schema as it stands at each call
    (the held schema beside the description, decision E67), so the
    sampler state's fingerprint follows a key, link or time column edited
    between calls as before; the pinning test is unchanged and passes on
    both routes. The implementer's recommendation to the owner is in the
    tracker's Journey row.

- id: P1B-15
  title: A key of one column given as a sequence is read as the column's name on the core route
  kind: change
  old_behavior: >-
    The reference's Schema.from_source keeps a key of one column given as
