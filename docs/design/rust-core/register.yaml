- id: P2C-7
  title: On Postgres two S0 boundary queries are refused at materialize by the core's not-yet target rules, until T2.10
  kind: change
  old_behavior: >-
    The reference materializes s0.boundary.escapes and
    s0.boundary.start-past-64kb on Postgres: each query's target has a
    filter (start-past-64kb) or is a condition (escapes).
  new_behavior: >-
    Off DuckDB every call a case makes runs on the core (T2.1d), so these
    queries, which the core validates and accepts, reach its materialize,
    which refuses them UNSUPPORTED_REQUEST at materialize under its
