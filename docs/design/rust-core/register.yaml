- id: DT-3
  title: int64 wrap at Timestamp.min
  kind: drop
  old_behavior: >-
    The in-memory sampler's seconds round trip of -9223372036854775807 ns
    (pd.Timestamp.min) wraps to 2262-04-11T23:47:16.709551616. A graph with
    no time column is anchored at that sentinel, so after the wrap the
    comparison at inference/payload.py:469-471 no longer sees it: the
    in-memory route's payload gains an anchor time column holding the wrapped
    instant for every instance, and the end-time check at
    base/sampler.py:321-326 keeps every end time. The SQL samplers make no
    round trip (base/sql_sampler.py:573), keep the sentinel, send no anchor
    time column and clear every end time.
  new_behavior: >-
    The core gives 1677-09-21T00:12:43 and does not reproduce the wrap; it
    handles the no-time marker explicitly (decision 30), so the payload of a
    graph with no time column has no anchor time column on any route, as the
    reference's SQL samplers send it.
  affected_inputs: >-
    Only the Timestamp.min sentinel, the anchor of a graph with no time
    column, and only on the in-memory route, the one sampler that round trips
    through seconds: its payload's anchor time column and the end-time
    columns it sends. No Phase 1 case: Phase 1 runs the SQL path, which keeps
    the sentinel, and every inventory case is a DuckDB source.
  cases: [T0.6, T1.21]
  refs: [M3]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-0/decisions.md, row: 30}
  notes: >-
    Answered at T1.21 from the reference alone (b413e9a), by the
    algorithm-level probes in contract/tests/test_register_probes.py, which
    pass against the reference checkout and on the candidate's default
    route, whose four files they reach are the reference's byte for byte. A
    four-user graph with no time column and an end-time column, sampled at
    its default anchor (pd.Timestamp.min) and laid out by payload.py's
    _instance_dataframe: on the in-memory sampler the anchors come back as
    9223372036709551616 ns, the instance table gains __kumo_anchor_time
    holding 2262-04-11T23:47:16.709551616 four times, and the three end
    times stay; on DuckDB the anchors come back as the sentinel, no anchor
    time column is added, and all four end times are cleared. So the
    comparison does not see the sentinel after the round trip, and a public
    answer changes when the core takes the in-memory route: that route's
    payload loses the wrapped anchor time column. The end-time check is a
    second reader of the same value: with the marker kept, the in-memory
    route would clear every end time as the SQL route does. That answer is
    public only through the engine package's own API: sdm_client clears a
    table's end-time column before it samples (_copy_for_one_gather,
    materializers/sources.py:82), so no sdm_client payload carries end
    times. This entry records it and decides nothing about it; whether the
    in-memory route should follow the SQL route there is a question for the
    owner, in design.md's Journey check-in, not part of this approval.
    Neither shows in Phase 1, and the
    public in-memory proof is Phase 4's (H24). Decision 30's condition, that
    a changed public answer is recorded here, is met by this note. Phase 0's
    recommendation: drop the wrap, after Phase 1 checks whether that
    comparison still sees the sentinel after the sampler's round trip.

