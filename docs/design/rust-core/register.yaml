# --- The host layer -------------------------------------------------------------

- id: HOST-1
  title: A request whose control message passes the 64 KB cap
  kind: change
  old_behavior: >-
    The reference validates a query of any length against a schema of any
    width: there is no limit on the query's text or on the number of tables
    and columns materialize resolves it against.
  new_behavior: >-
    sdm-host refuses a control message past 64 KB with INVALID_MESSAGE before
    reading it (design, "Core, host and binding"; decision E2). validate_query
    carries the query text and its schema in the start message, so a query
    whose text and schema pass about 64 KB of JSON cannot be validated on the
    core route: roughly a thousand columns, or a query of tens of thousands
    of characters.
  affected_inputs: >-
    S0 on the core route (materialize's validation) with very wide schemas or
    very long query text; later operations whose requests carry schemas.
  cases: [T1.7]
  status: rejected
  approved_by: owner
  decision_ref: null
  notes: >-
    Rejected by the owner on 2026-10-08 (answers to Phase 1 re-review round 1):
    the refusal is not adopted; contract v3 moves every field whose size grows
    with user input into an attachment (Phase 1 decisions H5, superseding E14),
    and T1.7b's exit proves a start past 64 KB is accepted. As first proposed:
    Phase 1 decisions row E14. This refuses input the reference accepts, so
    it waits for the owner (P1B-1 process); no inventory case or corpus query
    reaches it. Recommendation: do not approve the refusal; before S0 switches
    (Phase 3), move a start message's schema (and query text past a bound)
    into an attachment, as data already travels, with a contract version
    bump, and keep the cap for control JSON proper.

- id: HOST-2
  title: An interval or a union, refused by name where the reference fails unnamed
  kind: change
  old_behavior: >-
    The reference reads the Arrow DuckDB returns into pandas (to_pandas with
    pd.ArrowDtype) and takes each column's dtype from its catalog type, or
    infers it from the sample where that gives none. Through DuckDB 1.5.6
    its Schema.from_source fails an INTERVAL column, Arrow's month_day_nano
    interval, with an unnamed RuntimeError, alone, in a list or in a struct,
    and a UNION column unnamed likewise, in its default form and under
    arrow_large_buffer_size or produce_arrow_string_view (the refs; T1.33).
    The other types it fails unnamed (an ENUM, the view types, decimal32 and
    decimal64, a lossless connection's extension types, a VARINT) are other
    entries' (P1B-43 to P1B-49).
  new_behavior: >-
    Admission widens losslessly into the closed set (Phase 1 decisions H16
    and H27): float16, decimal32 and decimal64, duration and time32 at s or
    ms, date64 (as timestamp[us]), view types, fixed_size_binary and any
    dictionary are admitted, keeping the received type, and from T1.7d
    (decision E17) a run_end_encoded column is decoded to its value type,
    and from T1.33 an int8 carrying the canonical extension arrow.bool8
    (DuckDB's booleans under arrow_lossless_conversion) is read as boolean;
    a batch whose values pass int32 offsets is split between rows.
    What still cannot convert is refused by name. Generated at T1.7d from
    the admission tests' family table (sdm-host tests/admission.rs, which
    fails if this list and the code disagree), the type families still
    refused, StructuredDataError with code UNSUPPORTED_TYPE naming the column
    and its Arrow type, are `interval`, not reference-accepted (marked at
    T1.33: through DuckDB 1.5.6 the reference's Schema.from_source fails an
    INTERVAL column with an unnamed RuntimeError, alone, in a list or in a
    struct: contract/nested-type-vectors.json's scalar.interval*,
    orders.interval and list.interval, contract/type-set-vectors.json's
    interval.month-day-nano and struct.interval, case time.feature-interval;
    DuckDB hands over no year-month or day-time interval), and `union`, not
    reference-accepted (marked at T1.33: the reference fails a UNION column
    unnamed at from_source, contract/nested-type-vectors.json's
    union.integer-varchar and case nested.union, and its large-buffer and
    view forms; DuckDB hands over no dense union). The approval covers those
    measured transitions only, the refs. No public call reaches the engine's
    explicit-dtype path that would skip that inference
    (rfm/base/table.py:262-296). The client builds every engine table
    through engine_graph (sdm_client/materializers/sources.py:125-170), whose
    specs carry a table's name and source name and never a column's dtype
    (:147-153), so the engine reads every column of the source table and
    types each as above, the columns a gather does not want removed only
    afterwards (:80-87). That holds for Schema.from_source (schema.py:1194)
    and for a Schema built by its constructor from SourceTable objects
    (schema.py:715, :851), which materialize reads through the same
    engine_graph (sources.py:42-77). A duration or a date64 is not reachable
    from any Phase 1 public source: the core routes DuckDB only
    (_routing.py's CORE_ROUTED), which turns a duration into an INTERVAL
    (month_day_nano) and a date64 into a DATE (date32), and
    contract/type-set-vectors.json marks both not reachable. A value is no
    type: a timestamp at s or ms past int64 microseconds is DT-14's (T1.36
    fix 3), a single value past int32 offsets P1B-79's and P1B-80's.
  affected_inputs: >-
    Sources returning an Arrow interval or union, alone or nested, which the
    reference fails unnamed at from_source.
  cases: [T1.7c, T1.33, T1.36]
  refs:
  - 'contract/type-set-vectors.json#interval.month-day-nano refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/type-set-vectors.json#list.interval refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/type-set-vectors.json#struct.interval refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/type-set-vectors.json#union.sparse refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/type-set-vectors.json#large.union refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/type-set-vectors.json#view.union refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/nested-type-vectors.json#scalar.interval* refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/nested-type-vectors.json#orders.interval refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/nested-type-vectors.json#list.interval refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  - 'contract/nested-type-vectors.json#union.* refusal UNNAMED -> refusal UNSUPPORTED_TYPE'
  status: approved
  approved_by: reviewer
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E146}
  notes: >-
    At the T1.7b check-in (2026-10-08) the owner chose to decode
    run_end_encoded rather than refuse it (Phase 1 decisions row E17, T1.7d).
    From the batch 2 code review. Marked at T1.33
    (contract/type-set-vectors.json, the test author's, and the reference's
    code): neither family is reference-accepted, so what remains is a named
    refusal where the reference fails unnamed, E66(b)'s class, the
    reviewer's; P1B-7, P1B-8, P1B-47, P1B-49 and P1B-51 are the cases of it.
    Approved by the reviewer, as both final reviews of Phase 1 at c49ee4f8
    asked: Codex, "restrict this E66(b) approval to the measured
    interval/union transitions"; the independent subagent, "interval and
    union fit E66(b) ... and I would approve that part". Narrowed at T1.36
    fix 3 as both asked; DT-14 cited separately for the timestamp tail. The
    entry's value refusals and its clause for types T1.33 might find were
    taken out: a timestamp at s or ms past int64 microseconds is now
