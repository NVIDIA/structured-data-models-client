    test_entities_that_do_not_cast_are_the_caller_s_error_on_the_core holds
    it beside the old route.
    Approver: reviewer (T1.33: the reference's INTERNAL_ERROR to the caller's
    error, E66(b)'s class).
    Approved by both reviewers of the final whole-phase review at c49ee4f8
    (Codex's and the independent subagent's: APPROVE-P1B-32), relayed by the
    orchestrator, recorded at T1.36 fix 7; never the implementer's approval.
    Codex: the reference's internal failure to a named refusal under E66(b)
