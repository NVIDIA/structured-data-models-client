- id: P1B-22
  title: A model's answer nested past 128 levels is refused INVALID_RESPONSE where the reference reads it
  kind: change
  old_behavior: >-
    The reference's client decodes an answer's JSON at any depth Python's
    reader takes (an answer whose metadata or an item's unread member
    nests 200 or 5,000 levels is read, and predict returns its result).
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    the core reads an answer nested at most 128 levels
    (sdm_wire::json::MAX_DEPTH) and refuses a deeper one before anything
    of it is built: StructuredDataError, code INVALID_RESPONSE, fields
    field response, reason too_deep and category depth, a local error
    (no endpoint status), on every host; the Python host writes an answer
    its transport decoded past that depth cut one level past it, so the
    core refuses it alike (_rust/predict.py's _encoded); one Python's own
    reader cannot read for its depth (before 3.12, past about 1,000
    levels, which the transport reports as TRANSPORT_ERROR) is told to the
    core as too deep, so it is refused INVALID_RESPONSE there too (T1.28b
    fix round 2), on every interpreter and both transports, the HTTP one
    and the Databricks serving one, which flag it (fix round 3). The
    default route is unchanged.
  affected_inputs: >-
    SDMClient.predict of a request materialized on the core over a DuckDB
    source, under a forced core route, answered with JSON nested more
    than 128 levels anywhere.
  cases: [T1.28b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E78}
  notes: >-
    Approved by the owner on 2026-10-12, relayed by the orchestrator
    during T1.28b (E78(f)): the bounded reader's refusal is kept. The
    boundary vectors of contract/response-vectors.json it covers end so on
    both core hosts (the client's
    tests/test_t128b_predict_result.py, sdm-testkit's
    tests/t128b_predict_result.rs): boundary.deep.metadata-200,
    boundary.deep.metadata-5000 and boundary.deep.item-5000;
    boundary.deep.metadata-100 is read as the reference reads it. The
    vectors are named here, not in cases, which register.py holds to
    corpus cases, task IDs and inventory cases.

- id: P1B-23
  title: A regression's prediction that is not a number is refused INVALID_RESPONSE where the reference passes it on
  kind: change
  old_behavior: >-
    The reference's client takes an answer's prediction as written: for a
    regression, text, a boolean, a list or an integer past int64 is put in
    the result as is, and its frame's prediction column is then of object
    dtype; an integer past a double's range makes to_pandas() raise
    OverflowError.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, a
    regression's prediction is a number: a JSON number (an integer within
    int64 kept as the integer it is, its column int64 where every answer
    is one and float64 where it is mixed with doubles or missing ones, as
    pandas infers it, the result's items keeping each integer exact,
    T1.28b fix round 1; a float token, a token past a double's range read
    as an infinity; NaN and Infinity read as Python's reader reads them,
    P1B-4) or null; any other (text, a
    boolean, an array, an object, an integer past int64) refuses the
    answer: StructuredDataError, code INVALID_RESPONSE, fields field
    prediction.prediction and reason not_a_number, a local error, on
    every host (sdm_request::predict's answer_of). The default route is
    unchanged.
  affected_inputs: >-
    SDMClient.predict of a regression materialized on the core over a
    DuckDB source, under a forced core route, answered with a prediction
    that is not a number.
  cases: [T1.28b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E78}
  notes: >-
    Approved by the owner on 2026-10-12, relayed by the orchestrator
    during T1.28b (E78(g)). A result column holds one type on every host,
    so a column mixing text, booleans or lists with numbers has no layout
    the pure-Rust host could give alike. The boundary vectors
    boundary.evidence.prediction-text, boundary.evidence.prediction-bool,
    boundary.evidence.prediction-list, boundary.finite.integer-past-int64
    and boundary.finite.integer-past-double end so on both core hosts. The
    vectors are named here, not in cases, which register.py holds to
    corpus cases, task IDs and inventory cases. A classification's answer that is
    not of its target's type stays refused by name (prediction_type,
    P1B-4).

- id: P1B-24
  title: An answer holding a lone surrogate escape is refused INVALID_RESPONSE where the reference reads it
  kind: change
  old_behavior: >-
    The reference's client decodes an answer with Python's JSON reader,
    which takes a lone surrogate escape in text (\ud800) as that code
    point, and passes the text on (in the metadata, an item's id or a
    class).
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    the core's reader (sdm_wire::json, serde_json's) holds text as UTF-8
    and refuses such an answer: StructuredDataError, code
    INVALID_RESPONSE, field response, a local error, on every host. So
    since sdm-wire's reader was added at T1.11d, not from T1.28b. The
    default route is unchanged.
  affected_inputs: >-
    SDMClient.predict of a request materialized on the core over a DuckDB
    source, under a forced core route, answered with JSON text holding a
    lone surrogate escape.
  cases: [T1.11d, T1.28b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E93}
  notes: >-
    Found by T1.28b's review (the subagent, round 1). Pinned by the
    client's tests/test_the_predict_route.py,
    test_a_lone_surrogate_in_an_answer_is_refused_on_the_core
    (diagnostic). A refusal of an answer the reference reads, so for the
    owner, never self-approved. Reading it would need text that is not
    UTF-8 (a replacement character would differ too); a named refusal is
    the recommendation. Approved by the owner on 2026-10-13, relayed by the orchestrator (E93): "if we're sure it's invalid, refuse"; a lone surrogate is never valid Unicode text, cannot be encoded as UTF-8 and arises only from lossy byte decoding.

- id: P1B-25
  title: A probability written with a decimal digit Unicode added after 13.0 is refused where Python 3.12 and later read it
  kind: change
  old_behavior: >-
    The reference's bindings read a probability written as text with
    Python's float, which takes any Unicode decimal digit of the
    interpreter's Unicode database: Unicode 13.0 on Python 3.10, 14.0 on
    3.11, 15.0 on 3.12 (the reference's), 15.1 on 3.13 and 16.0 on 3.14,
    so Kawi digits (Unicode 15.0) read as digits on 3.12 and are refused on
    3.10.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    the core reads the decimal digits every supported Python reads, Unicode
    13.0's (sdm_wire::response::numeric_text, the orchestrator's portable
    policy, T1.28b fix round 2), on every interpreter, and refuses a
    probability written with a later one: StructuredDataError, code
    INVALID_RESPONSE, field prediction.probabilities, reason
    not_a_number, as Python 3.10 refuses it. The default route is
    unchanged.
  affected_inputs: >-
    SDMClient.predict of a classification materialized on the core over a
    DuckDB source, under a forced core route, answered with a probability
    written as text holding a decimal digit added after Unicode 13.0, on
    Python 3.11 and later.
  cases: [T1.28b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E93}
  notes: >-
    Found by T1.28b's review (Codex, round 2); the portable policy is the
    orchestrator's, for the owner, never self-approved. Pinned by
    sdm-wire's tests/numeric_text.rs,
    only_the_digits_every_supported_python_reads_are_read (Kawi and Tangsa
    digits refused, Arabic-Indic and fullwidth read), and by the test
    author's recorded case numeric-text.kawi-digits on both hosts, which
    the reference reads on 3.12 and later and refuses on 3.10 and 3.11. Approved by the owner on 2026-10-13, relayed by the orchestrator (E93): the Unicode 13 digit rule for numeric text, which can be revisited later, since widening the digit set is a compatible change.

- id: P1B-38
  title: A whole-table read the source fails, or does not answer, refuses Schema.from_source on the core route where the reference falls back to its preview
  kind: change
  old_behavior: >-
    The reference's time column choice over a table whose preview returned
    1,000 rows asks its source for each timestamp's MIN, MAX and COUNT
    over every row in one statement (Table._full_range). When that
    statement raises, whatever the error (a timeout on a large view, most
    often, by its own comment), it catches it and chooses from the
    preview: a column the preview would pass over for its values is kept,
    behind every other, and named, with a TimeColumnWarning and a line of
    the client's warning ("because the query over the whole table
    failed"). Measured at b413e9ad in ref-pandas3: a DuckDB view of 10,000
    rows whose time column fails past row 9,000 (error() in a CASE) is
    described, happened_at its time column.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    describe_source asks the provider the same statement as a
    column_ranges request (contract version 22, E83). A provider error
    on it ends the call with that error, PROVIDER_ERROR on the measured
    view; a provider that does not declare column_ranges (a host provider,
    none in this build; every SQL dialect sdm-data renders declares it)
    is refused UNSUPPORTED_REQUEST naming the request, as any undeclared
    request is. The default route is unchanged.
  affected_inputs: >-
    Schema.from_source under a forced core route over a table of 1,000
    rows or more with a timestamp that is not the key and not named as a
    load stamp or a date of birth, whose whole-table statement the source
    fails; or through a host provider that does not declare
    column_ranges.
  cases: [T1.32e]
  status: rejected
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E85}
  notes: >-
    Rejected by the owner on 2026-10-13, relayed by the orchestrator
    (E85): match the reference. From then the core falls back to the
    preview when column_ranges fails or is not answered, keeping a column
    the rows read would pass over, behind every other, and naming it as the
    reference names it (TIME_COLUMNS_GUESSED, variants taken_unchecked_*,
    worded by the Python host as the reference's taken_unchecked line);
    sdm-testkit's tests/whole_table_time.rs holds the view above described
    with happened_at, as the reference describes it. Formerly:
    The reference's success turns into a refusal, so this needs the owner
    individually (E66(b) and E73(b)); never self-approved. The
    alternative, for part 2 if the owner prefers it: port the fallback
    (the doubted columns, TimeColumnChoice.unconfirmed, and two warning
    codes the hosts word), which also catches a provider's transient
    failure into a schema the caller cannot tell was guessed beyond the
    warning. Recommendation: keep the refusal (a clear error over a silent
    guess; the provider's retryable flag says when to try again).

- id: P1B-39
  title: A zoned timestamp's whole table is read on the core route where the reference, without pytz, falls back to its preview
  kind: change
  old_behavior: >-
    In the reference's own environment (ref-pandas3: pandas 3, which no
    longer installs pytz), DuckDB's Python driver cannot fetch a TIMESTAMP
    WITH TIME ZONE value ("Required module 'pytz' failed to import"), so
    the whole-table statement of the time column's choice raises for any
    table holding a zoned candidate, and the reference chooses from its
    preview as P1B-38 describes. With pytz installed (as under pandas 2,
    dbr17-pandas2) it reads the whole table.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    the statement's answer travels as Arrow, which needs no pytz, so a
    zoned timestamp is read over the whole table as every other kind is:
    the answer the reference gives where pytz is installed. Where the
    preview and the whole table disagree the time column chosen, or the
    warning, differs from the reference's in ref-pandas3: a zoned column
    held only past the first 1,000 rows, or mostly empty past them, is
    passed over (sparse) where the reference took it unchecked; one whose
    first 1,000 rows hold one value is taken with no warning where the
    reference warned it was taken unchecked. The default route is
    unchanged.
  affected_inputs: >-
    Schema.from_source under a forced core route over a DuckDB table of
    1,000 rows or more holding a TIMESTAMP WITH TIME ZONE column that is
    a time column candidate, compared with the reference run without
    pytz.
  cases: [T1.32e]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E83}
  notes: >-
    Measured by contract/tools/whole_table_time_probe.py (seed 32, 50
    generated sources): 42 agree with the reference and 8 differ, each a
    zoned candidate; of the 8 targeted zoned sources 3 agree and 5
    differ. Run with pytz on the reference's path, all 50 and all 8
    agree. The test author's timestamptz vectors (one zoned column held in
    every row) agree either way. The core reads what the reference's code
    asks for; the difference is the reference's environment. Owner to
    approve (a different success, not E66(b)'s class); never
    self-approved. Approved by the owner on 2026-10-13, relayed by the orchestrator (E85).

- id: P1B-40
  title: Rows a walk reaches with a null text or decimal key beside keys that are not null are left out, with a warning, where the reference fails
  kind: change
  old_behavior: >-
    The reference's materialize sorts the keys of every keyed table its
    sampler reached (np.unique in _sample_subgraph). A null beside a text
    key's values fails that sort, which its client reports as an unnamed
    INVALID_REQUEST; beside a DECIMAL key's values it is reported as
    INTERNAL_ERROR. One null alone, or keys that are all null, sort, and
    the request is built. Such a key is kept where its table is 99%
    distinct (T1.32e's key rules), so one null in 200 rows reaches it.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    materialize leaves out of the request the rows of a keyed table whose
    rows reached hold a null text or decimal key beside keys that are not
    null, the links naming them dropped and the rest renumbered, and warns
    once per such table, NULL_KEYS_LEFT_OUT with the table, the column and
    the rows left out (sdm-core's subgraph.rs, null_keys_beside_values);
    the request is built. One null alone, keys that are all null, and a
    null integer or float key are read as before. The default route is
    unchanged.
  affected_inputs: >-
    materialize under a forced core route over a source whose keyed
    table, reached by the walk, holds in the rows reached a null DECIMAL or
    text key beside keys that are not null, its key kept by inference.
  cases: [T1.32e]
  refs:
  - 'contract/sampled-null-key-vectors.json#mixed-null-text refusal INVALID_REQUEST -> success'
  - 'contract/sampled-null-key-vectors.json#mixed-null-decimal refusal INTERNAL_ERROR -> success'
  - 'contract/key-inference-vectors.json#nulls-1-text.200 refusal INVALID_REQUEST -> success'
  - 'contract/key-inference-vectors.json#nulls-1-decimal.200 refusal INTERNAL_ERROR -> success'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E85}
  notes: >-
    The owner's option (b) of 2026-10-13, relayed by the orchestrator
    (E85): drop the rows with a warning, no refusal. Measured on the test
    author's vectors (contract/sampled-null-key-vectors.json,
    contract/key-inference-vectors.json) and by
    contract/tools/key_rules_probe.py. nulls-1-text.200 (the reference's
    unnamed INVALID_REQUEST) is under option (b) too, the orchestrator's
    reading: the same text key mixing nulls with values. The test author's
    vectors hold the request equal to the not-sampled twin's and the
    warnings to the twin's plus this one. Formerly proposed as a refusal by
    name (null_key) at T1.32e's first push.

