    needs the owner. T1.21e's family maps (contract/refusal-maps/<seam>.json)
    show today's core route on each; the three outcomes it already changes
    are P1B-6 to P1B-8, and from T1.25 DT-12 (time.text-us-date and
    time.text-one-bad-value, the source's CAST failure as PROVIDER_ERROR);
    from T1.27 P1B-18 (decimal.class-target-38-18, refused by name when
    its labels are read).
    Closed as superseded by the owner on 2026-10-13 (night; the owner's
    answers, item 12, E88), recorded as approved by the owner since the
    register has no superseded status; it approves no outcome of its own.
    Replaced case by case: key.hugeint, key.decimal-18-0 and key.decimal-38-10
    are P1B-31's and P1B-33's; key.varchar-large-buffers P1B-6's (approved by
    the owner the same night, recorded at the T1.32g bundle, E99(d), which
    also adds the case to P1B-33's); decimal.class-target-38-18 P1B-18's;
    nested.fixed-array P1B-9's; nested.struct and nested.map P1B-10's;
    nested.union P1B-7's; empty.fact-table P1B-11's; time.text-us-date and
    time.text-one-bad-value DT-12's; time.feature-interval P1B-8's. Relayed by
    the orchestrator, recorded at T1.33 part 2; never the implementer's
    approval.
    Its cases are emptied at T1.33 fix 3 (the orchestrator's decision), moved
