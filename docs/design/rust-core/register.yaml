    returns in varying order and whose summed values are inexact in
    float32: measured on RelBench H&M's full tables (15,453,651
    transactions), the 30-day SUM(price) per customer.
  cases: [T1.32e]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E83}
  notes: >-
    ORD-2's notes foresaw this entry. Measured by
    scripts/live/real_data_benchmark.py --dry-run on the full H&M tables
    (seed 0, 16 entities): the old route's request and the core's differ in
