- id: DT-16
  title: Text in the core's list read, refused or warned of otherwise than the reference
  kind: change
  old_behavior: >-
    pandas reads a column's text by a format guessed from its first value,
    reading a value written another way as NaT (inference's and the time
    column's readings), or value by value with each slash date month first
    unless its first field cannot be a month (a SQL source's text time
    column); it warns of a guessed format that puts the day first, which it
    guesses from a first value whose first field is past 12 and a four-digit
    year; values with mixed offsets that its guess leaves partly NaT do not
    raise; an instant past what nanoseconds hold, in a column of nanosecond
    values, is NaT.
  new_behavior: >-
    The core reads every value of its list by the value's own format, and
    the order of day and month by the client's rule over the values read
    together (date-rules.md, "The core's text formats"). The kinds, as the
    differential names them (text-times-differential.json): b.order_open, an
    order the values leave open is refused (text_time_order) where the
    reference reads month first (01/05/2024 alone), and, in inference and
    the time column's choice, a column whose order changes the score or
    the start (03/15/99 beside 15/11/00), both under their own rule
    text_time_order; b.order_decided, a value
    read in the order the column decides (02/01/2024 beside 15/03/2024 is
    the 2nd of January, the 1st of February to the engine); b.format_guess,
    a value the reference's guessed format reads as no time is read (a
    column of 2024-01-05 and 2024-01-05 10:30:00, or of ISO and slash
    dates), so inference may type a text column a timestamp that the
    reference types as text and materialize go on to read it; b.offsets,
    offsets mixed among the values read refused (text_time_zones) where the
    reference's guess left one side NaT and raised nothing, or decided where
    it raised; b.range, a year past 2262 read where a nanosecond column
    reads NaT (materialize then refuses it, DT-14); b.order_rule, the day-
    first warning given where the client's rule decides the day comes first
    over the column's day or month first values (a two-digit year, an
    ambiguous first value, a stray value outside the list beside them) and
    not where pandas guesses it from a first value the core does not read
    as day or month first.
  affected_inputs: >-
    Over the 13,456 columns T1.25 recorded: materialize 1,166 (1,150
    b.order_open, 15 b.order_decided, 1 b.range); the time column's choice
    1,203; inference 398 of 26,908 decisions (272 b.offsets, 67
    b.format_guess, 41 b.order_open, the rest range or mixed); the warning
    372 of 2,810 (b.order_rule). Over
    T1.25b's 60 generated sources: European dates (dd/mm/yyyy, dd-mm-yyyy
    HH:MM) typed a timestamp and warned of, two-digit European years read
    and warned of, US-and-ISO and mixed ISO layouts typed a timestamp, an
    ambiguous text feature refused (text_time_order), mixed offsets refused
    at describe.
  cases: [T1.25b]
  refs: [DT-7, DT-11, DT-14]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E68}
  notes: >-
    Approved by the owner on 2026-10-11, relayed by the orchestrator during
    T1.25b's fix round 1 ("approve both", as recommended), including the
    refusal of a lone ambiguous date (text_time_order) rather than reading
    it month first by default; the approval takes in the open orders fix
    round 1 moved here from DT-15 (text_time_order in inference and the
    time column's choice, 41 inference decisions over T1.25's columns).
    Recorded in E68. Before the answer it was proposed, never
    self-approved: the owner's T1.25b answer required separate approval
    for a value inside the documented formats read differently from the
    reference. No contract case was affected (the gate passes with no
    transition). Each kind is the client's documented rule (the order over
    the column, two-digit years, per-row reading) or a pandas artefact the
    core drops (the format guessed from the first value, month first by
