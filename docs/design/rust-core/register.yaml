  - {case: empty.fact-table, cell: ref-pandas3, runner: rust-host, old: 'none', new: 'refusal INVALID_REQUEST', summary: 'first admission (T1.32g): the outcome this entry states, held as the case is admitted'}

- id: P1B-12
  title: Schema.from_source's keys and time columns of the wrong type are refused by the core, by name, where the reference refuses them or fails unnamed
  kind: change
  old_behavior: >-
    The reference reads each key it is given with _as_key_tuple, after the
    source is read and the key's table is found: None names no column,
    refused as an empty key; a name, one column; an ordered iterable of
    names, read once with list(), its columns; anything else (a number, a
    set, a mapping, bytes, a nested list, a member that is not a name) is
    refused, all StructuredDataError INVALID_REQUEST, and an exception
    raised while reading the iterable propagates. A time column that is
    not a name is refused as a column the table lacks where it is hashable
    (a number, a tuple, INVALID_REQUEST), and fails unnamed where it is
    not (a list, a set, a mapping, a pd.Index or an ndarray: TypeError
    unhashable type). A table named by a non-str is refused
    INVALID_REQUEST as a table the schema lacks; text JSON cannot hold (a
    lone surrogate) is refused INVALID_REQUEST.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    the Python bridge writes each key and time column as contract 23's
    Given (T1.32h, decision E101): a value the contract's type holds as
    {"value": ...}, any other "unreadable", by the codec's one classifier
    the edit setters use too. The core refuses each after the source is
    read, as the reference does: an unreadable key INVALID_REQUEST
    {field: primary_keys, table, rule: key_not_names}; a None key as an
    empty key {field, table}; an unreadable time column INVALID_REQUEST
    {field: time_columns, table, rule: time_column_not_a_name}; a column
    the table lacks {field, table, column}, as before. Every input the
    reference refuses INVALID_REQUEST is refused INVALID_REQUEST. What
    differs from the reference: (1) a time column the reference fails
    unnamed (a list, a set, a mapping, a pd.Index, an ndarray) is the
    core's named refusal (decision E66(b)'s class); (2) the host's own
    steps, reading an iterable key (an iterable whose reading raises lets
    its exception out unchanged, KeyboardInterrupt included) and encoding
    (a lone surrogate, the codec's INVALID_REQUEST with no fields), run
    before the source is read, where the reference reads the key after
    it, so with a source that also fails the host's step is seen first;
    (3) a table named by a non-str is written by JSON's coercion of an
    object key (3 is the table "3", None "null"), refused as a table the
    schema lacks with that name, or taken if the source holds such a
    table; a tuple is the codec's refusal; from T1.32h's part 2 the host
    refuses any such table name before the run instead (P1B-74,
    approved); (4) in several tables, the core takes the tables in
    the order of their names, the reference in the caller's mapping order
    (the multi-fault class, E41(k)). The default route is unchanged.
  affected_inputs: >-
    Schema.from_source over a DuckDB source under a forced core route,
    with primary_keys or time_columns holding a value of another type than
    a name or a sequence of names, an iterable key, or a table named by
    anything but a str.
  cases: [T1.23, T1.24, T1.24b, T1.32h, base.adventureworks, time.text-declared]
  refs:
  - 'contract/given-vectors.json#time.list refusal UNNAMED -> refusal INVALID_REQUEST'
  - 'contract/given-vectors.json#time.mapping refusal UNNAMED -> refusal INVALID_REQUEST'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E101}
  notes: >-
    Found by T1.24's round-1 review (subagent P3-3), pre-existing from
    T1.23. The owner said on 2026-10-13 that P1B-12 must be fixed, asked
    for a design of where the rule lives and of the interface, and
    allowed the bridge to grow for it (owner decisions of 2026-10-13,
    item 18, relayed by the orchestrator; never the implementer's
    approval). The design of 2026-10-13, revised after Codex's review,
    puts every refusal of a value in the core (sdm-schema's
    apply_keys_and_times, sharing edit_schema's refusals, E101) and
    leaves the host only the reading of its own argument's type, the
    stays-host class: the frozen _rust/schema.py::from_source is declared
    moved, naming T1.32h. Held by contract/given-vectors.json on
    python-core and rust-host (contract/tests/test_t132h_given_vectors.py,
    sdm-testkit's tests/t132h_given.rs) and the client's
    tests/test_t132h_keys_and_times.py, every Python type. Before T1.32h
    a key of None or a number failed with a raw TypeError, a set or a
    mapping was read as its members or keys and taken, and a nested list
    or a time column that is not a name reached the decoder,
    INVALID_MESSAGE. A key naming one column twice is the reference's
    success; the core refuses it key_column_twice (P1B-73, approved).
    A 0-d NumPy array as a key (np.array('order_id')) is an iterable whose
    reading raises: TypeError (iteration over a 0-d array) on both routes,
    the caller's exception let out unchanged, as the iteration policy
    says (measured at T1.32h's review, P3-1).
    Contract 23 changes the shape of two cases' core inputs, their
    describe_source spec's keys and time columns now written as Given;
    their outcomes are unchanged on every runner, and their reference
    lines are recorded again for the new case files (identity only).
  case_outcomes:
  - {case: base.adventureworks, cell: ref-pandas3, runner: python-ref, old: 'success at predict', new: 'success at predict', summary: 'case file only: the core spec written as contract 23 Given; the outcome unchanged'}
  - {case: time.text-declared, cell: ref-pandas3, runner: python-ref, old: 'success at predict', new: 'success at predict', summary: 'case file only: the core spec written as contract 23 Given; the outcome unchanged'}

