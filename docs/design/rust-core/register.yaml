# The quirk register (migration-plan.md section 5; Phase 0, T0.8).
#
# Every behavior of the reference that the Rust core keeps, drops or changes by
# recorded decision. Format 2 from T1.14 (Phase 1 decision A6), checked by
# scripts/rust_core/register.py validate against register.schema.json:
#
#   cases          contract case IDs, or for an entry written before the
#                  corpus the legacy form, a task ID or an inventory case ID;
#   refs           what an entry cites that is not a case (Phase 0 vector
#                  groups G1 to G5 and M1 to M5, reference commits, documents,
#                  other entries), moved out of `cases` by the migration;
#   case_outcomes  each case, cell and runner whose projected outcome the
#                  entry changes, with the exact old and new outcome, generated
#                  by scripts/rust_core/ratchet.py, never written by hand;
#   decision_ref   {file, row}: a decisions file by path and the row's ID.
#
# The checkpoint's ratchet compares each entry with the checkpoint's: changed
# contents under an approved ID are a new change and need approval again, and
# an ID is never removed or reused.
#
# IDs by origin:
#   PK-n   the plan's section 5 "keep" column (approved by the owner)
#   PD-n   the plan's section 5 "drop" column (approved by the owner)
#   DF-n   determinism fixes of the reference (T0.3, determinism-fixes.md)
#   RS-n   random streams (T0.6, random-streams.md)
#   DT-n   dates and time zones (T0.6, chrono-check.md and date-rules.md)
#   ORD-n  orderings found in Phase 0 that are not random streams
#   P1B-n  Phase 1b inventory cases flagged `register` (T0.7)
#   HOST-n the host layer's own limits (Phase 1, T1.7)
#   PQL-n  PQL validation differences found by the S0 corpus (Phase 1, T1.12)
#   SMP-n  the sampler's behaviors the core keeps, registered at T1.27
#          (checkpoint 7), each found in a package's differential
#
# Status: proposed entries wait for the independent reviewer, or for the owner
# when they refuse an input Python accepted or the owner has to choose; the
# recommendation is in notes. approved_by is null while proposed.
# "The reference" is rust-core-reference; "main" is unpatched main at fa0637d.

format: sdm-register/2

entries:

