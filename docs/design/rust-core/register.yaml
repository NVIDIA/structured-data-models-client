- id: P1B-42
  title: Times of day and ratios written as text, under a name that does not say time, are read as categories, where the reference reads them as times of the day it runs
  kind: change
  old_behavior: >-
    The reference reads text such as 09:30, 9:30 AM, 09:30:15, 16:9 or
    1:2 with pandas' to_datetime, which takes it as that time on the day
    the call runs. Under any name such a column is a timestamp: on the
    entity table it becomes its time column, and materialize then fails
    INVALID_REQUEST; on the fact table, beside the time column, it is sent
    as a timestamp feature dated the day of the run. Its multi-category
    reading is never reached.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    such text is no time under a name that does not say time, by the
    approved DT-17 (outside the client's shapes), so the ported
    multi-category reading decides it (sdm-schema's infer.rs,
    text_holds_categories): split by the colon, a column of few parts is
    multicategorical, and otherwise categorical or text; materialize and
    predict then succeed, the values sent whole. Before T1.32e part 2a the
    core refused such text at from_source (rule multicategorical). The
    default route is unchanged.
  affected_inputs: >-
    Schema.from_source, materialize and predict under a forced core route
    over a source with a text column of times of day or ratios under a
    name that does not say time. Under a name that says time such values
    are refused text_time (DT-15), as before.
  cases: [T1.32e]
  refs:
  - DT-17
  - 'contract/multicategorical-vectors.json#text.time-of-day* refusal INVALID_REQUEST -> success'
  - 'contract/multicategorical-vectors.json#text.ratio refusal INVALID_REQUEST -> success'
  - 'contract/multicategorical-vectors.json#text.aspect-ratio refusal INVALID_REQUEST -> success'
  - 'contract/multicategorical-vectors.json#large.times-then-multi-after-1000 refusal INVALID_REQUEST -> success'
  - 'contract/multicategorical-vectors.json#fact.time-of-day success -> success'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E86}
  notes: >-
    A refusal to success change (E66(b), E73(b)), for the owner. Measured
    on the test author's 77 vectors: these 8 differ, on both hosts, and
    stay pending until an approval. Matching the reference instead would
    mean reading a time of day as a date the core takes from a clock (the
    reference's answer for fact.time-of-day carries the day it was
    recorded, 2026-10-13, so it changes with the day the reference runs)
    and reversing DT-17 for this shape. The other choice, refusing such
    text by name, would refuse fact.time-of-day, which the reference
    answers.
    Approver: owner (T1.33: a refusal to success, kept by E66(b) for
    individual decision; the owner approved it on 2026-10-13, evening,
    recorded at the T1.32g bundle, E99(b), not here).
    Approved by the owner on 2026-10-13 (evening, E99(b): text such as 09:30
    in a column not named as a time stays categorical), relayed by the
    orchestrator, recorded at T1.32g; never the implementer's approval.

- id: P1B-43
  title: A column DuckDB hands over as an Arrow extension type is read as what it means, where the reference fails unnamed
  kind: change
  old_behavior: >-
    DuckDB hands some types over as Arrow extension types: under SET
    arrow_lossless_conversion = true a UUID as arrow.uuid
    (fixed_size_binary(16)), a HUGEINT, a UHUGEINT and a TIMETZ as
    arrow.opaque over fixed_size_binary, a BIT as arrow.opaque over binary, a
    JSON as arrow.json over utf8 (and a BOOLEAN as arrow.bool8); with any
    setting a VARINT (BIGNUM) as arrow.opaque over binary, large_binary under
    arrow_large_buffer_size, or binary_view under arrow_output_version 1.5 or
    string views. The reference's Schema.from_source fails the UUID, HUGEINT,
    UHUGEINT, BIT, JSON and VARINT columns with an unnamed RuntimeError, and
    describes the lossless TIMETZ column as a timestamp (dtype timestamp[us],
    stype timestamp).
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    host layer reads each as what it means before admission (sdm-host's
    extensions.rs; the owner's decision of 2026-10-14, item 26: read, not
    left out): the UUID as text, its canonical lower-case 8-4-4-4-12 form;
    the BIT as text of 0 and 1; the TIMETZ as a time of day, as a TIME is
    (dtype timestamp[us], every payload cell null), its offset dropped, so
    it is described as the reference describes it; the JSON as text. A
    HUGEINT, UHUGEINT or VARINT, under any setting and storage, follows the
    big-integer rule over the whole column: received as int64 where every
    value fits it, else as decimal128(38, 0) where every value fits 38
    digits, else as text (utf8); dtype int for the first two, string for
    the third; every payload cell is DuckDB's own CAST(x AS VARCHAR), so
    exact. The tier is the whole column's, never a fetch's (the
    orchestrator's decision of 2026-10-14): where the preview may have left
    rows unread, describe_source asks the column's smallest and largest
    values over the whole table (column_ranges) and takes the widest tier;
    every later fetch is widened to the tier described, and one holding a
    value past it (a source that does not answer column_ranges) is refused
    VALUE_OUT_OF_RANGE naming the column, never sent in another tier. A HUGEINT with no setting (decimal128(38, 0)) is read as before.
    A lossless connection is described as any other (T1.33's fix of the
    catalog read: arrow.bool8 admitted as boolean). A value whose bytes the
    type's layout does not read is refused UNSUPPORTED_TYPE naming the
    column, never guessed. An opaque column is read by DuckDB's layouts only
    when its metadata names the vendor the run's provider declares
    (sdm-data's DuckDB dialect declares DuckDB's; a host provider declares
    none): another vendor's, or none, is admitted by its storage as before
    (binary, left out). A decimal128(38, 0) seed key is joined in the
    joined key's own type where that is an integer type, as describe_source
    read it from the source's catalog and the described schema keeps it
    (DescribedColumn.declared_type, contract version 24, for a big-integer
    column the host layer read from an opaque type only; any other key joins
    as before part 3), so materialize adds no statement
    (t.key = TRY_CAST(seed AS type), a VARINT through HUGEINT), exact and
    native: no one SQL type compares such a seed exactly
    with a VARINT and a UHUGEINT key alike (DuckDB has no DECIMAL(38, 0) to
    VARINT cast, and compares a UHUGEINT with a HUGEINT through DOUBLE); a
    float or a decimal with a scale keeps the comparison it had before part
    3. The default route is unchanged.
  affected_inputs: >-
    Schema.from_source and materialize over a DuckDB connection with
    arrow_lossless_conversion set, holding a UUID, HUGEINT, UHUGEINT, BIT or
    JSON column, or over any DuckDB connection holding a VARINT column,
    under a forced core route.
  cases: [T1.33]
  refs:
  - 'contract/type-set-vectors.json#lossless.uuid refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.hugeint refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.hugeint-wide refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.hugeint-past-38-digits refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.uhugeint refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.uhugeint-wide refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.uhugeint-past-38-digits refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.bit refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.json refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.varint refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#varint refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#varint-wide refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#varint-past-38-digits refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#varint.large refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#varint.view refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#lossless.hugeint-wide-after-preview refusal UNNAMED -> success'
  - 'contract/type-set-vectors.json#varint-wide-after-preview refusal UNNAMED -> success'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E120}
  notes: >-
    Approved by the owner on 2026-10-14 (items 21 and 26: support rather
    than skip; UUID and BIT as text, TIMETZ as a time, HUGEINT, UHUGEINT and
    VARINT as a number, text only where a value cannot be held), with the
    big-integer rule's tiers the orchestrator's (2026-10-14), recorded in
    E120. Rewritten at T1.33 part 3 from "read by its storage" (binary,
    left out), which the owner turned down. The reference fails each unnamed
    and the core reads it: a new success, E66(b)'s class for the owner's
    individual decision. lossless.timetz no longer differs (both describe
    it as a time) and fixed-size-binary.16 is not reachable bare, so
    neither is named. Measured by T1.33's test author:
    contract/type-set-vectors.json's rows, the reference's answers recorded
    through each row's witness by contract/tools/type_set_record.py in the
    reference environment (DuckDB 1.5.6); the core's held through real
    DuckDB on rust-host by sdm-testkit's tests/t133_type_reach.rs and
    tests/t133p3_reads.rs (each payload cell against DuckDB's own text);
    each transition held by contract/tests/test_t133_type_set.py.
    Without arrow_lossless_conversion, DuckDB exports UHUGEINT as
    decimal128(38,0), even for values exceeding its declared precision;
    values above 2^127-1 wrap to signed i128 (2^128-1 arrives as -1),
    before the core sees them.
    Known edges of the seed join, from T1.33 part 3's review, recorded at
    T1.36; each fails by name, never with wrong rows: a key read in the
    text tier joins its seeds as before part 3, so linking keys of
    different big-integer types (a HUGEINT key against a 41-digit VARINT)
    fails PROVIDER_ERROR, naming the provider's failure; and a key that is
    a decimal with a scale (DECIMAL(10, 2)) joined to a seed of 1e36 or
    more fails DuckDB's conversion, PROVIDER_ERROR likewise (as-built,
    T1.33 part 3).

- id: P1B-44
  title: Text and binary DuckDB hands over as view types, and lists of text views, are read as text and binary where the reference fails unnamed
  kind: change
  old_behavior: >-
    Under SET arrow_output_version = '1.4' with produce_arrow_string_view
    DuckDB hands VARCHAR over as utf8_view and BLOB as binary_view; the
    reference's Schema.from_source fails either column with an unnamed
