# --- PQL validation (T1.12) ---------------------------------------------------

- id: PQL-1
  title: Escaped surrogates in a PQL string literal
  kind: change
  old_behavior: >-
    The reference reads a string literal's escapes with Python's
    unicode-escape codec, which leaves \uD800 to \uDFFF escapes as lone
    surrogates, a pair included (\ud83d\ude00 is two of them, not one
    character). Validation takes the literal; the old materializer then
    refuses the call with INVALID_REQUEST (a UnicodeEncodeError,
    "surrogates not allowed", when it writes the value).
  new_behavior: >-
    The core's escapes.rs joins an escaped pair into the character it
    encodes and reads a lone surrogate as U+FFFD, and validate_query
    accepts the query, so a core route that materializes would go on where
    the reference refuses. Today only rust-host shows it: on the Python core
    route the accepted query still goes through the shadow check and the
    old materializer, which refuse as the reference does.
  affected_inputs: >-
    S0 (and every later core route) for a PQL string literal holding a
    \u escape of a surrogate, paired or lone.
  cases: [s0.boundary.escape-surrogate-pair, s0.boundary.escape-lone-surrogate]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E93}
  notes: >-
    Found by T1.12's review (subagent P2-1); the orchestrator chose to
    record it rather than stop. The core accepts input the reference
    refuses, so it needs the owner. Alternatives: (a) keep the core's
    reading, joining pairs and replacing lone surrogates; (b) match the
    reference: refuse any escaped surrogate with INVALID_REQUEST at
    validation (the reference refuses later, at materialize, with the same
    code); (c) join valid pairs and refuse a lone surrogate by name. Both
    cases are diagnostic until the owner decides; the one that matches the
    decision then becomes acceptance. Approved by the owner on 2026-10-13, relayed by the orchestrator (E93): surrogates in PQL handled as proposed.

- id: PQL-2
  title: PQL query depth past the reference's recursion limit
  kind: change
  old_behavior: >-
    The reference has no depth limit of its own: its parser and the old
    materializer recurse, and past about 461 nested levels (in the
    contract runner under Python 3.12; the edge moves with the caller's
    stack) the public call raises RecursionError.
  new_behavior: >-
    The core bounds depth (decision H27): validate_query accepts up to 999
    nested levels, on its grown stack, and refuses 1,000 and more with
    PQL_PARSE_SYNTAX. On the Python core route the accepted query still
    goes through the shadow check's old validator, so the public call
    raises RecursionError from about 461 to 999 levels, as the reference
    does, and answers INVALID_REQUEST at 1,000 and above, where the
    reference raises RecursionError.
  affected_inputs: >-
    S0 (and every later core route) for a query nested more deeply than
    the reference's recursion limit allows.
  cases: [s0.boundary.depth-999, T1.7c]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E93}
  notes: >-
    Found by T1.12's review (Codex P2, subagent P3-2). It refuses nothing
    the reference accepts, since the reference answers no such query.
    Recommendation: keep the core's bounded behavior rather than reproduce
    the reference's crash. The Python route's RecursionError up to 999
    leaves with the shadow check and the old validator in Phase 5
    (_rust/s0.py's bridge header; design, "Routing seam"). Executable:
    s0.boundary.depth-999 (diagnostic: python-ref and python-core raise
    RecursionError, rust-host accepts) and sdm-core's
    tests/pql_adapter.rs, whose deepest() queries are accepted at 999
    nested levels and refused at 1,000 (T1.7c).
    The edge, about 461 levels, was measured in the runner on Python 3.12
    at T1.12's last review; the two depth cases' texts still say about
    455, left as written, since changing a case file changes the digest
    its reference observation is held to. Approved by the owner on 2026-10-13, relayed by the orchestrator (E93): the core accepts PQL nested up to 999 levels, where the reference crashes.

- id: PQL-3
  title: The day-first date literal warning given once per literal (D4)
  kind: change
  old_behavior: >-
    The reference reads a date literal with pd.to_datetime each time a step
    reads it, and pandas gives its UserWarning ("Parsing dates in %d/%m/%Y
    format when dayfirst=False ...") each time: twice in a validation
    (Constant built, then typed_value in the checks), more as the
    materializer reads the literal again. Under Python's default warning
    filter a caller sees it once per call site.
  new_behavior: >-
    The core gives DATE_LITERAL_DAY_FIRST (fields: the format and the
    literal's span) once per day-first literal, from the validate_query run
    that reads the query; materialize, which a public call reaches only
    after validating, gives none, so the pure-Rust host's S1 path, which
    starts no validate_query, gives none. The Python host words it in
    pandas' sentence behind its code. On the S0 core route, for a query the
    core accepts, the core's is held back while the shadow check's old
    validator gives the reference's own (s0.SHADOWED, bridge code until
    Phase 5), so the caller sees what the old route shows; for a query the
    core refuses, which meets no shadow check, the core's is shown, once
    per day-first literal read, where the reference gives one per read:
    once for a query refused before the later type checks read the literal
    again, twice for one refused in them.
  affected_inputs: >-
    Queries with a date literal read day first whose format pandas names
    (a four-digit year, one or two digits elsewhere), on the core route.
  cases: [T1.6b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E78}
  notes: >-
    Approved by the owner on 2026-10-12, relayed by the orchestrator during T1.28b (E78(l)).
    Measured at T1.6b: the corpus's one day-first case gives the reference's
    warning twice and the core's once, the same format
    (sdm-core/tests/pql_corpus.rs compares the formats as a set, and fails
    where the core warns twice at one literal);
    test_a_day_first_literal_warns_on_the_core_as_on_the_old_route holds
    the python-core caller to the old route's warnings for an accepted
    query, and to the old route's one warning, worded the same behind the
    code, for two refused after the literal is read (T1.6b fix round 1,
    Codex P2: the warning was held back on refusal too). Where the run cannot
    read the host's zone and a later literal needs a two-digit year placed,
    the zone refusal ends the validation, and the day-first warnings of the
    literals read before it are not given (T1.6b review, carried at
    T1.28w). Recommendation: approve; the count is the reference's reading
    count, not a rule.

- id: PQL-4
  title: A day-first literal whose middle field is written as its year
  kind: change
  old_behavior: >-
    pandas guesses a literal's format by writing its reading back with
    strftime; for a day-first literal whose middle field is a four-digit
    number written as the year is (13/0001/1, read as the 13th of January
    of the year 1), it names the middle field %Y and the last %m, and warns
    "Parsing dates in %d/%Y/%m format ...", reading the same date.
  new_behavior: >-
    The core reads the same date and gives no D4 warning: D4 names a format
    only for a four-digit year last and one or two digits elsewhere
    (date-rules.md, "The PQL literal rules").
  affected_inputs: >-
    PQL date literals day first whose middle field has four digits and
    equals the year written last (with its time of day, if any).
  cases: [T1.6b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E78}
  notes: >-
    Approved by the owner on 2026-10-12, relayed by the orchestrator during T1.28b (E78(l)).
    Found by T1.6b's probes: 144 of the 1,134 literals of dates.json's
    format_guess set, and 7 of the 330 generated queries of the pre-push
    differential, differ only so; every reading agrees. Executable:
    sdm-pql's tests/dates.rs,
    a_format_pandas_guesses_from_a_year_written_as_a_month_is_not_named
    (diagnostic). A pandas artifact of format guessing, flagged to the
    owner rather than copied (the T1.6b brief). Recommendation: approve.
- id: PQL-5
  title: A query reaching a link that names a table the schema lacks
  kind: change
  old_behavior: >-
    The reference's join validator, looking for a route between the
    query's tables (JoinValidator._route_between), reads each linked
    table's key from the schema by name; where a link names a table the
    schema does not hold, it raises KeyError (an unnamed crash, no PQL
    error).
  new_behavior: >-
    The core answers the query by PQL code: where the walk needs that
    link, validate_query refuses it with PQL_JOIN_MISSING_FOREIGN_KEY
    and the aggregation's span, as for any table it cannot join.
  affected_inputs: >-
    validate_query against a schema one of whose links names a table the
    schema does not hold, for a query whose join walk reaches that link.
  cases: [T1.20]
  status: approved
  approved_by: reviewer
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E66}
  notes: >-
    Measured by T1.20's batch-2 S0 differential: 1 of the 120 queries run
    against the schema with a link to a missing table ("ghostlink"),
    PREDICT COUNT(orders.*, 0, 30, days) FOR EACH orders.order_id; the
    other 119 agree. The reference crashes where the core gives a named
    refusal, so it is E66(b)'s class, for the reviewer to approve under
    it. Whether a public Schema can hold such a link, so that a client
    caller reaches it, is not established here; the differential calls
    the adapter directly. No case holds it.
    Approver: reviewer (T1.33: the reference's KeyError to a PQL code,
    E66(b)'s class).
    Approved by both reviewers of the final whole-phase review at c49ee4f8
    (Codex's and the independent subagent's: APPROVE-PQL-5), relayed by the
    orchestrator, recorded at T1.36 fix 7; never the implementer's approval.
    Codex: the reference's unnamed failure (its join validator indexing a
    missing linked table) to a named PQL code under E66(b) only, not a
    catch-all approval of its code, public-schema reachability unclaimed;
    the subagent: adapter-level, from T1.20's differential, not reproduced,
    no public reach shown.

