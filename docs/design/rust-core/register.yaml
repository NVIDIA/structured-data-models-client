# The quirk register (migration-plan.md section 5; Phase 0, T0.8).
#
# Every behavior of the reference that the Rust core keeps, drops or changes by
# recorded decision. Validated against register.schema.json.
#
# IDs by origin:
#   PK-n   the plan's section 5 "keep" column (approved by the owner)
#   PD-n   the plan's section 5 "drop" column (approved by the owner)
#   DF-n   determinism fixes of the reference (T0.3, determinism-fixes.md)
#   RS-n   random streams (T0.6, random-streams.md)
#   DT-n   dates and time zones (T0.6, chrono-check.md and date-rules.md)
#   ORD-n  orderings found in Phase 0 that are not random streams
#   P1B-n  Phase 1b inventory cases flagged `register` (T0.7)
#   HOST-n the host layer's own limits (Phase 1, T1.7)
#   PQL-n  PQL validation differences found by the S0 corpus (Phase 1, T1.12)
#
# Status: proposed entries wait for the independent reviewer, or for the owner
# when they refuse an input Python accepted or the owner has to choose; the
# recommendation is in notes. approved_by is null while proposed.
# "The reference" is rust-core-reference; "main" is unpatched main at fa0637d.

format: sdm-register/1

entries:

