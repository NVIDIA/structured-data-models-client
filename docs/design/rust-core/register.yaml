    tests/test_the_schema_route.py. Never self-approved. Approved by the owner on 2026-10-11 as a class (E66(b): where the reference crashes or gives an unnamed or internal error, a named refusal or a clearer code is approved), relayed by the orchestrator; checked at T1.26b to fit it: the reference's answer is an unnamed or internal error, and the core's a named refusal or a clearer code. From T1.32d its refs name the family's vectors whose source holds an empty table (the fact table, the entity table, both, a third table named or not, the fact table named, emptied by a filter, and with no entities asked for), each the same transition, the reference's unnamed RuntimeError to this entry's UNSUPPORTED_REQUEST: for a reviewer to hold to the approved meaning. The code is kept: the recommendation above, INVALID_REQUEST, would change this approved entry, so T1.32d leaves it to the owner (E91). The owner chose INVALID_REQUEST on 2026-10-13, the rule kept (relayed by the orchestrator; recorded at T1.32g, E97, never the implementer's approval): the refs above declare the reference's unnamed RuntimeError to INVALID_REQUEST, and sdm-schema's infer.rs refuses an empty table so.
    Its first-admission case_outcomes (empty.fact-table, T1.32g) approved by
    both reviewers of T1.32g part 2b's review round 1 (Codex and the
