- id: P2A-1
  title: The AdventureWorks cases' core inputs name their sources as contract 26 relations, shape only
  kind: change
  old_behavior: >-
    Under contract 25 the core's describe_source took each table's source
    as one string, so the core inputs of base.adventureworks,
    base.adventureworks.churn and base.adventureworks.color named each
    source as "adventureworks_customers" and so on.
  new_behavior: >-
    Contract 26 (T2.1b, design choice 12, the owner's KO2-39) makes a
    table's source a relation, {"source": [name]}, and the Python host
    sends each one-part name as that relation, so each case's
    core.describe_source names its sources as the hosts now send them,
    one part each, the same names. Shape only: the statements the core
    renders for a one-part relation are byte for byte contract 25's, and
    no outcome moves on any runner; each case's python-ref lines are
    re-recorded for the new case files, identity only.
