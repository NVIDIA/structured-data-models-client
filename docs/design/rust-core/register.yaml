    two under T2.1g's rule (an endpoint's refusal with no code at predict
    and the core's INVALID_RESPONSE for the same call); this entry states
    rust-host's outcome for the ratchet's first admission and for the
    SQLite host test, which hold rust-host to the reference's outcome
    unless an approved entry names the case.
