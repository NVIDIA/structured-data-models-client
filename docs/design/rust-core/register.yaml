- id: DT-10
  title: Zone answers at the ends of the time range, by the zone's rules
  kind: change
  old_behavior: >-
    pandas 3 converts an instant to a zone's wall clock (Timestamp.tz_convert)
    only where Python's datetime holds both: of the range-end vectors in the
    18 vendored zones, at the int64 microsecond range's ends it raises
    (ValueError, NotImplementedError, OutOfBoundsDatetime: 36 of 36), at
    9999-12-31T23:59:59.999999Z in 8 zones (NotImplementedError,
    OverflowError), and at 0001-01-01T00:00Z it raises in 6 zones and in 11
    shows the instant's UTC wall clock with the zone's offset beside it, where
    the wall clock falls in the year 0; it answers every other vector
    (101 of 162) by the zone's rules.
  new_behavior: >-
    sdm_engine::time answers every instant an i128 of nanoseconds holds by
    the zone's rules (Instant::to_local, localize): inside jiff's range by
    jiff, outside it by moving the instant by whole 400-year Gregorian cycles
    into a window jiff holds on the same side of the zone's history (before
    its first transition the offset it starts with, after its last the rule
    its database ends with, which repeats every cycle), with civil arithmetic
    for the wall clock (E6). time-ranges.json holds the answers in every
    vendored zone, recorded with zoneinfo over the same files and moved by
    other windows, so the cycle rule is held, not assumed.
  affected_inputs: >-
    Zone conversions of instants or wall clocks before 0001-01-02 or after
    9999-12-30T22:00Z. No public path reaches one in Phase 1: a zoned time
    column is read at its UTC instants, and an anchor time with a zone at
    its UTC instant, neither through a zone's rules.
  cases: [T1.25]
  refs: [DT-1, M4]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E140}
  notes: >-
    Measured at T1.25 (rust/crates/sdm-engine/tests/time_ranges_record.py
    records pandas' own answer beside each expected one). It refuses nothing
    the reference answers, so it is for the independent reviewer.
    Recommendation: approve.
    Approver: owner (T1.33: at 0001-01-01T00:00Z in 11 zones the reference
    answers, the instant's UTC wall clock with the zone's offset beside it,
    and the core answers otherwise, a changed answer, which E66(b) keeps for
    individual decision; elsewhere the reference raises. E66's row records the
    orchestrator's reading that the range ends are the reviewer's, which the
    orchestrator may keep instead).
    Approved by the owner on 2026-10-14 (morning; the orchestrator's record of
    the owner's answers, item 23: DT-10 approved), relayed by the orchestrator,
    recorded at T1.36 (E140); never the implementer's approval.

