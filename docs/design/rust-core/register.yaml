- id: P1B-12
  title: Schema.from_source's keys and time columns of the wrong type are read otherwise on the core route than by the reference
  kind: change
  old_behavior: >-
    The reference reads each key it is given with _as_key_tuple: None names
    no column, refused as an empty key; a name, one column; an ordered
    iterable of names, its columns; anything else (a number, a set, a
    mapping, a nested list) is refused, all StructuredDataError
    INVALID_REQUEST. A time column that is not a name is refused as a
    column the table lacks (a number, INVALID_REQUEST), or fails unnamed (a
    list, TypeError).
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    schema bridge writes each key as a list of its names before the core
    reads it (since T1.23, on the route for tables named from T1.24): a key
    of None or a number fails with a raw TypeError; a set or a mapping is
    read as its members or keys and taken; a nested list, and any time
    column that is not a name (a number or a list), reach the contract's
    decoder, which refuses them INVALID_MESSAGE. Measured at T1.24's fix
    round 1, pinned both routes' by the client's
    tests/test_the_schema_route.py. A value the contract's JSON cannot
    encode fails on the core route with a raw TypeError or ValueError where
    the reference gives INVALID_REQUEST: a time column given as a date, a
    NaN or a NumPy bool, and a key member that is a NaN or another object
    (found at T1.24's review, recorded at T1.25). The default route is
    unchanged.
  affected_inputs: >-
    Schema.from_source over a DuckDB source under a forced core route, with
    primary_keys or time_columns holding a value of another type than a
    name or a sequence of names.
