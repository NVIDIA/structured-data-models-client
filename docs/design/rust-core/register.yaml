    diagnostic until T1.29. context_coverage was a choice for the owner,
    answered by E52 (the dedupe in sdm-host) and lifted at T1.26b.
    Recommendation: approve as temporary, as P1B-2; T1.22 (seeds and
    streams), T1.26a and T1.26b (sampling), T1.27 (labels) and T1.28 (the payload)
    remove each rule's refusal, and this entry is set to rejected when the
    last one goes. T1.21b's refusal map
    (contract/refusal-maps/base.adventureworks.json) records which of these
    E27's AdventureWorks journey reaches and which task removes each, and
    T1.21e's family maps which the inventory's cases reach (key_type in the
    bridge; static_target, target_type and wire_dtype in the core, and
    time_type until T1.25); they approve nothing. Measured at T1.24 (E61) by an old-against-
    core differential over 160 generated DuckDB sources through
    Schema.from_source, edits, materialize and predict: every refusal of
    materialize's on the core named its rule (text_column, keyless_neighbors,
    num_neighbors, num_context_samples, unseeded) where the reference
    succeeded, and nothing else differed. Found at T1.24's review: over a
    key of one column given as a sequence (P1B-2), the reference refuses
    the question's entity as no primary key (INVALID_REQUEST) and the core
    route materializes it; the fix gives the description the key's form, a
    contract change for the owner's queue, not T1.24's fix round. The
    contract field is needed only for the link inferred to it (P1B-2), not
    for this half: the host's own check of the query already refuses a
    tuple key. Options for the owner (recorded at T1.25): (a) the
    description carries the key's form and the core matches the reference,
    linking nothing to a one-column sequence key; (b) it carries a flag and
    the core refuses a one-column sequence key by name; (c) approve reading
    it as a plain name. The owner chose (c), for now, on 2026-10-11: P1B-15.
    Measured at T1.24b by the E49 differential over 102 generated DuckDB
    sources, each with a sequence of edits (574 steps): keyless_neighbors is
    reached where an edit clears the key of a table others refer to (5
    sources), the reference sampling them; nothing else of this entry
    differed.
    Measured at T1.27 by contract/tools/differential.py (the E49
    differential as one committed tool): see decisions E72 and the
    tracker's T1.27 row for the counts; every refusal of materialize's on
    the core named its rule where the reference succeeded, the core's
    labels equal to the reference payload's context wherever the core
    gave them (the test-only labels operation), and nothing else of this
    entry differed.
    Measured at T1.28a by contract/tools/differential.py over 150 sources
    (seeds 27 to 29), its generator grown with booleans, DECIMAL(38, 0)
    features, times of day, wide tables, empty tables and the options the
    core now reads: the classification and static tasks' payloads equal to
    the reference's, and of this entry only keyless_neighbors, key_type
    and target_type reached. Approved by the owner on 2026-10-13, relayed by the orchestrator (E92), for the Phase 2 class only: composite_key, aggregation, anchor_entity, assuming, condition, context_anchor_time, entity_filter, entity_ids, evaluate, exclude_cols_dict, explain, lag_timesteps, logical_target, max_pq_iterations, num_hops, num_neighbors, open_window, parent_table, problem_type, return_embeddings, static_target, target_filter, target_transform_null, inference_config_text, text_time_rules, top_k, unseeded, use_prediction_time stay refused by name until Phase 2 (docs/design/rust-core/phase-1/not-yet-refusals.md; static_target only beyond the in-table case E72(c) lifted); keyless_neighbors left the class with the key rules the owner moved into T1.32e part 1 (E84), a keyless table being sampled as the reference samples it. The entry's other rules stay proposed, each its family's or T1.33's.
    Closed as superseded by the owner on 2026-10-13 (night; the owner's
    answers, item 12, E88), recorded as approved by the owner since the
