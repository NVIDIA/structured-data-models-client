  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Found by T1.24's round-1 review (subagent P3-3), pre-existing from
    T1.23. The fix is the reference's own reading in the bridge, a host's
    reading of its own argument (stays host): reading each key as
    _as_key_tuple does and a time column's type before the core runs. It
    grows frozen bridge code (E50(c)), so it waits for an owner-approved
    allowance, which T1.24b's row asks for its setters' routing too.
    Never self-approved.

- id: P1B-13
  title: A null where the sampler's walk tells rows apart is no link on the core route
  kind: change
  old_behavior: >-
    The reference's SQL sampler numbers each row it reaches by its key and
    its example (Mapper). A foreign key it looks up holding a null is taken
    for the last key it looked up (pandas' factorize gives the null -1, and
    the mask of keys found is read at -1) whenever that key was found, so a
    row of the table referred to is added for it; a null key of a table it
    reads by foreign key numbers every such row as one row, whatever its
    example. Either way the rows it adds are numbered out of step with the
    rows it keeps: the request sends rows nothing refers to, and links
    rows to rows of other examples (measured at T1.26b on generated DuckDB
    sources: of 4 with a null foreign key, every one sends rows of the
    table referred to that no row refers to, and one links 3,690 rows
    across examples; of 6 with a null key, 5 link rows across examples).
    Where its numbering does not go astray it is clean: every foreign key
    it looks up null, for one, it looks up no key (one statement of no
    row) and sends each as null.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, a
    null is no link: a null foreign key the walk looks up adds no row and
    is sent as null (an integer key column holding one as float64, as
    pandas types it), the lookup still made, of the keys that are not null
    (of none when every one is null), as the reference makes it; and a row
    of a table read by foreign key whose key is null is no other row's,
    reached anew and never merged. Measured at T1.26b's fix round 1: on
    the 112 generated sources the core's request is the reference's with
    its null handling corrected (null dropped before its factorize, each
    null key read as a key of its own) on every call, statements included,
    and the reference's own where it is clean (every foreign key looked up
    null); held by the client's tests/test_the_materialize_route.py
    (test_a_null_key_the_walk_reaches_links_nothing, the old route's
    crossing links against none on the core, for both;
    test_every_foreign_key_looked_up_null_is_the_reference_s_request).
    The default route is unchanged.
  affected_inputs: >-
    PredictiveQuery.materialize with indices over a DuckDB source under a
    forced core route whose sampled tables hold a null foreign key reached
    at the second hop or a null key in a table referring to a sampled one.
  cases: [T1.26b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E66}
  notes: >-
    Found by T1.26b's old-against-core differential (E49); proposed as a
    refusal by name (null_foreign_key, null_key) at T1.26b. The owner's
    decision (b) of 2026-10-11, relayed by the orchestrator (E66(a)): a
    null is no link, in place of the refusals, conditional on all cases
    passing and model accuracy holding; benchmark before Phase 1
    acceptance (T1.29).

- id: P1B-14
  title: A schema's keys, links or time column edited between two materialize calls is followed on the core route
  kind: change
  old_behavior: >-
    The reference builds its model, and with it its sampler, once per
    materializer (RelationalMaterializer._get_model), from the schema as it
    stood at the first call; a key, a link or a time column edited on the
    same schema before a later call of the same query is not followed: the
    later call reads neither the indexes nor the time bounds again, warns
    of no missing index, and sends the request the first schema gives.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    sampler state a call leaves is made under the provider and each table's
    key, time column and unique columns and the links (E64); a later call
    of the same query whose schema's keys, links or time column were
    edited does not read it: it checks the indexes and reads the time
    bounds afresh, warns of missing indexes again, and sends the request a
    new materializer of the edited schema sends (measured at T1.26b's fix
    round 1 on the shop with a second time column, a second key and a
    second table referring to the users: the core's second call 7, 7 and
    6 statements with one warning each, the reference's 5 with none and
    its first request; the core's request equal to a fresh old-route
    materializer's of the edited schema each time). A column's type or
    meaning edited is not in the state's fingerprint and changes nothing of
    this. Of the two halves, the payload differs from before T1.26b (the
    core has always read the schema as it is at the call), and the second
    check and warning are T1.26b's (until it, the bridge's once-flag kept
    the second call quiet). The default route is unchanged.
  affected_inputs: >-
    Two or more materialize calls of one PredictiveQuery over a DuckDB
    source under a forced core route, the schema's keys, relationships or a
    table's time column edited between them.
  cases: [T1.26b, T1.24b]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Found by T1.26b's review round 1 (Codex P2). Following the edit is the
    proposed behavior: the reference's request after such an edit is the
    first schema's, which the caller's edit says is not the one asked for;
    keeping it would mean holding the first schema's sampling in the state.
    Which edits the core route takes at all is T1.24b's (the edit
    semantics, schema_edited), so the owner decides this with it. Pinned
    by the client's tests/test_the_materialize_route.py,
    test_a_schema_edited_between_two_calls_is_sampled_as_edited, on both
    routes. Never self-approved. T1.24b leaves it as registered: an edit is
    the core's edit_schema, made on the schema the host holds and stored
    there, and materialize reads that schema as it stands at each call
    (the held schema beside the description, decision E67), so the
    sampler state's fingerprint follows a key, link or time column edited
    between calls as before; the pinning test is unchanged and passes on
    both routes. The implementer's recommendation to the owner is in the
    tracker's Journey row.


