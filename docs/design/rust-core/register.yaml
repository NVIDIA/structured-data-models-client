- id: P2E-4
  title: On Postgres a primary or foreign key of several columns the catalog declares is read as no key, as on DuckDB and SQLite, where the reference fails unnamed
  kind: change
  old_behavior: >-
    The reference's Postgres graph discovery takes one-column keys only:
    a table whose primary key covers several columns
    (_get_source_columns), or that declares a foreign key of several
    columns (_get_source_foreign_keys), fails Schema.from_source with an
    unnamed ValueError. Its DuckDB and SQLite engines read such a key as
    none: the table is keyed as if it declared no key (inferred by name),
    and no link is made of the foreign key.
  new_behavior: >-
    The core reads the Postgres catalog's keys of several columns as its
    DuckDB and SQLite readings do: no table is keyed by one, and no link
    is made of one; the source is described and materialized as on the
    other two databases. Until T2.12 the core refused such a key by name
    (UNSUPPORTED_REQUEST, rule composite_key, P2C-11); T2.12 lifts the
    rule (E92's class).
  affected_inputs: >-
    Schema.from_source on the core route over a Postgres source a table of
    which declares a primary key or a foreign key of several columns, and
    every call after it.
  cases: [rule.composite-key-declared, rule.composite-foreign-key-declared]
  refs:
  - P2C-11
  - E92
  - E66
  - 'contract/composite-key-vectors.json#declared.*@postgres refusal UNNAMED -> success'
  - 'contract/composite-key-vectors.json#foreign.*@postgres refusal UNNAMED -> success'
  - 'contract/postgres-regression-vectors.json#key.composite-primary refusal UNNAMED -> success'
  - 'contract/postgres-regression-vectors.json#key.composite-foreign refusal UNNAMED -> success'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-67}
  notes: >-
    Approver: owner. Approved by the owner on 2026-10-19 as KO2-67 ("L:
    Yes"), relayed by the orchestrator. An answer where the reference
    fails unnamed, the
    answer DuckDB's and SQLite's references give the same source (E66(b)
    approves a named refusal in place of such a failure, not an answer).
    The alternative keeps P2C-11's named refusal under a rule outside
    E92's class. Measured at T2.12 on python-core: the two cases answered
    through predict on Postgres, their schema, payload and result as on
    DuckDB and SQLite. Supersedes P2C-11, retired at T2.12, whose
    two regression vectors it names. Proposed by T2.12, never self-approved.
    Its matrix vectors: every declared and foreign form of the composite
    key pair matrix on Postgres (contract/composite-key-vectors.json).
  case_outcomes:
  - {case: rule.composite-foreign-key-declared@postgres, cell: ref-pandas3, runner: python-core, old: 'refusal - at from_source (ValueError)', new: 'success at predict', statements_differ: [from_source], summary: 'the Postgres line: the catalog key of several columns read as no key, so from_source, materialize and predict answer'}
  - {case: rule.composite-foreign-key-declared@postgres, cell: ref-pandas3, runner: rust-host, old: 'refusal -', new: 'success', statements_differ: [from_source], summary: 'the Postgres line: the catalog key of several columns read as no key, so from_source, materialize and predict answer'}
  - {case: rule.composite-key-declared@postgres, cell: ref-pandas3, runner: python-core, old: 'refusal - at from_source (ValueError)', new: 'success at predict', statements_differ: [from_source], summary: 'the Postgres line: the catalog key of several columns read as no key, so from_source, materialize and predict answer'}
  - {case: rule.composite-key-declared@postgres, cell: ref-pandas3, runner: rust-host, old: 'refusal -', new: 'success', statements_differ: [from_source], summary: 'the Postgres line: the catalog key of several columns read as no key, so from_source, materialize and predict answer'}

- id: P2E-5
  title: A schema keyed by several columns is refused at materialize without the reference's read of the folded key, one statement fewer
  kind: change
  old_behavior: >-
    At materialize, after the query resolves, the reference's engine folds
    each key of several columns into one identity
    (Table._set_composite_primary_key): it refuses a float part, a derived
    name past 200 characters or one a column holds, else reads the
    source's fold of the first rows (_assert_warehouse_folds_like_pandas,
    one statement) and compares it with its own of its preview; then its
    SQL samplers refuse the table (_reject_reserved_columns). Each refusal
    is a StructuredDataError of code INVALID_REQUEST.
  new_behavior: >-
    The core refuses the same tables at the same call with the same code,
    its float, name and collision checks first, without reading the
    source's fold: the read only chooses between two refusals of one
    code. The materialize call runs one statement fewer than the
    reference's on each database.
  affected_inputs: >-
    materialize on the core route with a schema a table of which is keyed
    by several columns (given to Schema.from_source), on a SQL source.
  cases: [rule.composite-key-given]
  refs:
  - KO2-68
  - E92
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-68}
  notes: >-
    Approver: owner. Approved by the owner on 2026-10-19 as KO2-68 ("M:
    Yes"), relayed by the orchestrator. The outcome is the reference's on
    every database; only the materialize call's statements differ, by the
    one read, which the rows name under statements_differ. Measured at
    T2.12 fix 8 on rust-host through the gate on DuckDB: the one
    difference is sql.count at materialize, 0 statements against the
    reference's 1. Proposed by T2.12.
  case_outcomes:
  - {case: rule.composite-key-given, cell: ref-pandas3, runner: python-core, old: 'refusal INVALID_REQUEST at materialize (StructuredDataError)', new: 'refusal INVALID_REQUEST at materialize (StructuredDataError)', statements_differ: [materialize], summary: "the DuckDB line: refused at materialize as the reference refuses it, without the reference's read of the folded key"}
  - {case: rule.composite-key-given, cell: ref-pandas3, runner: rust-host, old: 'refusal INVALID_REQUEST', new: 'refusal INVALID_REQUEST', statements_differ: [materialize], summary: "the DuckDB line: refused at materialize as the reference refuses it, without the reference's read of the folded key"}
  - {case: rule.composite-key-given@postgres, cell: ref-pandas3, runner: python-core, old: 'refusal INVALID_REQUEST at materialize (StructuredDataError)', new: 'refusal INVALID_REQUEST at materialize (StructuredDataError)', statements_differ: [materialize], summary: "the Postgres line: refused at materialize as the reference refuses it, without the reference's read of the folded key"}
  - {case: rule.composite-key-given@postgres, cell: ref-pandas3, runner: rust-host, old: 'refusal INVALID_REQUEST', new: 'refusal INVALID_REQUEST', statements_differ: [materialize], summary: "the Postgres line: refused at materialize as the reference refuses it, without the reference's read of the folded key"}
  - {case: rule.composite-key-given@sqlite, cell: ref-pandas3, runner: python-core, old: 'refusal INVALID_REQUEST at materialize (StructuredDataError)', new: 'refusal INVALID_REQUEST at materialize (StructuredDataError)', statements_differ: [materialize], summary: "the SQLite line: refused at materialize as the reference refuses it, without the reference's read of the folded key"}
  - {case: rule.composite-key-given@sqlite, cell: ref-pandas3, runner: rust-host, old: 'refusal INVALID_REQUEST', new: 'refusal INVALID_REQUEST', statements_differ: [materialize], summary: "the SQLite line: refused at materialize as the reference refuses it, without the reference's read of the folded key"}

- id: P2E-15
  title: A string constant's invalid escape warns as often as the query is read, twice on the core route where the reference warns five times
  kind: change
  old_behavior: >-
    The query PREDICT users.country = 'caf\u00e9\t\'\\\/' FOR EACH
    users.user_id holds the escape \/, which Python's string decoding warns
    of (DeprecationWarning "invalid escape sequence '\/'", raised by
    predictive_query's Constant.typed_value). The reference reads the
    constant twice while it validates the query and three more times while
    its engine labels the examples: on SQLite five DeprecationWarnings
    (with the sampler's UserWarning between them and the SDMWarning last),
    on Postgres five as well.
  new_behavior: >-
    The core route reads the constant only while the client validates the
    query, so the same DeprecationWarning, with the same message from the
    same line, is raised twice; the core labels the examples from its own
    reading of the constant (T2.10). The outcome, the payload and every
    other warning are the reference's.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route over a SQLite or
    Postgres source of a query whose string constant holds an escape
    Python deprecates (on DuckDB the case's materialize takes the old
    route and warns as the reference does).
  cases: [s0.boundary.escapes@sqlite, s0.boundary.escapes@postgres]
  refs: [T2.10, P2B-16, P2C-7]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-83}
  fewer_deprecations:
  - {case: s0.boundary.escapes@sqlite, runners: [python-core, rust-host]}
  - {case: s0.boundary.escapes@postgres, runners: [python-core, rust-host]}
  notes: >-
    Proposed by T2.10's implementer at the orchestrator's decision
    (register it rather than repeat a deprecation warning), for the
    reviewers. Measured on SQLite through the public calls on both routes:
    every DeprecationWarning is "invalid escape sequence '\/'" from
    predictive_query's constant.py line 134, five on the reference and two
    on the core route; nothing else differs. On Postgres the committed
    reference line holds five and CI's python-core observation two (round
    1's review). Seen once P2B-16 and P2C-7
    were retired, the core no longer refusing the case's condition.
    Approved by the owner on 2026-10-20 as KO2-83 (relayed by the
    orchestrator; T2.1s's fewer_deprecations rule reads the two lines).
  case_outcomes:
  - {case: s0.boundary.escapes@sqlite, cell: ref-pandas3, runner: python-core, old: 'success at materialize', new: 'success at materialize', summary: 'T2.10: the invalid-escape DeprecationWarning raised twice, where the reference re-reads the constant and raises it five times'}
  - {case: s0.boundary.escapes@sqlite, cell: ref-pandas3, runner: rust-host, old: 'success', new: 'success', summary: 'T2.10: the invalid-escape DeprecationWarning raised twice, where the reference re-reads the constant and raises it five times'}
  - {case: s0.boundary.escapes@postgres, cell: ref-pandas3, runner: python-core, old: 'success at materialize', new: 'success at materialize', summary: 'T2.10: the invalid-escape DeprecationWarning raised twice, where the reference re-reads the constant and raises it five times'}
  - {case: s0.boundary.escapes@postgres, cell: ref-pandas3, runner: rust-host, old: 'success', new: 'success', summary: 'T2.10: the invalid-escape DeprecationWarning raised twice, where the reference re-reads the constant and raises it five times'}

- id: P2E-16
  title: A logical target joins each example's own conditions where an average, minimum or maximum has no value for an earlier example
  kind: change
  old_behavior: >-
    The reference's executor reads a condition on a windowed AVG, MIN or
    MAX inside NOT, AND or OR through execute_join, which always drops the
    examples whose window holds no value and renumbers the rest from 0
    (filter_na=True); execute_logical_operation then joins that shorter
    series with the other side by index (pandas alignment). Where an
    example without a value comes before one with a value, each later
    label is another example's (measured at 6298913c: AVG(...) > 2 AND
    COUNT(...) > 0 over examples 0, 2 and 4 with averages labels them
    [F, T, F] where each example's own conditions give [F, F, T]); where
    the lengths cannot meet (NOT of such a condition, or two of them), the
    executor raises IndexError ("Boolean index has wrong length"), which
    the client gives as INTERNAL_ERROR.
  new_behavior: >-
    The core joins each example's own conditions (sdm-engine labels::truth,
    T2.10): an example whose average, minimum or maximum has no value has
    no label, every other example is labelled from its own values, and
    NOT and two such conditions are answered the same way. Where every
    example of the reference's first batch has a value the two agree.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route of a query whose target
    is NOT, AND or OR over a condition on a windowed AVG, MIN or MAX, where
    some example's window holds no value of it, on DuckDB, SQLite and
    Postgres.
  cases: [T2.10]
  refs: [T2.10, KO2-70]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-72}
  notes: >-
    Proposed by T2.10's implementer for the orchestrator under KO2-70 (the
    same class as KO2-70 #1, misaligned lagged values, decided there as a
    fix). Measured on the route probe (T2.10 tracker): of 50 generated
    DuckDB sources, two crash on the reference (IndexError, INTERNAL_ERROR)
    and one labels one example otherwise; the alternative is the
    reference's packing and, where it raises, a named refusal in E66(b)'s
    class.
    Approved by the owner on 2026-10-19 as KO2-72 (relayed by the
    orchestrator; T2.1p).

- id: P2E-17
  title: A constant past a narrow integer column's type, or a float with a fraction in IN, is compared exactly in a filter or a logical target, where the reference casts it
  kind: change
  old_behavior: >-
    Inside a target's filter or a logical target the reference's executor
    reads a column as the source gave it (filter_na=False): on DuckDB and
    SQLite a pyarrow type of the column's own width, on Postgres pandas'
    nullable Int64. It casts each constant to that type
    (pd.Series([value], dtype=left.dtype)): on DuckDB an integer past the
    column's type (an INTEGER against 3000000000, a UTINYINT against 300)
    is refused INVALID_REQUEST (ArrowInvalid); on Postgres a float with a
    fraction in an IN list of an integer column is refused INVALID_REQUEST
    (TypeError "cannot safely cast"), where DuckDB and SQLite take it
    toward zero.
  new_behavior: >-
    Inside a target's filter or a logical target the core compares exactly
    on every database (sdm-engine labels::int_member): an integer constant
    with an integer column whatever the column's width, and a float in an
    IN list of an integer column, a whole one matching its integer, one
    with a fraction or past int64 matching no row (1.5 matches no row).
    Where the condition is the whole target the reference reads the column
    as numpy int64 on every database, and both refuse a float with a
    fraction in the list INVALID_REQUEST.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route of a target filter or a
    logical target comparing an integer column narrower than 64 bits with
    an integer past its type (DuckDB), or listing a float with a fraction
    or past int64 in IN against an integer column (all three databases).
  cases: [T2.10]
  refs: [T2.10]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-73}
  notes: >-
    Proposed by T2.10's implementer; the fraction part decided by the owner
    as exact comparison (KO2-73, "go with option b"), over keeping the
    reference's DuckDB and SQLite reading toward zero or refusing
    everywhere. The core reads no database's identity (no dialect in the
    core), so it cannot refuse on one database what it answers on another.
    Measured on the route probe: PREDICT e.size > 3000000000 OR e.flag =
    true over a DuckDB INTEGER (reference INVALID_REQUEST, core answered),
    and users.age IN (21, 22.5) inside OR (reference INVALID_REQUEST on
    Postgres, 22.5 read as 22 on DuckDB and SQLite; the core matches no
    row for it).
    Approved by the owner on 2026-10-19 as KO2-73 (relayed by the
    orchestrator; T2.1p).

- id: P2E-18
  title: A float with a fraction in an IN list of a whole-number decimal target is compared exactly, where the reference reads the column as int64 and refuses
  kind: change
  old_behavior: >-
    The reference reads a DECIMAL column of scale 0 whose values fit int64
    as int64 (Table._sanitize, since main's eb6c68eb); where a condition
    on it is the whole target, the executor reads the IN list at numpy's
    int64 and refuses a float with a fraction, INVALID_REQUEST ("Trying to
    coerce float values to integers"); inside a filter or a logical target
    it takes the float toward zero.
  new_behavior: >-
    The core compares a decimal column with each constant of the list
    exactly (KO2-35, as it compares a decimal with one constant since
    T2.17): a float with a fraction matches no whole-number value, and the
    request is answered.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route of a target testing a
    DECIMAL column of scale 0 with IN, the list holding a float with a
    fraction.
  cases: [T2.10]
  refs: [T2.10, KO2-35, KO2-50]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-74}
  notes: >-
    Proposed by T2.10's implementer under KO2-35's exact decimals. Measured
    on the route probe: PREDICT e.big IN (10, 20.5) over a DECIMAL(38, 0)
    (reference INVALID_REQUEST, core answered).
    Approved by the owner on 2026-10-19 as KO2-74 (relayed by the
    orchestrator; T2.1p).

- id: P2E-19
  title: LIST_DISTINCT of a foreign key, a temporal link prediction, stays refused by name until Phase 4
  kind: change
  old_behavior: >-
    The reference's validation lets PREDICT LIST_DISTINCT(t.fkey, 0, 30,
    days) FOR EACH ... through when the column is a foreign key, and its
    engine asks it as a temporal link prediction (_get_task_type), each
    context row labelled with the distinct keys in its window; the
    scripted endpoint refuses that request at predict.
  new_behavior: >-
    The core refuses it UNSUPPORTED_REQUEST at materialize under its
    not-yet rule aggregation, the one form of that rule the validation
    lets through (COUNT_DISTINCT, FIRST, LAST and a LIST_DISTINCT of any
    other column it refuses first on both routes): link prediction is
    Phase 4's (design, "Explicitly out"). A ranking (RANK TOP k) of the
    same aggregation is T2.8's.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route of a target
    LIST_DISTINCT of a foreign key without RANK TOP, on DuckDB, SQLite and
    Postgres.
  cases: [target.aggregation.list-distinct]
  refs: [T2.10, E92, P1B-3]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-75}
  notes: >-
    A refusal of an input the reference accepts: owner-only. Proposed by
    T2.10's implementer for the orchestrator: keep it refused by name
    until Phase 4 (as KO2-22 keeps model and text_time_rules), or bring
    temporal link prediction into Phase 2.
    Approved by the owner on 2026-10-19 as KO2-75 (relayed by the
    orchestrator; T2.1p). Each row names materialize under
    statements_differ (T2.1r's opt-in for a refusal moved to an earlier
    call): the core refuses there, before the reference's later refusal
    at predict, so the reference's statements past materialize are no
    expectation of its own.
  case_outcomes:
  - {case: target.aggregation.list-distinct, cell: ref-pandas3, runner: python-core, old: 'none', new: 'refusal UNSUPPORTED_REQUEST at materialize (UnsupportedRequestError)', statements_differ: [materialize], summary: 'T2.10: LIST_DISTINCT link prediction refused by name until Phase 4 (KO2-75)'}
  - {case: target.aggregation.list-distinct, cell: ref-pandas3, runner: rust-host, old: 'none', new: 'refusal UNSUPPORTED_REQUEST', statements_differ: [materialize], summary: 'T2.10: LIST_DISTINCT link prediction refused by name until Phase 4 (KO2-75)'}
  - {case: target.aggregation.list-distinct@sqlite, cell: ref-pandas3, runner: python-core, old: 'refusal - at predict (NimRequestError)', new: 'refusal UNSUPPORTED_REQUEST at materialize (UnsupportedRequestError)', statements_differ: [materialize], summary: 'T2.10: LIST_DISTINCT link prediction refused by name until Phase 4 (KO2-75)'}
  - {case: target.aggregation.list-distinct@sqlite, cell: ref-pandas3, runner: rust-host, old: 'refusal -', new: 'refusal UNSUPPORTED_REQUEST', statements_differ: [materialize], summary: 'T2.10: LIST_DISTINCT link prediction refused by name until Phase 4 (KO2-75)'}
  - {case: target.aggregation.list-distinct@postgres, cell: ref-pandas3, runner: python-core, old: 'refusal - at predict (NimRequestError)', new: 'refusal UNSUPPORTED_REQUEST at materialize (UnsupportedRequestError)', statements_differ: [materialize], summary: 'T2.10: LIST_DISTINCT link prediction refused by name until Phase 4 (KO2-75)'}
  - {case: target.aggregation.list-distinct@postgres, cell: ref-pandas3, runner: rust-host, old: 'refusal -', new: 'refusal UNSUPPORTED_REQUEST', statements_differ: [materialize], summary: 'T2.10: LIST_DISTINCT link prediction refused by name until Phase 4 (KO2-75)'}

# --- lane G entries (P2G-1..19) ---

- id: P2G-1
  title: rust-host reports an endpoint's refusal of a call as the core's INVALID_RESPONSE, where the reference raises NimRequestError with no code
  kind: change
  old_behavior: >-
    The reference's client raises an endpoint's refusal of a call (an
    HTTP status other than 2xx) as the endpoint's own refusal: a public
    NimRequestError carrying the endpoint's text and details and no code of
    the client's (decision E47), so the reference's outcome is a refusal
    at predict with no code.
  new_behavior: >-
    The pure-Rust host (rust-host) has no transport and no client class:
    it hands the endpoint's status to the core, which ends the run with
