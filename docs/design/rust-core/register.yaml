- id: P2C-11
  title: On Postgres a composite primary or foreign key is refused by name, where the reference fails the source's description with an unnamed ValueError
  kind: change
  old_behavior: >-
    The reference's Postgres graph discovery takes one-column keys only:
    reading a table whose primary key covers several columns
    (_get_source_columns) or that declares a foreign key of several columns
    (_get_source_foreign_keys), it fails Schema.from_source with an
    unnamed ValueError.
  new_behavior: >-
    The core reads the same catalog answers and refuses such a key by name
    at describe_source (Schema.from_source), as it refuses a key of several
    columns a caller names: UNSUPPORTED_REQUEST rule composite_key (E92's
    Phase 2 class, until T2.12). A composite primary key is refused as the
    table's keys are read, a composite foreign key as the foreign keys are
    read, at the same statements the reference fails after; no later call
    is reached. A composite UNIQUE constraint is left aside, as the
    reference leaves it.
  affected_inputs: >-
    Schema.from_source on the core route over a Postgres source a table of
    which declares a primary key or a foreign key of several columns.
  cases: [T2.3]
  refs:
  - E66
  - E92
  status: rejected
  approved_by: reviewer
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E66}
  notes: >-
    Approved by both of T2.3's round 4 reviewers (APPROVE-P2C-11): E66(b)'s
    class, the reference's unnamed error a named refusal. Before T2.3's
    fix 14 the core keyed such a table by one
    of the key's columns and linked on one of the foreign key's, which can
    join rows the key does not; by the orchestrator's decision at round 3
    it is refused as DuckDB refuses a key of several columns named. Its
    inputs are the test author's two regression vectors,
    key.composite-primary@postgres and key.composite-foreign@postgres
    (contract/postgres-regression-vectors.json, the refs), not corpus
    cases.
    Retired at T2.12, its ID kept: T2.12 lifts composite_key, and the core
    reads a Postgres catalog key of several columns as no key, as DuckDB's
    and SQLite's references read it; P2E-4 (proposed for the owner)
    supersedes this entry and names its two regression vectors with
    refusal UNNAMED -> success.

