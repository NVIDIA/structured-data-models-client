- id: P2B-1
  title: Exact decimals, where the reference at 6298913c rounds, merges or refuses
  kind: change
  old_behavior: >-
    Since main's eb6c68eb, merged into the reference at 6298913c, the
    reference reads a DuckDB DECIMAL by its declared type: int64 at scale 0
    where it fits, float64 otherwise, through pyarrow's cast, which can be
    one unit in the last place off (0.70 as 0.7000000000000001). So a key
    with decimal places becomes a float, and distinct keys a float cannot
    tell apart become one (a looked-up key merged silently, an entity's
    refused as a repeated key); a decimal class target's distinct values a
    float32 cannot tell apart become one class; its sums and averages are
    float sums; a DECIMAL sum whose values do not fit int64 is still
    refused INVALID_REQUEST past the column's digits.
  new_behavior: >-
    The core keeps decimals exact (T2.0c, the owner's KO2-35): a key with
    decimal places is sent and read back as its exact digits, so a
    result's id is text where the reference's is a float, and no two keys
    merge; a feature is sent as the nearest double to its exact value; a
    sum or an average is computed exactly, at any size, and read once at
    float32; a class target's distinct values stay distinct classes,
    spelled as the reference spells them unless two of them meet at one
    float32 (a regression target's values are numbers, each the nearest
    float32). It answers every decimal input the reference answers, except
    the entities P1B-34 and P2B-8 refuse, and answers a sum past 38 digits,
    which the reference refuses.
  affected_inputs: >-
    PredictiveQuery.materialize and SDMClient.predict on the core route
    over a DuckDB source with a DECIMAL key with decimal places, a DECIMAL
    feature whose value pyarrow's cast rounds wrongly, a DECIMAL sum or
    average the reference computes as floats, a DECIMAL sum past 38
    digits, or a DECIMAL class target with distinct values one float32
    cannot tell apart.
