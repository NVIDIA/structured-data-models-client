    dates in words (March 3 2020, Jan 5), packed digits (20240101), dots
    (15.01.2024), short fields (2024-1-5), the clock's words (now, today); a
    second of 60 rolls over under a format guessed from the first value;
    another value (a code, a value naming no date such as 2024-02-30, an
    offset of a day or more, a zone named other than UTC or GMT) reads as
    NaT, which materialize drops and warns of, and which inference counts as
    no time; minutes past 59 in an offset count on.
