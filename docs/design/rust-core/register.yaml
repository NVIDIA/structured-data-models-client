    decisions (class c), columns under a name that does not say time whose
    values outside the client's shapes (the clock's words now and today,
    dates in words, ordinals such as 5th, a bare year such as 2024) pandas
    reads as dates. No day-first warning differs for this reason (the 11
    T1.25b first counted here are in-list order-rule differences, DT-16,
    fix round 1). None of T1.25b's 60 generated sources.
  cases: [T1.25b]
  refs: [DT-15, P1B-2]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E68}
