- id: P1B-36
  title: A decimal entity of a float key is rounded once, at the key's width, where the reference rounds it twice
  kind: change
  old_behavior: >-
    The reference's pandas cast reads a Decimal entity of a FLOAT key
    through a double first, then rounds that to 32 bits, so a value just
    past the midpoint between two float32s can land on the lower one
    (1.000000059604644775390625000001 as 1.0); for a DOUBLE key a Decimal
    past 2**53 likewise lands on its double's neighbour.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, a
    decimal or a text entity of a float key is read as the nearest float
    of the key's width, rounded once from its exact value, ties to even
    (sdm_engine::keys::read_float; design, "The entities' cast to the
    key's type"), so the entity is the float its value is nearest. The
    default route is unchanged.
  affected_inputs: >-
    PredictiveQuery.materialize with indices over a DuckDB source under a
    forced core route, a FLOAT or DOUBLE key, and Decimal entities whose
    nearest float of the key's width the double between differs from.
  cases: [T1.32a]
  refs:
  - 'contract/key-cast-vectors.json#float32-large.* success -> success'
  - 'contract/key-cast-vectors.json#float32-near-one.* success -> success'
  - 'contract/key-cast-vectors.json#float64-past-2pow53.* success -> success'
  status: proposed
  approved_by: null
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E82}
  notes: >-
    Found by T1.32a's review of part 1 (Codex P1); the test author's
    midpoint vectors derive each expected float exactly. It changes an
    accepted answer's value, so it is for the owner; never self-approved.

