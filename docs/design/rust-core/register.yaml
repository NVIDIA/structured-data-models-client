- id: P1B-9
  title: nested.fixed-array is described on the core route where the reference fails with an unnamed RuntimeError
  kind: change
  old_behavior: >-
    The reference's Schema.from_source over a users table with a fixed-size
    list feature (BIGINT[2]) raises an unnamed RuntimeError: its reading of
    DuckDB's catalog type takes BIGINT[2] for an integer (only a type
    ending [] is a list to it), and the stype inference then fails on the
    list values, naming the wrong type. Under a name that reads as a key
    (id_x_0 BIGINT[2]) it fails earlier with pyarrow's unnamed
    ArrowNotImplementedError ("Function 'unique' has no kernel matching
    input types (fixed_size_list<: int64>[2])").
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    column is left out of its table with the reference's warning for a
    list ("users leaves out f (intlist): a request carries one scalar value
    per cell, and these hold none", COLUMNS_LEFT_OUT), as the reference
    leaves out a variable-size list (nested.list-int): the host layer
    admits a fixed-size list as a list (the plan's type set holds no
    fixed-size list), and the core reads types from the admitted Arrow, so
    it cannot tell the two apart without reading DuckDB's type text, which
    is sdm-data's. The case reaches predict's result on python-core and
    rust-host. From T1.32c, a fixed-size list of binary is left out too,
