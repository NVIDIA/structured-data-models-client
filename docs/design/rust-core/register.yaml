# --- The host layer -------------------------------------------------------------

- id: HOST-1
  title: A request whose control message passes the 64 KB cap
  kind: change
  old_behavior: >-
    The reference validates a query of any length against a schema of any
    width: there is no limit on the query's text or on the number of tables
    and columns materialize resolves it against.
  new_behavior: >-
    sdm-host refuses a control message past 64 KB with INVALID_MESSAGE before
    reading it (design, "Core, host and binding"; decision E2). validate_query
    carries the query text and its schema in the start message, so a query
    whose text and schema pass about 64 KB of JSON cannot be validated on the
    core route: roughly a thousand columns, or a query of tens of thousands
    of characters.
  affected_inputs: >-
    S0 on the core route (materialize's validation) with very wide schemas or
    very long query text; later operations whose requests carry schemas.
  cases: [T1.7]
  status: rejected
  approved_by: owner
  decision_ref: null
  notes: >-
    Rejected by the owner on 2026-10-08 (answers to Phase 1 re-review round 1):
    the refusal is not adopted; contract v3 moves every field whose size grows
    with user input into an attachment (Phase 1 decisions H5, superseding E14),
    and T1.7b's exit proves a start past 64 KB is accepted. As first proposed:
    Phase 1 decisions row E14. This refuses input the reference accepts, so
    it waits for the owner (P1B-1 process); no inventory case or corpus query
    reaches it. Recommendation: do not approve the refusal; before S0 switches
    (Phase 3), move a start message's schema (and query text past a bound)
    into an attachment, as data already travels, with a contract version
    bump, and keep the cap for control JSON proper.

- id: HOST-2
  title: Arrow types admission still refuses that the reference accepts
  kind: change
  old_behavior: >-
    The reference reads any Arrow type DuckDB returns into pandas
    (to_pandas with pd.ArrowDtype) and maps float16, any timedelta unit and
    any categorical, among others.
  new_behavior: >-
    Admission widens losslessly into the closed set (Phase 1 decisions H16
    and H27): float16, decimal32 and decimal64, duration and time32 at s or
    ms, date64 (as timestamp[us]), view types, fixed_size_binary and any
    dictionary are admitted, keeping the received type; a batch whose values
    pass int32 offsets is split between rows. Proposed: what still cannot
    convert is refused by name. Generated at T1.7c from the admission
    tests' family table (sdm-host tests/admission.rs, which fails if this
    list and the code disagree), the type families still refused are
    `interval`, `run_end_encoded` and `union`. The reference refuses
    interval and union where it infers a column's type (inventory cases
    time.feature-interval and nested.union), but a column given an
    explicit dtype skips that inference (table.py), so the reference may
    read all three there, and each needs the owner. The values still
    refused are a timestamp, duration or date64 at s or ms whose value
    passes int64 microseconds, and a single string, binary or list value
    past int32 offsets; any type T1.33 finds no lossless row for joins
    them.
  affected_inputs: Sources returning Arrow types outside the closed set with no lossless conversion.
  cases: [T1.7c, T1.33]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    From the batch 2 code review. Each remaining refusal of a type the
    reference accepts needs the owner (P1B-1 process); T1.7c writes the
    generated list here and T1.33 marks each type reference-accepted or not,
    with a case where the inventory reaches one.
