- id: P1B-80
  title: A single text or binary value past int32 offsets under arrow_large_buffer_size is refused at from_source where the reference reads it
  kind: change
  old_behavior: >-
    Under SET arrow_large_buffer_size = true DuckDB 1.5.6 hands a VARCHAR or
    BLOB column holding one value of 2**31 + 16 bytes over as large_string or
    large_binary. The reference's Schema.from_source succeeds: the BLOB
    column is left out (SDMWarning "users leaves out f (binary)") and the
    calls go on through predict; the VARCHAR is described string,
    categorical, and its materialize fails INTERNAL_ERROR with DuckDB's
    OutOfMemoryException after 370 s on a 24 GB machine (so an answer of the
    machine).
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    host layer's admission narrows large_string and large_binary into utf8
    and binary, whose int32 offsets cannot hold the value: the batch is split
    between rows and the one row still past them is refused, so
    Schema.from_source fails StructuredDataError, code VALUE_OUT_OF_RANGE,
    naming the column and the type received (sdm-host tests/widening.rs,
    a_single_value_past_the_offset_capacity_is_refused_by_name). A refusal of
    an input the reference accepts: the BLOB end to end, the VARCHAR at
    from_source. The default route is unchanged.
  affected_inputs: >-
    Schema.from_source over a DuckDB source under arrow_large_buffer_size
    holding a VARCHAR or BLOB value of more than 2,147,483,647 bytes, under a
    forced core route.
  cases: [T1.36]
  refs:
  - 'contract/t136-host2-vectors.json#big.varchar.large success -> refusal VALUE_OUT_OF_RANGE'
  - 'contract/t136-host2-vectors.json#big.blob.large success -> refusal VALUE_OUT_OF_RANGE'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E152}
  notes: >-
    A refusal of an input the reference accepts, so the owner's. Approver:
    owner. The owner's question (P1B-80): for one text or binary value over
    2 GiB handed over in large buffers, (a) match the reference, or (b) keep
    the named refusal at from_source for Phase 1? (a) needs the value kept in
    a large form through describe: large_utf8 and large_binary in the closed
    type set (sdm-contract's ColumnType and its wire names), or an exception
    to it for describe alone, with admission, inference's reading of text
    (sdm-schema) and the description taking it, so the BLOB is left out
    unread and the VARCHAR described, and then a named refusal of the
    VARCHAR at materialize, where the reference runs out of memory
    (E66(b)). Estimated at 1.5 to 2 days, with tests that need several GiB
    CI cannot give. (b) costs nothing; matching becomes a Phase 2 row.
    Recommendation: (b), for one value no Phase 1 case reaches. Until it is
