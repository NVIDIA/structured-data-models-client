- id: P2E-2
  title: A target filter on a column only the core names is refused by the core's not-yet rule target_filter, until T2.10
  kind: change
  old_behavior: >-
    The reference leaves out a column whose name holds a dot, a backtick or
    a line break, and refuses a query whose target's aggregation filters on
    it INVALID_REQUEST at materialize.
  new_behavior: >-
    The core keeps the column and resolves the query (P2E-1), and its
    materialize refuses it UNSUPPORTED_REQUEST at materialize under its
    not-yet rule target_filter (E92's class), as it refuses the same query
    over a column named a_b. T2.10 (PQL targets: target_filter) lifts it
    and retires this entry, the cases then answered under P2E-1.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route over a DuckDB, SQLite or
    Postgres source of a query whose target's aggregation filters on a
    column named with a dot, a backtick or a line break.
  cases: [T2.18]
  refs: [E92, T2.10, P2E-1]
  status: rejected
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-36}
  notes: >-
    Approved under KO2-56's standing approval of a temporary entry naming
    the package that retires it, relayed by the orchestrator; the
    reviewers check this entry fits it. Temporary: it lapses when T2.10
    lands, and the final gate fails while it remains. The rule was read
    from the core's refusal (details rule target_filter), on each database
    and on both core hosts. Rejected, its ID kept: filter role deferred to
    T2.10 (the orchestrator's decision); the three filter cases and their
    vectors left T2.18's acceptance for T2.10's
    (contract/deferred/t210-column-filter), so no case is under this
    entry.

