    is refused, UNSUPPORTED_REQUEST with rule text_time, by materialize when
    a fetched text time column or text timestamp feature holds one, by the
    time column's choice where it asks where such a column starts, and by
    inference where such values could make the score (under a name that
    says time, every value outside the list; under another, the ones in the
    client's shapes; the rest is DT-17) and the values in the list decide
