- id: P1B-17
  title: An edit to a schema changed past its description is refused by name at the edit on the core route
  kind: change
  old_behavior: >-
    The reference makes an edit to a schema of tables in their source
    whatever was changed of it before: a column's data type assigned, a
    table mapped to another source table, a table or column added through
    the schema's dictionaries.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    core's edit_schema reads the schema as the host holds it beside the
    description the core last answered, and refuses such a schema by name,
    UNSUPPORTED_REQUEST with operation edit_schema and rule schema_edited,
    at the next key, time column, meaning, column left out or relationships
    edit, the schema left as it was (T1.24b, decision E67). Until T1.24b
    the Python setters made that edit, and only materialize refused the
    schema (P1B-3's schema_edited, which it still is at materialize). An
    edit of the data type, the source name or a dictionary is not passed
    to the core, as before.
  affected_inputs: >-
    A schema Schema.from_source described on the core route, a column
    retyped, a table mapped to another source table or a table or column
    added since, then edited by a setter the core takes.
  cases: [T1.24b]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    The core checks an edit against what the source said of each column
    (its data type), which it does not know of a column it did not
    describe or one retyped since; following such a schema is later work,
    with materialize's (P1B-3). Pinned by the client's
    tests/test_the_schema_edits.py,
    test_a_schema_changed_past_its_description_is_refused_by_name, and
    sdm-schema's and sdm-core's tests. A refusal of an input the reference
    accepts, so for the owner. Never self-approved. A sub-case, from
    T1.24b's review: where the change leaves a value the held schema
    writes as no text (a column's dtype assigned None, a table's
    source_name or a column's key in the dictionary that is not a string),
    the next edit or materialize fails as INVALID_MESSAGE, the held
    schema not reading as the contract's HeldSchema, rather than as
    schema_edited.
# --- The host layer -------------------------------------------------------------

- id: HOST-1
  title: A request whose control message passes the 64 KB cap
  kind: change
  old_behavior: >-
    The reference validates a query of any length against a schema of any
    width: there is no limit on the query's text or on the number of tables
    and columns materialize resolves it against.
  new_behavior: >-
    sdm-host refuses a control message past 64 KB with INVALID_MESSAGE before
    reading it (design, "Core, host and binding"; decision E2). validate_query
    carries the query text and its schema in the start message, so a query
    whose text and schema pass about 64 KB of JSON cannot be validated on the
    core route: roughly a thousand columns, or a query of tens of thousands
    of characters.
  affected_inputs: >-
    S0 on the core route (materialize's validation) with very wide schemas or
    very long query text; later operations whose requests carry schemas.
  cases: [T1.7]
  status: rejected
  approved_by: owner
  decision_ref: null
  notes: >-
    Rejected by the owner on 2026-10-08 (answers to Phase 1 re-review round 1):
    the refusal is not adopted; contract v3 moves every field whose size grows
    with user input into an attachment (Phase 1 decisions H5, superseding E14),
    and T1.7b's exit proves a start past 64 KB is accepted. As first proposed:
    Phase 1 decisions row E14. This refuses input the reference accepts, so
    it waits for the owner (P1B-1 process); no inventory case or corpus query
    reaches it. Recommendation: do not approve the refusal; before S0 switches
    (Phase 3), move a start message's schema (and query text past a bound)
    into an attachment, as data already travels, with a contract version
    bump, and keep the cap for control JSON proper.

- id: HOST-2
  title: Arrow types admission still refuses that the reference accepts
  kind: change
  old_behavior: >-
    The reference reads any Arrow type DuckDB returns into pandas
    (to_pandas with pd.ArrowDtype) and maps float16, any timedelta unit and
    any categorical, among others.
  new_behavior: >-
    Admission widens losslessly into the closed set (Phase 1 decisions H16
    and H27): float16, decimal32 and decimal64, duration and time32 at s or
    ms, date64 (as timestamp[us]), view types, fixed_size_binary and any
    dictionary are admitted, keeping the received type, and from T1.7d
    (decision E17) a run_end_encoded column is decoded to its value type;
    a batch whose values pass int32 offsets is split between rows.
    Proposed: what still cannot convert is refused by name. Generated at
    T1.7d from the admission tests' family table (sdm-host
    tests/admission.rs, which fails if this list and the code disagree),
    the type families still refused are `interval` and `union`. The
    reference refuses both where it infers a column's type (inventory cases
    time.feature-interval and nested.union), but a column given an
    explicit dtype skips that inference (table.py), so the reference may
    read both there; they stay proposed until T1.33 shows whether it does,
    and each needs the owner. The values still
    refused are a timestamp, duration or date64 at s or ms whose value
    passes int64 microseconds, and a single string, binary or list value
    past int32 offsets; any type T1.33 finds no lossless row for joins
    them.
  affected_inputs: Sources returning Arrow types outside the closed set with no lossless conversion.
  cases: [T1.7c, T1.33]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    At the T1.7b check-in (2026-10-08) the owner chose to decode run_end_encoded rather than refuse it (Phase 1 decisions row E17, T1.7d); the entry stays proposed for interval and union until T1.33 shows whether the reference reads them. From the batch 2 code review. Each remaining refusal of a type the
    reference accepts needs the owner (P1B-1 process); T1.7c writes the
    generated list here and T1.33 marks each type reference-accepted or not,
    with a case where the inventory reaches one.

- id: HOST-3
  title: The floor cell's to_pandas raises pandas' BlockManager DeprecationWarning
  kind: keep
  old_behavior: >-
    In the reference environment (ref-pandas3: pandas 3.0.6, pyarrow 25.0.1)
    an S0 case's public calls raise no warning.
  new_behavior: >-
    In the floor-pandas2.2 cell (Python 3.10, pandas 2.2.0, pyarrow 14.0.1,
    NumPy 1.26.4) pyarrow 14's to_pandas() builds its frame by passing a
    BlockManager to DataFrame, which pandas 2.2.0 deprecates, so each of 19
    S0 acceptance cases records two DeprecationWarnings, on python-core and
    python-old alike: a runtime-only difference, the same on both routes,
    which the client neither causes nor changes. Measured at T1.18 in a
    local floor-pandas2.2 environment; ref-pandas3 and dbr17-pandas2 show
    none. From T1.18 the comparator holds python-core to python-old on host
    fields in a cell other than the reference's and reports the reference's
    (H1), so the warning passes where both runners show it and fails where
    one alone does (contract/tests/test_runners.py).
  affected_inputs: Any public call whose result reaches to_pandas() under pandas 2.2.0 with pyarrow 14.
  cases: [T1.18]
  status: proposed
  approved_by: null
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E65}
  notes: >-
    Runtime-only, so a register entry naming the cell, never an exclusion
    (H1). For the independent reviewer; no case outcome changes.

# --- PQL validation (T1.12) ---------------------------------------------------

- id: PQL-1
  title: Escaped surrogates in a PQL string literal
  kind: change
  old_behavior: >-
    The reference reads a string literal's escapes with Python's
    unicode-escape codec, which leaves \uD800 to \uDFFF escapes as lone
    surrogates, a pair included (\ud83d\ude00 is two of them, not one
    character). Validation takes the literal; the old materializer then
    refuses the call with INVALID_REQUEST (a UnicodeEncodeError,
    "surrogates not allowed", when it writes the value).
  new_behavior: >-
    The core's escapes.rs joins an escaped pair into the character it
    encodes and reads a lone surrogate as U+FFFD, and validate_query
    accepts the query, so a core route that materializes would go on where
    the reference refuses. Today only rust-host shows it: on the Python core
    route the accepted query still goes through the shadow check and the
    old materializer, which refuse as the reference does.
  affected_inputs: >-
    S0 (and every later core route) for a PQL string literal holding a
    \u escape of a surrogate, paired or lone.
  cases: [s0.boundary.escape-surrogate-pair, s0.boundary.escape-lone-surrogate]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Found by T1.12's review (subagent P2-1); the orchestrator chose to
    record it rather than stop. The core accepts input the reference
    refuses, so it needs the owner. Alternatives: (a) keep the core's
    reading, joining pairs and replacing lone surrogates; (b) match the
    reference: refuse any escaped surrogate with INVALID_REQUEST at
    validation (the reference refuses later, at materialize, with the same
    code); (c) join valid pairs and refuse a lone surrogate by name. Both
    cases are diagnostic until the owner decides; the one that matches the
    decision then becomes acceptance.

- id: PQL-2
  title: PQL query depth past the reference's recursion limit
  kind: change
  old_behavior: >-
    The reference has no depth limit of its own: its parser and the old
    materializer recurse, and past about 461 nested levels (in the
    contract runner under Python 3.12; the edge moves with the caller's
    stack) the public call raises RecursionError.
  new_behavior: >-
    The core bounds depth (decision H27): validate_query accepts up to 999
    nested levels, on its grown stack, and refuses 1,000 and more with
    PQL_PARSE_SYNTAX. On the Python core route the accepted query still
    goes through the shadow check's old validator, so the public call
    raises RecursionError from about 461 to 999 levels, as the reference
    does, and answers INVALID_REQUEST at 1,000 and above, where the
    reference raises RecursionError.
  affected_inputs: >-
    S0 (and every later core route) for a query nested more deeply than
    the reference's recursion limit allows.
  cases: [s0.boundary.depth-999, T1.7c]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Found by T1.12's review (Codex P2, subagent P3-2). It refuses nothing
    the reference accepts, since the reference answers no such query.
    Recommendation: keep the core's bounded behavior rather than reproduce
    the reference's crash. The Python route's RecursionError up to 999
    leaves with the shadow check and the old validator in Phase 5
    (_rust/s0.py's bridge header; design, "Routing seam"). Executable:
    s0.boundary.depth-999 (diagnostic: python-ref and python-core raise
    RecursionError, rust-host accepts) and sdm-core's
    tests/pql_adapter.rs, whose deepest() queries are accepted at 999
    nested levels and refused at 1,000 (T1.7c).
    The edge, about 461 levels, was measured in the runner on Python 3.12
    at T1.12's last review; the two depth cases' texts still say about
    455, left as written, since changing a case file changes the digest
    its reference observation is held to.

- id: PQL-3
  title: The day-first date literal warning given once per literal (D4)
  kind: change
  old_behavior: >-
    The reference reads a date literal with pd.to_datetime each time a step
    reads it, and pandas gives its UserWarning ("Parsing dates in %d/%m/%Y
    format when dayfirst=False ...") each time: twice in a validation
    (Constant built, then typed_value in the checks), more as the
    materializer reads the literal again. Under Python's default warning
    filter a caller sees it once per call site.
  new_behavior: >-
    The core gives DATE_LITERAL_DAY_FIRST (fields: the format and the
    literal's span) once per day-first literal, from the validate_query run
    that reads the query; materialize, which a public call reaches only
    after validating, gives none, so the pure-Rust host's S1 path, which
    starts no validate_query, gives none. The Python host words it in
    pandas' sentence behind its code. On the S0 core route, for a query the
    core accepts, the core's is held back while the shadow check's old
    validator gives the reference's own (s0.SHADOWED, bridge code until
    Phase 5), so the caller sees what the old route shows; for a query the
    core refuses, which meets no shadow check, the core's is shown, once
    per day-first literal read, where the reference gives one per read:
    once for a query refused before the later type checks read the literal
    again, twice for one refused in them.
  affected_inputs: >-
    Queries with a date literal read day first whose format pandas names
    (a four-digit year, one or two digits elsewhere), on the core route.
  cases: [T1.6b]
  status: proposed
  approved_by: null
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E69}
  notes: >-
    Measured at T1.6b: the corpus's one day-first case gives the reference's
    warning twice and the core's once, the same format
    (sdm-core/tests/pql_corpus.rs compares the formats as a set, and fails
    where the core warns twice at one literal);
    test_a_day_first_literal_warns_on_the_core_as_on_the_old_route holds
    the python-core caller to the old route's warnings for an accepted
    query, and to the old route's one warning, worded the same behind the
    code, for two refused after the literal is read (T1.6b fix round 1,
    Codex P2: the warning was held back on refusal too). Where the run cannot
    read the host's zone and a later literal needs a two-digit year placed,
    the zone refusal ends the validation, and the day-first warnings of the
    literals read before it are not given (T1.6b review, carried at
    T1.28w). Recommendation: approve; the count is the reference's reading
    count, not a rule.

- id: PQL-4
  title: A day-first literal whose middle field is written as its year
  kind: change
  old_behavior: >-
    pandas guesses a literal's format by writing its reading back with
    strftime; for a day-first literal whose middle field is a four-digit
    number written as the year is (13/0001/1, read as the 13th of January
    of the year 1), it names the middle field %Y and the last %m, and warns
    "Parsing dates in %d/%Y/%m format ...", reading the same date.
  new_behavior: >-
    The core reads the same date and gives no D4 warning: D4 names a format
    only for a four-digit year last and one or two digits elsewhere
    (date-rules.md, "The PQL literal rules").
  affected_inputs: >-
    PQL date literals day first whose middle field has four digits and
    equals the year written last (with its time of day, if any).
  cases: [T1.6b]
  status: proposed
  approved_by: null
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E69}
  notes: >-
    Found by T1.6b's probes: 144 of the 1,134 literals of dates.json's
    format_guess set, and 7 of the 330 generated queries of the pre-push
    differential, differ only so; every reading agrees. Executable:
    sdm-pql's tests/dates.rs,
    a_format_pandas_guesses_from_a_year_written_as_a_month_is_not_named
    (diagnostic). A pandas artifact of format guessing, flagged to the
    owner rather than copied (the T1.6b brief). Recommendation: approve.
