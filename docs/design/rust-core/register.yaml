- id: P1B-32
  title: An entity the key's type cannot hold is the caller's error, INVALID_REQUEST, where the reference fails with INTERNAL_ERROR
  kind: change
  old_behavior: >-
    The reference casts the entities to the key's type with pandas
    (pd.Series(indices, dtype=train_pkey.dtype)). An integer past the
    key's width or past int64, a negative integer for an unsigned key, or a
    date or timestamp for a number key raises something other than the
    TypeError or ValueError its engine handles (OverflowError,
    ArrowNotImplementedError), which the client reports as
    StructuredDataError, code INTERNAL_ERROR, at materialize.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    core casts the entities under its rule table (sdm_engine::keys::cast;
    design, "The entities' cast to the key's type") and refuses each such
    entity as the caller's error: StructuredDataError, code INVALID_REQUEST,
    at materialize, with field indices, the entity's position, the reason
    (out_of_range or type) and the key's type, never its value (H17,
    E41(l)); an integer past int64 the host hands over as its text reads as
    the number it is, so where the key's type holds it and the table does
    not, it is refused as an entity the table does not hold. The default
    route is unchanged.
  affected_inputs: >-
    PredictiveQuery.materialize with indices over a DuckDB source under a
    forced core route, whose integer, unsigned, float or text key cannot
    hold an entity given: an integer outside its range or past int64, a
    negative one for an unsigned key, a date or a timestamp.
  cases: [T1.32a]
  refs:
  - 'contract/key-cast-vectors.json#float32.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#float64.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#int16.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#int32.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#int64.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#int8.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#uint16.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#uint32.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#uint64-past-int64.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#uint64.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#uint8.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  - 'contract/key-cast-vectors.json#utf8.* refusal INTERNAL_ERROR -> refusal INVALID_REQUEST'
  status: proposed
  approved_by: null
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E82}
  notes: >-
    Measured at T1.32a on both hosts over the test author's vectors
    (contract/key-cast-vectors.json, recorded from the reference): its refs
    name exactly the vectors of this class, a refusal before and after,
    each by id or by a glob no vector of another class matches (fix round
    1: int64.time.timestamp-1us, which the reference accepts, is P1B-34's
    alone).
    A refusal in place of a failure, both refusing (E66(b)'s class), for
    the reviewers, never self-approved. The client test
    test_entities_that_do_not_cast_are_the_caller_s_error_on_the_core holds
    it beside the old route.

- id: P1B-33
  title: Decimal keys and keys handed over as large text are sampled, where the reference fails on every entity
  kind: change
  old_behavior: >-
    The reference's engine fails with INTERNAL_ERROR at materialize for any
    entity of a decimal key (DuckDB DECIMAL(18, 0), DECIMAL(38, 10), HUGEINT
    as decimal128(38, 0)) or a text key DuckDB hands over as large_string
    ("unsupported data type ... for column 'ENTITY'"), whether the entity
    is in the table or not, wherever its pandas cast does not fail first:
    a list mixing numbers and text, and NumPy int64 entities for a
    DECIMAL(18, 0) key, it refuses with INVALID_REQUEST (those differences
    are P1B-35's).
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    core samples such a key as any other: its sampler compares keys by
    value (sdm_engine::keys::read), the payload names a whole decimal key's
    column as the reference names a decimal by what it holds (int64 up to
    18 digits or where every value fits, string past that) and one with a
    scale as string, each value its exact decimal text, never a double,
    which could make two keys one (sdm_request::payload::key_dtype; T1.32a
    fix round 1), so predict reads such a key's entities back as text, the
    result's id a utf8 such as "0.5" though the caller passed Decimals; and
    the entities, of any decimal width, are cast
    under the core's rule table: a request where they cast and the table
    holds them, otherwise INVALID_REQUEST at materialize (P1B-32's fields;
    those refusals in place of the reference's failures are P1B-37's).
    The default route is unchanged.
  affected_inputs: >-
    PredictiveQuery.materialize with indices over a DuckDB source under a
    forced core route whose entity key is a decimal of no negative scale,
    or text DuckDB hands over as large_string (arrow_large_buffer_size).
  cases: [key.decimal-18-0, key.decimal-38-10, key.hugeint]
  refs:
  - 'contract/key-cast-vectors.json#decimal128-18-0.* refusal INTERNAL_ERROR -> success'
  - 'contract/key-cast-vectors.json#decimal128-38-0-wide.* refusal INTERNAL_ERROR -> success'
  - 'contract/key-cast-vectors.json#decimal128-38-0.* refusal INTERNAL_ERROR -> success'
  - 'contract/key-cast-vectors.json#decimal128-38-10-wide.* refusal INTERNAL_ERROR -> success'
  - 'contract/key-cast-vectors.json#decimal128-38-10.* refusal INTERNAL_ERROR -> success'
  - 'contract/key-cast-vectors.json#decimal128-38-37.* refusal INTERNAL_ERROR -> success'
  - 'contract/key-cast-vectors.json#large-utf8.* refusal INTERNAL_ERROR -> success'
  - 'contract/decimal-vectors.json#key.at-precision.* refusal INTERNAL_ERROR -> success'
  - 'contract/decimal-vectors.json#key.both.* refusal INTERNAL_ERROR -> success'
  - 'contract/decimal-vectors.json#key.negative.* refusal INTERNAL_ERROR -> success'
  - 'contract/decimal-vectors.json#key.null-foreign.* refusal INTERNAL_ERROR -> success'
  - 'contract/decimal-vectors.json#key.primary-only.* refusal INTERNAL_ERROR -> success'
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E82}
  notes: >-
    This entry changes a refusal into success and requires individual owner
    approval under E66(b) and E73(b); never self-approved. Its refusal-to-refusal
    vectors are P1B-37's. key.varchar-large-buffers is
    P1B-6's case. No question sums a key, so the declared precision a
    decimal sum is held to (T1.32b) does not arise for one. T1.32b's 13
    decimal-key vectors (contract/decimal-vectors.json's key.both.*,
    key.primary-only.*, key.negative.*, key.at-precision.* and
    key.null-foreign.*: DECIMAL(4, 0) to (38, 0), (9, 2) and (18, 2), the
    reference's INTERNAL_ERROR, the core's success) are named in refs here,
