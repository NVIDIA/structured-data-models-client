- id: P1B-76
  title: A BOOLEAN[] or STRUCT of BOOLEAN DuckDB hands over losslessly is refused by name where the reference fails unnamed
  kind: change
  old_behavior: >-
    Under SET arrow_lossless_conversion = true DuckDB hands a BOOLEAN nested
    in a list or a struct over as int8 storage of the canonical extension
    arrow.bool8, on the child field; the reference's Schema.from_source fails
    a BOOLEAN[] column with an unnamed ValueError and a STRUCT(a BOOLEAN)
    column with an unnamed RuntimeError.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    host layer admits the nested arrow.bool8 child as boolean, as it does a
    top-level one (T1.33), so the column is list<bool> or struct<a: bool>,
    refused as the default forms are (list.boolean P1B-51's, a struct
    P1B-10's):
    UnsupportedRequestError, code UNSUPPORTED_REQUEST, fields operation
    describe_source and rule column_type. The extension on any storage but
    int8 (another integer, text, a dictionary of int8), at any depth, is
    refused by the host layer's admission, UNSUPPORTED_TYPE naming the
    column's path and the Arrow type received, never read by its storage.
    The default route is unchanged.
  affected_inputs: >-
    Schema.from_source over a DuckDB source under arrow_lossless_conversion
    holding a BOOLEAN[] or a STRUCT with a BOOLEAN field, under a forced core
    route; an Arrow field tagged arrow.bool8 on storage other than int8.
  cases: [T1.36]
  refs:
  - 'contract/type-set-vectors.json#lossless.list-boolean refusal UNNAMED -> refusal UNSUPPORTED_REQUEST'
  - 'contract/type-set-vectors.json#lossless.struct-boolean refusal UNNAMED -> refusal UNSUPPORTED_REQUEST'
  status: approved
  approved_by: reviewer
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E142}
  notes: >-
    A named refusal where the reference fails unnamed, E66(b)'s class, for
    the reviewer to check it fits; the behavior is the default forms'
    (P1B-51's list.boolean vector and P1B-10's struct, approved), reached
    through DuckDB's lossless Arrow form, written as an entry of its own as
    P1B-49 is. Approver:
    reviewer. Recommendation: approve. Measured by T1.36's test author (P3
    C13): contract/type-set-vectors.json's two rows, the reference's answers
    recorded through each row's witness by contract/tools/type_set_record.py
    in the reference environment (DuckDB 1.5.6), the core's held through real
    DuckDB on rust-host by sdm-testkit's tests/t133_type_reach.rs; the
    extension's edges (a value other than 0 or 1 read as true, nested
    children, the tag on other storage, a dictionary of int8) by sdm-host's
    tests/t136_bool8.rs. Each transition held by
    contract/tests/test_t133_type_set.py, pending until an approved entry
    names it. Never self-approved.
    Approved by both reviewers of the final whole-phase review at c49ee4f8
    (Codex's and the independent subagent's: APPROVE-P1B-76), relayed by the
    orchestrator, recorded at T1.36 fix 7; never the implementer's approval.
    Codex: a repeat of its cleanup review's approval, held by the
    real-DuckDB vectors and the independently reproduced reference failures;
    the subagent, probed on the reference side: lossless BOOLEAN[] an
    unnamed ValueError, STRUCT(a BOOLEAN) an unnamed RuntimeError, the core
    side held by T1.36's tests. Its two registration tests leave
    t133p2-pending.json's pending list with this approval.

- id: P1B-86
  title: With no entity-reference column, an answer whose row_index or forecast_step is past int64 is refused where the reference passes it through
  kind: change
  old_behavior: >-
    Where a materialized request's predicted instance table has no column
    named with the __kumo_entity_ref prefix (the caller renamed or dropped
    it), the reference's _named_entities gives the answers back as the
    endpoint wrote them, checking no row, so a row_index or forecast_step of
    any size the bindings read (a Python int) is in the result, and
    to_pandas() holds it.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    SDMClient.predict gives such answers back as written too (T1.36 fix 8,
    sdm-request's predict::layout), but the result's row_index and
    forecast_step columns are int64, so an answer whose row_index or
    forecast_step is past int64 (and one past the reader's 128 bits) is
    refused: StructuredDataError, code INVALID_RESPONSE, field
    prediction.row_index or prediction.forecast_step, reason out_of_range.
    Where the column is kept both routes refuse such an answer, as before.
    The default route is unchanged.
  affected_inputs: >-
    SDMClient.predict of a request materialized on the core over a DuckDB
    source, its entity-reference column renamed or dropped, under a forced
    core route, answered with a row_index or forecast_step below -2**63 or
    at or past 2**63.
  cases: [T1.36]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E152}
  notes: >-
    A refusal of an answer the reference accepts, so the owner's (locked
    check 5); not E66(b)'s class. Approver: owner. Question for the owner:
    may the core refuse, as INVALID_RESPONSE, an answer to an edited request
    whose row_index or forecast_step does not fit int64, or should the
    result carry such numbers as written? Recommendation: approve; no
    endpoint answers a row past int64, and carrying one needs a column the
    result's contract does not have. Measured by the implementer's
    old-route versus core-route probe at T1.36 fix 8 (a row_index of 2**63
    and 2**130, a forecast_step of 2**63, with the column dropped or
    renamed: the reference answers, the core refuses; -2**63 the same on
    both). Never self-approved.
    Approved by the owner on 2026-10-15 (owner item 47, E152), relayed by
    the orchestrator: the core refuses a malformed endpoint answer whose row
    index or forecast step is past int64; permanent, not matched in Phase 2.
    Never the implementer's approval.

- id: P1B-87
  title: An entity of an integer or float key written as text with a decimal digit Unicode added after 13.0 is given as the text where Python 3.12 reads it as a number
  kind: change
  old_behavior: >-
    The reference reads each entity of a predicted request back as its
    key's dtype with as_declared, which for an integer key calls Python's
    int on text and for a float key Python's float: on Python 3.12 (the
    reference's) these take any decimal digit of Unicode 15.0, so a Kawi
    digit five reads as the integer 5, and on Python 3.10 the same text is
    left as text.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    core reads the decimal digits every supported Python reads, Unicode
    13.0's, on every interpreter (sdm_wire::response's integer_text and
    numeric_text, the portable policy of P1B-25), so an entity written with
    a later digit is given back as the text it is, as Python 3.10's
    as_declared gives it. Entities written with Unicode 13.0's digits read
    as on the reference (T1.36 fix 8). The default route is unchanged.
  affected_inputs: >-
    SDMClient.predict of a request materialized on the core over a DuckDB
    source, under a forced core route, whose entity-reference cells a
    caller edited to text holding a decimal digit Unicode added after 13.0,
    for an integer or a float key, on Python 3.11 and later.
  cases: [T1.36]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E152}
  notes: >-
    The same digit policy the owner approved for numeric text (P1B-25,
    E93: the Unicode 13 digit rule, which can be revisited later), met at a
    new site: an entity read back from text. It changes an outcome the
    reference gives (an int where the core gives text), so the owner's.
    Approver: owner. Question for the owner: does E93's Unicode 13 digit
    rule cover entities read back as integers or floats too?
    Recommendation: approve as the same rule. Measured by the implementer's
    old-route versus core-route probe at T1.36 fix 8 (Kawi and Tangsa digit
    five: the reference gives 5, the core the text; Arabic-Indic five: 5 on
    both). Never self-approved.
    Approved by the owner on 2026-10-15 (owner item 46, E152), relayed by
    the orchestrator: the same rule as P1B-25 (E93), Unicode 13.0's decimal
    digits on every interpreter, for entities read back from text too. Never
    the implementer's approval.

- id: P1B-89
  title: A table whose zoned time column candidate holds a value whose wall clock leaves the years has its time column chosen from the whole table where the reference with pytz falls back to its preview
  kind: change
  old_behavior: >-
    With pytz installed (as under pandas 2, dbr17-pandas2) and a DuckDB
    TimeZone other than UTC, the reference's time column choice asks one
    whole-table statement for every candidate of a table at once (MIN and
    MAX of each: predictive_query's time_columns.py, _WholeTable calling
    full_range once with every candidate name)
    and fetches the answer as Python datetimes in that zone. Where any
    TIMESTAMP WITH TIME ZONE candidate's MIN or MAX has a wall clock in the
    zone before the year 1 or after 9999, and its first previewed value does
    not (that case is P1B-81(b)'s), the fetch fails even with pytz
    (OverflowError, "date value out of range"), so the reference judges
    every candidate of that table, zoned or plain TIMESTAMP, from its
    preview, as it does whenever the whole-table query fails (E85(a)), with
    its "taken unchecked" warning where the preview would pass a column
    over. Measured shapes, each in America/New_York unless named: a
    candidate null in the 1,000 rows the preview reads and holding after
    them only TIMESTAMPTZ '0001-01-01 00:00+00' (the year 0 at its wall
    clock), or only '9999-12-31 23:00+00' under Asia/Tokyo (the year
    10000), taken as the time column unchecked; (i) a candidate null in the
    preview, holding varying 2020 values after it and one '0001-01-01
    00:00+00' row, taken with the warning that none of the 1,000 rows read
    holds a value and the query over the whole table failed; (ii) a
    candidate whose preview holds one value (2020-01-01) and which holds one
    '0001-01-01 00:00+00' row later, taken with the warning that every row
    read holds that value and the query failed; (iii) a sibling: a table
    with a zoned h varying from 2020-06, a zoned g varying from 2020-01
    with one late '0001-01-01 00:00+00' row, and a plain TIMESTAMP f holding
    2019-01-01 in its 1,000 previewed rows and varying after them (so it
    starts earliest), where the reference judges f constant from its
    preview and takes g ("start earliest of 'h' and 'g'"). Without pytz the
    query fails for any table with a zoned candidate, which is P1B-39's
    case.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    whole-table statement's answer travels as Arrow and is read whatever the
    wall clock (P1B-39), so every candidate of the table is judged by its
    own whole-table range, and the time column chosen (any candidate, the
    out-of-years one or a sibling, zoned or plain) or the warning can differ
    from the reference's with pytz: in the first two shapes the candidate's
    MIN and MAX are its one value, so it is passed over as constant, no time
    column taken, with the constant-column warning ("every row that holds a
    value holds 0001-01-01 00:00:00+00"); in (i) and (ii) the column is
    taken, as the reference takes it, with no warning; in (iii) the core
    takes f ("start earliest of 'h', 'g' and 'f'"). Both routes succeed. A
    candidate whose first previewed value leaves the years is refused by
    name under P1B-81(b), and a table whose candidates' previews already
    decide the choice (a realistic sentinel, one such value late in a column
    whose other values vary) is chosen alike on both routes, with and
    without pytz; the same shapes with '0001-01-02 00:00+00', whose wall
    clock stays in the years, agree with no warning ((iii)'s control: both
    routes take f). The default route is unchanged.
  affected_inputs: >-
    Schema.from_source under a forced core route over a DuckDB table of
    1,000 rows or more, its TimeZone not UTC, holding a TIMESTAMP WITH TIME
    ZONE time column candidate any of whose values past its first previewed
    one has a wall clock in that zone outside the years 1 to 9999 (the
    choice among all of that table's candidates, zoned or plain), compared
    with the reference run with pytz (dbr17-pandas2).
  cases: [T1.36]
  refs:
  - contract/t136-host2-zone-vectors.json#p1b89.held-past-the-preview.new-york.year-1
  - contract/t136-host2-zone-vectors.json#p1b89.held-past-the-preview.tokyo.year-9999
  - contract/t136-host2-zone-vectors.json#p1b89.control.utc.year-1
  - contract/t136-host2-zone-vectors.json#p1b89.control.sentinel.new-york
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E152}
  notes: >-
    Found by the independent subagent's re-check of T1.36 fix 13 at
    b6ac5b76 (its P3-1 and its OWNER line), reproduced there with pytz
    installed for the comparison; recorded at T1.36 fix 14. P1B-39 does not
    cover it: P1B-39's reference with pytz reads the whole table, and here
    its query fails with pytz too. A different success, not E66(b)'s class,
    so the owner's. Approver: owner. The owner's question (P1B-89): match
    the reference's fallback (take it as the time column) or keep the
    core's choice? (a) Treat a whole-table MIN or MAX whose wall clock in
    the zone leaves the years 1 to 9999, for any candidate, as the table's
    query failing and fall back to the preview for the whole table's choice
    (every candidate of it), which matches the reference with and without
    pytz in every shape here, (iii) included; or
    (b) keep the whole-table reading. Cost of (a): about one condition in
    sdm-schema's time column choice (infer.rs, where it reads the
    column_ranges answer), plus the test author's vectors and tests, a few
    hours; (b) costs nothing. Recommendation: (b) for Phase 1, with (a) as
    Phase 2 row FX-5 (migration-plan.md section 8) if the owner prefers
    exact matching: both routes succeed; where the time column chosen
    differs the input is a column holding only instants Python cannot hold
    in that zone, and the core's "constant" is the more accurate answer;
    in (i) and (ii) only the warning differs, the core's whole-table reading
    being the truer one; and realistic sentinels agree. Measured by the
    test author's "T1.36 tests: P1B-89's zoned whole table that pytz cannot
    read held as measured": contract/t136-host2-zone-vectors.json's p1b89
    section (2,500 events rows beside shop, f null in the 1,000 the preview
    reads), held by contract/tests/test_t136_host2_zones.py's test_p1b89_*
    tests: in New York and Tokyo the reference takes f with and without
    pytz, the core none; the UTC control agrees with the reference with
    pytz (without it, P1B-39's case); the sentinel control agrees on every
    route; DuckDB's fetchall of the edge values fails with pytz. Widened at
    T1.36 fix 15 from that first shape to the class, after the independent
    subagent's review of the final bookkeeping (e2fc16f4) measured shapes
    (i) and (ii) in New York with pytz, each a warning difference only, and
    their '0001-01-02' controls; option (a) covers every shape. Stated per
    table at T1.36 fix 16, after the subagent's re-check of fix 15
    (183900a0) measured shape (iii), a plain TIMESTAMP sibling's choice
    decided by a zoned candidate's failure, and its control. Never
    self-approved.
    Approved by the owner on 2026-10-15 (owner item 48, E152), relayed by
    the orchestrator: option (b), the core's choice kept; permanent, not
    matched in Phase 2 (FX-5 closed). Never the implementer's approval.

- id: P1B-79
  title: A single text or binary value past int32 offsets without large buffers is refused by name where the reference fails unnamed
  kind: change
  old_behavior: >-
    Without SET arrow_large_buffer_size = true, DuckDB 1.5.6 refuses to hand
    over a VARCHAR or BLOB column holding one value of 2**31 + 16 bytes
    ("Arrow Appender: The maximum total string size for regular string
    buffers is 2147483647 but the offset of 2147483667 exceeds this"); the
