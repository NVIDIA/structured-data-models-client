    gets its own entry here before the change is adopted. The changes the
    core route already shows, measured at T1.21e, have theirs: P1B-6
    (key.varchar-large-buffers), P1B-7 (nested.union) and P1B-8
    (time.feature-interval).
  affected_inputs: >-
