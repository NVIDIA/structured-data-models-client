- id: P1B-4
  title: SDMClient.predict on the core route refuses what T1.11d's thin predict does not port yet
  kind: change
  old_behavior: >-
    The reference sends any gathered relational request to its model and
    reads any answer its bindings read: every task kind, any outputs asked
    for (probabilities, quantiles, scores, rankings, embeddings,
    explanation), any prediction statistic, an answer whose items carry
    those fields or item metadata, a prediction of any JSON type (an
    integer, text, null, an overflowing number read as an infinity or,
    through Python's reader, NaN and Infinity),
    and an entity key of any declared dtype, read back as the client's
    as_declared reads it.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build,
    SDMClient.predict of a request materialized on the core over a DuckDB
    source runs on the core's predict (T1.11d). From T1.28b it runs the
    client's predict-side rules (sdm-request's predict): the model and
    output checks and the task's default outputs (SDMClient._prepare), the
    answer to a request with no rows, the adapter's _preflight, the merge
    and the notice of an absent output, as the reference's; it predicts a
    regression, a binary and a multiclass classification asked for any
    outputs the model produces, and lays out the answer as the reference's
    frame (a class as the target's type, its probabilities keyed as the
    column spells the classes, a null prediction as NaN), a non-finite
    number read as the reference's reader reads it (the owner's decision
    of 2026-10-12: passed through). It refuses the rest with
    UNSUPPORTED_REQUEST naming the rule, never a value (fields operation
    and rule): model (the tabular model, once its shape checks pass, which
    refuse a relational request first as the reference does), problem_type
    (a forecast or a link prediction), prediction_statistic (a statistic
    not written as text), entity_ref (a request with no entity reference
    column), id_type (an entity key not declared int8 to int64, written as
    an integer or as plain digits, or string), instance_id_type,
    response_field (an answer carrying scores, rankings, embeddings,
    quantiles, an explanation or item metadata, named in field),
    prediction_type (a classification's answer not of its target's type
    and not a non-finite number)
    and target_type (a classification of a float target, which
    materialize does not write). An answer nested past 128 levels (P1B-22)
    and a regression's prediction that is not a number (P1B-23) are
    INVALID_RESPONSE, approved by the owner. A request not materialized on
    the core, or holding other payloads than the one it wrote, has no core
    route (RouteError, the seam's own failure). The default route is
    unchanged.
  affected_inputs: >-
    SDMClient.predict of a request materialized on the core over a DuckDB
    source, under a forced core route, with any of the inputs or answers
    above; base.regression is none of them, and its request and result are
    the reference's.
  cases: [base.regression, base.binary, base.multiclass, T1.11d, T1.26, T1.28, T1.28a, T1.28b, T1.29]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Rewritten at T1.28b, which lifted outputs, the classification's
    layout, the prediction types a regression's number and a class take,
    and the non-finite numbers (owner, 2026-10-12, E78(h)): from fix
    round 1 a class written as a non-finite number is passed through too,
    as the reference passes it; what remains is the forecast, ranking,
    tabular and extra-output work of later packages. rust-host's Arrow
    result carries columns the reference's frame does not (answer_index,
    and prediction_as_answered where the prediction column changed an
    answer), which python-core reads into its items and leaves out of
    to_pandas().
    Proposed by the implementer of T1.11d (Phase 1 decisions row E45), for
    the owner: each is a refusal of an input or answer the reference
    accepts, so it waits for the owner (P1B-1 process) and is never
    self-approved; the route is not a default anywhere, so no caller meets
    it. The tests that pin the refusals (sdm-core's tests/predict.rs, the
    client's tests/test_the_predict_route.py) are diagnostic:
    base.regression is diagnostic until T1.29. Recommendation: approve as
    temporary, as P1B-2 and P1B-3; T1.28 (the generated wire types, the
    response and the result layout) and the task kinds T1.29 brings remove
    each rule's refusal, and this entry is set to rejected when the last
    one goes. Approved by the owner on 2026-10-13, relayed by the orchestrator (E92), for the Phase 2 class only: problem_type, instance_id_type, model, prediction_statistic, prediction_type, response_field stay refused by name until Phase 2 (docs/design/rust-core/phase-1/not-yet-refusals.md). The entry's other rules stay proposed, each its family's or T1.33's.

- id: P1B-5
  title: A DuckDB table named with a double quote is described on the core route where the reference refuses it
  kind: change
  old_behavior: >-
    The reference's Schema.from_source over a DuckDB source holding a table
    whose name holds a double quote (CREATE TABLE "double""quote") refuses
    the call: its catalog read, PRAGMA table_info, reads its argument as a
    qualified name, in which a double quote opens or closes a quoted part,
    so DuckDB fails it, and the engine raises its TableNotFoundError, which
    the client raises as StructuredDataError with code INVALID_REQUEST. A
    name holding a dot is read as another table's (schema.table) the same
    way.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    table is described: sdm-data reads the columns of a table whose name
    holds a double quote or a dot by its own name, as text, from
    duckdb_columns() and duckdb_constraints(), in the pragma's columns and
    rows (decision E58(d)); every other name is still read with the
    reference's PRAGMA text. A name holding a dot is refused by the
    schema's rule on names, INVALID_REQUEST as on the reference: from
    T1.23 the core holds a table's name in the schema to that rule
    (E59(b)), before the client's own does. With tables named (T1.23, a
    rust-host case until T1.24's route, the public call's from T1.24),
    measured at T1.23's fix round 2 and again at T1.24 through the public
    call (a schema-qualified system view, information_schema.tables, among
    them): a
    plain name over a source table named with a dot is described on the
    core, where the reference refuses it (INVALID_REQUEST, its pragma
    reading the name as another); a source name qualified or quoted
    (main.users, "users") over a table the source holds is refused
    INVALID_REQUEST on the core, which reads it by name and finds nothing,
    where the reference fails in its engine, unnamed
    (GraphConstructionError). Before
    T1.22 the core refused the double-quoted name with PROVIDER_ERROR
    (DuckDB's parser error as the provider's), against PK-6. The default
    route is unchanged.
  affected_inputs: >-
    Schema.from_source, and what follows it, over a DuckDB source holding a
    table named with a double quote, under a forced core route; and, from
    T1.23, a table named in the schema over a source name holding a dot or
    a double quote, or qualified by its schema.
  cases: [T1.21d, T1.22]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Found at T1.21d's review (Codex P2 of round 2, subagent P3-2) as the
    PROVIDER_ERROR divergence; at T1.22 no quoting of the pragma's argument
    reads such a name on DuckDB 1.5.6 (it unquotes no doubled quote), so
    the catalog read takes the name as text, and the core now accepts what
    the reference refuses: it refuses nothing the reference accepts.
    Pinned by the client's tests/test_the_schema_route.py, which names both
    routes' outcomes for a double quote and for a dot, and by sdm-testkit's
    duckdb_provider.rs, which holds the by-name read to the pragma's answer
    for an ordinary twin. Recommendation: approve. Never self-approved.

