- id: P2C-5
  title: On Postgres a text time value pandas reads and the core's list does not is refused by name at materialize
  kind: change
  old_behavior: >-
    The reference's Postgres sampler takes a time column's bounds as MIN
    and MAX of the column in its own type, a text column's by its text, and
    reads them in the host (pandas): a value pandas reads ('March 3rd
    2023', the refusal census's rule:text_time probe) is answered.
  new_behavior: >-
    The core takes the same MIN and MAX and reads each bound and each
    fetched value itself, by its fixed list of formats: a value outside the
    list is refused at materialize, UNSUPPORTED_REQUEST rule text_time.
    Until T2.3's fix 9 the core asked the source for its bounds as
    timestamps (CAST to timestamp), and such a value failed the source's
    statement, PROVIDER_ERROR at materialize.
  affected_inputs: >-
    PredictiveQuery.materialize on the core route over a Postgres source
    whose text time column holds a value pandas reads and the core's list
    does not.
  cases: [T2.3]
  refs: [DT-12, DT-7, DT-15, 'contract/refusal-census.json rule:text_time']
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-2/decisions.md, row: KO2-64}
  notes: >-
