- id: P1B-16
  title: An edit naming a column by a value no name is is refused by name on the core route
  kind: change
  old_behavior: >-
    The reference looks a column up by the value an edit gives
    (schema[t].time_column = value, schema[t][c].stype = value,
    del schema[t][value], a Relationship naming a column by the value), and
    a value that cannot be looked up, a list, raises Python's TypeError
    (unhashable type) from the lookup, naming nothing; a value that can be
    and is no name (a number) is refused INVALID_REQUEST.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, a
    core-built schema's setter passes the value to the core's edit_schema
    as unreadable where no contract type holds it, and the core refuses it
    INVALID_REQUEST naming the field (time_column, stype, column,
    relationships), the schema left as it was (T1.24b, decision E67). The
    values the reference refuses by name are refused alike.
  affected_inputs: >-
    Edits to a schema Schema.from_source described on the core route that
    name a column by an unhashable value.
  cases: [T1.24b]
  status: approved
  approved_by: reviewer
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E66}
  notes: >-
    Measured at T1.24b and pinned on both routes by the client's
    tests/test_the_schema_edits.py,
    test_a_value_no_name_is_is_refused_by_name_where_the_reference_crashes
    (TypeError on the old route, INVALID_REQUEST on the core). The
    implementer reads it as fitting E66(b)'s class (the reference gives an
    unnamed error, the core a named refusal); whether it does is the
    owner's or the reviewer's to say. Never self-approved.
    Approver: reviewer (T1.33: the reference's unnamed TypeError to a named
    refusal, E66(b)'s class).
    Approved by both reviewers of the final whole-phase review at c49ee4f8
    (Codex's and the independent subagent's: APPROVE-P1B-16), relayed by the
    orchestrator, recorded at T1.36 fix 7; never the implementer's approval.
    Codex: the reference's unnamed failure to a named refusal under E66(b)
    only, not a catch-all approval of INVALID_REQUEST; the subagent, probed:
    the reference raises TypeError (unhashable type: 'list') for a list
    time_column and for del schema[t][[c]], the core refuses
    INVALID_REQUEST.

- id: P1B-17
  title: An edit to a schema changed past its description is refused by name at the edit on the core route
  kind: change
  old_behavior: >-
    The reference makes an edit to a schema of tables in their source
    whatever was changed of it before: a column's data type assigned, a
    table mapped to another source table, a table or column added through
    the schema's dictionaries.
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build, the
    core's edit_schema reads the schema as the host holds it beside the
    description the core last answered, and refuses such a schema by name,
    UNSUPPORTED_REQUEST with operation edit_schema and rule schema_edited,
    at the next key, time column, meaning, column left out or relationships
    edit, the schema left as it was (T1.24b, decision E67). Until T1.24b
    the Python setters made that edit, and only materialize refused the
    schema (P1B-3's schema_edited, which it still is at materialize). An
    edit of the data type, the source name or a dictionary is not passed
    to the core, as before.
  affected_inputs: >-
    A schema Schema.from_source described on the core route, a column
    retyped, a table mapped to another source table or a table or column
    added since, then edited by a setter the core takes.
  cases: [T1.24b]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E78}
  notes: >-
    Approved by the owner on 2026-10-12, relayed by the orchestrator during T1.28b (E78(l)).
    The core checks an edit against what the source said of each column
    (its data type), which it does not know of a column it did not
    describe or one retyped since; following such a schema is later work,
    with materialize's (P1B-3). Pinned by the client's
    tests/test_the_schema_edits.py,
    test_a_schema_changed_past_its_description_is_refused_by_name, and
    sdm-schema's and sdm-core's tests. A refusal of an input the reference
    accepts, so for the owner. Never self-approved. A sub-case, from
    T1.24b's review: where the change leaves a value the held schema
    writes as no text (a column's dtype assigned None, a table's
    source_name or a column's key in the dictionary that is not a string),
    the next edit or materialize fails as INVALID_MESSAGE, the held
    schema not reading as the contract's HeldSchema, rather than as
    schema_edited.
