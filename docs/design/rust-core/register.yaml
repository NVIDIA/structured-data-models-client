    the orchestrator: an edge case; the core's named refusal is kept for
    Phase 1, and matching the reference (one value over 2 GiB under large
    buffers) is Phase 2 row FX-3. Never the implementer's approval.

- id: P1B-81
  title: A time value past int64 microseconds or the years 1 to 9999 where the reference fails unnamed, refused by name
  kind: change
  old_behavior: >-
    (a) A finite TIMESTAMP_S or TIMESTAMP_MS value past int64 microseconds in
    the time column, which a table built from Arrow keeps (DuckDB's own casts
    refuse it): the reference's Schema.from_source describes the source, and
    its materialize fails INTERNAL_ERROR, "the relational engine failed while
    building this request: ConversionException", DuckDB failing the time
    bounds' CAST(ts AS TIMESTAMP). (b) A time column candidate (any column
    of a timestamp's meaning, in any table, but the key and one named as a
    load stamp or a date of birth, whatever role it then gets) whose first
    value held in the rows the reference previews lies outside the years 1
    to 9999 (an infinity, a finite value past int64 microseconds, the year
    10000): the reference's Schema.from_source fails unnamed, an
    OverflowError, where its time column choice reads that value as a
    Python datetime (predictive_query/time_columns.py, _refused_for_values,
    present.iloc[0]).
  new_behavior: >-
    On the core route, which only SDM_CORE_ROUTES forces in this build: (a)
    the core sends the reference's same bounds statement and DuckDB fails it
    the same way, which reaches the core as the provider's failure:
    materialize fails StructuredDataError, code PROVIDER_ERROR, request
    time_bounds, the host naming the driver's class. DT-14's
    VALUE_OUT_OF_RANGE would need the core to read why the driver failed,
    which the contract does not carry (a provider's error holds no message,
    and DuckDB gives no SQLSTATE). (b) the core's inference, which mirrors
    the reference's choice (sdm-schema infer.rs), reads the same candidates'
    first values of its preview, the same rows in the same order, and
    refuses the table at Schema.from_source, StructuredDataError, code
    VALUE_OUT_OF_RANGE, naming the table and the column (the first such in
    table order). A value is read as the reference reads it, which builds
    its UTC instant first and then, for a value with a zone, its wall clock
    in that zone (the Arrow zone DuckDB hands over, its database's global
    TimeZone; the zone's offset at that instant from the zones the run
    resolves, local mean time before the zone's first transition included):
    the table is refused where either reading, the UTC instant or the wall
    clock, lies outside 0001-01-01T00:00 to 9999-12-31T23:59:59.999999. A
    value past those years in a later row, a
    nanosecond's, and one in a column named as a load stamp or a date of
    birth are described as the reference describes them. The default route
    is unchanged.
  affected_inputs: >-
    A DuckDB source whose timestamp column holds a value past int64
    microseconds or the years 1 to 9999, under a forced core route.
