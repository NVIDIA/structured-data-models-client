# --- The keys family (T1.32a) ------------------------------------------------

- id: P1B-31
  title: The entities reach the core as the host's own values, and the key cases' core inputs say so
  kind: change
  old_behavior: >-
    Before T1.32a the Python bridge cast the entities to the key's type with
    pandas before the core saw them, so the key cases' core inputs named
    them in the key's type (key.declared-int32 as i32, key.uint8 as u8,
    key.uint64-small and key.uint64-above-int64-max as u64), and the decimal
    key cases had none: the bridge refused their key type (key_type) and the
    case format carried no decimal entity.
  new_behavior: >-
    The host hands the core the entities as one Arrow column of its own
    values' type and the core casts them (sdm_engine::keys::cast; design,
    "The entities' cast to the key's type"): a Python integer is i64, an
    integer past int64 is its text (pyarrow infers no type for it), a
    Decimal is the decimal pyarrow infers. The cases' core inputs are what
    both hosts now send: i64 for key.declared-int32, key.uint8,
    key.uint64-small and key.hugeint, utf8 text for
    key.uint64-above-int64-max, and decimal128(1, 0) and decimal128(2, 1)
    for key.decimal-18-0 and key.decimal-38-10, which gain materialize and
    predict inputs. No public outcome changes by this entry; each case's
    python-ref line is re-recorded, identity only.
  affected_inputs: >-
    The core inputs of the seven key cases named; no public call.
  cases:
  - key.declared-int32
  - key.uint8
  - key.uint64-small
