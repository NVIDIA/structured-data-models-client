  notes: >-
    Approved by the owner's T1.25b answer of 2026-10-11, relayed by the
    orchestrator (E66(h)): "A named refusal of text outside the documented
    formats is approved by the owner's T1.25b answer (2026-10-11)." Each
    refusal here is made by a value outside the documented list in both
    orders of day and month: the reading refuses text_time only then, an
    order of the values in the list left open being text_time_order
    (DT-16); the differential's classifier asserts such a value for each
    class a answer, and text_times.rs holds every class a example to it,
    with the review's open-order column (03/15/99, 15/11/00) as a negative
    control (fix round 1: 41 inference decisions T1.25b first counted here
    moved to DT-16's b.order_open). No baselined case changes (the gate
    passes with no transition).

- id: DT-16
  title: Text in the core's list read, refused or warned of otherwise than the reference
  kind: change
  old_behavior: >-
    pandas reads a column's text by a format guessed from its first value,
    reading a value written another way as NaT (inference's and the time
    column's readings), or value by value with each slash date month first
    unless its first field cannot be a month (a SQL source's text time
    column); it warns of a guessed format that puts the day first, which it
    guesses from a first value whose first field is past 12 and a four-digit
    year; values with mixed offsets that its guess leaves partly NaT do not
    raise; an instant past what nanoseconds hold, in a column of nanosecond
    values, is NaT.
  new_behavior: >-
    The core reads every value of its list by the value's own format, and
    the order of day and month by the client's rule over the values read
    together (date-rules.md, "The core's text formats"). The kinds, as the
    differential names them (text-times-differential.json): b.order_open, an
    order the values leave open is refused (text_time_order) where the
    reference reads month first (01/05/2024 alone), and, in inference and
    the time column's choice, a column whose order changes the score or
    the start (03/15/99 beside 15/11/00), both under their own rule
    text_time_order; b.order_decided, a value
    read in the order the column decides (02/01/2024 beside 15/03/2024 is
    the 2nd of January, the 1st of February to the engine); b.format_guess,
    a value the reference's guessed format reads as no time is read (a
    column of 2024-01-05 and 2024-01-05 10:30:00, or of ISO and slash
    dates), so inference may type a text column a timestamp that the
    reference types as text and materialize go on to read it; b.offsets,
    offsets mixed among the values read refused (text_time_zones) where the
    reference's guess left one side NaT and raised nothing, or decided where
    it raised; b.range, a year past 2262 read where a nanosecond column
    reads NaT (materialize then refuses it, DT-14); b.order_rule, the day-
    first warning given where the client's rule decides the day comes first
    over the column's day or month first values (a two-digit year, an
    ambiguous first value, a stray value outside the list beside them) and
    not where pandas guesses it from a first value the core does not read
    as day or month first.
  affected_inputs: >-
    Over the 13,456 columns T1.25 recorded: materialize 1,166 (1,150
    b.order_open, 15 b.order_decided, 1 b.range); the time column's choice
    1,203; inference 398 of 26,908 decisions (272 b.offsets, 67
    b.format_guess, 41 b.order_open, the rest range or mixed); the warning
    372 of 2,810 (b.order_rule). Over
    T1.25b's 60 generated sources: European dates (dd/mm/yyyy, dd-mm-yyyy
    HH:MM) typed a timestamp and warned of, two-digit European years read
    and warned of, US-and-ISO and mixed ISO layouts typed a timestamp, an
    ambiguous text feature refused (text_time_order), mixed offsets refused
    at describe.
  cases: [T1.25b]
  refs: [DT-7, DT-11, DT-14]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E68}
  notes: >-
    Approved by the owner on 2026-10-11, relayed by the orchestrator during
    T1.25b's fix round 1 ("approve both", as recommended), including the
    refusal of a lone ambiguous date (text_time_order) rather than reading
    it month first by default; the approval takes in the open orders fix
    round 1 moved here from DT-15 (text_time_order in inference and the
    time column's choice, 41 inference decisions over T1.25's columns).
    Recorded in E68. Before the answer it was proposed, never
    self-approved: the owner's T1.25b answer required separate approval
    for a value inside the documented formats read differently from the
    reference. No contract case was affected (the gate passes with no
    transition). Each kind is the client's documented rule (the order over
    the column, two-digit years, per-row reading) or a pandas artefact the
    core drops (the format guessed from the first value, month first by
    default, nanosecond overflow).

- id: DT-17
  title: Inference counts text outside the client's shapes as no time under a name that does not say time
  kind: change
  old_behavior: >-
    contains_timestamp counts every value pandas reads as a date: under a
    name that does not say time, a column whose first 100 non-empty values
    pandas all reads (dates in words, packed digits, the clock's words) is a
    timestamp.
  new_behavior: >-
    Under a name that does not say time, the core counts a value outside the
    client's shapes as no time, so such a column is text (no refusal); under
    a name that says time, such values could make the score and the column
    is refused (text_time, DT-15). A code (AW00011205) is no timestamp under
    any name the reference would not make one of either.
  affected_inputs: >-
    Over the 13,456 columns T1.25 recorded: 459 of 26,908 inference
    decisions (class c), columns under a name that does not say time whose
    values outside the client's shapes (the clock's words now and today,
    dates in words, ordinals such as 5th, a bare year such as 2024) pandas
    reads as dates. No day-first warning differs for this reason (the 11
    T1.25b first counted here are in-list order-rule differences, DT-16,
    fix round 1). None of T1.25b's 60 generated sources.
  cases: [T1.25b]
  refs: [DT-15, P1B-2]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E68}
  notes: >-
    Approved by the owner on 2026-10-11, relayed by the orchestrator during
    T1.25b's fix round 1 ("approve both", as recommended); recorded in E68.
    Not a named refusal, so it was outside the T1.25b answer's approval and
    proposed until then. It is the client's own inference rule
    (client/core/dates.py: inference does not read loose text as dates,
    which would read part codes as dates); refusing instead would need a
    reader of dateutil's words to tell a date from a code, or would refuse
    every text column of the AdventureWorks journey (codes, names, UUIDs),
    which reaches predict on both hosts with this rule.

- id: DT-18
  title: A time of day set as a time column fails the source's CAST, reported as the provider's error
  kind: change
  old_behavior: >-
    A TIME column set as a table's time column (an edit after
    Schema.from_source) fails the reference's sampling statement, DuckDB's
    CAST from TIME to TIMESTAMP being unimplemented, which its client
    reports as StructuredDataError with code INTERNAL_ERROR at materialize.
  new_behavior: >-
    The core renders the same statement, which fails the same way in the
    source, and reports the provider's error, PROVIDER_ERROR at
    materialize, as DT-12 reports a text column the CAST cannot read.
  affected_inputs: >-
    SQL sources whose time column, set by an edit, is a TIME column, on the
    core route.
  cases: [T1.28a]
  refs: [DT-12, P1B-1]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Found at T1.28a by contract/tools/differential.py, whose generator now
    makes times of day (seed 29, one source, an edit setting e.tod as the
    time column); the core's behavior predates T1.28a. Fits the class the
    owner approved on 2026-10-11 (E66(b): where the reference gives an
    internal error, a clearer code is approved), as DT-12 did: for the
    reviewer to approve under the class, never self-approved. The tool
    classifies a PROVIDER_ERROR where the reference fails internally here
    only when the source's spec makes a time of day (make_time or a cast
    to TIME in its setup) a table's time column, as Schema.from_source is
    told it and the edits leave it; any other such pair stays UNCLASSIFIED
    (T1.28a fix round 1).

- id: ORD-1
  title: Tie order of the shared train set by entity time
  kind: change
  old_behavior: >-
    sample_target sorts a shared train set by entity time with
    sort_values(ascending=False), numpy's unstable quicksort, so rows tying on
    time come out in introsort's order. It sorts only when the anchor is
    'entity' (base/sampler.py:777-783): a static query materialized with
    anchor_time='entity', whose entity table has a time column. On the
    reference host (arm64, numpy 2.5.3, pandas 3.0.6) a shared train set of
    up to 16 entities keeps its tied rows in their shuffled order, and one
    of more than 16 entities may not: the threshold is on the length of the
    train set sorted, not on the number of rows that tie.
  new_behavior: >-
    Proposed: the core orders the shared train set by entity time, newest
    first, with tied rows in their shuffled order (RS-1's draw), the order
    sort_values(ascending=False, kind='stable') gives; for a shared train
    set of up to 16 entities that is also the reference's order on its
    host.
  affected_inputs: >-
    Static queries materialized with anchor_time='entity' over a shared
    train set of more than 16 entities in which any two tie on time: the
    order of the context rows, and which tied rows fill the context when
    more qualify than it holds. No case of the Phase 1b inventory or of
    contract/cases.
  cases: [T0.6, T1.21]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Measured at T1.21 by contract/tests/test_register_probes.py, which
    passes against the reference checkout (b413e9a) and on the candidate's
    default route. The tie order reaches no inventory payload: the case
    schema takes an ISO date as materialize's anchor_time, so no case can
    name 'entity'; running the 40 inventory cases and the three of
    contract/cases, 32 cases (31 distinct ids, base.regression appears
    twice, in the inventory and in contract/cases) reach sample_target with
    one call each (30 temporal, 2 static), every one anchored at a
    timestamp, so none takes the sort. From T1.21b contract/cases holds a
    fourth case, base.adventureworks, which reaches it once more, temporal
    and at a timestamp: 33 cases, 32 distinct ids. The control, a public materialize on DuckDB with
    anchor_time='entity' over 40 users tying on two times, reaches it; run
    by hand on the reference, its context rows came out in another order
    than with kind='stable', so the tie order does reach a payload when a
    caller asks for that anchor. The core route refuses that anchor in
    Phase 1 (anchor_entity, T1.24), so no Phase 1 answer depends on this
    entry. Recommendation, as random-streams.md and Phase 1 decision Q3
    propose when no inventory payload shows the order: register a stable
    order as this change. Reproducing it would mean porting numpy's introsort
    for datetime64, and the order is the host's: only the reference host was
    measured. A change, so the owner decides; until then the comparator does
    not normalize tie order (Q3).

- id: ORD-2
  title: NULL times and emit order of the latest-neighbor fetch
  kind: keep
  old_behavior: >-
    The reference's two samplers disagree: the SQL push-down drops rows whose
    time is NULL and returns neighbors newest first (ties by time, then
    primary key); the in-memory sampler keeps NULL-time rows and returns them
    oldest first in stable row order.
  new_behavior: >-
    Proposed: each path keeps its own reference policy until the disagreement
    is settled. Phase 1 runs only the SQL path; its policy is stated in the
    Neighbors request's window (NULL window times not returned) and TieBreak,
    and pinned by L1 vectors from T1.26b: sdm-testkit's tests/neighbors.json,
    the rows the reference's DuckDB sampler's _by_fkey and _by_time returned
    for 14 sets of seeds (an anchor equal to a time, window starts and ends,
    a microsecond either side, ties broken by the key at the cut, a NULL
    time, times before 1970, several seeds reaching one row, a TIMESTAMPTZ
    column under a session zone of America/New_York), which the core's own
    requests (tests/neighbor-requests.json, held to sdm_engine::sample's
    builders) return on DuckDB, by neighbors.rs. Rows tying on the whole
    order (their time and their key, which a key that repeats allows) are
    in no order the reference fixes, and the rows kept at the cut, and so
    the request, differ from run to run on both routes (measured at
    T1.26b's review: three runs, three payloads, on each route); a
    differential compares such sources only where times or keys are
    unique. Null keys tie too: rows whose key is null in a table without a
    time column come back in no fixed order, on the core and on the
    reference with its null handling corrected (measured at T1.26b's
    review round 2).
  affected_inputs: >-
    Relational requests whose neighbor tables have NULL or tied times, or
    null keys.
  cases: [T1.26, T1.26b]
  status: proposed
  approved_by: null
  decision_ref: null
  notes: >-
    Phase 1 decisions F2 and H15. Settling which policy both paths follow is
    S3 work in Phase 4, as its own change entry. The time-window fetch
    (_by_time) is unordered and feeds order-sensitive float32 group sums; the
    inventory's values are exact in float32, so no case shows it, and it
    becomes its own entry (ORD-3) if one ever does.

- id: ORD-3
  title: Float32 label sums over an unordered window fetch vary from run to run on large real data, on both routes
  kind: keep
  old_behavior: >-
    The reference reads a window's rows unordered (_by_time) and sums each
    entity's labels in float32 in the order they arrive (PK-2), so where a
    window holds values a float32 sum rounds by order, the labels change
    with the source's parallel scan order.
  new_behavior: >-
    The core reads the same rows as unordered and sums them in float32 in
    the order they arrive (PK-2), so its labels vary the same way. Neither
    route's request is stable from run to run there; their requests can
    differ by the last float32 digits of a label.
  affected_inputs: >-
    materialize over a large source whose window rows a parallel scan
    returns in varying order and whose summed values are inexact in
    float32: measured on RelBench H&M's full tables (15,453,651
    transactions), the 30-day SUM(price) per customer.
  cases: [T1.32e]
  status: approved
  approved_by: owner
  decision_ref: {file: docs/design/rust-core/phase-1/decisions.md, row: E83}
  notes: >-
    ORD-2's notes foresaw this entry. Measured by
    scripts/live/real_data_benchmark.py --dry-run on the full H&M tables
    (seed 0, 16 entities): the old route's request and the core's differ in
    3 of the context's targets by about 1e-7 relative (0.16762712597846985
    against 0.16762711107730865; the exact double sum is
    0.1676271186440672), and two runs of the same route differ from each
    other as much; the H&M sample and full-size AdventureWorks send one
    request on both routes. A real-data comparison reads these labels as
    noise. Settling an order belongs with ORD-2 (Phase 4, S3). Approved by the owner on 2026-10-13, relayed by the orchestrator (E85). From T1.32e's fix round 3 the benchmark compares the two routes' requests allowing exactly this (compare_requests, equal-within-ORD-3: label values only, within 8 float32 steps relative); rerun on the full H&M tables, seed 0's regression is equal-within-ORD-3 and every other request equal.

