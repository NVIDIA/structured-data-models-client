# Scope manifest for the Java binding (Phase 0, T0.5).
# Format: scope-format.md; schema: scope.schema.json.
# Java starts with DuckDB, SQLite, Postgres and Databricks (plan decision 2); S3 only as the owner adds scope.
# Ranking and forecasting stay out of Java until the owner adds them, so Java's S2 covers 4 of the 6 base job questions (owner decision J2).
# Operation ids are shared with Python; Java API names are filled in when Java S0 work starts.
# Case lists stay empty until Phase 1a.

format: sdm-scope/1
language: java
# The slice descriptions are the plan's; Java's scope has no ranking or forecasting paths yet (J2).
slices:
  S0: PQL validation
  S1: Schema from a source, materialize, predict on DuckDB, SQLite and Postgres, offline, including ranking and forecasting
  S2: The same live on Databricks (with a metric view), Snowflake (with a semantic view) and Lakebase, including ranking and forecasting, plus the Databricks job matrix
  S3: In-memory frames (including files read from Amazon S3) with their ranking and forecasting, link prediction, sessions, tabular requests
backends:
- id: duckdb
  what: DuckDB over its JDBC driver
- id: sqlite
  what: SQLite over its JDBC driver
- id: postgres
  what: PostgreSQL over its JDBC driver
- id: databricks-sql
  what: A Databricks SQL warehouse over the Databricks JDBC driver
- id: databricks-metric-view
  what: A Databricks metric view over the same connection
- id: any
  what: Behavior that does not depend on the backend; a case on any backend covers it
operations:
- id: query.validate
  api: null
  layer: core
  modes: [accept, refuse]
  note: Java API not designed yet; named when Java S0 work starts
- id: source.open
  api: null
  layer: host
  modes: [explicit]
  note: Java API not designed yet; named when Java S0 work starts
- id: schema.from-source
  api: null
