  layer: core
  modes: [set-time-column, set-primary-key, set-stype, drop-column, edit-relationships, snapshot]
  note: Java API not designed yet; named when Java S0 work starts
- id: schema.inspect
  api: null
  layer: core
  modes: [attributes, check-consistent]
  note: Java API not designed yet; named when Java S0 work starts
- id: query.materialize
  api: null
  layer: core
  modes: [indices-binary, indices-multiclass, indices-regression]
  note: Java API not designed yet; named when Java S0 work starts
- id: request.inspect
  api: null
  layer: core
  modes: [attributes]
  note: Java API not designed yet; named when Java S0 work starts
- id: client.connect
  api: null
  layer: host
  modes: [url, databricks-serving]
  note: Java API not designed yet; named when Java S0 work starts
- id: client.capabilities
  api: null
  layer: core
  modes: [capabilities]
  note: Java API not designed yet; named when Java S0 work starts
- id: client.predict
  api: null
  layer: core
  modes: &id001 [binary, multiclass, regression]
  note: Java API not designed yet; named when Java S0 work starts
- id: result.read
  api: null
  layer: host
  modes: *id001
  note: Java records; Java API not designed yet; named when Java S0 work starts
- id: result.inspect
  api: null
  layer: core
  modes: [absent, explanation]
  note: Java API not designed yet; named when Java S0 work starts
