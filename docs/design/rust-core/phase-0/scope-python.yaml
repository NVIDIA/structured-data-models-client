# Scope manifest for the Python binding (Phase 0, T0.5).
# Format: scope-format.md; schema: scope.schema.json.
# Built from the plan's decisions 2 and 3 and section 4, and from sdm_client.__all__,
# sdm_connectors.__all__ and sdm_connectors.databricks.__all__ (tests/golden/public_api.json).
# Case lists stay empty until Phase 1a.

format: sdm-scope/1
language: python
slices:
  S0: PQL validation
  S1: Schema from a source, materialize, predict on DuckDB, SQLite and Postgres, offline
  S2: The same live on Databricks (with a metric view), Snowflake (with a semantic view) and Lakebase, plus the Databricks job matrix
  S3: In-memory frames (including files read from Amazon S3), ranking, forecasting, link prediction, sessions, tabular requests
backends:
- id: duckdb
  what: DuckDBSource over a duckdb connection
- id: sqlite
  what: SQLiteSource over an ADBC SQLite connection
- id: postgres
  what: PostgresSource over a psycopg connection to PostgreSQL
- id: lakebase
  what: PostgresSource over a psycopg connection to Lakebase, opened with sdm_connectors.databricks.lakebase
- id: databricks-sql
  what: DatabricksSource over a databricks.sql connection to a SQL warehouse
- id: databricks-spark
  what: DatabricksSource over a notebook's own SparkSession
- id: databricks-metric-view
  what: DatabricksSource.semantic_model over either Databricks connection
- id: snowflake
  what: SnowflakeSource over a snowflake.connector connection or a Snowpark session
- id: snowflake-semantic-view
  what: SnowflakeSource.semantic_model
- id: frames
  what: pandas DataFrames in memory, including frames read from local files or Amazon S3
- id: local-file
  what: 'A local path or file: URI read by sdm_connectors.read'
- id: s3
  what: An s3:// URI read by sdm_connectors.read through s3fs
- id: any
  what: Behavior that does not depend on the backend; a case on any backend covers it
operations:
- id: query.validate
  api: sdm_client.PredictiveQuery, resolved in materialize()
  layer: core
  modes: [accept, refuse]
  note: There is no public validate method today; validation is observed as the resolved query or the refusal materialize() raises before reading data
- id: source.open
  api: sdm_connectors.DuckDBSource, SQLiteSource, PostgresSource, DatabricksSource, SnowflakeSource and Source(connection)
  layer: host
  modes: [explicit, auto]
- id: source.connect-databricks
  api: sdm_connectors.databricks.warehouse and lakebase
  layer: host
  modes: [warehouse, lakebase]
- id: schema.from-source
  api: sdm_client.Schema.from_source
  layer: core
  modes: [tables, catalog-keys, all-tables, semantic-model]
- id: schema.from-data
  api: sdm_client.Schema.from_data and PredictiveQuery(text, mapping of frames)
  layer: core
  modes: [frames, mapping]
- id: schema.construct
  api: sdm_client.Schema, Table, SourceTable, Column, Relationship constructors
  layer: core
  modes: [source-tables, frame-tables]
- id: schema.edit
  api: Attribute setters on Table, SourceTable and Column, del SourceTable[column], Schema.relationships list edits, Schema.snapshot, copy
  layer: core
  modes: [set-time-column, set-primary-key, set-stype, drop-column, edit-relationships, snapshot]
- id: schema.inspect
  api: Schema.tables, Schema[name], Column attributes, check_consistent, repr
  layer: core
  modes: [attributes, check-consistent]
- id: state.pickle
  api: pickle and copy of Schema and Request
  layer: core
  modes: [schema, request, reference-pickle]
  note: 'reference-pickle: a pickle written by the reference loads in the new client (plan section 6, L2)'
- id: query.materialize
  api: sdm_client.PredictiveQuery.materialize
  layer: core
  modes: [indices-binary, indices-multiclass, indices-regression, indices-link-prediction, indices-ranking, indices-forecast, predict-frame]
  note: Options such as anchor_time, num_context_samples, num_neighbors, inference_config and model= are case variants within a mode
- id: request.tabular
  api: sdm_client.Request(context, predict, target=, task=, ...)
  layer: core
  modes: [classification, regression]
- id: request.from-payloads
  api: sdm_client.Request.materialized
  layer: core
  modes: [payloads]
- id: request.inspect
  api: Request.context_rows, predict_rows, payloads, parts, asked, nothing_to_score, is_relational, target_moves_with_time, context, predict
  layer: core
  modes: [attributes]
- id: client.connect
  api: sdm_client.SDMClient(url, ...), SDMClient.for_databricks_serving, close, context manager
  layer: host
  modes: [url, databricks-serving]
- id: client.discover
  api: SDMClient.models, SDMClient.health_ready
  layer: host
  modes: [models, health-ready]
- id: client.capabilities
  api: SDMClient.capabilities, ModelCapabilities
  layer: core
  modes: [capabilities]
- id: client.predict
  api: sdm_client.SDMClient.predict
  layer: core
  modes: [binary, multiclass, regression, link-prediction, ranking, forecast, tabular]
  note: outputs= selection and the model handle are case variants within a mode
- id: client.fit
  api: sdm_client.SDMClient.fit
  layer: core
  modes: [binary, multiclass, regression, tabular]
  note: Refusals of fit for rankings, forecasts and Model Serving endpoints are cases under these modes
- id: fitted.predict
  api: sdm_client.FittedModel.predict
  layer: core
  modes: [binary, multiclass, regression, tabular]
- id: fitted.close
  api: sdm_client.FittedModel.close and context manager
  layer: host
  modes: [close]
- id: result.read
  api: sdm_client.PredictionResult.to_pandas
  layer: host
  modes: [binary, multiclass, regression, link-prediction, ranking, forecast, tabular]
  note: The host renders the layout the core returns; the columns per output set are promised (docs/reference/stability.md)
- id: result.inspect
  api: PredictionResult.absent, explanation, unscored_candidates
  layer: core
  modes: [absent, explanation, unscored-candidates]
- id: result.merge
  api: sdm_client.PredictionResult.merge
  layer: core
  modes: [merge]
- id: connectors.read
  api: sdm_connectors.read
  layer: host
  modes: [csv, parquet]
- id: connectors.read-table
  api: sdm_connectors.read_table
  layer: host
  modes: [table, query]
- id: connectors.quote
  api: sdm_connectors.quote_ident and resolve_sql
  layer: host
  modes: [quote-ident, resolve-sql]
