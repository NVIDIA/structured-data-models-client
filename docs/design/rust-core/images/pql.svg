<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="750" viewBox="0 0 1300 750" font-family="Helvetica, Arial, sans-serif"><defs><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9781c"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9781c"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d72b8"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d72b8"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#666666"/></marker></defs><rect width="1300" height="750" fill="#ffffff"/><text x="650.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">One PQL implementation, used everywhere (target)</text><text x="650.0" y="64" font-size="14" text-anchor="middle" fill="#444">The PQL team owns one C++ core and publishes it as a Rust crate and a Python package; every consumer uses one of those.</text><rect x="30" y="90" width="590" height="440" rx="14" fill="#f7f7f7" stroke="#999999" stroke-width="1.6"/><rect x="70" y="134" width="510" height="90" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="325.0" y="165.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">PQL core (C++)</text><text x="325.0" y="184.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">grammar, parser, validator, error codes and spans,</text><text x="325.0" y="203.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">validated query as versioned JSON</text><rect x="70" y="290" width="240" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="190.0" y="320.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Python package</text><text x="190.0" y="339.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">PyPI</text><rect x="340" y="290" width="240" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="460.0" y="320.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Rust crate</text><text x="460.0" y="339.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">wraps the C++ core</text><rect x="70" y="430" width="510" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="325.0" y="460.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Conformance suite</text><text x="325.0" y="479.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">shared valid and invalid queries, run by every consumer</text><path d="M190,224 L190,290" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M460,224 L460,290" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><rect x="700" y="130" width="260" height="80" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.3"/><text x="830.0" y="156.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Kumo Java</text><text x="830.0" y="175.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">via the C++ core</text><text x="830.0" y="194.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">(when Kumo adopts it)</text><rect x="700" y="272" width="260" height="80" rx="10" fill="#fdf3e6" stroke="#c9781c" stroke-width="1.3"/><text x="830.0" y="307.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">sdm-client Rust core</text><text x="830.0" y="326.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">uses the Rust crate</text><rect x="1020" y="272" width="250" height="80" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.3"/><text x="1145.0" y="307.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">sdm-client</text><text x="1145.0" y="326.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Python and Java</text><rect x="700" y="414" width="260" height="80" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.3"/><text x="830.0" y="449.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Kumo Python</text><text x="830.0" y="468.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">uses the Python package</text><path d="M580,170 L700,170" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M580,325 L700,325" fill="none" stroke="#c9781c" stroke-width="2.2" marker-end="url(#eo)"/><path d="M190,360 L190,395 L640,395 L640,454 L700,454" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M960,312 L1020,312" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><rect x="70" y="574" width="510" height="98" rx="10" fill="#f7f7f7" stroke="#999999" stroke-width="1.3" stroke-dasharray="6,4"/><text x="325.0" y="601.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Until the Rust crate is published</text><text x="325.0" y="619.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">sdm-client uses the first attempt&#x27;s hand-written Rust parser</text><text x="325.0" y="637.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">as an interim parser, held to the shared conformance suite;</text><text x="325.0" y="655.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">today&#x27;s ANTLR grammar stays a CI reference</text><path d="M325,500 L325,574" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" stroke-dasharray="7,5"/><text x="60" y="712" font-size="13" fill="#444">sdm-client adds only model capability checks on top of the validated query.</text><text x="46" y="114" font-size="16" font-weight="bold" fill="#999999" stroke="#f7f7f7" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Shared PQL repository (PQL team)</text><text x="325" y="262" font-size="14" fill="#666666" text-anchor="middle" font-style="italic">published as</text><text x="990" y="302" font-size="14" fill="#666666" text-anchor="middle" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">serves</text><text x="335" y="556" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">same queries</text></svg>
