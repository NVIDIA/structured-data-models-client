<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="740" viewBox="0 0 1300 740" font-family="Helvetica, Arial, sans-serif"><defs><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9781c"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9781c"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d72b8"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d72b8"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#666666"/></marker></defs><rect width="1300" height="740" fill="#ffffff"/><text x="650.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">One PQL implementation, used everywhere (target)</text><text x="650.0" y="64" font-size="14" text-anchor="middle" fill="#444">The grammar, parser and validator live once, in Rust; every consumer uses the same crate.</text><rect x="30" y="90" width="570" height="440" rx="14" fill="#fdf3e6" stroke="#c9781c" stroke-width="1.6"/><rect x="70" y="134" width="490" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="315.0" y="164.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Grammar files</text><text x="315.0" y="183.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">token table for logos, LR(1) grammar for lalrpop</text><rect x="70" y="262" width="490" height="100" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="315.0" y="298.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">pql crate</text><text x="315.0" y="317.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">parser, validator, error codes and spans,</text><text x="315.0" y="336.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">validated query as versioned JSON</text><rect x="70" y="430" width="490" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="315.0" y="460.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Conformance suite</text><text x="315.0" y="479.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">shared valid and invalid queries, run by every consumer</text><path d="M315,204 L315,262" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M315,430 L315,362" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><rect x="700" y="130" width="260" height="80" rx="10" fill="#fdf3e6" stroke="#c9781c" stroke-width="1.3"/><text x="830.0" y="165.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">sdm-client Rust core</text><text x="830.0" y="184.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">direct dependency</text><rect x="1020" y="130" width="250" height="80" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.3"/><text x="1145.0" y="165.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">sdm-client</text><text x="1145.0" y="184.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Python and Java</text><rect x="700" y="266" width="260" height="92" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.3"/><text x="830.0" y="298.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Kumo Python</text><text x="830.0" y="317.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">thin wheel over the crate</text><text x="830.0" y="336.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">(when Kumo adopts it)</text><rect x="700" y="408" width="260" height="92" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.3"/><text x="830.0" y="440.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Kumo Java</text><text x="830.0" y="459.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">thin JNI jar</text><text x="830.0" y="478.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">(when Kumo adopts it)</text><path d="M560,312 L630,312 L630,170 L700,170" fill="none" stroke="#c9781c" stroke-width="2.2" marker-end="url(#eo)"/><path d="M630,312 L700,312" fill="none" stroke="#c9781c" stroke-width="2.2" marker-end="url(#eo)"/><path d="M630,312 L630,454 L700,454" fill="none" stroke="#c9781c" stroke-width="2.2" marker-end="url(#eo)"/><path d="M960,170 L1020,170" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><rect x="70" y="574" width="490" height="98" rx="10" fill="#f7f7f7" stroke="#999999" stroke-width="1.3" stroke-dasharray="6,4"/><text x="315.0" y="592.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">During migration</text><text x="315.0" y="610.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">today&#x27;s ANTLR grammar kept as a CI reference until its</text><text x="315.0" y="628.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">remaining users migrate; the first attempt&#x27;s Rust parser</text><text x="315.0" y="646.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">serves sdm-client as an interim parser until the shared</text><text x="315.0" y="664.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">crate replaces it</text><path d="M315,500 L315,574" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" stroke-dasharray="7,5"/><text x="60" y="712" font-size="13" fill="#444">sdm-client adds only model capability checks on top of the validated query.</text><text x="46" y="114" font-size="16" font-weight="bold" fill="#c9781c" stroke="#fdf3e6" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Shared PQL repository</text><text x="325" y="238" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">builds the parser</text><text x="325" y="401" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">checks</text><text x="990" y="160" font-size="14" fill="#666666" text-anchor="middle" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">serves</text><text x="325" y="556" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">same queries, compared in CI</text></svg>
