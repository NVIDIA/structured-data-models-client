<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1075" viewBox="0 0 1600 1075" font-family="Helvetica, Arial, sans-serif"><defs><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9781c"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9781c"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d72b8"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d72b8"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#666666"/></marker></defs><rect width="1600" height="1075" fill="#ffffff"/><text x="800.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">New plan: one Rust core behind a typed contract</text><text x="800.0" y="64" font-size="14" text-anchor="middle" fill="#444">The core decides what data it needs; each language fetches it, converts it to Arrow, and shows the result its own way.</text><rect x="30" y="86" width="1540" height="118" rx="14" fill="#f7f7f7" stroke="#999999" stroke-width="1.6" stroke-dasharray="8,5"/><rect x="30" y="232" width="1540" height="184" rx="14" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.6"/><rect x="30" y="556" width="1540" height="344" rx="14" fill="#fdf3e6" stroke="#c9781c" stroke-width="1.6"/><rect x="690" y="122" width="260" height="68" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="820.0" y="151.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Model endpoint</text><text x="820.0" y="170.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">NIM or Databricks Model Serving</text><path d="M970,127 A120.0,9 0 0,1 1210,127 L1210,185 A120.0,9 0 0,1 970,185 Z" fill="#ffffff" stroke="#777"/><path d="M970,127 A120.0,9 0 0,0 1210,127" fill="none" stroke="#777"/><text x="1090.0" y="151.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Databases</text><text x="1090.0" y="170.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">Databricks, Snowflake, Postgres, ...</text><rect x="1230" y="122" width="180" height="68" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1320.0" y="151.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Other data sources</text><text x="1320.0" y="170.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">e.g. Pyramid</text><rect x="60" y="278" width="240" height="120" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="180.0" y="316.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">User API</text><text x="180.0" y="334.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Schema.from_source / from_data</text><text x="180.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">PredictiveQuery.materialize,</text><text x="180.0" y="370.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">predict</text><rect x="330" y="278" width="270" height="120" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="465.0" y="316.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Errors and results</text><text x="465.0" y="334.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">maps error kinds to native exceptions;</text><text x="465.0" y="352.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">turns Arrow results into pandas</text><text x="465.0" y="370.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">or Java objects</text><rect x="700" y="278" width="240" height="120" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="820.0" y="333.5" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Model transport</text><text x="820.0" y="352.5" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">HTTP(S)</text><rect x="970" y="278" width="330" height="120" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1135.0" y="305.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Data providers</text><text x="1135.0" y="324.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">SQL connector: runs the core&#x27;s SQL</text><text x="1135.0" y="343.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">with the vendor driver</text><text x="1135.0" y="362.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">custom provider: answers data</text><text x="1135.0" y="381.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">requests itself, e.g. Pyramid</text><rect x="1330" y="278" width="210" height="120" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1435.0" y="307.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Type conversion</text><text x="1435.0" y="325.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">native types to Arrow,</text><text x="1435.0" y="343.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">through a reviewed table:</text><text x="1435.0" y="361.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">pandas in Python,</text><text x="1435.0" y="379.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">JDBC in Java</text><line x1="30" y1="500" x2="1570" y2="500" stroke="#555" stroke-width="1.2" stroke-dasharray="3,3"/><rect x="1090" y="472" width="320" height="56" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="1250.0" y="487.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Typed contract</text><text x="1250.0" y="505.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Arrow types, typed operations, error kinds;</text><text x="1250.0" y="523.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">no calls back into the language</text><rect x="450" y="604" width="150" height="246" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="525.0" y="714.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Core operations</text><text x="525.0" y="732.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">typed operations,</text><text x="525.0" y="750.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">run loop</text><rect x="60" y="604" width="360" height="100" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="240.0" y="640.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">PQL</text><text x="240.0" y="659.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">from the PQL team&#x27;s Rust crate (C++ core):</text><text x="240.0" y="678.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">parser, validator, error codes</text><rect x="60" y="750" width="360" height="100" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="240.0" y="805.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Labels</text><rect x="740" y="604" width="200" height="100" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="840.0" y="641.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Request builder</text><text x="840.0" y="659.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">payload, response,</text><text x="840.0" y="677.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">result</text><rect x="970" y="604" width="570" height="100" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1255.0" y="640.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Data access</text><text x="1255.0" y="659.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">typed data requests; built-in SQL dialects compile them to SQL;</text><text x="1255.0" y="678.0" font-size="14" font-weight="normal" text-anchor="middle" fill="#222">capability flags; in-memory fallback</text><rect x="970" y="750" width="250" height="100" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1095.0" y="787.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Schema inference</text><text x="1095.0" y="805.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">keys, time columns, links,</text><text x="1095.0" y="823.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">over typed Arrow</text><rect x="1260" y="750" width="280" height="100" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1400.0" y="787.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Sampling</text><text x="1400.0" y="805.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">plan, neighbor sampler,</text><text x="1400.0" y="823.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">random streams</text><path d="M840,278 L840,190" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" marker-start="url(#sg)"/><path d="M1090,278 L1090,194" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" marker-start="url(#sg)"/><path d="M1260,278 L1260,190" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" marker-start="url(#sg)"/><path d="M1300,338 L1330,338" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M180,398 L180,450 L490,450 L490,604" fill="none" stroke="#3d72b8" stroke-width="2.2" marker-end="url(#eb)"/><path d="M575,604 L575,398" fill="none" stroke="#c9781c" stroke-width="2.2" marker-end="url(#eo)"/><path d="M1050,604 L1050,398" fill="none" stroke="#c9781c" stroke-width="2.8" marker-end="url(#eo)"/><path d="M1440,398 L1440,604" fill="none" stroke="#3d72b8" stroke-width="2.8" marker-end="url(#eb)"/><path d="M450,654 L420,654" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M450,800 L420,800" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M525,850 L525,878 L1400,878 L1400,850" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M1095,878 L1095,850" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M1095,750 L1095,704" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" marker-start="url(#sg)"/><path d="M1400,750 L1400,704" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" marker-start="url(#sg)"/><path d="M600,640 L740,640" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M740,680 L600,680" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M780,604 L780,398" fill="none" stroke="#c9781c" stroke-width="2.2" marker-end="url(#eo)"/><path d="M900,398 L900,604" fill="none" stroke="#3d72b8" stroke-width="2.2" marker-end="url(#eb)"/><text x="60" y="928" font-size="13" fill="#444">Steps 2 and 3 repeat per table and per sampling hop.</text><text x="60" y="966" font-size="15" font-weight="bold" fill="#222">Example: who handles what</text><rect x="60" y="980" width="480" height="66" rx="10" fill="#fdf3e6" stroke="#c9781c" stroke-width="1.3"/><text x="300.0" y="1000.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Rust core</text><text x="300.0" y="1018.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">writes Databricks SQL, or a typed data request</text><text x="300.0" y="1036.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">for a swapped-in data layer</text><rect x="570" y="980" width="470" height="66" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.3"/><text x="805.0" y="1009.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Python</text><text x="805.0" y="1027.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">runs it with databricks-sql-connector or Spark</text><rect x="1070" y="980" width="470" height="66" rx="10" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.3"/><text x="1305.0" y="1000.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Java</text><text x="1305.0" y="1018.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">runs it with the Databricks JDBC driver,</text><text x="1305.0" y="1036.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">or a custom data provider (e.g. Pyramid)</text><text x="46" y="110" font-size="16" font-weight="bold" fill="#999999" stroke="#f7f7f7" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Outside sdm-client</text><text x="46" y="256" font-size="16" font-weight="bold" fill="#3d72b8" stroke="#eaf2fc" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Python and Java: every query and network call happens here</text><text x="46" y="580" font-size="16" font-weight="bold" fill="#c9781c" stroke="#fdf3e6" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Rust core: shared logic, no database or network access</text><text x="848" y="224" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">HTTP(S)</text><text x="1098" y="224" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">SQL, rows</text><text x="1268" y="224" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">its own API</text><text x="192" y="442" font-size="14" fill="#3d72b8" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">1  query, Arrow tables</text><text x="583" y="532" font-size="14" fill="#c9781c" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">7  typed result</text><text x="1058" y="444" font-size="14" fill="#c9781c" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">2  SQL, or a typed request</text><text x="1432" y="444" font-size="14" fill="#3d72b8" text-anchor="end" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">3  rows as Arrow</text><text x="1103" y="732" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">catalog</text><text x="1408" y="732" font-size="14" fill="#666666" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">data for each hop</text><text x="670" y="630" font-size="14" fill="#666666" text-anchor="middle" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">4  samples, labels</text><text x="670" y="670" font-size="14" fill="#666666" text-anchor="middle" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">result</text><text x="788" y="444" font-size="14" fill="#c9781c" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">5  request</text><text x="908" y="444" font-size="14" fill="#3d72b8" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">6  response</text></svg>
