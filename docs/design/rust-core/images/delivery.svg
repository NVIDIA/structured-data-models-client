<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="620" viewBox="0 0 1740 620" font-family="Helvetica, Arial, sans-serif"><defs><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9781c"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9781c"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d72b8"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d72b8"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#666666"/></marker></defs><rect width="1740" height="620" fill="#ffffff"/><text x="870.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">Delivery: slices through the public API</text><text x="870.0" y="64" font-size="14" text-anchor="middle" fill="#444">Each slice goes from the public API down to the core and merges into the epic branch at its gate.</text><rect x="245" y="106" width="1160" height="240" rx="14" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.6"/><rect x="60" y="148" width="170" height="170" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="145.0" y="193.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Phase 0 Prepare</text><text x="145.0" y="211.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">reference environment</text><text x="145.0" y="229.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">in its own worktree;</text><text x="145.0" y="247.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">bank the first attempt&#x27;s</text><text x="145.0" y="265.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">best candidate;</text><text x="145.0" y="283.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">the epic branch (rust-core)</text><rect x="260" y="148" width="170" height="170" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="345.0" y="202.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Phase 1a Harness</text><text x="345.0" y="220.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">contract, test runners,</text><text x="345.0" y="238.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">CI guards, installed wheel;</text><text x="345.0" y="256.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">S0 PQL validation</text><text x="345.0" y="274.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">in Python</text><rect x="460" y="148" width="170" height="170" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="545.0" y="202.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Phase 1b Spike</text><text x="545.0" y="220.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">fixed case inventory</text><text x="545.0" y="238.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">on DuckDB, in Python</text><text x="545.0" y="256.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">and a pure-Rust</text><text x="545.0" y="274.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">test host</text><rect x="820" y="148" width="170" height="170" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="905.0" y="193.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Phase 2</text><text x="905.0" y="211.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">S1 offline warehouses</text><text x="905.0" y="229.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">DuckDB, SQLite, Postgres;</text><text x="905.0" y="247.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">sample data provider;</text><text x="905.0" y="265.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">swappable data layer</text><text x="905.0" y="283.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">proof</text><rect x="1020" y="148" width="170" height="170" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1105.0" y="175.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Phase 3</text><text x="1105.0" y="193.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">S2 live warehouses</text><text x="1105.0" y="211.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Databricks, Snowflake,</text><text x="1105.0" y="229.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Lakebase;</text><text x="1105.0" y="247.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Python switches</text><text x="1105.0" y="265.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">warehouse paths;</text><text x="1105.0" y="283.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Java follows</text><text x="1105.0" y="301.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">on Databricks</text><rect x="1220" y="148" width="170" height="170" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1305.0" y="202.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Phase 4</text><text x="1305.0" y="220.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">S3</text><text x="1305.0" y="238.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">in-memory frames,</text><text x="1305.0" y="256.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">ranking, forecasting,</text><text x="1305.0" y="274.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">sessions</text><rect x="1450" y="148" width="170" height="170" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1535.0" y="220.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Phase 5 Release</text><text x="1535.0" y="238.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">PQL crate,</text><text x="1535.0" y="256.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">delete old engine</text><path d="M725.0,188 L795,233.0 L725.0,278 L655,233.0 Z" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="725.0" y="229.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">owner decides</text><text x="725.0" y="246.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">go / no-go</text><text x="725" y="302" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">go: merge Phase 1a</text><text x="725" y="319" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">and Phase 1b into epic</text><path d="M230,233 L260,233" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M430,233 L460,233" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M630,233 L655,233" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M795,233 L820,233" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M990,233 L1020,233" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M1190,233 L1220,233" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M1390,233 L1450,233" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><line x1="60" y1="394" x2="1620" y2="394" stroke="#666666" stroke-width="4"/><text x="60" y="384" font-size="14" font-weight="bold" fill="#666666">epic branch (rust-core)</text><text x="60" y="418" font-size="13" fill="#444">main stays pure Python and is merged into the epic at each slice gate; the epic merges into main only when the owner decides</text><path d="M807,233 L807,391" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="807" cy="233" r="4.5" fill="#c9781c"/><text x="814" y="372" font-size="12" fill="#c9781c">merge into epic</text><path d="M1005,233 L1005,391" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1005" cy="233" r="4.5" fill="#c9781c"/><text x="1012" y="372" font-size="12" fill="#c9781c">merge into epic</text><path d="M1205,233 L1205,391" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1205" cy="233" r="4.5" fill="#c9781c"/><text x="1212" y="372" font-size="12" fill="#c9781c">merge into epic</text><path d="M1420,233 L1420,391" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1420" cy="233" r="4.5" fill="#c9781c"/><text x="1427" y="372" font-size="12" fill="#c9781c">merge into epic</text><path d="M1535,318 L1535,391" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1535" cy="318" r="4.5" fill="#c9781c"/><text x="1542" y="372" font-size="12" fill="#c9781c">owner merges epic into main</text><rect x="30" y="450" width="1680" height="130" rx="14" fill="#f7f7f7" stroke="#999999" stroke-width="1.6"/><rect x="60" y="490" width="530" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="325.0" y="512.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Every PR</text><text x="325.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">unit, boundary guards, contract subset,</text><text x="325.0" y="548.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">SQL goldens, provider kit, conversion tables</text><rect x="620" y="490" width="500" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="870.0" y="512.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Nightly</text><text x="870.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">full contract corpus, differential vs reference,</text><text x="870.0" y="548.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">offline performance</text><rect x="1150" y="490" width="530" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1415.0" y="512.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Weekly and before release</text><text x="1415.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">weekly: live matrix</text><text x="1415.0" y="548.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">before release: all layers, packaging and safety</text><text x="261" y="130" font-size="16" font-weight="bold" fill="#3d72b8" stroke="#eaf2fc" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Python leads every slice; Java follows on the same contract cases (Java: DuckDB, SQLite, Postgres, Databricks)</text><text x="46" y="474" font-size="16" font-weight="bold" fill="#999999" stroke="#f7f7f7" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Checks that run all along</text></svg>
