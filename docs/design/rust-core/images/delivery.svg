1.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">attempt&#x27;s best</text><text x="140.0" y="309.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">candidate</text><rect x="250" y="198" width="160" height="140" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="330.0" y="246.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">R1a Harness</text><text x="330.0" y="264.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">contract, test runners,</text><text x="330.0" y="282.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">CI guards;</text><text x="330.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">S0 PQL validation</text><rect x="440" y="198" width="160" height="140" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="520.0" y="246.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">R1b Spike</text><text x="520.0" y="264.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">DuckDB from_source</text><text x="520.0" y="282.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">to predict in</text><text x="520.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">both languages</text><rect x="790" y="198" width="160" height="140" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="870.0" y="246.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">R2</text><text x="870.0" y="264.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">S1 offline warehouses</text><text x="870.0" y="282.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">DuckDB, SQLite,</text><text x="870.0" y="300.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Postgres</text><rect x="980" y="198" width="160" height="140" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.