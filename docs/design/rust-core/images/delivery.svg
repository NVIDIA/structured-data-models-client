le" fill="#222">go / no-go</text><text x="695" y="334" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">go: merge R1a</text><text x="695" y="351" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">and R1b to main</text><path d="M220,268 L250,268" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M410,268 L440,268" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M600,268 L625,268" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M765,268 L790,268" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M950,268 L980,268" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M1140,268 L1170,268" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M1330,268 L1410,268" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><line x1="60" y1="414" x2="1570" y2="414" stroke="#666666" stroke-width="4"/><text x="60" y="404" font-size="14" font-weight="bold" fill="#666666">main</text><path d="M777,268 L777,411" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="777" cy="268" r="4.5" fill="#c9781c"/><text x="784" y="392" font-size="12" fill="#c9781c">merge to main</text><path d="M965,268 L965,411" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="965" cy="268" r="4.5" fill="#c9781c"/><text x="972" y="392" font-size="12" fill="#c9781c">merge to main</text><path d="M1155,268 L1155,411" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1155" cy="268" r="4.5" fill="#c9781c"/><text x="1162" y="392" font-size="12" fill="#c9781c">merge to main</text><path d="M1355,268 L1355,411" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1355" cy="268" r="4.5" fill="#c9781c"/><text x="1362" y="392" font-size="12" fill="#c9781c">merge to main</text><path d="M1490,338 L1490,411" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1490" cy="338" r="4.5" fill="#c9781c"/><text x="1497" y="392" font-size="12" fill="#c9781c">merge to main (release)</text><path d="M1155,268 L1155,118 L1210,118" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" stroke-dasharray="7,5"/><rect x="1210" y="92" width="240" height="52" rx="10" fill="#f7f7f7" stroke="#999999" stroke-width="1.3" stroke-dasharray="6,4"/><text x="1330.0" y="114.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Pyramid provider</text><text x="1330.0" y="132.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">(if in scope)</text><rect x="30" y="450" width="1600" height="130" rx="14" fill="#f7f7f7" stroke="#999999" stroke-width="1.6"/><rect x="60" y="490" width="510" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="315.0" y="512.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Every PR</text><text x="315.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">unit, boundary guards, contract subset,</text><text x="315.0" y="548.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">SQL goldens, provider kit, conversion tables</text><rect x="600" y="490" width="480" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="840.0" y="512.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Nightly</text><text x="840.0" y="530.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">full contract corpus, differential vs old release,</text><text x="840.0" y="548.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">performance</text><rect x="1110" y="490" width="490" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1355.0" y="512.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222