ght="normal" text-anchor="middle" fill="#222">sample Java</text><text x="905.0" y="259.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">data provider</text><rect x="1020" y="148" width="170" height="140" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1105.0" y="169.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">R3</text><text x="1105.0" y="187.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">S2 live warehouses</text><text x="1105.0" y="205.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Databricks, Snowflake,</text><text x="1105.0" y="223.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Lakebase</text><text x="1105.0" y="241.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">(Java: Databricks);</text><text x="1105.0" y="259.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Python switches</text><text x="1105.0" y="277.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">warehouse paths</text><rect x="1220" y="148" width="170" height="140" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1305.0" y="187.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">R4</text><text x="1305.0" y="205.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">S3</text><text x="1305.0" y="223.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">in-memory frames,</text><text x="1305.0" y="241.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">ranking, forecasting,</text><text x="1305.0" y="259.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">sessions</text><rect x="1450" y="148" width="170" height="140" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1535.0" y="205.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">R5 Release</text><text x="1535.0" y="223.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">PQL crate,</text><text x="1535.0" y="241.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">delete old engine</text><path d="M725.0,173 L795,218.0 L725.0,263 L655,218.0 Z" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="725.0" y="214.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">owner decides</text><text x="725.0" y="231.5" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">go / no-go</text><text x="725" y="284" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">go: merge R1a</text><text x="725" y="301" font-size="12" font-weight="normal" text-anchor="middle" fill="#222">and R1b to main</text><path d="M230,218 L260,218" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M430,218 L460,218" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M630,218 L655,218" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M795,218 L820,218" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M990,218 L1020,218" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M1190,218 L1220,218" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><path d="M1390,218 L1450,218" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)"/><line x1="60" y1="364" x2="1620" y2="364" stroke="#666666" stroke-width="4"/><text x="60" y="354" font-size="14" font-weight="bold" fill="#666666">main</text><path d="M807,218 L807,361" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="807" cy="218" r="4.5" fill="#c9781c"/><text x="814" y="342" font-size="12" fill="#c9781c">merge to main</text><path d="M1005,218 L1005,361" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1005" cy="218" r="4.5" fill="#c9781c"/><text x="1012" y="342" font-size="12" fill="#c9781c">merge to main</text><path d="M1205,218 L1205,361" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1205" cy="218" r="4.5" fill="#c9781c"/><text x="1212" y="342" font-size="12" fill="#c9781c">merge to main</text><path d="M1420,218 L1420,361" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1420" cy="218" r="4.5" fill="#c9781c"/><text x="1427" y="342" font-size="12" fill="#c9781c">merge to main</text><path d="M1535,288 L1535,361" fill="none" stroke="#c9781c" stroke-width="2" marker-end="url(#eo)"/><circle cx="1535" cy="288" r="4.5" fill="#c9781c"/><text x="1542" y="342" font-size="12" fill="#c9781c">merge to main (release)</text><rect x="30" y="400" width="1660" height="130" rx="14" fill="#f7f7f7" stroke="#999999" stroke-width="1.6"/><rect x="60" y="440" width="530" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="325.0" y="462.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Every PR</text><text x="325.0" y="480.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">unit, boundary guards, contract subset,</text><text x="325.0" y="498.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">SQL goldens, provider kit, conversion tables</text><rect x="620" y="440" width="500" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="870.0" y="462.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Nightly</text><text x="870.0" y="480.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">full contract corpus, differential vs old release,</text><text x="870.0" y="498.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">performance</text><rect x="1150" y="440" width="510" height="70" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="1405.0" y="462.0" font-size="13" font-weight="bold" text-anc