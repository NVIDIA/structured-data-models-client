<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="710" viewBox="0 0 1300 710" font-family="Helvetica, Arial, sans-serif"><defs><marker id="eo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c9781c"/></marker><marker id="so" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9781c"/></marker><marker id="eb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3d72b8"/></marker><marker id="sb" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3d72b8"/></marker><marker id="eg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker><marker id="sg" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#666666"/></marker></defs><rect width="1300" height="710" fill="#ffffff"/><text x="650.0" y="38" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">Bindings: standard tools per language, over one shared Rust layer</text><text x="650.0" y="64" font-size="14" text-anchor="middle" fill="#444">The core is plain Rust and never knows who loads it; the boundary logic is written once in sdm-host.</text><rect x="30" y="90" width="910" height="156" rx="14" fill="#eaf2fc" stroke="#3d72b8" stroke-width="1.6"/><rect x="60" y="136" width="270" height="90" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="195.0" y="168.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Python</text><text x="195.0" y="186.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">PyO3 binding (sdm-py),</text><text x="195.0" y="204.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">abi3 wheels built with maturin</text><rect x="350" y="136" width="270" height="90" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="485.0" y="159.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Java</text><text x="485.0" y="177.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">jni-rs binding (sdm-jni), loaded</text><text x="485.0" y="195.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">from the JAR (JDK 17 and 21);</text><text x="485.0" y="213.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">follows Python</text><rect x="640" y="136" width="270" height="90" rx="10" fill="#ffffff" stroke="#aaaaaa" stroke-width="1.3" stroke-dasharray="6,4"/><text x="775.0" y="168.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Future languages</text><text x="775.0" y="186.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">without a Rust binding tool:</text><text x="775.0" y="204.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">a C interface on top of sdm-host</text><rect x="60" y="310" width="850" height="100" rx="10" fill="#ffffff" stroke="#555" stroke-width="1.3"/><text x="485.0" y="338.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">sdm-host (plain Rust, written once)</text><text x="485.0" y="356.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">run protocol; versioned JSON messages;</text><text x="485.0" y="374.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Arrow streams (zero-copy, Arrow C Data Interface);</text><text x="485.0" y="392.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">catches panics; error kinds; threading rules</text><rect x="30" y="480" width="910" height="186" rx="14" fill="#fdf3e6" stroke="#c9781c" stroke-width="1.6"/><rect x="60.0" y="520" width="197.5" height="52" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="158.75" y="551.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Data access</text><rect x="277.5" y="520" width="197.5" height="52" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="376.25" y="551.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Schema</text><rect x="495.0" y="520" width="197.5" height="52" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="593.75" y="551.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Sampling</text><rect x="712.5" y="520" width="197.5" height="52" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="811.25" y="551.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Contract</text><rect x="60" y="588" width="197.5" height="56" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="158.75" y="621.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Labels</text><rect x="277.5" y="588" width="197.5" height="56" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="376.25" y="621.0" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">Request builder</text><rect x="495.0" y="588" width="415.0" height="56" rx="10" fill="#ffffff" stroke="#777" stroke-width="1.3"/><text x="702.5" y="612.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">PQL</text><text x="702.5" y="630.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">the PQL team&#x27;s Rust crate over its C++ core</text><path d="M120,226 L120,310" fill="none" stroke="#3d72b8" stroke-width="2.2" marker-end="url(#eb)"/><path d="M400,226 L400,310" fill="none" stroke="#3d72b8" stroke-width="2.2" marker-end="url(#eb)"/><path d="M775,226 L775,310" fill="none" stroke="#666666" stroke-width="2.2" marker-end="url(#eg)" stroke-dasharray="7,5"/><path d="M811,410 L811,520" fill="none" stroke="#c9781c" stroke-width="2.2" marker-end="url(#eo)"/><path d="M948,136 L960,136 L960,666 L948,666" fill="none" stroke="#999999" stroke-width="1.6"/><line x1="960" y1="401" x2="990" y2="401" stroke="#999999" stroke-width="1.6"/><rect x="990" y="306" width="280" height="190" rx="10" fill="#f7f7f7" stroke="#999999" stroke-width="1.3"/><text x="1130.0" y="352.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">Native libraries</text><text x="1130.0" y="370.0" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">per platform</text><text x="1130.0" y="388.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">Linux x86_64 and aarch64, macOS;</text><text x="1130.0" y="406.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">one in the wheel, one in the JAR,</text><text x="1130.0" y="424.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">same sources;</text><text x="1130.0" y="442.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">PQL&#x27;s C++ linked in</text><text x="1130.0" y="460.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#222">with private symbols</text><text x="46" y="114" font-size="16" font-weight="bold" fill="#3d72b8" stroke="#eaf2fc" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Each language</text><text x="46" y="504" font-size="16" font-weight="bold" fill="#c9781c" stroke="#fdf3e6" stroke-width="6" stroke-linejoin="round" paint-order="stroke">Rust core (plain Rust, no unsafe)</text><text x="128" y="274" font-size="14" fill="#3d72b8" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">Python objects, Arrow via PyCapsule</text><text x="408" y="274" font-size="14" fill="#3d72b8" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">Java objects, Arrow via Arrow Java C Data</text><text x="819" y="450" font-size="14" fill="#c9781c" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" paint-order="stroke">Rust calls</text></svg>
