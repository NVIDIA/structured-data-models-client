# Phase 2's locked acceptance checks (design.md, "Locked acceptance checks"),
# as scripts/rust_core/gate.sh --locked 2a reads them from the judging
# harness's tree. The half lists the 52 S1 cases, each run on DuckDB, SQLite
# and Postgres (decision KO2-19); its steps beyond the runners, observations,
# ratchet, compare, coverage, l0 and l1 every locked run makes; and its
# numbered checks that the gate judges, with the steps each holds (12 is the
# every check). Under the owner's KO2-76 the census, coverage-s1, l3, l7
# and ci steps left the gate, with the L7 limits and CI job patterns they
# read: the census, coverage, L3 and L7 are end-of-phase reports read by
# both reviewers, and the CI-green parts of checks 1, 3, 4, 5, 8 and 10 are
# judged by land.py's exact-SHA rule. So checks 3, 4, 5, 6, 8 and 11, like
# check 9 (the held-out run), are judged outside the gate, and checks 1, 2
# and 10 keep only their gate steps here. Protected by the
# phase-*/locked-set.yaml glob in contract/protected-paths.txt: a change
# lands under its trailer, and a further change to the checks is the owner's.
format: sdm-locked-set/1
halves:
  2a:
    cases:
      - base.adventureworks
      - base.adventureworks.churn
      - base.adventureworks.color
      - base.binary
      - base.multiclass
      - base.regression
      - decimal.class-target-38-18
      - decimal.feature-38-0-wide
      - decimal.target-38-18
      - edit.accepted-meaning-key-links
      - edit.key-missing-column
      - edit.key-time-column
      - edit.leave-out-the-key
      - edit.link-not-the-key
      - edit.meaning-not-carried
      - edit.meaning-unknown
      - edit.time-column-not-a-time
      - edit.time-column-text
      - empty.entity-without-facts
      - empty.fact-table
      - empty.indices
      - feature.bool
      - key.decimal-18-0
      - key.decimal-38-10
      - key.declared-int32
      - key.hugeint
      - key.uint64-above-int64-max
      - key.uint64-small
      - key.uint8
      - key.varchar
      - key.varchar-large-buffers
      - nested.fixed-array
      - nested.list-int
      - nested.map
      - nested.struct
      - nested.union
      - null.feature-all-null
      - null.some-foreign-keys
      - null.some-times
      - null.target-all-null
      - refuse.unknown-column
      - time.date
      - time.feature-date-and-timestamp-with-null
      - time.feature-interval
      - time.feature-time-of-day
      - time.text-declared
      - time.text-iso-date
      - time.text-one-bad-value
      - time.text-us-date
      - time.timestamp-ns
      - time.timestamp-s
      - time.timestamptz
    steps: [inventory, seeded, main]
    checks:
      '1': [runners, observations, ratchet, compare, coverage, l1, inventory]
      '2': [ratchet]
      '7': [ratchet, main]
      '10': [l0, seeded]
    every: '12'
