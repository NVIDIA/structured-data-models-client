# The comparator's policy (design, "Observations and comparator"), read by
# scripts/rust_core/compare.py and contract/runners/capture_check.py, the one
# place each comparison rule says whether it gates and each exclusion is
# written. From T1.11e, the payload and result rules (decision H9 for
# statements, E35 for the one exclusion). From T1.14, the projection the
# baselines hold (`baseline`), and the checkpoint's ratchet
# (scripts/rust_core/ratchet.py) reads this file at the checkpoint and at the
# candidate: a removed rule, a gate made diagnostic, an added or changed
# exclusion, a statement dropped from `ordered`, a case dropped from `reach`
# or its stage changed, or a field dropped from `baseline` is a relaxation,
# which passes only when `relaxations` lists it, word for word as the ratchet
# prints it, under a row of the checkpoint's decisions.md whose status reads
# "approved by owner <date>" and which names this file (design, "Reference
# observations and the gate"; H2). Adding or tightening a rule passes.
#
# A rule that gates fails the comparison on any difference in an acceptance
# case; in a diagnostic case every rule only reports (design, "Merge rules"),
# except `reach` for the cases it names. A diagnostic rule always only
# reports. The comparator refuses a policy naming a rule it does not run, or
# leaving out one it runs.

format: sdm-compare-policy/1

rules:
  # The outcome rules of T1.10: the outcome, stage, class and code, against
  # the case's expectation and the reference; the core's answer as the route
  # maps it; the route proof; the inputs the core runners record.
  outcome: gate
  route: gate
  inputs: gate
  # A case the policy names under `reach` reaches its result on every runner,
  # gating while the case is diagnostic (design, "Merge rules": reaching
  # base.regression's result gates from T1.11e).
  reach: gate
  # Python runners against the reference (host fields, acquisition point the
  # public call): the public Schema, warning classes in order, and the
  # result through to_pandas() (columns and dtypes, row count, and the rows'
  # digest in order: predict's result is one row per requested row, in the
  # request's order, which the operation defines).
  schema: gate
  warnings: gate
  result: gate
  # Each request the scripted endpoint received, against the reference's,
  # parsed, every number compared as its kind (an integer or a float token)
  # and its exact decimal value, under `exclusions`; on rust-host, the call
  # the core wrote (core.predicted.body), the payload it would send, against
  # the reference's request; on python-core, the call the core wrote against
  # the request the endpoint received. The raw body's SHA-256 is integrity
  # only and is not compared.
  payload: gate
  # The two core runners on core fields: the step trace, the description,
  # the request state, the call and the result (each float as its bits), the
  # error, the contract version.
  core: gate
  # Decision H9, against the reference, per public call (stage): the number
  # of statements (setup excluded); and each statement's result, its columns,
  # DuckDB's type names (where both runners read them from a Python driver),
  # its Arrow schema (where both read Arrow) and its rows in canonical form,
  # in order only for the statements `ordered` names, otherwise as a
  # multiset; between the two core runners, each statement's result likewise.
  # A runner whose record of what ran is missing or incomplete fails these.
  sql.count: gate
  sql.result: gate
  # Also H9: the reference's raw SQL text, typed parameters and the relations
  # bound (bindings) are reported, never gated. The core's own text is pinned
  # by the step trace between the core runners (`core`) and, from T1.30, by
  # the DuckDB goldens.
  sql.text: diagnostic
  sql.parameters: diagnostic
  sql.bindings: diagnostic

# Values left out of a comparison. Each is value only: the field must be
# present in both or absent in both, with a value of the same JSON type. Each
# names its decision, whose status must read "approved by owner".
exclusions:
  - id: request-id
    decision: E35
    status: approved by owner 2026-10-10
    # A prediction payload: each request the scripted endpoint received
    # (public.payloads[].parsed) and the call the core wrote
    # (core.predicted.body). The client draws the request id at random for
    # every request.
    in: payload
    path: [metadata, request_id]
    keeps: [presence, type]

# Statements whose rows the comparison holds in order: a total ORDER BY, by
# case, public call and position within it (from 0), each with the reason
# its order is total. Every other statement's rows are compared as a
# multiset.
ordered:
  base.regression:
    # The reference's _by_fkey, the sixth statement of materialize: ORDER BY
    # the batch, CAST(ts AS TIMESTAMP) descending and order_id, the key the
    # schema infers for orders, which is unique in the shop base, so the
    # order is total; the core's neighbors request with per_seed and its
    # TieBreak asks the same order, NULLS LAST (design, "Data access").
    materialize: [5]

# Diagnostic cases whose reaching their result gates, by the stage the result
# is reached at.
reach:
  base.regression: predict

# The projection each baseline holds (contract/baselines/<cell>/<runner>.jsonl,
# design "Reference observations and the gate"), by field path: the outcome,
# platform-independent, so CI ratchets it in every cell (S0 validity and
# codes; on the core runners the code is the core's, by the `outcome` rule).
# A field a runner cannot observe (contract/availability.yaml) is null in
# its projection, never filled. The other fields are held to the committed
# reference observations by this file's rules, not baselined.
baseline: [outcome.result, outcome.stage, outcome.error, outcome.code]

# The one sampled Snowflake case (the owner's "2026-10-22 evening: Snowflake
# sampling, option C"): the core keeps the old client's unseeded
# `SAMPLE ROW (n ROWS)`, so the rows a sample draws differ from run to run.
# On its leg the case's comparison holds only the sampling statement (at the
# reference call `stage`, position `statement`: a unique exact SQL and
# typed-parameter match in the same core call, ignoring only outer SQL
# whitespace, reads as many rows as the reference's) and the result's row
# count, besides the outcome, the route, the inputs, the schema and the
# warnings; every other difference
# there is reported. Each entry is {leg, stage, statement, decision}, and
# contract/runners/capture_check.py holds the section to the owner's approval
# (APPROVED_SAMPLED: one case, on Snowflake). The case and its entry come with
# the Snowflake package's cases.
sampled:
  snowflake.sampled.entity-table:
    leg: snowflake
    stage: materialize
    statement: 3
    decision: '2026-10-22 evening: Snowflake sampling, option C'

# The relaxations of this file the owner approved, each {change, decision}:
# the change as the ratchet prints it, and the decisions.md row, at the
# checkpoint, that approves it.
relaxations:
  - change: sampled snowflake.sampled.entity-table added
    decision: KO3-63
