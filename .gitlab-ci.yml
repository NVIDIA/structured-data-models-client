# Every job here is offline and fast. Nothing reaches a NIM, a warehouse, or a
# package index beyond the wheels it installs.
#
# The one exception is `contract`, which clones the canonical contract at the
# exact revision this repository's bindings were generated from. That job is
# blocking, because bindings that do not match the contract are bindings that
# will misread a response. `contract-drift` watches the
# contract's HEAD instead and is advisory: upstream moving is news, not a
# broken build.

default:
  image: python:3.12-slim
  interruptible: true

stages:
  - lint
  - test

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"
  # PIP_INDEX_URL and CONTRACT_PROJECT are project variables. The contract
  # jobs skip themselves when CONTRACT_PROJECT is unset.

.python:
  before_script:
    - python -V
    - pip install -q --upgrade pip

lint:
  stage: lint
  extends: .python
  script:
    - pip install -q ruff==0.16.*
    - ruff check .
    - ruff format --check .

# Blocking. Five distributions ship `py.typed`, which tells every downstream
# user's type checker to trust these annotations. Nothing verified them, so the
# promise was only as good as the last person who happened to look. The modules
# that do not pass yet are listed in the root pyproject with the count they
# carried the day this job was added; the list can only shrink.
typecheck:
  stage: lint
  extends: .python
  script:
    - pip install -q mypy
    - pip install -q -e './packages/structured-data-models-api' -e './packages/structured-data-models-pql' -e './packages/structured-data-models-client' -e './packages/structured-data-models-connectors[sqlite,duckdb,postgres,snowflake,databricks]'
    # Every session a source takes too, so each driver's types are its own
    # rather than Any. pyspark-client is pyspark's Python without its jars.
    - pip install -q snowflake-snowpark-python pyspark-client
    # The engine needs its runtime deps present to be checked at all, and a
    # toolchain to install. It ships py.typed exactly like the other four,
    # so leaving it out made the gate narrower than the promise.
    - apt-get update -qq && apt-get install -y -qq build-essential cmake git
    - pip install -q -e './packages/structured-data-models-relational-engine'
    - mypy packages/structured-data-models-api/src packages/structured-data-models-pql/src packages/structured-data-models-client/src packages/structured-data-models-connectors/src packages/structured-data-models-relational-engine/src
    # What a caller's type checker infers for a source, and what it refuses.
    - mypy packages/structured-data-models-connectors/tests/typing/check_sources.py

hygiene:
  stage: lint
  extends: .python
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - python scripts/check_repo_hygiene.py all  # spdx, internal refs, retired APIs
    # The third-party attribution is generated; this reads no network.
    - python scripts/mermaid_notices.py --check

test:
  stage: test
  extends: .python
  # A real server for the connector's own PostgreSQL reads, which only a
  # PostgreSQL can show end their transaction. As in `engine`, a missing DSN
  # or driver fails here rather than skipping.
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: sdm_test
    POSTGRES_PASSWORD: postgres
    PGPASSWORD: postgres
    SDM_POSTGRES_TEST_DSN: postgresql://postgres@postgres:5432/sdm_test
    SDM_REQUIRE_POSTGRES: "1"
  script:
    # databricks, snowflake and s3 are here for their drivers, not for a
    # server: those tests mock the connection. Without the drivers, importing
    # the backend raises and every test that covers them skips, including the
    # ones holding the partner identifier Databricks requires on every
    # connection.
    - pip install -q -e './packages/structured-data-models-api[test]' -e './packages/structured-data-models-pql[test]' -e './packages/structured-data-models-client[test]' -e './packages/structured-data-models-connectors[sqlite,duckdb,postgres,databricks,snowflake,s3,test]'
    # ruff is here for tests/, not for linting: the test that checks the
    # engine's ignore-list note shells out to ruff and skips without it,
    # which made the check vacuous in the only job that runs root tests/.
    - pip install -q pytest-cov 'ruff==0.16.*'
    # `tests/` at the root holds what no single package can check: that the five
    # agree on a version and a licence, that the public surface and the wire
    # payloads still match what was recorded, and that the claims the config
    # files make about themselves are true.
    #
    # Live tests are deselected: this job reaches no NIM and no warehouse. The
    # relational engine is a native build and is tested in its own job.
    - python -m pytest packages/structured-data-models-api/tests packages/structured-data-models-pql/tests packages/structured-data-models-client/tests packages/structured-data-models-connectors/tests tests -q -m 'not live_nim and not live_warehouse' --cov --cov-report=term --cov-report=xml
  coverage: '/^TOTAL.+?(\d+\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week

# The engine builds a C++ extension, so it needs a toolchain the pure-python
# jobs do not. It is tested from its own directory because some of its tests
# read paths relative to the working directory.
engine:
  stage: test
  extends: .python
  # A real server for the PostgreSQL backend, whose sampler is SQL that only a
  # PostgreSQL can say it accepts. SDM_REQUIRE_POSTGRES turns a missing DSN or
  # driver into a failure here, where a skip would read as a pass.
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: sdm_test
    POSTGRES_PASSWORD: postgres
    PGPASSWORD: postgres
    SDM_POSTGRES_TEST_DSN: postgresql://postgres@postgres:5432/sdm_test
    SDM_REQUIRE_POSTGRES: "1"
  script:
    - apt-get update -qq && apt-get install -y -qq build-essential cmake git
    # The Databricks and Snowflake drivers are here for the offline tests of
    # those backends, which import the driver and skipped whole modules without
    # it: eleven of them, fakes included, ran nowhere. Taken through
    # structured-data-models-connectors, which is where the driver is declared.
    # pyyaml is what the semantic-view tests read their fixtures with.
    - pip install -q -e './packages/structured-data-models-api' -e './packages/structured-data-models-pql' -e './packages/structured-data-models-connectors[sqlite,duckdb,databricks,snowflake,postgres]' pyyaml
    # The test extra, not a hand-written list beside it: naming these twice
    # is how the documented install came to be missing pytest-mock while this
    # job had it. `explain` carries the SDK that the explanation tests fake
    # around; without it those skipped too.
    - pip install -q -e './packages/structured-data-models-relational-engine[test,explain]'
    # The live NIM and live warehouse tests need credentials this job does not
    # have, so they are deselected by name rather than left to skip. A skip
    # that remains is a test that checked its own environment and stood down,
    # and is reported.
    - cd packages/structured-data-models-relational-engine && python -m pytest tests -q -m 'not live_nim and not live_warehouse'
    # The client's suite again, with an engine present. The `test` job does
    # not install one, so every client test that needs the engine skips there
    # and runs nowhere; a change to how a request is routed then breaks them
    # unseen. Running the whole suite rather than a name filter, because the
    # next such test will not be named like the current ones.
    - cd "$CI_PROJECT_DIR"
    - pip install -q -e './packages/structured-data-models-client[test]'
    - pip install -q 'ruff==0.16.*'
    - python -m pytest packages/structured-data-models-client/tests -q -m 'not live_nim and not live_warehouse'
    # And root tests/ again, with the engine present. The `test` job runs them
    # without one, and the wire-payload snapshot deliberately excludes the
    # relational case when the engine cannot build it, so that case was
    # recorded and then compared nowhere. Here it is compared.
    - python -m pytest tests -q

# Each distribution is built the way an index would build it: in an isolated
# environment holding only the build backend, with none of the runtime
# dependencies installed. This catches what no test can, because it fails
# before a test could run: `project.version` resolved through the package root
# imports that root, which imports pandas, and the wheel cannot be produced at
# all. Only a real build exercises that path.
build:
  stage: test
  extends: .python
  script:
    - apt-get update -qq && apt-get install -y -qq build-essential cmake git
    - pip install -q build
    - |
      for package in structured-data-models-api structured-data-models-pql structured-data-models-client structured-data-models-connectors structured-data-models-relational-engine; do
        echo "building $package"
        ( cd "packages/$package" && python -m build --wheel --outdir "$CI_PROJECT_DIR/dist" . )
      done
    - ls -1 dist/
    # Every distribution carries the one version they are released together
    # at. Read from what was just built rather than written here, so a version
    # bump does not fail the next step for the wrong reason.
    - |
      python - <<'EOF'
      import pathlib, re, sys
      names = sorted(p.name for p in pathlib.Path('dist').glob('*.whl'))
      versions = {re.match(r'[^-]+-([^-]+)-', n).group(1) for n in names}
      print('\n'.join(names))
      if len(names) != 5:
          sys.exit(f'expected 5 wheels, built {len(names)}')
      if len(versions) != 1:
          sys.exit(f'distributions disagree on the version: {sorted(versions)}')
      pathlib.Path('dist/VERSION').write_text(versions.pop())
      EOF
    # Building each one proves nothing about installing them together. A pin
    # that only one distribution carries makes the set unsatisfiable, and the
    # resolver is the only thing that says so.
    - |
      VERSION=$(cat dist/VERSION)
      pip install --dry-run --find-links "$CI_PROJECT_DIR/dist" \
        "structured-data-models-client[relational,sqlite,duckdb]==$VERSION"
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# The engine's Linux wheels, every interpreter and architecture it claims, from
# the same `[tool.cibuildwheel]` table the release workflow reads. The `build`
# job's single wheel proves the five install together; it is tagged for the
# runner that built it and installs nowhere else, and Databricks serverless
# runs on aarch64 as often as on x86-64.
#
# No arm64 runner serves this project, so aarch64 is built under QEMU, at four
# to five minutes a wheel. One of the two runners stops any job at 13m20s
# whatever the job asks for, and all four aarch64 wheels in one job passed or
# failed by which runner took it. Each aarch64 interpreter is its own job, so
# every job fits under that ceiling on either runner.
.wheel-rules: &wheel-rules
  # Branch pipelines only, like every other job here. Without the first rule,
  # `changes` also matches in merge-request pipelines, which then run these
  # jobs alone beside the branch pipeline and build the whole matrix twice.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - changes:
        - packages/**/*
        - pyproject.toml
        - .gitlab-ci.yml
    - when: manual
      allow_failure: true

wheels:
  stage: test
  extends: .python
  <<: *wheel-rules
  services:
    - name: docker:29.0.0-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # Into the manylinux container too. cibuildwheel prepends passed variables
    # to the `environment` pyproject sets, so PIP_FIND_LINKS still applies.
    CIBW_ENVIRONMENT_PASS_LINUX: PIP_INDEX_URL
  parallel:
    matrix:
      - CIBW_ARCHS_LINUX: x86_64
        CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
      - CIBW_ARCHS_LINUX: aarch64
        CIBW_BUILD: [cp310-*, cp311-*, cp312-*, cp313-*, cp314-*]
  script:
    - apt-get update -qq && apt-get install -y -qq docker.io
    - for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
    - docker info --format '{{.Architecture}} {{.ServerVersion}}'
    # Pinned by digest: it runs privileged, so a moved tag must not change what runs.
    # The pull is retried because Docker Hub has reset it mid-transfer.
    - |
      if [ "$CIBW_ARCHS_LINUX" = aarch64 ]; then
        binfmt=tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0  # qemu-v10.2.3
        for attempt in 1 2 3; do
          docker pull -q "$binfmt" && break
          if [ "$attempt" = 3 ]; then echo "pulling $binfmt failed 3 times" >&2; exit 1; fi
          sleep $((attempt * 15))
        done
        docker run --rm --privileged "$binfmt" --install arm64
      fi
    - pip install -q build 'cibuildwheel==4.3.0'
    # The engine's smoke test installs it against these, which exist nowhere
    # but here until a release; `[tool.cibuildwheel.linux]` points pip at them.
    - |
      for package in structured-data-models-api structured-data-models-pql structured-data-models-client structured-data-models-connectors; do
        ( cd "packages/$package" && python -m build --wheel --outdir "$CI_PROJECT_DIR/_sibling_wheels" . )
      done
    - cibuildwheel --platform linux packages/structured-data-models-relational-engine --output-dir dist
    - cp _sibling_wheels/*.whl dist/
  artifacts:
    paths:
      - dist/
    expire_in: 1 month

# Every wheel the jobs above built, gathered, and held to the set the engine
# claims: a job that built nothing, or the wrong interpreter, fails here rather
# than reaching an install as a missing wheel.
wheels-check:
  stage: test
  extends: .python
  <<: *wheel-rules
  needs: [wheels]
  script:
    - |
      python - <<'EOF'
      import pathlib, re, sys
      names = sorted(p.name for p in pathlib.Path('dist').glob('*.whl'))
      print('\n'.join(names))
      engine = re.compile(
          r'structured_data_models_relational_engine-[^-]+-(cp3\d+)-cp3\d+-.*_(x86_64|aarch64)\.whl$'
      )
      built = set()
      for name in names:
          match = engine.match(name)
          if match:
              built.add(match.groups())
      expected = {
          (f'cp3{minor}', arch)
          for minor in (10, 11, 12, 13, 14)
          for arch in ('x86_64', 'aarch64')
      }
      if built != expected:
          sys.exit(f'engine wheels missing: {sorted(expected - built)}')
      if len(names) != len(built) + 4:
          sys.exit('expected exactly the four pure-Python wheels beside the engine')
      versions = {re.match(r'[^-]+-([^-]+)-', n).group(1) for n in names}
      if len(versions) != 1:
          sys.exit(f'distributions disagree on the version: {sorted(versions)}')
      EOF
  artifacts:
    paths:
      - dist/
    expire_in: 1 month

# The suite has only ever run against the source tree. What users install is a
# wheel, and the difference is exactly where packaging bugs live: a module left
# out of `packages.find`, a data file not declared, a `py.typed` that never
# shipped. This runs the tests from a directory where the source tree is not
# importable, so an import that only worked because of the checkout fails here.
installed-wheel:
  stage: test
  extends: .python
  needs: ["build"]
  script:
    - pip install -q pytest requests-mock pytest-cov
    - VERSION=$(cat dist/VERSION)
    - pip install -q --find-links "$CI_PROJECT_DIR/dist" "structured-data-models-client[sqlite,duckdb]==$VERSION"
    # Prove the installed distribution, not the checkout, is what is imported,
    # and that the typed marker survived the build. Written as one script that
    # raises, rather than a chain ending in `|| true`: a check that cannot fail
    # is worse than no check, because it reads like one that passed.
    - cd /tmp
    - |
      python - <<'EOF'
      import pathlib
      import predictive_query, sdm_api, sdm_client, sdm_connectors

      for module in (sdm_api, sdm_client, sdm_connectors, predictive_query):
          location = pathlib.Path(module.__file__).resolve()
          assert 'site-packages' in location.parts, (
              f'{module.__name__} was imported from {location}, not from the '
              f'installed wheel, so this job is testing the checkout again'
          )
          marker = location.parent / 'py.typed'
          assert marker.is_file(), (
              f'{module.__name__} ships no py.typed in the built wheel, so a '
              f'downstream type checker ignores its annotations entirely'
          )
      print('four distributions imported from site-packages, all typed')
      EOF
    - python -m pytest "$CI_PROJECT_DIR/packages/structured-data-models-client/tests" -q -m 'not live_nim and not live_warehouse' -p no:cacheprovider

# Advisory. A known vulnerability in a dependency is news the moment it is
# published, not at the next release, but it is not a reason to fail a merge
# request that did not cause it.
audit:
  stage: test
  extends: .python
  allow_failure: true
  script:
    - pip install -q pip-audit
    # snowflake is audited too: this release holds that driver below 5, so a
    # finding against the 4 series is one the pin keeps us on.
    - pip install -q -e './packages/structured-data-models-api' -e './packages/structured-data-models-pql' -e './packages/structured-data-models-client' -e './packages/structured-data-models-connectors[sqlite,duckdb,postgres,databricks,snowflake]'
    # `oauthlib` 4.0.0 fixes CVE-2026-49265 and `databricks-sql-connector`
    # pins `oauthlib<4.0.0`, so the fix cannot be installed. It is ignored so
    # that a red result still means a new finding. The check below fails when
    # the pin is relaxed, so the ignore cannot outlive its reason.
    - |
      python - <<'EOF'
      from importlib.metadata import requires
      from packaging.requirements import Requirement
      from packaging.version import Version
      import sys

      for raw in requires('databricks-sql-connector') or []:
          requirement = Requirement(raw)
          if requirement.name != 'oauthlib':
              continue
          if requirement.specifier.contains(Version('4.0.0')):
              sys.exit(
                  f'databricks-sql-connector now allows oauthlib 4.0.0 ({raw}). '
                  f'Drop --ignore-vuln CVE-2026-49265 and let the fix install.'
              )
          print(f'oauthlib fix still blocked upstream by {raw}')
          break
      else:
          sys.exit('databricks-sql-connector no longer requires oauthlib; '
                   'recheck whether the ignore below is still needed')
      EOF
    - pip-audit --progress-spinner off --ignore-vuln CVE-2026-49265

# The dependency inventory a consumer needs to accept this into their own
# supply chain, covering the base install and every extra that resolves without
# a native toolchain. Attached to the build so a release always has one.
sbom:
  stage: test
  extends: .python
  needs: ["build"]
  script:
    - pip install -q cyclonedx-bom
    - VERSION=$(cat dist/VERSION)
    - pip install -q --find-links "$CI_PROJECT_DIR/dist"
        "structured-data-models-client[sqlite,duckdb,postgres,databricks,snowflake,s3]==$VERSION"
    - cyclonedx-py environment --of JSON --validate -o "$CI_PROJECT_DIR/dist/sbom.cyclonedx.json"
    - python -c "import json,sys; d=json.load(open('dist/sbom.cyclonedx.json'));
        names={c['name'] for c in d.get('components', [])};
        missing={'structured-data-models-client','structured-data-models-api','structured-data-models-pql','structured-data-models-connectors'} - names;
        print(f'{len(names)} components');
        sys.exit(f'SBOM missing {sorted(missing)}' if missing else 0)"
  artifacts:
    paths:
      - dist/sbom.cyclonedx.json
    expire_in: 1 month

# Blocking. Fetches the contract at the revision recorded in PROVENANCE.json,
# proves the recorded digest is that revision's actual bytes, and proves the
# generated file is exactly what the generator produces from it. A hand-edited
# binding, a doctored provenance record, or a stale regeneration all fail here.
contract:
  stage: test
  extends: .python
  rules:
    - if: $CONTRACT_PROJECT
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -q pyyaml
    - pip install -q -e './packages/structured-data-models-api[test]'
    - REVISION=$(python -c "import json;print(json.load(open('packages/structured-data-models-api/src/sdm_api/generated/PROVENANCE.json'))['source_revision'])")
    # Quoted whole: an unquoted ': ' makes YAML read the step as a mapping,
    # which fails the whole pipeline before a job starts.
    - 'echo "contract revision: $REVISION"'
    - git clone -q "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CONTRACT_PROJECT}.git" /tmp/contract
    - git -C /tmp/contract checkout -q "$REVISION"
    - python scripts/check_contract_pin.py --contract /tmp/contract/nim-sd.openapi.yaml
    - python scripts/generate_sdm_api.py --spec /tmp/contract/nim-sd.openapi.yaml --output packages/structured-data-models-api/src/sdm_api/generated/tfm_api.py --check
    - python scripts/generate_sdm_api.py --spec /tmp/contract/nim-sd.openapi.yaml --output packages/structured-data-models-api/src/sdm_api/generated/tfm_api.py --validate-contract
    - python scripts/check_wire_payloads.py --contract /tmp/contract/nim-sd.openapi.yaml
    # The checks on the checker. They need the spec, which only this job has,
    # so running them with the suite would skip every one of them.
    - SDM_CONTRACT_SPEC=/tmp/contract/nim-sd.openapi.yaml python -m pytest tests/test_release_contract.py -q -k TestTheRequestBodiesAreContractual

# Advisory. The contract moving forward is something to know about, not a
# reason to fail an unrelated change.
contract-drift:
  stage: test
  extends: .python
  allow_failure: true
  rules:
    - if: $CONTRACT_PROJECT
  script:
    - apt-get update -qq && apt-get install -y -qq git
    - pip install -q pyyaml
    - pip install -q -e './packages/structured-data-models-api[test]'
    - git clone -q --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CONTRACT_PROJECT}.git" /tmp/contract-head
    - python scripts/generate_sdm_api.py --spec /tmp/contract-head/nim-sd.openapi.yaml --output packages/structured-data-models-api/src/sdm_api/generated/tfm_api.py --check
