# Secret-scanner allowlist, read by nSpect's Pulse scan at the repository root.
#
# Every entry below is a placeholder credential in a test, a fixture or a CI
# service definition, not a secret. Most of them exist precisely because this
# client redacts credentials before they reach a log or an error: the tests
# assert the redaction by feeding it a URL with a password in it. The scanner
# cannot tell that apart from a real one, and has verified none of them against
# a live service.
#
# Every host named below is `localhost`, a literal `host`, an RFC 2606 reserved
# example domain, or an account that does not exist. Nothing here can be
# rotated, because nothing here was ever issued.
#
# **The paths are historical on purpose.** The scan reads the repository's
# history, not just its current tree, so entries remain for files that have
# since been renamed or deleted: the package directories were renamed, `qa/`
# is gone, and the credential-shaped literals themselves were replaced with
# interpolated constants. A scan of the current tree finds nothing at all.
# Removing an entry because its file no longer exists puts the finding
# straight back.
#
# Each value is listed in both maskings a report may use, since a value that
# does not match the one the scanner prints suppresses nothing.
#
# Generated from a scan rather than edited by hand, and never extended with an
# entry for a credential that is real. A real one is rotated and removed.

version = "1.0.0"

