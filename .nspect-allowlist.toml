# Secret-scanner allowlist, read by nSpect's Pulse scan at the repository root.
#
# **Nothing in this file is suppressing anything today, and that is expected.**
# Pulse runs `pulse-secret-scanner filesystem /repo`, so it scans the checked
# out tree and not the repository's history. The tree is clean: the same engine
# finds nothing in it. The entries below are kept so that a value which was
# once flagged, and which is a placeholder rather than a credential, is already
# accounted for if it reappears or if the scan's scope ever changes. They are
# not the fix for a finding that is already recorded in nSpect; a recorded
# finding is cleared by triaging it there.
#
# Every entry is a placeholder credential in a test, a docstring example, a
# fixture or a CI service definition. Most exist precisely because this client
# redacts credentials before they reach a log or an error: the tests assert the
# redaction by feeding it a URL with a password in it, and the docstrings show
# the same. The scanner cannot tell that apart from a real one, and has
# verified none of them against a live service.
#
# Every host named below is `localhost`, `127.0.0.1`, a literal `host`, an
# RFC 2606 reserved example domain, the `postgres` service alias this
# repository's CI defines, or an account that does not exist. The one Postgres
# value is the password that CI service definition assigns to an ephemeral
# container, so it is real for the lifetime of a job and worthless outside one.
# Nothing here grants access to anything that outlives a pipeline.
#
# The paths include names the tree no longer uses, because the entries were
# generated from a scan that reached further back than the current tree: the
# package directories were renamed and `qa/` is gone. Harmless, and cheaper to
# keep than to prune by hand.
#
# Generated from a scan rather than edited by hand, and never extended with an
# entry for a credential that is real. A real one is rotated and removed.

version = "1.0.0"

[[pulse-trufflehog.files]]
file = ".gitlab-ci.yml"
  [[pulse-trufflehog.files.secrets]]
  type   = "Postgres"
  values = [
            "pos*************************************5432",
            "postgresql://postgres:********@postgres:5432"]

