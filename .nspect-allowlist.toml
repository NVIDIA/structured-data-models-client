# Secret-scanner allowlist, read by nSpect's Pulse scan at the repository root.
#
# Every entry below is a placeholder credential in a test or an example, not a
# secret. Most of them exist precisely because this client redacts credentials
# before they reach a log or an error: the tests assert the redaction by
# feeding it a URL with a password in it. The scanner cannot tell that apart
# from a real one, and verified none of them against a live service.
#
# Each value is listed in both maskings a report may use, since a value that
# does not match the one the scanner prints suppresses nothing.
#
# Regenerate after a scan rather than editing by hand, and never add an entry
# for a credential that is real. A real one is rotated and removed.

version = "1.0.0"

[[pulse-trufflehog.files]]
file = "packages/structured-data-models-client/src/sdm_client/core/transport.py"
  [[pulse-trufflehog.files.secrets]]
  type   = "URI"
  values = ["htt****************host",
           "http://user:********@host",
           "https://user:********@host/path"]

