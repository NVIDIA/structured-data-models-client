# What `cargo deny check licenses bans` holds every dependency to.
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html

[graph]
all-features = true

[licenses]
# Only licences that the ASF puts in category A: a binary distributed under
# Apache-2.0 can include them without imposing further terms. A dependency
# under anything else fails the audit until someone decides about it. Only
# the licences some dependency uses are listed, so the list says what ships.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.93

[licenses.private]
# The workspace's own crates are Apache-2.0 like the rest of the repository,
# and are checked like any dependency.
ignore = false

[bans]
# Two versions of one crate is weight, not a licence problem; it is reported.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
