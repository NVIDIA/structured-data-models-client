[package]
name = "sdm-testkit"
description = "Dev-only: the case loader, the pure-Rust test host and the scripted endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sdm-contract = { path = "../sdm-contract" }
sdm-host = { path = "../sdm-host" }
anyhow.workspace = true
# The Postgres replay (KO2-20): a recorded answer is an Arrow IPC stream
# in base64 text.
arrow-ipc.workspace = true
base64.workspace = true
# vtab-arrow: the Arrow table function a key set is bound through, as the
# provider binds a key set (a relation of the attachment's rows); it adds
# the num crates to the test host only.
duckdb = { workspace = true, features = ["vtab-arrow"] }
serde.workspace = true
# raw_value, to read an entity key's integer literal of any size as its
# digits; it only adds `RawValue`, changing no other reading.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true

[dev-dependencies]
# The test-only fetch, which echoes what the core admitted, for the
# provider's tests.
sdm-host = { path = "../sdm-host", features = ["test-ops"] }
# The labels' test reads the test-only labels operation's Arrow batch.
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-select.workspace = true

# Not the workspace lints: unsafe code is denied rather than forbidden, so the
# Arrow FFI sites can allow it locally.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
