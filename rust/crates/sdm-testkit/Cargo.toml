[package]
name = "sdm-testkit"
description = "Dev-only: the case loader, the pure-Rust test host and the scripted endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
sdm-contract = { path = "../sdm-contract" }
sdm-host = { path = "../sdm-host" }
anyhow.workspace = true
duckdb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# Not the workspace lints: unsafe code is denied rather than forbidden, so the
# Arrow FFI sites can allow it locally.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
