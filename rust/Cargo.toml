# The Rust core of sdm-client: one crate per part of the pipeline, ported from
# Python phase by phase, and the bindings each language loads it through.
[workspace]
resolver = "2"
members = ["crates/*", "bindings/python"]

[workspace.package]
# Released with sdm-client, at its version: sdm-client requires sdm-core at
# exactly the version it carries itself.
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/NVIDIA/structured-data-models-client"
publish = false

[workspace.dependencies]
arrow-array = { version = "60", default-features = false, features = ["ffi"] }
arrow-buffer = "60"
arrow-data = "60"
arrow-ipc = { version = "60", default-features = false }
arrow-schema = "60"
arrow-pyarrow = "60"
arrow-select = "60"
getrandom = "0.3"
indexmap = { version = "2", features = ["serde"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "unbounded_depth"] }
sha2 = "0.10"
stacker = "0.1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
