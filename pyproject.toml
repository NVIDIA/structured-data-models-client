# Workspace root for the sdm-client monorepo. This builds no package; each
# independently released distribution lives under packages/ with its own
# pyproject.toml:
#
#   packages/sdm-client            - the public client SDK (pure python)
#   packages/sdm-api               - Universal TFM wire types (pure python)
#   packages/sdm-pql               - the Predictive Query Language (pure python)
#   packages/sdm-connectors        - shared data-source connectors (pure python)
#   packages/sdm-relational-engine - the relational driver (native build)
#
# This file carries only shared tooling configuration. Each package's
# [tool.ruff] extends this file, so the lint baseline below applies to every
# first-party tree and a package cannot drop rules by shadowing the block.

[tool.ruff]
line-length = 80
target-version = "py310"
# Vendored trees are upstream's bytes. Linting them here would invite a fix
# that silently forks them; see packages/sdm-pql/SOURCE.md.
# The generated bindings are the generator's output, and their bytes are
# recorded in PROVENANCE.json. Letting the formatter rewrite them would break
# that record on every run.
extend-exclude = [
    "packages/sdm-pql/src/predictive_query",
    "packages/sdm-api/src/sdm_api/generated/tfm_api.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "single"

# Registered here as well as per package, so that running the whole workspace
# from the repository root neither warns about unknown marks nor silently
# selects a test that opens a socket.
[tool.pytest.ini_options]
markers = [
    "live_nim: needs a running NIM",
    "live_warehouse: needs a real Snowflake or Databricks warehouse",
    "socket: binds a local socket; deselect where that is not permitted",
    "gpu: needs a CUDA GPU",
]
