# Static analysis, in its own workflow rather than in `ci.yml`.
#
# `ci.yml` is the set of gates a change has to pass, and `publish.yml` refuses
# to build a tag whose CI run did not succeed. What would land in that contract
# is not the findings, which GitHub reports as a separate `Code scanning
# results` check, but this job's own failures: an extraction, build, query or
# upload error. Some are caused by source changes and others by the service. Mixing
# the second kind into the release gate is what this avoids.
#
# The weekly run does not bring new queries. Pinning the action by digest pins
# the CodeQL bundle with it, so the query set changes when dependabot raises
# that digest, and merging it scans on push anyway. What the schedule is for is
# narrower: a default branch that has not been touched in a month still carries
# a recent scan, and a workflow that has quietly stopped working says so
# without waiting for the next pull request.
#
# Results need GitHub code scanning, which needs Advanced Security while this
# repository is internal and is included once it is public.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday, off the hour: scheduled runs queue behind everyone else's at the
    # boundary, and GitHub drops them under load.
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # the only reason this job exists: to upload
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python APIs, host adapters and connectors.
          - language: python
            build-mode: none
          # Compile the shipped Java sources with their actual Maven dependencies.
          - language: java-kotlin
            build-mode: manual
          # The Rust core, the client's native module, read from the tree.
          - language: rust
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          db-location: ${{ runner.temp }}/codeql-databases
          # security-extended over the default pack: it adds queries of lower
          # precision and lower severity, so it finds more and is wrong more
          # often. This is a library other people install, and that trade buys
          # coverage with our triage rather than with their incident.
          queries: security-extended

      # Compile only: no tests, JNI loading, native build or model endpoint.
      # clean prevents incremental compilation from hiding sources from the tracer.
      - name: Extract all shipped Java sources
        if: matrix.language == 'java-kotlin'
        run: mvn --batch-mode --no-transfer-progress -f java/pom.xml clean compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

      - name: Verify Java extraction coverage
        if: matrix.language == 'java-kotlin'
        run: python scripts/check_codeql_java.py "$RUNNER_TEMP/codeql-databases/java/src.zip"
