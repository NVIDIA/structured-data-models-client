# Static analysis, in its own workflow rather than in `ci.yml`.
#
# `ci.yml` is the set of gates a change has to pass, and the release workflow
# refuses to build a tag whose CI run did not succeed. Static analysis does not
# belong in that contract: a new query released upstream can turn a commit that
# passed yesterday into a failure today, with nothing in this repository having
# changed. Keeping it separate means a finding is triaged rather than
# immediately blocking a release.
#
# It also needs a weekly run, which `ci.yml` has no reason to have. Most of
# what this catches arrives from the query packs rather than from the code.
#
# Results need GitHub code scanning, which needs Advanced Security while this
# repository is internal and is included for public repositories. Until one of
# those is true the analysis runs and the upload is refused.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 07:00 UTC, away from the hour boundary where everyone else queues.
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write   # the only reason this job exists: to upload
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The four pure-Python distributions and the engine's Python half.
          - language: python
            build-mode: none
          # The engine's compiled sampler. Small, but it is the only memory
          # unsafe code shipped, so it is the part worth a compiled analysis.
          - language: c-cpp
            build-mode: manual

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended over the default pack. This is a library other
          # people install, so the extra precision costs us triage and saves
          # them an incident.
          queries: security-extended

      # CodeQL observes a real compilation rather than guessing at one, so the
      # engine is actually built here. Only this matrix leg compiles anything;
      # the Python leg reads the tree.
      #
      # `--no-deps` because the engine pins its four siblings by exact version
      # and those versions are not on PyPI until the release publishes, so
      # resolving them fails outright. `ci.yml` works around that by installing
      # the siblings from the tree first, which this job has no use for: the
      # dependencies are never imported, and what CodeQL needs is the compiler
      # running over `csrc/`. Build requirements still install, because those
      # come from `[build-system] requires` and pip's build isolation, which
      # `--no-deps` does not touch.
      - name: Build the engine for CodeQL
        if: matrix.build-mode == 'manual'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake
          python -m pip install --upgrade pip
          python -m pip install --no-deps ./packages/structured-data-models-relational-engine

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
