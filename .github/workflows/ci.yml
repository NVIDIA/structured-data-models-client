            git fetch --quiet origin +refs/heads/rust-core:refs/remotes/origin/rust-core
          fi
          where=$(python3 scripts/rust_core/ratchet.py where)
          [ -n "$where" ] || { echo "$GITHUB_REF_NAME is under rust-core-phase- but is no phase branch"; exit 1; }
