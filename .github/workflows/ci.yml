# Every gate a change has to pass, run where a contributor can see it.
#
# One gate is not here: the contract check reads the canonical OpenAPI spec
# from where it is maintained, which a fork cannot reach. The generated
# bindings are pinned by SHA-256 in PROVENANCE.json either way, and a drifted
# copy fails the build it ships in.
name: CI

# CI is off the landing path (the owner's "2026-10-22 evening: CI off the
# landing path"): a package lands on its handoff stamp and two reviews, so
# no push to a phase branch, lane or topic runs this workflow. main and the
# epic branch rust-core still run it on every push, as before. Each phase
# head runs the full matrix nightly, with fresh dependencies: the
# `nightly` job below, on the schedule (which GitHub runs from the default
# branch's copy of this file), dispatches this workflow on the head of
# every rust-core-phase-N branch; until this file reaches the default
# branch the orchestrator's watchdog (watchdog.py --dispatch) dispatches it
# the same way. A dispatch (workflow_dispatch) runs every job on the ref
# it names, and nothing waits on it: a red nightly is a fix item the
# watchdog writes. The full matrix stays the phase-end gate. Every phase
# alike (T2.0): no phase is named here.
on:
  pull_request:
  push:
    branches:
      - main
      - rust-core
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      fresh:
        description: 'Resolve dependencies fresh (the nightly): cargo update before the Rust jobs build'
        type: boolean
        default: true

permissions:
  contents: read
  # For the images CI pulls from ghcr.io with GITHUB_TOKEN (E131).
  packages: read
  # For the landing job's skip step, which reads the candidate's runs
  # (E131).
  actions: read

# A newer push cancels the run in progress on the same branch, a topic's
# or a lane's (T3.0): a lane carries one package at a time (lane.py), so
# its newer push is that package's newer candidate, and the run of the
# commit it replaced is evidence for nothing; Phase 2 left 4,208 minutes
# of runs superseded this way running. On the phase branch a run in
# progress is not cancelled: each push there lands one package, and the
# phase check must judge every one. A run still queued there can be:
# GitHub keeps one pending run per group, and a newer push supersedes it.
# land.py refuses a candidate whose newest run was cancelled, and land.py
# verify asks for a rerun rather than a revert. Every phase alike (T2.0),
# with no phase named: an expression has no pattern match, so a phase
# branch is a name under rust-core-phase- whose rest is a number with no
# leading zero, read as: not empty; no "phase-0" but at its end; no
# character that the prefix lacks and a number never holds (b, d, ..., z,
# a dot, "_", "/"); and no character the prefix holds (a letter of it, or
# "-") first after it or after a digit (OF-7). Actions compares names
# ignoring case, so a name in capitals is let through; the phase check's
# condition reads the phase branch alike, and fails by name on a name
# this lets through that is no phase branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(startsWith(github.ref_name, 'rust-core-phase-') && !endsWith(github.ref_name, 'core-phase-') && !(contains(github.ref_name, 'phase-0') && !endsWith(github.ref_name, 'core-phase-0')) && !(contains(github.ref_name, 'b') || contains(github.ref_name, 'd') || contains(github.ref_name, 'f') || contains(github.ref_name, 'g') || contains(github.ref_name, 'i') || contains(github.ref_name, 'j') || contains(github.ref_name, 'k') || contains(github.ref_name, 'l') || contains(github.ref_name, 'm') || contains(github.ref_name, 'n') || contains(github.ref_name, 'q') || contains(github.ref_name, 'v') || contains(github.ref_name, 'w') || contains(github.ref_name, 'x') || contains(github.ref_name, 'y') || contains(github.ref_name, 'z') || contains(github.ref_name, '.') || contains(github.ref_name, '_') || contains(github.ref_name, '/') || startsWith(github.ref_name, 'rust-core-phase--') || startsWith(github.ref_name, 'rust-core-phase-a') || startsWith(github.ref_name, 'rust-core-phase-c') || startsWith(github.ref_name, 'rust-core-phase-e') || startsWith(github.ref_name, 'rust-core-phase-h') || startsWith(github.ref_name, 'rust-core-phase-o') || startsWith(github.ref_name, 'rust-core-phase-p') || startsWith(github.ref_name, 'rust-core-phase-r') || startsWith(github.ref_name, 'rust-core-phase-s') || startsWith(github.ref_name, 'rust-core-phase-t') || startsWith(github.ref_name, 'rust-core-phase-u') || contains(github.ref_name, '0-') || contains(github.ref_name, '0a') || contains(github.ref_name, '0c') || contains(github.ref_name, '0e') || contains(github.ref_name, '0h') || contains(github.ref_name, '0o') || contains(github.ref_name, '0p') || contains(github.ref_name, '0r') || contains(github.ref_name, '0s') || contains(github.ref_name, '0t') || contains(github.ref_name, '0u') || contains(github.ref_name, '1-') || contains(github.ref_name, '1a') || contains(github.ref_name, '1c') || contains(github.ref_name, '1e') || contains(github.ref_name, '1h') || contains(github.ref_name, '1o') || contains(github.ref_name, '1p') || contains(github.ref_name, '1r') || contains(github.ref_name, '1s') || contains(github.ref_name, '1t') || contains(github.ref_name, '1u') || contains(github.ref_name, '2-') || contains(github.ref_name, '2a') || contains(github.ref_name, '2c') || contains(github.ref_name, '2e') || contains(github.ref_name, '2h') || contains(github.ref_name, '2o') || contains(github.ref_name, '2p') || contains(github.ref_name, '2r') || contains(github.ref_name, '2s') || contains(github.ref_name, '2t') || contains(github.ref_name, '2u') || contains(github.ref_name, '3-') || contains(github.ref_name, '3a') || contains(github.ref_name, '3c') || contains(github.ref_name, '3e') || contains(github.ref_name, '3h') || contains(github.ref_name, '3o') || contains(github.ref_name, '3p') || contains(github.ref_name, '3r') || contains(github.ref_name, '3s') || contains(github.ref_name, '3t') || contains(github.ref_name, '3u') || contains(github.ref_name, '4-') || contains(github.ref_name, '4a') || contains(github.ref_name, '4c') || contains(github.ref_name, '4e') || contains(github.ref_name, '4h') || contains(github.ref_name, '4o') || contains(github.ref_name, '4p') || contains(github.ref_name, '4r') || contains(github.ref_name, '4s') || contains(github.ref_name, '4t') || contains(github.ref_name, '4u') || contains(github.ref_name, '5-') || contains(github.ref_name, '5a') || contains(github.ref_name, '5c') || contains(github.ref_name, '5e') || contains(github.ref_name, '5h') || contains(github.ref_name, '5o') || contains(github.ref_name, '5p') || contains(github.ref_name, '5r') || contains(github.ref_name, '5s') || contains(github.ref_name, '5t') || contains(github.ref_name, '5u') || contains(github.ref_name, '6-') || contains(github.ref_name, '6a') || contains(github.ref_name, '6c') || contains(github.ref_name, '6e') || contains(github.ref_name, '6h') || contains(github.ref_name, '6o') || contains(github.ref_name, '6p') || contains(github.ref_name, '6r') || contains(github.ref_name, '6s') || contains(github.ref_name, '6t') || contains(github.ref_name, '6u') || contains(github.ref_name, '7-') || contains(github.ref_name, '7a') || contains(github.ref_name, '7c') || contains(github.ref_name, '7e') || contains(github.ref_name, '7h') || contains(github.ref_name, '7o') || contains(github.ref_name, '7p') || contains(github.ref_name, '7r') || contains(github.ref_name, '7s') || contains(github.ref_name, '7t') || contains(github.ref_name, '7u') || contains(github.ref_name, '8-') || contains(github.ref_name, '8a') || contains(github.ref_name, '8c') || contains(github.ref_name, '8e') || contains(github.ref_name, '8h') || contains(github.ref_name, '8o') || contains(github.ref_name, '8p') || contains(github.ref_name, '8r') || contains(github.ref_name, '8s') || contains(github.ref_name, '8t') || contains(github.ref_name, '8u') || contains(github.ref_name, '9-') || contains(github.ref_name, '9a') || contains(github.ref_name, '9c') || contains(github.ref_name, '9e') || contains(github.ref_name, '9h') || contains(github.ref_name, '9o') || contains(github.ref_name, '9p') || contains(github.ref_name, '9r') || contains(github.ref_name, '9s') || contains(github.ref_name, '9t') || contains(github.ref_name, '9u'))) }}

env:
  # Whether this run saves its caches: the Rust builds and the DuckDB
  # extensions. GitHub restores a push's caches only from its own branch
  # and the default branch, so a cache a topic branch saves serves that
  # branch alone, and those filled the repository's 10 GiB. Only main,
  # rust-core and the lane branches save: each parallel lane of packages
  # pushes to one lane branch it reuses, so a package's first run restores
  # the builds the lane's previous package saved (decision E43). The phase
  # branch no longer saves (E131): every push there is a landing commit,
  # whose jobs are left out, and no other branch can restore its caches.
  # Every run restores what its own branch saved; a run that saves nothing
  # still runs every check.
  # pip's caches are saved on main alone (E131): one per job and Python on
  # every long-lived branch took half the 10 GiB, and evicted the Rust
  # builds, which cost far more to redo. Every branch restores main's.
  SAVE_CACHES: ${{ github.event_name == 'push' && (contains(fromJSON('["main", "rust-core"]'), github.ref_name) || (startsWith(github.ref_name, 'rust-core-phase-') && contains(github.ref_name, '-lane-'))) }}
  SAVE_PIP_CACHES: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
  # The nightly's fresh dependencies: on a dispatch asking for them (the
  # nightly's), the Rust jobs take each crate's latest compatible version
  # (cargo update before they build), so a RustSec advisory or a crate's
  # break shows within a day. The Python jobs that install unpinned resolve
  # the latest release on every run already; a cell's pins are its
  # definition and stay.
  FRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh }}
  # The process's time zone, named for every job (M5): a test that sets
  # only DuckDB's session zone, or reads the process's, reads this one,
  # never the runner image's default, which may change under it.
  TZ: UTC
  # The images CI pulls, each named here once and pinned by digest (E131),
  # but wheel-smoke's, which scripts/rust_core/wheel_smoke.py names. A pull
  # from ghcr.io logs in with GITHUB_TOKEN; any other is anonymous.
  # Each a private copy, on this repository's GitHub Packages, of the
  # upstream image by the same digest (E131): anonymous pulls from public
  # registries failed for their limits.
  # The PostgreSQL server for test and engine: Docker's official image
  # for postgres:17. A service container's image cannot read env, so the
  # landing job hands it on.
  POSTGRES_IMAGE: ghcr.io/nvidia/structured-data-models-client/postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
  # The manylinux2014 image both wheel builds run in (PyPA's, published on quay.io).
  MANYLINUX: ghcr.io/nvidia/structured-data-models-client/manylinux2014_x86_64:2026.09.14-1@sha256:21c37461985655aaa25ed3a923b28e6c9d4dd9e10edc0281eb50385184bddd31
  # The binding's tests run at the E16 floor; DuckDB, at the reference's
  # version, is for the DuckDB provider's tests there (T1.11b).
  BINDING_FLOOR: pyarrow==14.0.1 pandas==2.2.2 numpy==1.23.5 duckdb==1.5.6

jobs:
  # The nightly (the schedule): dispatch this workflow, fresh, on the head
  # of every phase branch, rust-core-phase-N for any N; every other job
  # leaves itself out on the schedule (the landing job says skip).
  nightly:
    name: nightly dispatch
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the full matrix on each phase head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          heads=$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --paginate --jq '.[].name' \
            | grep -E '^rust-core-phase-(0|[1-9][0-9]*)$' || true)
          [ -n "$heads" ] || { echo 'no phase branch'; exit 0; }
          for head in $heads; do
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$head" -f fresh=true
            echo "dispatched on $head"
          done

  # Decision E131 (the owner's of 2026-10-14): CI does not test an empty
  # landing commit again. land.py makes one per landing (one parent, no
  # file changed, a subject starting `Land `) and pushes it to the topic
  # and the phase branch; its tree is its candidate's, which land.py
  # requires green on the candidate's own exact-SHA push run, and
  # `land.py verify` stands on that run. A moved landing (`Moved-from`,
  # E130) still runs: its candidate never ran, and the commit it was moved
  # from was judged against an older checkpoint, so its landing runs judge
  # it against its own. On a push of such a commit to the
  # phase branch or a branch under it every other job is left out: each
  # needs this one, directly or through the jobs it needs, and runs only
  # when it does not say skip. Any other push, and every pull request, runs
  # them all. It also hands the service containers the PostgreSQL image.
  # tests/test_ci_workflow.py runs this step's text.
  landing:
    name: landing commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.landing.outputs.skip }}
      postgres-image: ${{ env.POSTGRES_IMAGE }}
      # The run's plan (T3.0), from the step below: the phase head the
      # candidate was pushed on, which every judging job reads as
      # SDM_PUSH_BASE; whether the tooling jobs run; and the Pythons the
      # client matrix runs on.
      base: ${{ steps.plan.outputs.base }}
      tooling: ${{ steps.plan.outputs.tooling }}
      full: ${{ steps.plan.outputs.full }}
      pythons: ${{ steps.plan.outputs.pythons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # Skip only on evidence (E131): the pushed commit is an empty landing
      # commit with no Moved-from, and the commit its tree was tested on,
      # the first below it that is no empty landing commit (whose runs this
      # job leaves out, so they are never evidence), has for its newest run
      # of this workflow on a push to the phase branch or a branch under it
      # (never an archive branch) one that completed with success, read
      # with gh, a push's run alone, as land.py reads one (C28). No such run
      # (none, failed, cancelled, unfinished, or the API unreadable) runs
      # every job. The phase branch is the one the
      # push is to or under, rust-core-phase-N for any N (T2.0).
      - id: landing
        name: An empty landing commit is not tested again
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          empty_landing() {
            [ "$(git rev-list --parents -n 1 "$1" | wc -w)" -eq 2 ] || return 1
            case "$(git log -1 --format=%s "$1")" in 'Land '*) ;; *) return 1 ;; esac
            [ "$(git rev-parse "$1^{tree}")" = "$(git rev-parse "$1^^{tree}")" ]
          }
          skip=false
          why='not a push of an empty landing commit under a phase branch'
          phase=''
          if [ "${GITHUB_EVENT_NAME:-}" = schedule ]; then
            # The schedule only dispatches (the nightly job): the matrix
            # runs on each phase head, not on the default branch here.
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'every other job left out: true; the schedule dispatches each phase head instead'
            exit 0
          fi
          if [ "${GITHUB_EVENT_NAME:-}" = push ] &&
            [[ "${GITHUB_REF_NAME:-}" =~ ^(rust-core-phase-(0|[1-9][0-9]*))(-.+)?$ ]]; then
            phase=${BASH_REMATCH[1]}
          fi
          case "$phase" in
            ?*)
              moved=$(git log -1 --format='%(trailers:key=Moved-from,valueonly)' HEAD)
              if [ -z "$moved" ] && empty_landing HEAD; then
                if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --quiet --unshallow origin; fi
                tested=$(git rev-parse HEAD^)
                while empty_landing "$tested"; do tested=$(git rev-parse "$tested^"); done
                newest=$(gh api "repos/${GITHUB_REPOSITORY:-}/actions/workflows/ci.yml/runs?head_sha=$tested&event=push&per_page=100" \
                  --jq '[.workflow_runs[] | select(.event == "push" and (.head_branch == "'"$phase"'" or ((.head_branch | startswith("'"$phase"'-")) and (.head_branch | startswith("'"$phase"'-archive-") | not))))]
                    | sort_by(.created_at) | last | if . == null then "none" else "\(.id) \(.status) \(.conclusion)" end') || newest=unreadable
                case "$newest" in
                  *' completed success') skip=true; why="its tree is green in run ${newest%% *} at $tested" ;;
                  *) why="no green run of its tree at $tested (newest: $newest)" ;;
                esac
              fi ;;
          esac
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "every other job left out: $skip; $why"
      # The run's plan (T3.0), decided once, as the run starts, so a job
      # that starts an hour later decides alike. On a push to a branch under
      # a phase branch:
      # - base: the phase head now (ratchet.py push-base), or, for a
      #   candidate stacked on unlanded landings, the last of them, the base
      #   every comparison of this run takes, so a landing while it runs,
      #   its own candidate's included, cannot make one a self-comparison; a
      #   rerun of failed jobs keeps it, and a rerun of every job after the
      #   candidate landed takes the head it landed on;
      # - tooling: whether the tests of the checking tools (the
      #   tooling marker) run, which they do when the change touches a
      #   judging path or such a test (tooling_tests.py must-run), the
      #   change being the whole stack's, from the phase head
      #   (push-base --stack-base), so a train below the top counts;
      # - full: false on a test author's branch (<topic>-tests, or
      #   <topic>-tests-<suffix>), whose tests fail by design until the
      #   code exists: the client tests on one Python, and no wheels for
      #   other platforms.
      # Anywhere else every job runs, on every Python.
      - id: plan
        name: The run's base and the jobs it runs
        if: steps.landing.outputs.skip != 'true'
        run: |
          base=''
          tooling=true
          why='not a push under a phase branch'
          full=true
          if [ "${GITHUB_EVENT_NAME:-}" = push ] &&
            [[ "${GITHUB_REF_NAME:-}" =~ ^(rust-core-phase-(0|[1-9][0-9]*))-.+$ ]]; then
            phase=${BASH_REMATCH[1]}
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --quiet --unshallow origin; fi
            git fetch --quiet origin "refs/heads/$phase:refs/remotes/origin/$phase" || exit 1
            base=$(python3 scripts/rust_core/ratchet.py push-base) || exit 1
            stacked=$(python3 scripts/rust_core/ratchet.py push-base --stack-base) || exit 1
            plan=$(python3 scripts/rust_core/tooling_tests.py must-run --base "$stacked") || exit 1
            tooling=${plan%%$'\n'*}
            why=${plan#*$'\n'}
            if [[ "$GITHUB_REF_NAME" =~ -tests(-[^-]+)*$ ]]; then full=false; fi
          fi
          if [ "$full" = true ]; then pythons='["3.10", "3.11", "3.12", "3.13", "3.14"]'; else pythons='["3.12"]'; fi
          { echo "base=$base"; echo "tooling=$tooling"; echo "full=$full"; echo "pythons=$pythons"; } >> "$GITHUB_OUTPUT"
          echo "base: ${base:-none}; tooling jobs: $tooling ($why); full matrix: $full"
      # On the phase branch, every push, a landing's included, lands one
      # package as a fast-forward, its landing commit's Base-SHA the
      # previous tip: ratchet.py's --phase-push check, which the gate makes
      # when the jobs run, made here whether or not they are left out. The
      # epic branch is fetched for a phase's first landing, whose checkpoint
      # is the phase's fork point from it (T2.0), when the remote has it:
      # without it a fork point is refused, by name. A phase branch as the
      # concurrency reads it, any N.
      - name: A push to the phase branch lands one package
        if: github.event_name == 'push' && (startsWith(github.ref_name, 'rust-core-phase-') && !endsWith(github.ref_name, 'core-phase-') && !(contains(github.ref_name, 'phase-0') && !endsWith(github.ref_name, 'core-phase-0')) && !(contains(github.ref_name, 'b') || contains(github.ref_name, 'd') || contains(github.ref_name, 'f') || contains(github.ref_name, 'g') || contains(github.ref_name, 'i') || contains(github.ref_name, 'j') || contains(github.ref_name, 'k') || contains(github.ref_name, 'l') || contains(github.ref_name, 'm') || contains(github.ref_name, 'n') || contains(github.ref_name, 'q') || contains(github.ref_name, 'v') || contains(github.ref_name, 'w') || contains(github.ref_name, 'x') || contains(github.ref_name, 'y') || contains(github.ref_name, 'z') || contains(github.ref_name, '.') || contains(github.ref_name, '_') || contains(github.ref_name, '/') || startsWith(github.ref_name, 'rust-core-phase--') || startsWith(github.ref_name, 'rust-core-phase-a') || startsWith(github.ref_name, 'rust-core-phase-c') || startsWith(github.ref_name, 'rust-core-phase-e') || startsWith(github.ref_name, 'rust-core-phase-h') || startsWith(github.ref_name, 'rust-core-phase-o') || startsWith(github.ref_name, 'rust-core-phase-p') || startsWith(github.ref_name, 'rust-core-phase-r') || startsWith(github.ref_name, 'rust-core-phase-s') || startsWith(github.ref_name, 'rust-core-phase-t') || startsWith(github.ref_name, 'rust-core-phase-u') || contains(github.ref_name, '0-') || contains(github.ref_name, '0a') || contains(github.ref_name, '0c') || contains(github.ref_name, '0e') || contains(github.ref_name, '0h') || contains(github.ref_name, '0o') || contains(github.ref_name, '0p') || contains(github.ref_name, '0r') || contains(github.ref_name, '0s') || contains(github.ref_name, '0t') || contains(github.ref_name, '0u') || contains(github.ref_name, '1-') || contains(github.ref_name, '1a') || contains(github.ref_name, '1c') || contains(github.ref_name, '1e') || contains(github.ref_name, '1h') || contains(github.ref_name, '1o') || contains(github.ref_name, '1p') || contains(github.ref_name, '1r') || contains(github.ref_name, '1s') || contains(github.ref_name, '1t') || contains(github.ref_name, '1u') || contains(github.ref_name, '2-') || contains(github.ref_name, '2a') || contains(github.ref_name, '2c') || contains(github.ref_name, '2e') || contains(github.ref_name, '2h') || contains(github.ref_name, '2o') || contains(github.ref_name, '2p') || contains(github.ref_name, '2r') || contains(github.ref_name, '2s') || contains(github.ref_name, '2t') || contains(github.ref_name, '2u') || contains(github.ref_name, '3-') || contains(github.ref_name, '3a') || contains(github.ref_name, '3c') || contains(github.ref_name, '3e') || contains(github.ref_name, '3h') || contains(github.ref_name, '3o') || contains(github.ref_name, '3p') || contains(github.ref_name, '3r') || contains(github.ref_name, '3s') || contains(github.ref_name, '3t') || contains(github.ref_name, '3u') || contains(github.ref_name, '4-') || contains(github.ref_name, '4a') || contains(github.ref_name, '4c') || contains(github.ref_name, '4e') || contains(github.ref_name, '4h') || contains(github.ref_name, '4o') || contains(github.ref_name, '4p') || contains(github.ref_name, '4r') || contains(github.ref_name, '4s') || contains(github.ref_name, '4t') || contains(github.ref_name, '4u') || contains(github.ref_name, '5-') || contains(github.ref_name, '5a') || contains(github.ref_name, '5c') || contains(github.ref_name, '5e') || contains(github.ref_name, '5h') || contains(github.ref_name, '5o') || contains(github.ref_name, '5p') || contains(github.ref_name, '5r') || contains(github.ref_name, '5s') || contains(github.ref_name, '5t') || contains(github.ref_name, '5u') || contains(github.ref_name, '6-') || contains(github.ref_name, '6a') || contains(github.ref_name, '6c') || contains(github.ref_name, '6e') || contains(github.ref_name, '6h') || contains(github.ref_name, '6o') || contains(github.ref_name, '6p') || contains(github.ref_name, '6r') || contains(github.ref_name, '6s') || contains(github.ref_name, '6t') || contains(github.ref_name, '6u') || contains(github.ref_name, '7-') || contains(github.ref_name, '7a') || contains(github.ref_name, '7c') || contains(github.ref_name, '7e') || contains(github.ref_name, '7h') || contains(github.ref_name, '7o') || contains(github.ref_name, '7p') || contains(github.ref_name, '7r') || contains(github.ref_name, '7s') || contains(github.ref_name, '7t') || contains(github.ref_name, '7u') || contains(github.ref_name, '8-') || contains(github.ref_name, '8a') || contains(github.ref_name, '8c') || contains(github.ref_name, '8e') || contains(github.ref_name, '8h') || contains(github.ref_name, '8o') || contains(github.ref_name, '8p') || contains(github.ref_name, '8r') || contains(github.ref_name, '8s') || contains(github.ref_name, '8t') || contains(github.ref_name, '8u') || contains(github.ref_name, '9-') || contains(github.ref_name, '9a') || contains(github.ref_name, '9c') || contains(github.ref_name, '9e') || contains(github.ref_name, '9h') || contains(github.ref_name, '9o') || contains(github.ref_name, '9p') || contains(github.ref_name, '9r') || contains(github.ref_name, '9s') || contains(github.ref_name, '9t') || contains(github.ref_name, '9u')))
