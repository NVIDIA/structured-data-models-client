  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: landing
    if: needs.landing.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install --upgrade pip 'ruff==0.16.*'
      - run: ruff check .
      - run: ruff format --check .

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: landing
    if: needs.landing.outputs.skip != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/check_repo_hygiene.py all

  # The Rust core (docs/design/rust-core/phase-1/design.md, section CI). Each
  # job installs the toolchain rust/rust-toolchain.toml pins, and caches the
  # build keyed on Cargo.lock. Third-party actions are pinned by commit, as
  # the organisation's allow list requires.
  rust-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: landing
    if: needs.landing.outputs.skip != 'true'
    defaults:
      run:
        working-directory: rust
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - run: cargo fmt --all --check
      # sdm-testkit builds the bundled DuckDB, so its clippy runs in rust-test,
      # which builds it anyway (H3); the L0 self-tests' clippy fixture needs
      # only jiff, and stays here.
      - run: cargo clippy --workspace --exclude sdm-testkit --all-targets --locked -- -D warnings
      # The binding with its test-only operations, as its tests build it.
      - run: cargo clippy -p sdm-py --features test-ops --locked -- -D warnings
      # The L0 guards (T1.10c): the crate graph (l0_deps.py), with the
      # bridge freeze (bridge_freeze.py, E50), whose baseline ratchets
      # against the merge base with the phase head the run was pushed on
      # (SDM_PUSH_BASE, T3.0), else with origin/<the phase branch>
      # (phases.py: the phase this branch is under, else the phase in
      # progress), which the full checkout above fetches; and the vocabulary, SQL-fragment, skip and
      # ignore, clippy-ban and step-variant scans (l0_scan.py). The bans
      # themselves are enforced by the clippy runs above, from
      # rust/clippy.toml.
      - name: L0 graph, bans and scans
        run: |
          if [ -n "${SDM_PUSH_BASE:-}" ]; then export SDM_FREEZE_BASE=$SDM_PUSH_BASE; fi
          python3 scripts/rust_core/l0_deps.py
          python3 scripts/rust_core/l0_scan.py
        working-directory: .
      # Each guard passes on the tree and fails on a fixture seeded with the
      # fault it exists for, and clippy refuses each banned item in a fixture
      # crate under rust/clippy.toml.
      - name: L0 self-tests
        run: python3 scripts/rust_core/selftest.py
        working-directory: .
      # land.py's checks, each passing a sound landing and refusing a seeded
      # fault, against a scripted git and gh; lane.py's lane rules and
      # land.py's on a lane, against real temporary git repositories and a
      # fake gh; and prune_caches.py's stale-cache rules; with no network
      # (decision E43, CI2).
      - name: land.py, lane.py and prune_caches.py self-tests
        run: |
          python3 scripts/rust_core/land_selftest.py
          python3 scripts/rust_core/lane_selftest.py
          python3 scripts/rust_core/prune_caches.py --selftest
        working-directory: .
      # The contract schema: regenerated from the types and compared with the
      # committed file, locked to the current version; no entry merged into
      # rust-core rewritten, and at most one working entry, which is why this
      # job checks out every branch (for the merge base with rust-core).
      - run: cargo test -p sdm-contract --locked --test schema_lock
      - run: python3 scripts/rust_core/contract_lock.py
        working-directory: .
      # The client wheel's notices for the Rust crates it links, regenerated
      # from Cargo.lock and compared with the committed file.
      - run: python3 scripts/rust_core/rust_notices.py --check
        working-directory: .
      # The open source inventory main's 4cfbcd18 added for nSpect's scan,
      # uv.lock, current with every distribution's requirements (T2.0c).
      # Reading the client's version builds its metadata with maturin, so
      # the pinned toolchain is named: from the client's directory rustup
      # does not see rust/rust-toolchain.toml.
      - name: uv.lock is current
        run: |
          RUSTUP_TOOLCHAIN=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust/rust-toolchain.toml) \
            pipx run uv==0.13.1 lock --check
        working-directory: .

  rust-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: landing
    if: needs.landing.outputs.skip != 'true'
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-deny
      - if: env.FRESH == 'true'
        run: cargo update
      - run: cargo deny --locked check

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: landing
    if: needs.landing.outputs.skip != 'true'
    defaults:
      run:
        working-directory: rust
    # Line tables only for the workspace's own crates (dependencies build
    # with none, rust/Cargo.toml): a panic and its backtrace still name each
    # file and line, and the test binaries take far less of the runner's
    # disk. The test profile inherits dev's; stated for both all the same.
    # The pinned PostgreSQL service, required (H26; T2.1a): sdm-testkit's
    # tests/postgres_required.rs fails, never stands down, when it is not
    # there. rust-host reads Postgres by replaying python-core's recorded
    # fetches (KO2-20, KO2-60), which this job cannot wait for: it hands
    # its build of sdm-contract-run to cross-host (postgres), which
    # replays them there (T2.4, for T2.3b).
    services:
      postgres: &postgres-service
        # POSTGRES_IMAGE, by way of the landing job, pulled from ghcr.io
        # as this workflow, which needs packages: read.
        image: ${{ needs.landing.outputs.postgres-image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_DB: sdm_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      # Every branch, for the gate's checkpoint (the merge base with the
      # phase branch) and its worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # This job builds the bundled DuckDB; on a cold cache (any Cargo.lock
      # change misses rust-cache's key) the build ran the runner out of disk
      # (T1.35). The preinstalled toolchains it never uses are removed first,
      # the free space printed before and after.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      # The test host's ICU and JSON, DuckDB's signed extensions for v1.5.6,
      # which it installs the first time and checks against their recorded
      # digests before every load (decision E37; JSON from T1.33): cached, so
      # a run downloads them once. The key names both, so the cache saved
      # before JSON, which lacks it, is not restored as a hit.
      # Saved, like every cache here, only where SAVE_CACHES says.
      - id: duckdb-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions/v1.5.6
          key: duckdb-extensions-v1.5.6-icu-json-${{ runner.os }}-${{ runner.arch }}
      # The test kit's clippy, here on the DuckDB build this job makes (H3).
      - if: env.FRESH == 'true'
        run: cargo update
      - run: cargo clippy -p sdm-testkit --all-targets --locked -- -D warnings
      # Python, for the contract loader (contract/runners/databases.py),
      # which loads a case's tables into SQLite for sdm-contract-run
      # --database sqlite in the tests below (T2.2), and for the steps after
      # them: DuckDB at the reference's version and pyarrow at the
      # reference cell's, as the contract jobs pin them, with what the
      # runner reads the bases with.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install duckdb==1.5.6 pyarrow==25.0.1 pyyaml jsonschema
      - run: cargo test --workspace --locked
        env:
          SDM_PYTHON: python
      # The pure-Rust host over the contract cases, its observations compared
      # with the cases' expectations and reference observations (T1.10;
      # T1.18 moves this to the checkpoint's comparator), from T1.11e under
      # contract/compare-policy.yaml, which pyyaml reads: its statements and
      # their results against the reference's (H9), its call against the
      # reference's request, and base.regression reaching its result. The
      # test host links no Python. Its DuckDB loads ICU explicitly, installing
      # DuckDB's signed extension for its version the first time, from the
      # cache above when it holds it (decision E37).
      - run: cargo run -p sdm-testkit --bin sdm-contract-run --locked -- --out ../rust-host.jsonl ../contract/cases
      - run: |
          cargo tree -e normal -p sdm-testkit --locked > ../testkit-tree.txt
          ! grep -w pyo3 ../testkit-tree.txt
      # On a phase branch and its lanes, and on the epic branch (T2.0), the
      # gate step below runs this comparison with the checkpoint's
      # comparator, each baselined case's outcome against its effective
      # expectation (an approved change included), so this one runs only
      # elsewhere (T1.14); whether the gate runs is the gate step's to
      # decide, failing closed.
      - run: |
          pip install jsonschema pyyaml
          where=$(python scripts/rust_core/ratchet.py where) || exit 1
          if [ -n "$where" ]; then
            echo 'the gate step compares rust-host on this branch'
            exit 0
          fi
          python scripts/rust_core/compare.py --cases contract/cases --reference contract/reference/*.jsonl rust-host.jsonl
        working-directory: .
      # The gate (T1.14): the candidate judged by its checkpoint's harness,
      # from the checkpoint's own worktree (design, "Reference observations
      # and the gate"; H2): rust-host's observations made with the
      # checkpoint's case loader and observation writer, the checkpoint's
      # ratchet (protected paths, reference immutability, cases, register,
      # relaxations, KNOWN_DIFFERING, baselines and availability), its
      # comparator and its L0 scripts. On a push to the phase branch the
      # checkpoint is the push's previous tip, and the push lands exactly
      # one package; on a lane or topic branch, the merge base with the
      # phase branch's tip, a landing commit judged against its own
      # recorded base; on the epic branch rust-core (T2.0), the merged
      # phase's last landing, so rust-core is judged like a moved landing
      # of that phase's head. Before T1.14 lands, the bootstrap: the
      # candidate's harness runs.
      # Whether the gate runs fails closed (T1.18), decided in the step
      # itself so a local replay runs it too (replay_jobs.py takes no
      # conditions): on a push to rust-core, to a phase branch
      # (rust-core-phase-N, any N) or to any branch under one the gate must
      # run, from GitHub's own event and ref, not from the candidate's
      # ratchet.py, whose `where` then only names the base; an error or an
      # empty answer there fails. Elsewhere there is no ratchet.
      # tests/test_contract_ci_gate.py runs this step's text.
      - name: gate (rust-host)
        run: |
          where=$(python scripts/rust_core/ratchet.py where) || { echo 'gate: ratchet.py where failed'; exit 1; }
          if [ "${GITHUB_EVENT_NAME:-}" = push ] &&
            [[ "${GITHUB_REF_NAME:-}" =~ ^rust-core(-phase-(0|[1-9][0-9]*)(-.+)?)?$ ]]; then
            [ -n "$where" ] || { echo "gate: ratchet.py where named no base on $GITHUB_REF_NAME, where the gate must run"; exit 1; }
          fi
          [ -n "$where" ] || { echo 'gate: no ratchet off the phase branch'; exit 0; }
          scripts/rust_core/gate.sh $where --run rust-host
        working-directory: .
      # rust-host's observations, made above by this candidate's host, for
      # the cross-host job (T1.29), which holds them to python-core's on
      # the core rule: uploaded whether or not the gate passed, so that
      # comparison reports for itself.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observations-rust-host
          path: rust-host.jsonl
          if-no-files-found: error
      # rust-host on SQLite (T2.4, for T2.2b): each case that runs on
      # SQLite, its tables loaded into a new SQLite file by the contract
      # loader (the Python SDM_PYTHON names, which holds DuckDB and
      # pyarrow), read through the dev-only rusqlite provider, every
      # observation keyed `<case>@sqlite`; held to the staging rule
      # (run_python.py legs: the host reports a SQLite provider, so it
      # observes every case python-ref's committed lines hold there) and
      # to those lines, moved by the approved entries, as the contract
      # jobs hold python-core there (compare.py --database). Run whether
      # or not the DuckDB gate passed, so cross-host (sqlite) reports for
      # itself.
      - if: ${{ !cancelled() }}
        name: rust-host on SQLite
        env:
          SDM_PYTHON: python
        run: |
          set -o pipefail
          # Every checkpoint's gate.sh builds the test kit's overlay into a
          # target directory of its own (T2.16a), so this tree's host is
          # built here as Cargo judges it; no source is marked newer, which
          # rebuilt the test kit on every run (P2-T2.16a-1).
          out=rust-host-sqlite
          mkdir -p "$out"
          reference=$(ls contract/reference/*.jsonl)
          (cd rust && cargo run -q -p sdm-testkit --bin sdm-contract-run --locked -- --providers) \
            | python -I -c 'import json, sys; print(json.dumps({"rust-host": json.load(sys.stdin)}))' \
            > "$out/providers.json" || exit 1
          (cd rust && cargo run -q -p sdm-testkit --bin sdm-contract-run --locked -- \
            --database sqlite --out "../$out/rust-host.jsonl" ../contract/cases) || exit 1
          status=0
          python -I contract/runners/run_python.py legs --database sqlite \
            --providers "$out/providers.json" "$reference" "$out/rust-host.jsonl" || status=1
          where=$(python scripts/rust_core/ratchet.py where) || { echo 'ratchet.py where failed'; exit 1; }
          expect=()
          if [ -n "$where" ]; then
            python scripts/rust_core/ratchet.py effective $where --out "$out/effective.json" || exit 1
            expect=(--expect "$out/effective.json")
          fi
          python scripts/rust_core/compare.py --cases contract/cases --database sqlite \
            --reference "$reference" ${expect[@]+"${expect[@]}"} "$out/rust-host.jsonl" || status=1
          exit $status
        working-directory: .
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observations-rust-host-sqlite
          path: rust-host-sqlite/rust-host.jsonl
          if-no-files-found: error
      # The pure-Rust host as this job built it, for cross-host (postgres)
      # to replay python-core's recorded Postgres fetches with: a second
      # build there would only repeat this one.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdm-contract-run
          path: rust/target/debug/sdm-contract-run
          if-no-files-found: error
      - if: ${{ !cancelled() && env.SAVE_CACHES == 'true' && steps.duckdb-extensions.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.duckdb/extensions/v1.5.6
          key: ${{ steps.duckdb-extensions.outputs.cache-primary-key }}

  # The client wheel, which carries the core as sdm_client._native (design,
  # "Packaging"). maturin, at the version native_wheel.py pins, builds it in
  # a manylinux2014 container run with docker rather than through an
  # action: the x86_64 cp310-abi3 wheel that ships. native_wheel.py records
  # the build's target flags and fails on target-cpu, and reads the wheel
  # with auditwheel show. Every job that installs the client takes it from
  # this job's artifact, and this job builds and uploads nothing else, so
  # those jobs wait for the shipped wheel only (CI1): the test-only build
  # and the binding's tests run beside it, in native-test-ops and binding.
  native-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: landing
    if: needs.landing.outputs.skip != 'true'
    env:
      NATIVE_ARGS: --out native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
        working-directory: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      # The image, pulled with retries and, from ghcr.io, logged in (E131).
      - &manylinux-pull
        name: Pull the manylinux2014 image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/rust_core/pull_image.sh "$MANYLINUX"
      # As the runner's user, so the cache can read rust/target afterwards,
      # in a home the runner made, so that user can write it, holding the
      # runner's crate registry, which the cache restores. NATIVE_ARGS says
      # which build: native-test-ops runs this same step for its own.
      - &manylinux-build
        name: Build the wheel in manylinux2014
        run: |
          home="$RUNNER_TEMP/manylinux-home"
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git" "$home/.cargo/registry" "$home/.cargo/git"
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home -e CARGO_HOME=/tmp/home/.cargo -e RUSTUP_HOME=/tmp/home/.rustup \
            -e NATIVE_ARGS \
            -v "$home:/tmp/home" -v "$PWD:/io" -w /io \
            -v "$HOME/.cargo/registry:/tmp/home/.cargo/registry" \
            -v "$HOME/.cargo/git:/tmp/home/.cargo/git" \
            "$MANYLINUX" bash -euo pipefail -c '
              # rustup-init 1.29.0 for the architecture the image runs on,
              # checked against its published SHA-256.
              arch=$(uname -m)
              case "$arch" in
                x86_64) sum=4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10 ;;
                aarch64) sum=9732d6c5e2a098d3521fca8145d826ae0aaa067ef2385ead08e6feac88fa5792 ;;
                *) echo "no rustup-init checksum for $arch" >&2; exit 1 ;;
              esac
              curl --proto "=https" --tlsv1.2 -sSf -o /tmp/home/rustup-init \
                "https://static.rust-lang.org/rustup/archive/1.29.0/$arch-unknown-linux-gnu/rustup-init"
              echo "$sum  /tmp/home/rustup-init" | sha256sum -c -
              chmod +x /tmp/home/rustup-init
              /tmp/home/rustup-init -y --profile minimal --default-toolchain none --no-modify-path
              export PATH="$CARGO_HOME/bin:$PATH"
              (cd rust && rustup toolchain install)
              /opt/python/cp312-cp312/bin/python -m venv /tmp/home/maturin
              /tmp/home/maturin/bin/pip install --quiet maturin==1.15.0
              export PATH="/tmp/home/maturin/bin:$PATH"
              python scripts/rust_core/native_wheel.py $NATIVE_ARGS --manylinux
            '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wheel
          path: native/

  # The binding with its test-only operations, built beside native-wheel by
  # the same step and tested at the E16 floor: every file of the binding's
  # tests, and the Python host's tests that need those operations, which
  # the test job does not collect (E23). Its wheel is its own artifact,
  # which wheel-smoke installs in its clean containers and no job that
  # builds or ships takes (E23).
  native-test-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: landing
    if: needs.landing.outputs.skip != 'true'
    # The pinned PostgreSQL service, required (H26), for the Postgres
    # provider's own test (tests_test_ops/test_the_postgres_provider.py:
    # L4 executed on Postgres, key sets bound as the dialect binds them),
    # which needs the test-only fetch this build carries and stands down
    # with no server named (T2.4, for T2.3b).
    services:
      postgres: *postgres-service
    env:
      NATIVE_ARGS: --out native-test-ops --test-ops
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
        working-directory: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - *manylinux-pull
      - *manylinux-build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      # The connectors are for the canary test's journey over DuckDB
      # (T1.11d), which tests_test_ops runs here at the floor, and psycopg
      # for the Postgres provider's test, and ADBC's SQLite driver for L5's,
      # which runs here at the floor as in l5-conversion (their extras).
      - name: The binding's tests on the test-ops build
        run: |
          python -m venv /tmp/test-ops
          /tmp/test-ops/bin/pip install --quiet pytest $BINDING_FLOOR \
            ./packages/structured-data-models-api ./packages/structured-data-models-pql \
            './packages/structured-data-models-connectors[sqlite,postgres]' \
            "$(ls native-test-ops/*.whl)"
          /tmp/test-ops/bin/python -m pytest rust/bindings/sdm-py/tests -q \
            -p no:cacheprovider --native-build test-ops
          /tmp/test-ops/bin/python -m pytest packages/structured-data-models-client/tests_test_ops -q \
            -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-wheel-test-ops
          path: native-test-ops/

  # The client wheel for aarch64 Linux (decision KO2-40), built natively on
  # an Arm runner by native-wheel's own steps, in PyPA's
  # manylinux2014_aarch64 image (copied to ghcr.io by the same digest, as
  # the other images are, decision E131) pinned by digest, which MANYLINUX names
  # here for this job alone: the shipped build, beside native-wheel's
  # x86_64 one, and the test-ops build, which only wheel-smoke's aarch64
  # lanes install. native_wheel.py holds each to its architecture's
  # manylinux2014 tag.
  native-wheel-aarch64:
    name: native-wheel (aarch64, ${{ matrix.build }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: landing
    # Not on a test author's branch (the landing job's plan, T3.0), nor
    # its smoke after it.
    if: needs.landing.outputs.skip != 'true' && needs.landing.outputs.full != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: shipped
            args: --out native
            artifact: native-wheel-aarch64
          - build: test-ops
            args: --out native --test-ops
            artifact: native-wheel-test-ops-aarch64
    env:
      MANYLINUX: ghcr.io/nvidia/structured-data-models-client/manylinux2014_aarch64:2026.09.14-1@sha256:d4c40df238d6ec0ee91213f4797ad26f05d7d82947bcb61c40d1fdc13d0e16d5
      NATIVE_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
        working-directory: rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          key: ${{ matrix.build }}
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - *manylinux-pull
      - *manylinux-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: native/

  # The binding's tests on the wheel that ships, at the E16 floor: the file
  # any build passes.
  binding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: native-wheel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native
      - name: The binding's tests on the shipped build
        run: |
          python -m venv /tmp/production
          /tmp/production/bin/pip install --quiet pytest $BINDING_FLOOR \
            ./packages/structured-data-models-api ./packages/structured-data-models-pql \
            "$(ls native/*.whl)"
          /tmp/production/bin/python -m pytest rust/bindings/sdm-py/tests/test_binding.py -q \
            -p no:cacheprovider --native-build production

  # The wheels as a user installs them (T1.17, decision E16), each lane in
  # a clean container, both gating: the floor (Python 3.10, pyarrow 14.0.1,
  # pandas 2.2.2, NumPy 1.23.5) and the newest (Python 3.14 with the newest
  # pandas 3, NumPy 2 and pyarrow, resolved on every run). wheel_smoke.py
  # runs itself in the lane's Python image, pinned by digest, the checkout
  # mounted read-only; it installs the shipped wheel and the test-ops one,
  # as these jobs built them, each in an environment of its own holding
  # only wheels, and runs the binding's tests on them from outside the
  # checkout (shared and released buffers, admitted types, outputs after
  # collection, error and destruction, busy and cancel). Each lane's
  # resolved environments, reports and environment.json are its artifact,
  # uploaded whether it passed or not.
  wheel-smoke:
    name: wheel-smoke (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [native-wheel, native-test-ops]
    strategy:
      fail-fast: false
      matrix:
        lane: [floor, newest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel-test-ops
          path: native-test-ops
      # The lane's image, as wheel_smoke.py names it, pulled with retries
      # and, from ghcr.io, logged in (E131): the two lanes start together,
      # and a registry that refuses a pull for its rate often takes it a
      # minute later. The run below then finds it pulled.
      - name: Pull the lane's image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/rust_core/pull_image.sh "$(python3 scripts/rust_core/wheel_smoke.py image ${{ matrix.lane }})"
      - name: The lane's clean container
        run: |
          python3 scripts/rust_core/wheel_smoke.py --lane ${{ matrix.lane }} --container \
            --wheel "$(ls native/*.whl)" --test-ops-wheel "$(ls native-test-ops/*.whl)" \
            --out wheel-smoke
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-smoke-${{ matrix.lane }}
          path: wheel-smoke/

  # The same two lanes on an Arm runner with the aarch64 wheels (decision
  # KO2-40): wheel_smoke.py's aarch64 lanes are the floor and the newest,
  # whose images are multi-architecture, and also require the interpreter
  # to run on aarch64. First, the shipped wheel set: one manylinux2014
  # wheel for each architecture, of one distribution and version, so a set
  # missing an architecture fails here.
  wheel-smoke-aarch64:
    name: wheel-smoke (${{ matrix.lane }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    needs: [native-wheel, native-wheel-aarch64]
    strategy:
      fail-fast: false
      matrix:
        lane: [aarch64-floor, aarch64-newest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel-aarch64
          path: native
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel-test-ops-aarch64
          path: native-test-ops
      - name: The shipped wheel set
        run: python3 scripts/rust_core/native_wheel.py --check-set native-x86_64 native
      - name: Pull the lane's image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/rust_core/pull_image.sh "$(python3 scripts/rust_core/wheel_smoke.py image ${{ matrix.lane }})"
      - name: The lane's clean container
        run: |
          python3 scripts/rust_core/wheel_smoke.py --lane ${{ matrix.lane }} --container \
            --wheel "$(ls native/*.whl)" --test-ops-wheel "$(ls native-test-ops/*.whl)" \
            --out wheel-smoke
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-smoke-${{ matrix.lane }}
          path: wheel-smoke/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: native-wheel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native
      # The engine needs its runtime dependencies present to be checked at all,
      # and a toolchain to install. It ships py.typed exactly like the other
      # four, so leaving it out would make the gate narrower than the promise.
      # The image's compilers and CMake are that toolchain; the runner image
      # carries them, so nothing is installed (CI1).
      - run: for tool in gcc g++ make cmake; do command -v "$tool"; done
      - run: pip install --upgrade pip mypy
      # The client from the native wheel; its stub, _native.pyi, ships in it.
      - run: |
          pip install -e './packages/structured-data-models-api' -e './packages/structured-data-models-pql' \
            "$(ls native/*.whl)" \
            -e './packages/structured-data-models-connectors[sqlite,duckdb,postgres,snowflake,databricks]' \
            -e './packages/structured-data-models-relational-engine'
      # Every session a source takes too, so each driver's types are its own
      # rather than Any. pyspark-client is pyspark's Python without its jars.
      - run: pip install snowflake-snowpark-python pyspark-client
      - run: |
          mypy packages/structured-data-models-api/src packages/structured-data-models-pql/src packages/structured-data-models-client/src \
            packages/structured-data-models-connectors/src packages/structured-data-models-relational-engine/src
      # What a caller's type checker infers for a source, and what it refuses.
      - run: mypy packages/structured-data-models-connectors/tests/typing/check_sources.py

  # Every interpreter the four pure-python distributions classify. The
  # internal pipeline runs one of them, so a defect specific to any other
  # reached a release through a promise nothing checked.
  test:
    runs-on: ubuntu-latest
    # 90, not 60: the job reached 58 minutes on GitHub's runners as Phase 2's
    # three-database corpus grew (T2.1o); the cause is being cut separately.
    timeout-minutes: 60
    needs: [landing, native-wheel]
    strategy:
      fail-fast: false
      # Every Python, but on a test author's branch (the landing job's
      # plan, T3.0).
      matrix:
        python-version: ${{ fromJSON(needs.landing.outputs.pythons || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}
    # A real server for the PostgreSQL reads and the PostgreSQL sampler, which
    # only a PostgreSQL can say it accepts. SDM_REQUIRE_POSTGRES turns a
    # missing DSN or driver into a failure, where a skip would read as a pass.
    services:
      postgres: *postgres-service
    env:
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      # Every commit: the root suite runs the gate's real bootstrap on the
      # real history (tests/test_t20_bootstrap.py, T2.0), which a shallow
      # checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native
      # pip's downloads and built wheels, keyed on the week and on every
      # distribution's manifest and restored from the newest of this job's
      # otherwise; saved on main alone, which every branch restores (E131).
      # pip still resolves each requirement against the index, so the cache
      # only saves downloads and changes no version (CI1).
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-${{ matrix.python-version }}-${{ steps.week.outputs.week }}-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-${{ github.job }}-${{ matrix.python-version }}-
      # databricks, snowflake and s3 are here for their drivers, not for a
      # server: those tests mock the connection. Without the driver, importing
      # the backend raises and every test covering it skips. snowflake was
      # missing here, which is how a driver release that refused every
      # ordinary connection keyword reached main reading as a pass. The
      # client is the native wheel's, the one abi3 build every interpreter
      # here installs; its test extra carries pytest-xdist, and
      # pytest-timeout==2.4.0 is for the run's --timeout.
      - run: |
          pip install --upgrade pip 'ruff==0.16.*' pytest-timeout==2.4.0 "tomli; python_version < '3.11'"
          pip install -e './packages/structured-data-models-api[test]' -e './packages/structured-data-models-pql[test]' \
            "$(ls native/*.whl)[test]" \
            -e './packages/structured-data-models-connectors[sqlite,duckdb,postgres,databricks,snowflake,s3,test]'
      # In parallel, as contract/tests runs: each test file on one worker,
      # so its module fixtures are built once. The gate's tooling tests
      # (the tooling marker) run once, in tooling (root), not on five
      # Pythons and again in engine (T3.0). A test past 10 minutes
      # fails with its stack, and a worker that dies ends the run rather
      # than leaving xdist waiting on it.
      - run: |
          python -m pytest packages/structured-data-models-api/tests packages/structured-data-models-pql/tests \
            packages/structured-data-models-client/tests packages/structured-data-models-connectors/tests tests -q \
            -m 'not live_nim and not live_warehouse and not tooling' \
            -n auto --dist loadfile --timeout=600 --max-worker-restart=0
      - if: ${{ !cancelled() && env.SAVE_PIP_CACHES == 'true' && steps.pip-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

  engine:
    runs-on: ubuntu-latest
    # 60 again (P2-T2.16-14, P2-T2.1o-1): it reached its 60-minute limit on
    # two runs in Phase 2 (T2.11), and since T3.0's split, which runs the
    # checking tools' tests apart, it takes about 16 minutes.
    timeout-minutes: 60
    needs: [landing, native-wheel]
    # A real server for the PostgreSQL reads and the PostgreSQL sampler, which
    # only a PostgreSQL can say it accepts. SDM_REQUIRE_POSTGRES turns a
    # missing DSN or driver into a failure, where a skip would read as a pass.
    # The same service as test's.
    services:
      postgres: *postgres-service
    env:
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      # Every branch, for the gate's checkpoint and its worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native
      # The image's compilers and CMake, which a source build uses; the
      # runner image carries them, so nothing is installed (CI1).
      - run: for tool in gcc g++ make cmake; do command -v "$tool"; done
      # pip's downloads and built wheels, keyed on the week and on every
      # distribution's manifest and restored from the newest of this job's
      # otherwise; saved on main alone, which every branch restores (E131).
      # pip still resolves each requirement against the index, so the cache
      # only saves downloads and changes no version (CI1).
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ github.job }}-3.12-${{ steps.week.outputs.week }}-${{ hashFiles('packages/*/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-${{ github.job }}-3.12-
      # ruff is here for the root suite, not for linting: the test that
      # checks the engine ignore-list note shells out to it and skips
      # without it, which would make that check vacuous here.
      # The Databricks and Snowflake drivers are for the offline tests of those
      # backends, which skip whole modules without them; pyyaml reads the
      # semantic-view fixtures, and `explain` carries the SDK the explanation
      # tests fake around. jsonschema validates the contract's cases and
      # observations, which the root suite checks. pytest-timeout==2.4.0 is for
      # the root suite's --timeout; the client's test extra, installed
      # below, carries pytest-xdist.
      - run: |
          pip install --upgrade pip 'ruff==0.16.*' pytest-timeout==2.4.0
          pip install -e './packages/structured-data-models-api' -e './packages/structured-data-models-pql' \
            -e './packages/structured-data-models-connectors[sqlite,duckdb,databricks,snowflake,postgres]' \
            pyyaml jsonschema
          pip install -e './packages/structured-data-models-relational-engine[test,explain]'
      # The same marker filter as the internal pipeline. The live NIM and live
      # warehouse tests need credentials this job does not have, so they are
      # deselected by name rather than left to skip. A skip that remains is a
      # test that checked its own environment and stood down, and is reported.
      - run: |
          cd packages/structured-data-models-relational-engine
          python -m pytest tests -q -m 'not live_nim and not live_warehouse'
      # The client's suite again, with an engine present. The test job installs
      # none, so every client test that needs one skips there and runs nowhere.
      - run: |
          pip install "$(ls native/*.whl)[test]"
          python -m pytest packages/structured-data-models-client/tests -q \
            -m 'not live_nim and not live_warehouse'
      # And the root suite, which holds the relational wire snapshots. They
      # only exercise anything with an engine installed, so running them in
      # the test job would prove nothing.
      # The contract cases and the runner's controls (contract/tests) run
      # in contract-python, from T1.18. In parallel, as in the test job.
      # The checking tools' own tests run in tooling (root) (T3.0).
      - run: python -m pytest tests -q -m 'not tooling' -n auto --dist loadfile --timeout=600 --max-worker-restart=0
      - if: ${{ !cancelled() && env.SAVE_PIP_CACHES == 'true' && steps.pip-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

  # The L2 corpus on the Python runners per runtime cell (H1; design, "CI";
  # T1.18): each cell pinned as run_python.py's CELLS names it, python-core
  # and python-old observed with the checkpoint's runner and judged by the
  # checkpoint's ratchet and comparator through gate.sh, which also
  # validates the register; rust-test runs the L0 scripts. In a cell other
  # than the reference's the comparator holds python-core to python-old on
  # host fields and reports the reference's (H1). Each observation must name
  # the job's cell, so a pin that drifts fails. The runner's controls and
  # the route tests (contract/tests) run once, in ref-pandas3, with their
  # comparisons on the same effective expectations as the gate. One job per
  # cell, sharing its steps: replay_jobs.py substitutes no matrix value but
  # the Python version.
  # The stand-in's binary (T3.3), built once for the jobs that run the
  # contract tests and the warehouse legs over it, so no test builds it
  # under its own timeout.
  standin-binary:
    name: sdm-standin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: landing
    if: needs.landing.outputs.skip != 'true'
    defaults:
      run:
        working-directory: rust
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - run: cargo build -p sdm-testkit --bin sdm-standin --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdm-standin
          path: rust/target/debug/sdm-standin
          if-no-files-found: error

  contract-python-ref-pandas3:
    name: contract-python (ref-pandas3, duckdb)
    runs-on: ubuntu-latest
    # 120: the job took 80 to 90 minutes on Phase 2's last candidates and
    # one run on T2.16's ran past 90 (T2.1o first raised it from 60); the
    # cause is carried into Phase 3 (P2-T2.16-14).
    timeout-minutes: 60
    needs: [landing, native-wheel, native-test-ops, standin-binary]
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: ref-pandas3
      CELL_PINS: pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.3
    steps:
      - &contract-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, for the gate's checkpoint and its worktree.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - &contract-wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native
      # The cell's pins as constraints, so nothing installed after moves
      # them; DuckDB at the reference's version; the SQLite and Postgres
      # drivers (ADBC's SQLite, psycopg), one step for every database's job
      # (T2.1a); the engine, which a case's materialize needs, built from
      # source with the runner image's compilers and CMake.
      - &contract-install
        name: Install the cell
        run: |
          printf '%s\n' $CELL_PINS duckdb==1.5.6 > "$RUNNER_TEMP/cell.txt"
          pip install --upgrade pip
          pip install -c "$RUNNER_TEMP/cell.txt" $CELL_PINS duckdb==1.5.6 pyyaml jsonschema pytest pytest-xdist pytest-timeout==2.4.0 \
            ./packages/structured-data-models-api ./packages/structured-data-models-pql \
            './packages/structured-data-models-connectors[duckdb,sqlite,postgres]' \
            ./packages/structured-data-models-relational-engine "$(ls native/*.whl)[test]"
      # The provider conformance kit (T2.5, T2.6) asks the core one data
      # request at a time through the test-only fetch, which only the
      # test-ops build carries (E23): an interpreter over this job's
      # environment holding that build alone, which the kit's runner
      # (contract/runners/provider_kit.py) runs under (SDM_KIT_PYTHON)
      # when the shipped build it starts on has no test-only operations;
      # every other step runs the shipped build.
      - &contract-kit-wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel-test-ops
          path: native-test-ops
      - &contract-kit-python
        name: The test-ops build, for the provider kit
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/kit"
          "$RUNNER_TEMP/kit/bin/pip" install --quiet --no-deps --ignore-installed "$(ls native-test-ops/*.whl)"
          "$RUNNER_TEMP/kit/bin/python" -I -c 'import sdm_client._native as n; assert n.TEST_OPS'
          echo "SDM_KIT_PYTHON=$RUNNER_TEMP/kit/bin/python" >> "$GITHUB_ENV"
      # In parallel, each test file on one worker so its module fixtures are
      # built once; the results match a serial run's, test by test. The
      # files whose module fixtures hold a family run parsed share one
      # worker, one after the other (contract/tests/conftest.py), so this
      # runner's memory holds one at a time. A test past 10 minutes fails
      # with its stack, and a worker that dies ends the run rather than
      # leaving xdist waiting on it.
      # The checking tools' own tests run in tooling (contract) (T3.0).
      - &standin-binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdm-standin
          path: standin
      - &standin-path
        name: The stand-in's binary, built once (standin-binary)
        run: |
          chmod +x standin/sdm-standin
          echo "SDM_STANDIN=$PWD/standin/sdm-standin" >> "$GITHUB_ENV"
      - name: The runner's controls and the route tests
        run: python -m pytest contract/tests -q -m 'not tooling' -n auto --dist loadfile --timeout=600 --max-worker-restart=0
      # As in rust-test, whether the gate runs fails closed (T1.18); off
      # the phase branch, the candidate's own runners and comparator run.
      # Every cell gates, the floor's too (T1.18's own run alone reported
      # it, E65(c); the waiver went at T1.25b, every checkpoint descending
      # from T1.18's landing). tests/test_contract_ci_gate.py runs this
      # step's text.
      - &contract-gate
        name: gate (python-core, python-old)
        env:
          PYTHON: python
        run: |
          set -o pipefail
          where=$(python scripts/rust_core/ratchet.py where) || { echo 'gate: ratchet.py where failed'; exit 1; }
          if [ "${GITHUB_EVENT_NAME:-}" = push ] &&
            [[ "${GITHUB_REF_NAME:-}" =~ ^rust-core(-phase-(0|[1-9][0-9]*)(-.+)?)?$ ]]; then
            [ -n "$where" ] || { echo "gate: ratchet.py where named no base on $GITHUB_REF_NAME, where the gate must run"; exit 1; }
          fi
          mkdir -p gate-observations
          status=0
          if [ -z "$where" ]; then
            echo 'gate: no ratchet off the phase branch: the candidate runners and comparator'
            for runner in python-core python-old; do
              python -I contract/runners/run_python.py --mode $runner \
                --out gate-observations/$runner.jsonl contract/cases || exit 1
            done
            python scripts/rust_core/compare.py --cases contract/cases \
              --reference contract/reference/*.jsonl gate-observations/python-*.jsonl || status=$?
          else
            scripts/rust_core/gate.sh $where --run python-core,python-old --no-l0 \
              --out gate-observations || status=$?
          fi
          python - <<'EOF' || exit 1
          import json, os, pathlib, sys
          cell = os.environ['CELL']
          for runner in ('python-core', 'python-old'):
              path = pathlib.Path('gate-observations') / f'{runner}.jsonl'
              lines = path.read_text().splitlines() if path.is_file() else []
              try:
                  seen = {json.loads(line)['identity']['cell'] for line in lines}
              except (ValueError, RecursionError, KeyError, TypeError):
                  sys.exit(f'{runner}: an observation names no cell')
              if seen != {cell}:
                  sys.exit(f'{runner}: observed in {sorted(map(str, seen))}, not {cell}')
          print(f'every observation in {cell}')
          EOF
          exit $status
      # python-core's observations in the reference's cell, made by this
      # candidate's runner as rust-host's are by its host, for the
      # cross-host job (T1.29), whether or not the gate passed.
      - if: ${{ !cancelled() }}
        name: python-core's observations for the cross-host comparison
        run: |
          mkdir -p cross-host
          python -I contract/runners/run_python.py --mode python-core \
            --out cross-host/python-core.jsonl contract/cases
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observations-python-core
          path: cross-host/python-core.jsonl
          if-no-files-found: error

  # The checking tools' own tests (T3.0): every test carrying the
  # tooling marker, the ones that copy the checkout into a temporary
  # repository and rerun the gate, the ratchet or the comparator over the
  # corpus, minutes a test (scripts/rust_core/tooling_tests.py, which
  # fails on such a test without the marker). They run here once, on CI's
  # one Python, and only when the landing job's plan says the change can
  # reach them: a judging path (scripts/rust_core/judging-paths.txt), this
  # workflow, or such a test or a module one loads. Every other test of
  # contract/tests runs in contract-python (ref-pandas3), every other test
  # of the root suite in test and engine. One job per suite, each in the
  # environment the suite ran in before: contract-python's cell, and
  # engine's (the engine, the native wheel, a PostgreSQL server).
  tooling-contract:
    name: tooling (contract)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [landing, native-wheel, native-test-ops]
    if: needs.landing.outputs.skip != 'true' && needs.landing.outputs.tooling != 'false'
    env:
      CELL: ref-pandas3
      CELL_PINS: pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.3
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - *contract-wheel
      - *contract-install
      - *contract-kit-wheel
      - *contract-kit-python
      - name: The checking tools' tests in contract/tests
        run: python -m pytest contract/tests -q -m tooling -n auto --dist loadfile --timeout=600 --max-worker-restart=0

  tooling-root:
    name: tooling (root)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [landing, native-wheel]
    if: needs.landing.outputs.skip != 'true' && needs.landing.outputs.tooling != 'false'
    services:
      postgres: *postgres-service
    env:
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      # Every branch, for the gate's real bootstrap on the real history
      # (tests/test_t20_bootstrap.py).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native
      # engine's install, with the native wheel's test extra.
      - run: |
          pip install --upgrade pip 'ruff==0.16.*' pytest-timeout==2.4.0
          pip install -e './packages/structured-data-models-api' -e './packages/structured-data-models-pql' \
            -e './packages/structured-data-models-connectors[sqlite,duckdb,databricks,snowflake,postgres]' \
            pyyaml jsonschema
          pip install -e './packages/structured-data-models-relational-engine[test,explain]'
          pip install "$(ls native/*.whl)[test]"
          echo "SDM_TEST_CORE_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      # SDM_TEST_CORE_PYTHON: the interpreter holding the candidate's
      # client, which the handoff's tests run the cases on
      # (tests/test_t30_process.py).
      - name: The checking tools' tests in tests/
        run: python -m pytest tests -q -m tooling -n auto --dist loadfile --timeout=600 --max-worker-restart=0

  # The two core hosts on core fields (design, "Observations and
  # comparator"; T1.29): python-core's observations from
  # contract-python (ref-pandas3) and rust-host's from rust-test, compared
  # by compare.py in one run, so its core rule (the same operations, inputs,
  # fetches, description, request state, call and result) gates a
  # difference between the two hosts on every acceptance case in CI. It
  # compares two executions of one core, so a change both make alike is
  # not its to catch: contract/pinned/base.regression.core.json, the fixed
  # expectation both hosts are held to, stays for that (E81(c)). It fails
  # when either side's file is missing, empty or not that runner's, and
  # judges outcomes against the effective expectations on the phase
  # branches, their lanes and the epic branch, as the gate does. contract/tests/test_cross_host.py runs
  # this step's text.
  cross-host:
    name: cross-host (duckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Its own !cancelled() would run it on a landing commit, whose jobs
    # are left out (E131), so it says so itself.
    needs: [landing, rust-test, contract-python-ref-pandas3]
    if: ${{ !cancelled() && needs.landing.outputs.skip != 'true' }}
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: observations-python-core
          path: cross-host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: observations-rust-host
          path: cross-host
      - name: compare (python-core, rust-host)
        run: |
          pip install pyyaml jsonschema
          python - <<'EOF' || exit 1
          import json, pathlib, sys
          for runner in ('python-core', 'rust-host'):
              path = pathlib.Path('cross-host') / f'{runner}.jsonl'
              lines = path.read_text().splitlines() if path.is_file() else []
              if not lines:
                  sys.exit(f'cross-host: no observations of {runner}')
              try:
                  seen = {json.loads(line)['identity']['runner'] for line in lines}
              except (ValueError, RecursionError, KeyError, TypeError):
                  sys.exit(f'cross-host: an observation of {runner} names no runner')
              if seen != {runner}:
                  sys.exit(f'cross-host: {path} holds {sorted(map(str, seen))}, not {runner}')
          print('cross-host: python-core and rust-host observed')
          EOF
          where=$(python scripts/rust_core/ratchet.py where) || { echo 'cross-host: ratchet.py where failed'; exit 1; }
          expect=()
          if [ -n "$where" ]; then
            python scripts/rust_core/ratchet.py effective $where --out cross-host/effective.json || exit 1
            expect=(--expect cross-host/effective.json)
          fi
          python scripts/rust_core/compare.py --cases contract/cases \
            --reference contract/reference/*.jsonl ${expect[@]+"${expect[@]}"} \
            cross-host/python-core.jsonl cross-host/rust-host.jsonl

  contract-python-dbr17-pandas2:
    name: contract-python (dbr17-pandas2, duckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [landing, native-wheel]
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: dbr17-pandas2
      CELL_PINS: pandas==2.2.3 pyarrow==19.0.1 numpy==2.1.3
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - *contract-wheel
      - *contract-install
      - *contract-gate

  contract-python-floor-pandas2-2:
    name: contract-python (floor-pandas2.2, duckdb)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [landing, native-wheel]
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: floor-pandas2.2
      CELL_PINS: pandas==2.2.2 pyarrow==14.0.1 numpy==1.23.5
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - *contract-wheel
      - *contract-install
      - *contract-gate

  # The corpus on SQLite and Postgres (design choice 2, "CI"; T2.1a): each
  # cell once per database, `contract-python (<cell>, <database>)`. The
  # contract loader (contract/runners/databases.py) loads each case's DuckDB
  # tables into the database; the reference side is the committed
  # python-ref lines `<case>@<database>`, held to the cases
  # (compare.py --database), and the core's legs run there exactly when the
  # built core reports a provider for it (sdm_client._native.PROVIDERS),
  # judged against those lines: run_python.py legs holds the job to that
  # staging rule, and fails a job whose database has no case. python-old,
  # whose sampling on SQLite lacks the reference's seeding (main's
  # f0f324ce), does not run off DuckDB (T2.1a fix 4). Every cell runs both
  # databases (T2.4, for T2.2b and T2.3b), so a bug only the floor's
  # pandas, pyarrow or NumPy shows fails there: the reference's lines are
  # the reference cell's, so in another cell python-core's host fields
  # (schema, warnings, the frame) are reported against them (H1), and
  # every core rule gates. Only the Postgres jobs start the pinned
  # service, required there (SDM_REQUIRE_POSTGRES, H26). The reference
  # cell's jobs hand python-core's observations, and on Postgres the
  # answers to its fetches, to cross-host (<database>) and l4-goldens.
  contract-python-ref-pandas3-sqlite:
    name: contract-python (ref-pandas3, sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [landing, native-wheel, native-test-ops]
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: ref-pandas3
      CELL_PINS: pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.3
      DATABASE: sqlite
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - *contract-wheel
      - *contract-install
      # The reference side is python-ref's committed lines on the database
      # (the orchestrator's decision, T2.1a fix 4): held to the cases by
      # the comparator, and counted by the staging rule, so a job whose
      # database has no lines fails. python-old, the old route Phase 5
      # deletes, runs on DuckDB only. python-core runs on the database once
      # the built core reports a provider for it, judged against those
      # lines; on Postgres it records the server's answers to its fetches,
      # which rust-host replays in cross-host (postgres) (KO2-20, KO2-60).
      - &contract-database
        name: the reference side, and the core legs the core has a provider for
        run: |
          set -o pipefail
          out=database-observations
          mkdir -p "$out"
          reference=$(ls contract/reference/*.jsonl)
          python -I -c 'import json, sdm_client._native as n; print(json.dumps({"python-core": list(n.PROVIDERS)}))' \
            > "$out/providers.json" || exit 1
          observed=()
          record=()
          if [ "$DATABASE" = postgres ]; then record=(--record-fetches "$out/fetches.jsonl"); fi
          if python -I -c 'import json, os, sys; sys.exit(os.environ["DATABASE"] not in json.load(open(sys.argv[1]))["python-core"])' "$out/providers.json"; then
            python -I contract/runners/run_python.py --mode python-core --database "$DATABASE" \
              ${record[@]+"${record[@]}"} --out "$out/python-core.jsonl" contract/cases || exit 1
            observed+=("$out/python-core.jsonl")
          else
            echo "the core reports no $DATABASE provider: the reference side only"
          fi
          status=0
          python -I contract/runners/run_python.py legs --database "$DATABASE" \
            --providers "$out/providers.json" "$reference" "${observed[@]+"${observed[@]}"}" || status=1
          # The effective expectations on the phase branches, their lanes
          # and the epic branch, as the gate's and cross-host's: each line
          # of this database python-ref's committed line, moved by the
          # approved entries (T2.1e).
          where=$(python scripts/rust_core/ratchet.py where) || { echo 'ratchet.py where failed'; exit 1; }
          expect=()
          if [ -n "$where" ]; then
            python scripts/rust_core/ratchet.py effective $where --out "$out/effective.json" || exit 1
            expect=(--expect "$out/effective.json")
          fi
          # The candidate's register too, so an owner-approved entry's
          # more_exact fields count, as the gate's (T2.1e).
          python scripts/rust_core/compare.py --cases contract/cases --database "$DATABASE" \
            --reference "$reference" ${expect[@]+"${expect[@]}"} \
            --register docs/design/rust-core/register.yaml "${observed[@]+"${observed[@]}"}" || status=1
          python - "${observed[@]+"${observed[@]}"}" <<'EOF' || status=1
          import json, os, sys
          cell = os.environ['CELL']
          for path in sys.argv[1:]:
              lines = open(path, encoding='utf-8').read().splitlines()
              seen = {json.loads(line)['identity']['cell'] for line in lines}
              if seen != {cell}:
                  sys.exit(f'{path}: observed in {sorted(map(str, seen))}, not {cell}')
          print(f'every core observation in {cell}')
          EOF
          exit $status
      - *contract-kit-wheel
      - *contract-kit-python
      - &contract-kit
        name: The provider kit on this database's Python provider
        run: python -m pytest contract/tests/test_t25_provider_kit.py -q -k "$DATABASE"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observations-python-core-sqlite
          path: database-observations/python-core.jsonl
          if-no-files-found: error

  contract-python-ref-pandas3-postgres:
    name: contract-python (ref-pandas3, postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [landing, native-wheel, native-test-ops]
    services:
      postgres: *postgres-service
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: ref-pandas3
      CELL_PINS: pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.3
      DATABASE: postgres
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - *contract-wheel
      - *contract-install
      # Fails, never stands down, when the service is not there (H26).
      - &contract-postgres-required
        name: The Postgres service, and the contract loader on it
        run: python -m pytest contract/tests/test_postgres_required.py contract/tests/test_contract_loader.py -q
      # T2.3's regression and key vectors, on the service with the job's
      # DSN, failing where it is not there (SDM_REQUIRE_POSTGRES), in every
      # cell: the key vectors hold a run's host fields (the frame, the
      # warning classes) to its own cell's recording, and every core field,
      # statement and joined row to the reference cell's. The provider's own
      # test needs the test-ops build, and runs in native-test-ops. T2.21's
      # exact-key vectors too: an unconstrained numeric keyed or linked by
      # the caller, held to python-ref's catalog control on the service; and
      # T2.14c's numeric spellings, one number spelled two ways being one
      # key (P2-T2.14c-1).
      - &contract-postgres-vectors
        name: T2.3's Postgres regression and key vectors, T2.21's exact-key vectors and T2.14c's numeric spellings, on the service
        run: python -m pytest contract/tests/test_t23_postgres_regressions.py contract/tests/test_t23_postgres_keys.py contract/tests/test_t221_exact_keys.py contract/tests/test_t214c_numeric_spelling.py -q
      # T2.14b's Postgres JSON regressions (a document escaping a lone
      # surrogate kept as the reference keeps it), on the service, in the
      # reference cell (T2.14b fix 7).
      - name: T2.14b's Postgres JSON regressions, on the service
        run: python -m pytest contract/tests/test_t214b_regressions.py -k json -q
      - *contract-kit-wheel
      - *contract-kit-python
      - *contract-kit
      - *contract-database
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observations-python-core-postgres
          path: |
            database-observations/python-core.jsonl
            database-observations/fetches.jsonl
          if-no-files-found: error

  contract-python-dbr17-pandas2-sqlite:
    name: contract-python (dbr17-pandas2, sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [landing, native-wheel]
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: dbr17-pandas2
      CELL_PINS: pandas==2.2.3 pyarrow==19.0.1 numpy==2.1.3
      DATABASE: sqlite
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - *contract-wheel
      - *contract-install
      - *contract-database

  contract-python-dbr17-pandas2-postgres:
    name: contract-python (dbr17-pandas2, postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [landing, native-wheel]
    services:
      postgres: *postgres-service
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: dbr17-pandas2
      CELL_PINS: pandas==2.2.3 pyarrow==19.0.1 numpy==2.1.3
      DATABASE: postgres
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - *contract-wheel
      - *contract-install
      - *contract-postgres-required
      - *contract-postgres-vectors
      - *contract-database

  contract-python-floor-pandas2-2-sqlite:
    name: contract-python (floor-pandas2.2, sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [landing, native-wheel]
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: floor-pandas2.2
      CELL_PINS: pandas==2.2.2 pyarrow==14.0.1 numpy==1.23.5
      DATABASE: sqlite
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - *contract-wheel
      - *contract-install
      - *contract-database

  contract-python-floor-pandas2-2-postgres:
    name: contract-python (floor-pandas2.2, postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [landing, native-wheel]
    services:
      postgres: *postgres-service
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: floor-pandas2.2
      CELL_PINS: pandas==2.2.2 pyarrow==14.0.1 numpy==1.23.5
      DATABASE: postgres
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'
      - *contract-wheel
      - *contract-install
      - *contract-postgres-required
      - *contract-postgres-vectors
      - *contract-database

  # The two core hosts on SQLite and on Postgres (T2.4, for T2.2b and
  # T2.3b), as cross-host (duckdb) on DuckDB: python-core's observations
  # from contract-python (ref-pandas3, <database>) and rust-host's, held to
  # the staging rule (both hosts report the database, so each observes
  # every case python-ref's committed lines hold there) and compared by
  # compare.py --database in one run, each against python-ref's lines
  # moved by the approved entries and the two by the core rule. On SQLite
  # rust-host's observations are rust-test's (the dev-only rusqlite
  # provider); on Postgres rust-host replays here, with rust-test's build,
  # the answers the server gave python-core's fetches (KO2-20, KO2-60),
  # recorded in contract-python (ref-pandas3, postgres). Like cross-host
  # (duckdb), each fails when either side's file is missing, empty or not
  # that runner's, and runs whether the jobs it needs passed or not, so it
  # reports for itself.
  cross-host-sqlite:
    name: cross-host (sqlite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [landing, rust-test, contract-python-ref-pandas3-sqlite]
    if: ${{ !cancelled() && needs.landing.outputs.skip != 'true' }}
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      DATABASE: sqlite
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: observations-python-core-sqlite
          path: cross-host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: observations-rust-host-sqlite
          path: cross-host
      - &cross-host-database
        name: compare on the database (python-core, rust-host)
        # DuckDB and pyarrow, at the reference cell's versions, for the
        # comparator's read of a case's inputs as the database stores them
        # (compare.py's stored_schema).
        run: |
          pip install duckdb==1.5.6 pyarrow==25.0.1 pyyaml jsonschema
          python - <<'EOF' || exit 1
          import json, pathlib, sys
          for runner in ('python-core', 'rust-host'):
              path = pathlib.Path('cross-host') / f'{runner}.jsonl'
              lines = path.read_text().splitlines() if path.is_file() else []
              if not lines:
                  sys.exit(f'cross-host: no observations of {runner}')
              try:
                  seen = {json.loads(line)['identity']['runner'] for line in lines}
              except (ValueError, RecursionError, KeyError, TypeError):
                  sys.exit(f'cross-host: an observation of {runner} names no runner')
              if seen != {runner}:
                  sys.exit(f'cross-host: {path} holds {sorted(map(str, seen))}, not {runner}')
          print('cross-host: python-core and rust-host observed')
          EOF
          reference=$(ls contract/reference/*.jsonl)
          printf '{"python-core": ["%s"], "rust-host": ["%s"]}\n' "$DATABASE" "$DATABASE" \
            > cross-host/providers.json
          status=0
          python -I contract/runners/run_python.py legs --database "$DATABASE" \
            --providers cross-host/providers.json "$reference" \
            cross-host/python-core.jsonl cross-host/rust-host.jsonl || status=1
          where=$(python scripts/rust_core/ratchet.py where) || { echo 'cross-host: ratchet.py where failed'; exit 1; }
          expect=()
          if [ -n "$where" ]; then
            python scripts/rust_core/ratchet.py effective $where --out cross-host/effective.json || exit 1
            expect=(--expect cross-host/effective.json)
          fi
          python scripts/rust_core/compare.py --cases contract/cases --database "$DATABASE" \
            --reference "$reference" ${expect[@]+"${expect[@]}"} \
            cross-host/python-core.jsonl cross-host/rust-host.jsonl || status=1
          exit $status

  # Each warehouse leg offline (Phase 3 design, choice 2; T3.3): python-core
  # on the leg's stand-in (sdm-standin; Lakebase's is the Postgres service),
  # held by compare.py to the old client's reference line its C-1 capture
  # holds (contract/captures/<leg>/), Lakebase's to the Postgres line until
  # its capture exists. A case with no capture on the leg yet is listed
  # pending live, never passed; a leg the core reports no provider for yet
  # is listed and judged once its package adds the provider (the staging
  # rule, T3.2).
  contract-python-ref-pandas3-legs:
    name: contract-python (ref-pandas3, ${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [landing, native-wheel, native-test-ops, standin-binary]
    if: ${{ !cancelled() && needs.landing.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        leg: [databricks-sql, databricks-spark, snowflake, lakebase]
    services:
      postgres: *postgres-service
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      CELL: ref-pandas3
      CELL_PINS: pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.3
      DATABASE: ${{ matrix.leg }}
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - *contract-wheel
      - *contract-install
      - *standin-binary
      - *standin-path
      - name: python-core on the leg, offline, against the old client's answers
        run: |
          set -o pipefail
          out=leg-observations
          mkdir -p "$out"
          python -I contract/runners/captures.py references --leg "$DATABASE" \
            --cases contract/cases --reference "$(ls contract/reference/*.jsonl)" \
            --out "$out/reference.jsonl" --files "$out/cases.txt" || exit 1
          : > "$out/python-core.jsonl"
          if ! python -I -c 'import os, sys, sdm_client._native as n; sys.exit(os.environ["DATABASE"] not in n.PROVIDERS)'; then
            echo "the core reports no $DATABASE provider yet: judged once its package adds it"
            exit 0
          fi
          if [ ! -s "$out/cases.txt" ]; then
            echo "no case has a reference on $DATABASE yet: every one is pending live"
            exit 0
          fi
          mapfile -t files < "$out/cases.txt"
          python -I contract/runners/run_python.py --mode python-core --database "$DATABASE" \
            --out "$out/python-core.jsonl" "${files[@]}" || exit 1
          where=$(python scripts/rust_core/ratchet.py where) || { echo 'ratchet.py where failed'; exit 1; }
          expect=()
          if [ -n "$where" ]; then
            python scripts/rust_core/ratchet.py effective $where --out "$out/effective.json" || exit 1
            expect=(--expect "$out/effective.json")
          fi
          python scripts/rust_core/compare.py --cases contract/cases --database "$DATABASE" \
            --reference "$out/reference.jsonl" ${expect[@]+"${expect[@]}"} \
            --register docs/design/rust-core/register.yaml "$out/python-core.jsonl"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observations-python-core-${{ matrix.leg }}
          path: leg-observations/
          if-no-files-found: error

  # rust-host on each warehouse leg (T3.3): its observations, made in
  # process over the stand-in, held to the same reference lines as
  # python-core's; a leg rust-host reports no provider for yet
  # (sdm-contract-run --providers) is listed, judged once its package adds
  # it.
  cross-host-legs:
    name: cross-host (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [landing, contract-python-ref-pandas3-legs]
    if: ${{ !cancelled() && needs.landing.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        leg: [databricks-sql, databricks-spark, snowflake, lakebase]
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      DATABASE: ${{ matrix.leg }}
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: observations-python-core-${{ matrix.leg }}
          path: cross-host
      - name: compare on the leg (python-core, rust-host)
        run: |
          pip install duckdb==1.5.6 pyarrow==25.0.1 pyyaml jsonschema
          # The databases rust-host has a provider for: sdm-testkit's
          # PROVIDERS, which sdm-contract-run --providers prints, read from
          # its source so the job builds nothing it would not run.
          if ! python - <<'EOF'
          import os, re, sys
          text = open('rust/crates/sdm-testkit/src/lib.rs', encoding='utf-8').read()
          found = re.search(r'pub const PROVIDERS: &\[&str\] = &\[([^\]]*)\]', text)
          if found is None:
              sys.exit('sdm-testkit names no PROVIDERS')
          sys.exit(os.environ['DATABASE'] not in re.findall(r'"([^"]+)"', found.group(1)))
          EOF
          then
            echo "rust-host reports no $DATABASE provider yet: judged once its package adds it"
            exit 0
          fi
          if [ ! -s cross-host/cases.txt ]; then
            echo "no case has a reference on $DATABASE yet: every one is pending live"
            exit 0
          fi
          mapfile -t files < cross-host/cases.txt
          (cd rust && cargo run -q -p sdm-testkit --bin sdm-contract-run --locked -- \
            --database "$DATABASE" --out ../cross-host/rust-host.jsonl "${files[@]/#/../}") || exit 1
          where=$(python scripts/rust_core/ratchet.py where) || { echo 'cross-host: ratchet.py where failed'; exit 1; }
          expect=()
          if [ -n "$where" ]; then
            python scripts/rust_core/ratchet.py effective $where --out cross-host/effective.json || exit 1
            expect=(--expect cross-host/effective.json)
          fi
          python scripts/rust_core/compare.py --cases contract/cases --database "$DATABASE" \
            --reference cross-host/reference.jsonl ${expect[@]+"${expect[@]}"} \
            cross-host/python-core.jsonl cross-host/rust-host.jsonl

  cross-host-postgres:
    name: cross-host (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [landing, rust-test, contract-python-ref-pandas3-postgres]
    if: ${{ !cancelled() && needs.landing.outputs.skip != 'true' }}
    env:
      SDM_PUSH_BASE: ${{ needs.landing.outputs.base }}
      DATABASE: postgres
    steps:
      - *contract-checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: observations-python-core-postgres
          path: cross-host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdm-contract-run
          path: rust-host
      # rust-host on Postgres: each case that runs there, its fetches
      # answered from python-core's recording, each one held to the fetch
      # recorded at its position, so a change to what the core asks shows
      # as a recording to make again, never as stale rows (sdm-testkit's
      # replay); each observation keyed `<case>@postgres`. An artifact
      # keeps no file mode.
      - name: rust-host on Postgres, replaying python-core's recorded fetches
        run: |
          chmod +x rust-host/sdm-contract-run
          rust-host/sdm-contract-run --replay cross-host/fetches.jsonl \
            --out cross-host/rust-host.jsonl contract/cases
      - *cross-host-database

  # L4 (design, locked check 3; T2.4): each database's SQL goldens,
  # sdm-data's tests/<database>_goldens.rs, every statement the dialect
  # renders for the contract cases pinned verbatim beside its request. Each
  # golden must be what the dialect renders, so a SQL change without a
  # golden update fails; and every fetch python-core's run of the cases on
  # that database made here (from contract-python (ref-pandas3,
  # <database>), which executed each statement on the database, the
  # pinned Postgres service on Postgres, and held its result to the
  # reference's) must be a golden with its statements, so the goldens are
  # the SQL the run executed. A run named here but missing, empty or
  # holding no fetch on the database fails (tests/goldens/mod.rs). Only
  # sdm-data's tests are built: no DuckDB, no Python.
  l4-goldens:
    name: l4-goldens (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - landing
      - contract-python-ref-pandas3
      - contract-python-ref-pandas3-sqlite
      - contract-python-ref-pandas3-postgres
    if: ${{ !cancelled() && needs.landing.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: duckdb
            observations: observations-python-core
          - database: sqlite
            observations: observations-python-core-sqlite
          - database: postgres
            observations: observations-python-core-postgres
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          save-if: ${{ env.SAVE_CACHES == 'true' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.observations }}
          path: l4
      - name: The goldens, and the run held to them
        env:
          SDM_L4_OBSERVATIONS: ${{ github.workspace }}/l4/python-core.jsonl
        run: cargo test -p sdm-data --locked --test ${{ matrix.database }}_goldens

  # L5 (design, locked check 4; KO2-47; T2.4), in every cell, so pandas 2
  # and 3 and each cell's pyarrow and NumPy: tests_test_ops's
  # test_l5_conversion.py on the test-ops build, which takes the core's
  # test-only fetch, beside the pinned Postgres service. A table of each
  # type of the type map, built on DuckDB and loaded into SQLite and
  # Postgres by the contract loader, read through each database's
  # provider and admitted by the core: each column's Arrow type is the
  # conversion table's (a unit or scale change in one driver's path fails,
  # seeded), its values are what the database's own driver reads, the
  # types all three store as their own reach the core as identical Arrow,
  # and each type an engine stores in another form is the type map's,
  # printed per engine; and each layout of the result the core hands the
  # host is presented by to_pandas() as the presentation table says for
  # this pandas major. pytz is for DuckDB's own read of a TIMESTAMPTZ.
  l5-conversion:
    name: l5-conversion (${{ matrix.cell }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [landing, native-test-ops]
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: floor-pandas2.2
            python: '3.10'
            pins: pandas==2.2.2 pyarrow==14.0.1 numpy==1.23.5
          - cell: dbr17-pandas2
            python: '3.12'
            pins: pandas==2.2.3 pyarrow==19.0.1 numpy==2.1.3
          - cell: ref-pandas3
            python: '3.12'
            pins: pandas==3.0.6 pyarrow==25.0.1 numpy==2.5.3
    services:
      postgres: *postgres-service
    env:
      SDM_POSTGRES_TEST_DSN: postgresql://postgres:postgres@localhost:5432/sdm_test
      SDM_REQUIRE_POSTGRES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel-test-ops
          path: native-test-ops
      - name: L5's conversion and presentation tables
        env:
          PINS: ${{ matrix.pins }}
        run: |
          printf '%s\n' $PINS duckdb==1.5.6 > "$RUNNER_TEMP/cell.txt"
          python -m venv /tmp/l5
          /tmp/l5/bin/pip install --quiet -c "$RUNNER_TEMP/cell.txt" $PINS duckdb==1.5.6 pytz pytest \
            ./packages/structured-data-models-api ./packages/structured-data-models-pql \
            './packages/structured-data-models-connectors[sqlite,postgres]' \
            "$(ls native-test-ops/*.whl)"
          /tmp/l5/bin/python -m pytest packages/structured-data-models-client/tests_test_ops/test_l5_conversion.py \
            -q -s -p no:cacheprovider

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: native-wheel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # The image's compilers and CMake, which a source build uses; the
      # runner image carries them, so nothing is installed (CI1).
      - run: for tool in gcc g++ make cmake; do command -v "$tool"; done
      - run: pip install --upgrade pip build
      # Each distribution builds in an isolated environment holding only the
      # build backend. That catches what no test can, because it fails before a
      # test could run: a version resolved by importing the package root cannot
      # produce a wheel at all. The client is the exception: it carries the
      # core, so it is the wheel native-wheel built, taken as it is.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-wheel
          path: native
      - run: |
          for package in structured-data-models-api structured-data-models-pql structured-data-models-connectors structured-data-models-relational-engine; do
            echo "building $package"
            ( cd "packages/$package" && python -m build --wheel --outdir "$GITHUB_WORKSPACE/dist" . )
          done
          cp native/*.whl dist/
      # Every distribution carries the one version they are released together
      # at, read from what was just built rather than written here.
      - run: |
          python - <<'EOF'
          import pathlib, re, sys
          names = sorted(p.name for p in pathlib.Path('dist').glob('*.whl'))
          versions = {re.match(r'[^-]+-([^-]+)-', n).group(1) for n in names}
          print('\n'.join(names))
          if len(names) != 5:
              sys.exit(f'expected 5 wheels, built {len(names)}')
          if len(versions) != 1:
              sys.exit(f'distributions disagree on the version: {sorted(versions)}')
          pathlib.Path('dist/VERSION').write_text(versions.pop())
          EOF
      # Building each one proves nothing about installing them together. A pin
      # only one distribution carries makes the set unsatisfiable, and the
      # resolver is the only thing that says so.
      # The candidate's own wheels go in first, without their dependencies,
      # so the resolver sees them and never the published distributions of
      # the same version (T2.16, KO2-95).
      - run: |
          VERSION=$(cat dist/VERSION)
          pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          pip install --dry-run --find-links "$GITHUB_WORKSPACE/dist" \
            "structured-data-models-client[relational,sqlite,duckdb]==$VERSION"
      # The wheels only: dist/ also carries VERSION for the jobs downstream,
      # and twine refuses anything that is not a distribution.
      - run: pip install --upgrade twine && twine check dist/*.whl
      # The engine wheel built here is tagged linux_x86_64 and installs on no
      # other platform. The ones to install are engine-wheels' below.
      - run: rm dist/structured_data_models_relational_engine-*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/

  # The engine's wheels, from the same `[tool.cibuildwheel]` table the release
  # reads. One runner per platform and architecture, so every wheel is
  # smoke-tested on the machine it targets.
  engine-wheels:
    # Every job has a ceiling (tests/test_ci_workflow.py); main's job had
    # none. One engine build per interpreter, each platform and arch on its
    # own runner. Not on a test author's branch (the landing job's plan,
    # T3.0), nor the runtime cells after it.
    timeout-minutes: 60
    needs: [landing, build]
    if: needs.landing.outputs.skip != 'true' && needs.landing.outputs.full != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            archs: CIBW_ARCHS_LINUX=x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            archs: CIBW_ARCHS_LINUX=aarch64
          - name: macos-arm64
            runner: macos-15
            archs: CIBW_ARCHS_MACOS=arm64
          # macos-13 was retired in December 2025. x86_64 macOS ends with the
          # macOS 15 image in autumn 2027, and this row ends with it.
          - name: macos-x86_64
            runner: macos-15-intel
            archs: CIBW_ARCHS_MACOS=x86_64
          - name: windows-amd64
            runner: windows-2022
            archs: CIBW_ARCHS_WINDOWS=AMD64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The engine pins its siblings by exact version, which exist only as
      # wheels on disk; see the release workflow.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: _sibling_wheels
      # Only Linux runs in a container, where the engine's
      # `[tool.cibuildwheel.linux]` already names /project/_sibling_wheels.
      - name: Point the wheel test environments at the sibling wheels
        shell: bash
        run: |
          echo "${{ matrix.archs }}" >> "$GITHUB_ENV"
          case "${{ runner.os }}" in
            Linux) ;;
            # cibuildwheel layers its own `environment` over the host's, so a
            # plain variable reaches the build and test environments without
            # displacing what the engine's pyproject sets per platform.
            *) echo "PIP_FIND_LINKS=${{ github.workspace }}/_sibling_wheels" >> "$GITHUB_ENV" ;;
          esac

      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          package-dir: packages/structured-data-models-relational-engine
          output-dir: wheelhouse

      # A wheel built by the wrong compiler passes every other check here, so
      # the evidence has to come from the wheel. MinGW's runtime travelling
      # inside one means CMake found GCC where MSVC was intended. Every wheel
      # is read, and an empty wheelhouse fails rather than reporting nothing
      # found.
      - name: No MinGW runtime rode along in a Windows wheel
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::the Windows row produced no wheel to check"
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            names=$(unzip -Z1 "$wheel")
            if printf '%s\n' "$names" \
              | grep -qiE "lib(gcc_s_seh-1|stdc\+\+-6|winpthread-1)[^/]*\.dll"; then
              echo "::error::$(basename "$wheel") was built with MinGW, not MSVC"
              printf '%s\n' "$names" | grep -iE "\.dll$"
              exit 1
            fi
          done
          echo "${#wheels[@]} Windows wheels, no MinGW runtime in any of them"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-wheels-${{ matrix.name }}
          path: wheelhouse/

  # The suite has only ever run against the source tree. What users install is
  # a wheel, and the difference is where packaging bugs live: a module left out
  # of `packages.find`, a `py.typed` that never shipped. This runs from a
  # directory where the source tree is not importable.
  installed-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      # The candidate's own wheels first, without their dependencies, as
      # runtime-install installs them: --find-links alone lets pip take a
      # published distribution of the same version from the index instead
      # (it took the published connectors, whose duckdb extra admits 2.0;
      # T2.16), so the job would test that rather than the candidate.
      - run: |
          pip install --upgrade pip pytest requests-mock
          VERSION=$(cat dist/VERSION)
          pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          pip install --find-links "$GITHUB_WORKSPACE/dist" \
            "structured-data-models-client[sqlite,duckdb]==$VERSION"
      - name: The installed distribution is what gets imported, and it is typed
        working-directory: /tmp
        run: |
          python - <<'EOF'
          import pathlib
          import predictive_query, sdm_api, sdm_client, sdm_connectors

          for module in (sdm_api, sdm_client, sdm_connectors, predictive_query):
              location = pathlib.Path(module.__file__).resolve()
              assert 'site-packages' in location.parts, (
                  f'{module.__name__} was imported from {location}, not from '
                  f'the installed wheel, so this job is testing the checkout'
              )
              marker = location.parent / 'py.typed'
              assert marker.is_file(), (
                  f'{module.__name__} ships no py.typed in the built wheel, so '
                  f'a downstream type checker ignores its annotations entirely'
              )
          print('four distributions imported from site-packages, all typed')

          # The core is in the installed client, not merely in the checkout;
          # found without importing it, which only a core route does.
          import importlib.util
          spec = importlib.util.find_spec('sdm_client._native')
          assert spec and 'site-packages' in spec.origin, spec
          print(f'the core ships in the client: {pathlib.Path(spec.origin).name}')
          EOF
      - working-directory: /tmp
        run: |
          python -m pytest "$GITHUB_WORKSPACE/packages/structured-data-models-client/tests" -q \
            -m 'not live_nim and not live_warehouse' -p no:cacheprovider

  # The client's suite with every route forced onto the core (the Phase 2
  # flip dry run), nightly only: the owner's "2026-10-23 early: nightly
  # forced-route run". SDM_CORE_ROUTES names every path the build routes
  # onto the core (_routing.CORE_ROUTED); the watchdog names its failing
  # tests in a fix item.
  forced-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.fresh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - run: |
          pip install --upgrade pip pytest requests-mock
          VERSION=$(cat dist/VERSION)
          pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          pip install --find-links "$GITHUB_WORKSPACE/dist" \
            "structured-data-models-client[sqlite,duckdb]==$VERSION"
      - working-directory: /tmp
        run: |
          SDM_CORE_ROUTES=$(python -c 'from sdm_client._routing import CORE_ROUTED; print(",".join(sorted(CORE_ROUTED)))')
          export SDM_CORE_ROUTES
          python -m pytest "$GITHUB_WORKSPACE/packages/structured-data-models-client/tests" -q -rf \
            -m 'not live_nim and not live_warehouse' -p no:cacheprovider

  # The install on each promised Databricks runtime's own packages
  # (decisions KO2-37, KO2-38). Six cells cover the ten runtimes, a classic
  # LTS runtime and the serverless environment that ships its set (14.3 and
  # serverless 1, 15.4 and 2, 16.4 and 3, 17.3 and 4, then serverless 5 and
  # 6). Each preinstalls the runtime's Python (its minor version), NumPy,
  # pandas, pyarrow and PyYAML, as its release notes list them (pandas left
  # out where PyPI cannot install the runtime's own, PyYAML where the notes
  # list none), then runs the install
  # line docs/get-started/installation.md gives, verbatim but for the
  # notebook's %, with keep_numpy made as the guide makes it. The
  # candidate's wheels stand in for the published ones of the same version,
  # installed first without their dependencies, so the line itself is
  # unchanged and must leave them in place. The install must leave the
  # runtime's NumPy as it was, bring pandas to the client's floor
  # (upgrading one below it, as on 14.3 and 15.4) and pass pip check; then
  # the binding's and the client's tests run in that environment. Offline:
  # no Databricks workspace, and only x86_64 (the live job matrix, both
  # architectures, re-runs on the epic before it merges, KO2-38).
  runtime-install:
    name: runtime-install (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, engine-wheels]
    strategy:
      fail-fast: false
      matrix:
        include:
          # 14.3's release notes list no PyYAML, so none is preinstalled.
          - runtime: dbr14.3
            python: '3.10'
            preinstalled: numpy==1.23.5 pandas==1.5.3 pyarrow==8.0.0
          - runtime: dbr15.4
            python: '3.11'
            preinstalled: numpy==1.23.5 pandas==1.5.3 pyarrow==14.0.1 PyYAML==6.0
          # 16.4 ships pandas 1.5.3, which Databricks built for Python 3.12:
          # PyPI has no wheel of it for 3.12, and its source does not build
          # there, so this cell starts with no pandas and the install line
          # must bring one at the floor, rather than a stand-in version.
          - runtime: dbr16.4
            python: '3.12'
            preinstalled: numpy==1.26.4 pyarrow==15.0.2 PyYAML==6.0.1
          - runtime: dbr17.3
            python: '3.12'
            preinstalled: numpy==2.1.3 pandas==2.2.3 pyarrow==19.0.1 PyYAML==6.0.2
          - runtime: serverless5
            python: '3.12'
            preinstalled: numpy==2.1.3 pandas==2.2.3 pyarrow==21.0.0 PyYAML==6.0.2
          - runtime: serverless6
            python: '3.12'
            preinstalled: numpy==2.3.4 pandas==2.3.3 pyarrow==21.0.0 PyYAML==6.0.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: engine-wheels-linux-x86_64
          path: engine
      - name: The runtime's own packages
        env:
          PREINSTALLED: ${{ matrix.preinstalled }}
        run: |
          python -m venv /tmp/runtime
          /tmp/runtime/bin/pip install --quiet --only-binary=:all: $PREINSTALLED
          /tmp/runtime/bin/pip freeze --all
      - name: The documented install line, the runtime's NumPy kept, and pip check
        id: install
        run: |
          . /tmp/runtime/bin/activate
          keep_numpy="numpy==$(python -c 'import numpy; print(numpy.__version__)')"
          pandas_before=$(python -c 'import importlib.metadata as m; print(m.version("pandas"))' 2>/dev/null || echo none)
          # The candidate's wheels stand in for the published ones of the
          # same version: installed first, without their dependencies, so
          # the line finds them satisfied and resolves everything else.
          tag=$(python -c 'import sys; print(f"cp{sys.version_info[0]}{sys.version_info[1]}")')
          candidate=$(ls dist/*.whl engine/*-"$tag"-*.whl)
          pip install --quiet --no-deps $candidate
          pip install --only-binary=:all: "structured-data-models-client[relational,databricks,databricks-serving]" $keep_numpy
          now="numpy==$(python -c 'import numpy; print(numpy.__version__)')"
          if [ "$now" != "$keep_numpy" ]; then
            echo "the install moved the runtime's NumPy: $keep_numpy, now $now" >&2
            exit 1
          fi
          pip check
          # A runtime's pandas below the client's floor (2.2.2, KO2-37) is
          # upgraded by the line; one at or above it is kept.
          pandas_after=$(python -c 'import importlib.metadata as m; print(m.version("pandas"))')
          echo "pandas: the runtime's $pandas_before, after the install $pandas_after"
          python -c 'import importlib.metadata as m; print("after the install:", ", ".join(f"{n} {m.version(n)}" for n in ("numpy", "pandas", "pyarrow", "PyYAML")))'
          if [ "$(printf '%s\n' 2.2.2 "$pandas_after" | sort -V | head -n 1)" != 2.2.2 ]; then
            echo "the install left pandas $pandas_after, below the client's floor 2.2.2" >&2
            exit 1
          fi
          # Still the candidate's wheels, as pip recorded their install.
          python - $candidate <<'EOF'
          import importlib.metadata, json, pathlib, sys
          for wheel in map(pathlib.Path, sys.argv[1:]):
              name = wheel.name.split('-')[0].replace('_', '-')
              record = importlib.metadata.distribution(name).read_text('direct_url.json')
              url = json.loads(record or '{}').get('url', '')
              if not url.endswith('/' + wheel.name):
                  sys.exit(f'{name} is no longer the candidate wheel {wheel.name}: {url!r}')
          EOF
          pip freeze --all
      - name: The binding's and the client's tests in the runtime
        run: |
          . /tmp/runtime/bin/activate
          # What the client's tests read their tables through, as
          # installed-wheel has it, NumPy kept.
          keep_numpy="numpy==$(python -c 'import numpy; print(numpy.__version__)')"
          pip install --quiet --only-binary=:all: pytest requests-mock \
            "structured-data-models-client[sqlite,duckdb]" $keep_numpy
          python -m pytest rust/bindings/sdm-py/tests/test_binding.py -q \
            -p no:cacheprovider --native-build production
          cd /tmp
          python -m pytest "$GITHUB_WORKSPACE/packages/structured-data-models-client/tests" -q \
            -m 'not live_nim and not live_warehouse' -p no:cacheprovider

  # The dependency inventory a consumer needs before accepting this into their
  # own supply chain, covering every connector extra that resolves without a
  # native toolchain.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist
      - run: |
          pip install --upgrade pip cyclonedx-bom
          VERSION=$(cat dist/VERSION)
          # The candidate's own wheels first, as installed-wheel installs
          # them (T2.16, KO2-95).
          pip install --no-deps "$GITHUB_WORKSPACE"/dist/*.whl
          pip install --find-links "$GITHUB_WORKSPACE/dist" \
            "structured-data-models-client[sqlite,duckdb,postgres,databricks,snowflake,s3]==$VERSION"
          cyclonedx-py environment --of JSON --validate -o dist/sbom.cyclonedx.json
          python -c "import json,sys; d=json.load(open('dist/sbom.cyclonedx.json')); names={c['name'] for c in d.get('components', [])}; missing={'structured-data-models-client','structured-data-models-api','structured-data-models-pql','structured-data-models-connectors'} - names; print(f'{len(names)} components'); sys.exit(f'SBOM missing {sorted(missing)}' if missing else 0)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom.cyclonedx.json

  # The timing guard (T3.0): every job's time in this run, recorded in the
  # ci-timing artifact, and each job held to its time limit over its last
  # three runs on the Rust core's branches: a job over 80% of its
  # timeout-minutes on two of them is named, as an error annotation and in
  # a fix item the orchestrator's heartbeat pulls
  # (scripts/rust_core/orchestration/ci_timing.py, run there to fetch the
  # newest items); no issue is
  # opened. It needs every other job, so it runs last
  # (tests/test_ci_workflow.py holds it to that). A named job does not fail
  # the run, so no candidate is refused for a time limit (the owner: no
  # hard budgets); the guard's own failure (status 2) does, and an API that
  # does not answer judges nothing.
  timing-guard:
    name: timing guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [landing, lint, hygiene, rust-lint, rust-deny, rust-test, native-wheel, native-test-ops, native-wheel-aarch64, binding, wheel-smoke, wheel-smoke-aarch64, typecheck, test, engine, contract-python-ref-pandas3, tooling-contract, tooling-root, cross-host, contract-python-dbr17-pandas2, contract-python-floor-pandas2-2, contract-python-ref-pandas3-sqlite, contract-python-ref-pandas3-postgres, contract-python-dbr17-pandas2-sqlite, contract-python-dbr17-pandas2-postgres, contract-python-floor-pandas2-2-sqlite, contract-python-floor-pandas2-2-postgres, cross-host-sqlite, cross-host-postgres, standin-binary, contract-python-ref-pandas3-legs, cross-host-legs, l4-goldens, l5-conversion, build, engine-wheels, installed-wheel, runtime-install, sbom]
    if: ${{ !cancelled() && needs.landing.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Every job within its time limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install pyyaml
          status=0
          python scripts/rust_core/orchestration/ci_timing.py --run "$GITHUB_RUN_ID" --out ci-timing || status=$?
          if [ "$status" = 1 ]; then
            cat ci-timing/ci-timing-*.md >> "$GITHUB_STEP_SUMMARY"
            echo 'timing guard: a job is near its limit, named above and in the fix item; the run is not failed for it'
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-timing
          path: ci-timing
          if-no-files-found: warn
          retention-days: 30
