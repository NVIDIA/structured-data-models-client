# Publishing to PyPI, without a stored credential.
#
# There is no API token in this workflow or in the repository's secrets. PyPI's
# Trusted Publishing exchanges this job's OIDC identity for a PyPI token minted
# on the spot and good for about fifteen minutes, which the upload then uses
# for every file. That token is worth stealing while it lives; what does not
# exist is a long-lived one sitting in a secret for anyone who ever gets read
# access to it.
#
# The same identity signs a PEP 740 attestation that a consumer can verify back
# to this repository. An attestation proves the upload came from a publisher
# this repository authorized. It does not pin the workflow or the tag: the
# verifier takes those from PyPI's own provenance and cross-checks only the
# repository, so a second Trusted Publisher configured here would verify just
# as cleanly.
#
# `publish` is the only job that can reach the publishing identity, because it
# is the only one with `id-token: write`. `build` has `contents: read` to check
# the tree out and `actions: read` to ask whether CI passed, and nothing more,
# so a compromised build dependency cannot upload anything itself. It can still
# decide what the privileged job uploads, because it is what produces the
# distributions; the split limits who holds the credential, not what gets built.
# `verify` adds no permission. `attach-sbom` has `contents: write`, which is
# what lets it create the GitHub Release and attach the inventory to it.
name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# Least privilege at the top: a job that needs more says so itself.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_dispatch can be started from any ref, and everything below reads
    # GITHUB_REF_NAME as if it were a tag. A branch called v1.2.0 would have
    # satisfied the version check and published from it; --verify-tag only runs
    # afterwards, in attach-sbom, which is too late to stop an upload. Refuse
    # here, where nothing has been built yet.
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      # The gate below asks the API whether CI passed on this commit, which
      # needs more than the empty default at the top of this file. Without it
      # `gh run list` is a 403, `set -e` stops the job, and no release can be
      # built at all.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag can be put on any commit, including one that never reached a
      # pull request. The gates run on `main` and on pull requests, so a tag
      # off `main` is a tag nothing has tested. Checked before the build,
      # because the upload decision is made from these artifacts.
      #
      # This check is not the whole control and cannot be. A tag runs the
      # workflow as it existed at the tagged commit, so a tag placed on a
      # commit from before this step existed would not run it. What stops
      # that is outside the repository: a tag ruleset restricting who may
      # create `v*`, and required reviewers on the `pypi` environment, which
      # gate the upload itself. This step makes the common mistake
      # impossible; those settings make the deliberate one hard.
      - name: The tag is on main, and main has passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit that has been reviewed and merged."
            exit 1
          fi
          # --branch main --event push, because a pull-request run of CI on
          # this same commit says the branch passed, not that main did.
          conclusion=$(gh run list --workflow CI --commit "$GITHUB_SHA" \
            --branch main --event push \
            --json conclusion --jq '[.[].conclusion] | first // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $GITHUB_SHA is '$conclusion', not success. Publishing a commit whose gates did not pass is the one thing this workflow must not do."
            exit 1
          fi
          echo "$GITHUB_SHA is on main and its CI passed"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build the four pure-Python distributions
        run: |
          python -m pip install --upgrade pip build
          for package in structured-data-models-api structured-data-models-pql structured-data-models-client structured-data-models-connectors; do
            ( cd "packages/$package" && python -m build --outdir "$GITHUB_WORKSPACE/dist" . )
          done

      # The engine pins its four siblings by exact version, and at this point in
      # a release those versions exist only in dist/, not on PyPI
      # yet, and will not be until the publish job runs. cibuildwheel's test
      # environment resolves from PyPI unless told otherwise, so without this
      # the smoke test fails with "structured-data-models-api was not found" and the release stops
      # before it can publish anything. cibuildwheel copies the directory it
      # runs from, the repository root, into the container as /project, and
      # the engine's `[tool.cibuildwheel.linux]` points pip at
      # /project/_sibling_wheels.
      - name: Stage the sibling wheels where the engine's test env can see them
        run: |
          mkdir -p _sibling_wheels
          cp dist/*.whl _sibling_wheels/

      # aarch64 is built under emulation on the x86-64 runner, the same way the
      # GitLab `wheels` job builds it, so the two cannot disagree on the set.
      # The image is pinned as well as the action. Left to its default, this
      # step pulls `tonistiigi/binfmt:latest` and runs it with `--privileged`
      # on the runner that then builds the native wheels, so a moving tag on
      # that image reaches the release even though the action cannot. Nothing
      # updates this digest automatically, since dependabot does not read a
      # workflow input; it is raised by hand with the action.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      # The engine is a native build and needs one wheel per interpreter and
      # platform. It is not optional: structured-data-models-client[relational] pins it by exact
      # version, so publishing the other four without it makes that extra
      # uninstallable for the release it names. What is built, and the smoke
      # test each wheel must pass, is the engine's `[tool.cibuildwheel]`.
      - name: Build the relational engine's wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: packages/structured-data-models-relational-engine
          output-dir: dist

      - name: Unstage them, so nothing but distributions reaches the upload
        if: always()
        run: rm -rf _sibling_wheels

      # The tag is the release. If it does not name the version the packages
      # carry, the wrong thing is about to be published under the right name.
      - name: The tag must match what the distributions declare
        run: |
          python - <<'EOF'
          import os, pathlib, re, sys

          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          built = sorted(p.name for p in pathlib.Path('dist').glob('*.whl'))
          print('\n'.join(built))

          # All five, every time. The four pure-Python distributions and the
          # engine are pinned to each other by exact version, so a release
          # missing one is a release whose extras cannot resolve. Read off the
          # tree rather than listed here, so adding or renaming one cannot
          # leave this behind.
          expected = {
              path.parent.name.replace('-', '_')
              for path in pathlib.Path('packages').glob('*/pyproject.toml')
          }
          if len(expected) != 5:
              sys.exit(f'expected 5 distributions, found {sorted(expected)}')
          present = {name.split('-')[0] for name in built}
          missing = expected - present
          if missing:
              sys.exit(f'refusing to publish without {sorted(missing)}')

          versions = {re.match(r'[^-]+-([^-]+)-', name).group(1) for name in built}
          if len(versions) != 1:
              sys.exit(f'distributions disagree on the version: {sorted(versions)}')
          built_version = versions.pop()
          if built_version != tag:
              sys.exit(f'tag v{tag} does not match the built version {built_version}')
          print(f'all five distributions built at {built_version}, matching the tag')
          EOF

      - name: Nothing malformed reaches the index
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # The dependency inventory a consumer needs before accepting this into
      # their own supply chain. Attached to the release, not regenerated later
      # from a tree that has moved on.
      - name: Software bill of materials
        run: |
          python -m pip install --upgrade cyclonedx-bom
          # --find-links dist for the same reason as the engine's test env: the
          # exact sibling pins resolve to the wheels just built, not to whatever
          # happens to be on PyPI. Without it this describes a previous release,
          # or fails outright before the first one.
          python -m pip install --find-links dist \
            "./packages/structured-data-models-client[relational,sqlite,duckdb,postgres,databricks,snowflake,s3]"
          cyclonedx-py environment --of JSON --validate -o dist/sbom.cyclonedx.json
          python -c "import json,sys; d=json.load(open('dist/sbom.cyclonedx.json')); names={c['name'] for c in d.get('components', [])}; missing={'structured-data-models-client','structured-data-models-api','structured-data-models-pql','structured-data-models-connectors','structured-data-models-relational-engine'} - names; print(f'{len(names)} components'); sys.exit(f'SBOM missing {sorted(missing)}' if missing else 0)"

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            { line = $0; sub(/[ \t\r]+$/, "", line) }
            line == "## " v || index(line, "## " v " - ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || {
            echo "CHANGELOG.md has no '## $version' entry" >&2
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # a protected environment, so a release is reviewable
    permissions:
      id-token: write          # the only privilege here, and the reason there is no token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      # The SBOM is a release asset, not something to upload to the index.
      - name: Keep only the distributions
        run: rm -f dist/sbom.cyclonedx.json dist/notes.md

      # The mutable layer inside the pinned action. This action is pinned by
      # commit, but it generates a Docker action whose image is
      # `ghcr.io/pypa/gh-action-pypi-publish:<the pinned sha>`, and a GHCR tag
      # is mutable however it is named. There is no input to pull it by digest,
      # so short of forking the action there is no supported way to pin it, and
      # repointing that tag would change the code that runs in the job holding
      # `id-token: write`. The trust boundary for the upload is therefore the
      # pypa organization, not just the commit below. Writing the upload by
      # hand to avoid it would put less-reviewed code in the same place, which
      # is the worse trade.
      #
      # It is not the only mutable thing the release runs. `ubuntu-latest` is
      # reimaged on its own schedule, and everything this workflow installs
      # from PyPI resolves at release time: `pip` itself, the build and
      # packaging tools, the PEP 517 build requirements behind them, the whole
      # dependency graph the SBOM step installs to inventory it, and the
      # verifier's own dependencies, which the pin below does not reach.
      # Pinning every `uses:` does not make a release hermetic and is not
      # claimed to.
      #
      # What this one does not leave unguarded is the bytes of the files it is
      # given: `verify` below checks what PyPI attested against the artifacts
      # `build` produced, so an image that altered one of them on its way to
      # the index fails there.
      - name: Publish with Trusted Publishing and attest the artifacts
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  # An attestation nobody checks is a claim. The release workflow signs these
  # files, so the release workflow is where the signature is checked. It cannot
  # run before anyone installs them, because an attestation is only on the
  # index once the upload is done; what it catches is a release whose
  # signatures are wrong, while the release is still minutes old and whoever
  # cut it is still watching.
  #
  # It checks the files `build` produced, not copies fetched back from PyPI.
  # The verifier takes either, and the difference matters here: the provenance
  # always comes from PyPI, so handing it the local artifact asks whether each
  # file this workflow built is byte-for-byte what PyPI attested. Handing it
  # `pypi:<name>` would download the attested file and compare it against its
  # own attestation, which passes by construction even if the upload step
  # swapped the bytes.
  #
  # The question it does not ask is whether PyPI holds anything else. It walks
  # the artifacts this build produced, not the release's file list on the
  # index, so an upload that published all of them faithfully and added a
  # sixth file would pass here. Catching that means diffing the index's file
  # set against a build manifest, which is a network call that can fail a
  # release for reasons that are not about signatures; the residual is named
  # rather than guarded.
  #
  # What it establishes is still narrower than it looks, and the prose
  # elsewhere is written to match: a PEP 740 attestation proves these exact
  # bytes were published by a Trusted Publisher of this repository and have not
  # been altered since. It is not build provenance, and `--repository` is the
  # only constraint the verifier accepts. The workflow filename in the
  # attestation comes from PyPI's own provenance rather than from anything
  # asserted here, so this does not distinguish one workflow in this repository
  # from another.
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Every distribution this build produced verifies against this repository
        run: |
          set -euo pipefail
          # Pinned, unlike the build-time tools above, because this one is the
          # check rather than the thing being checked: a verifier resolved at
          # release time could pass without verifying, or drop the subcommand
          # and block a release that is fine. Upstream says the CLI is not a
          # stable interface, so raise this deliberately. The pin is on this
          # package only; what it resolves underneath is not pinned.
          python -m pip install pypi-attestations==0.0.30
          # The same two files the publish job drops, for the same reason:
          # they are release assets and were never uploaded to the index.
          rm -f dist/sbom.cyclonedx.json dist/notes.md

          failed=0
          for path in dist/*; do
            name=$(basename "$path")
            verified=
            # A file is on PyPI the moment the upload returns, but its
            # provenance is served through a cache that can take a few seconds
            # to catch up, and the files do not all become visible at once.
            # Every file gets its own retries, so one slow entry cannot be
            # reported as unsigned.
            for attempt in 1 2 3 4 5; do
              if python -m pypi_attestations verify pypi \
                   --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                   "$path"; then
                verified=yes
                break
              fi
              sleep $((attempt * 10))
            done
            if [ -z "$verified" ]; then
              echo "::error::$name does not verify as published by $GITHUB_REPOSITORY"
              failed=1
            fi
          done
          exit $failed

  # The SBOM is generated during the build and stripped from the upload,
  # because PyPI takes distributions and nothing else. Without this job it
  # lived only in the Actions artifact, which expires, so the inventory a
  # consumer needs to accept this into their own supply chain existed for
  # ninety days and then did not. Attached to the release, where it lasts as
  # long as the release does.
  attach-sbom:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      # Pushing a tag creates a tag, not a Release, and `gh release upload`
      # needs the Release to exist. Creating it here rather than asking the
      # releaser to do it by hand keeps RELEASING.md's promise that the tag is
      # the only manual step. `--verify-tag` refuses to invent a release for a
      # tag that is not really there.
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/sbom.cyclonedx.json
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes-file dist/notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/sbom.cyclonedx.json \
            --repo "$GITHUB_REPOSITORY" --clobber
