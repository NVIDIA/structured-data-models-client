# Publishing to PyPI, without a credential that can be stolen.
#
# There is no API token anywhere in this workflow or in the repository's
# secrets. PyPI's Trusted Publishing exchanges this job's OIDC identity for a
# short-lived, single-use upload token, and the same identity signs a PEP 740
# attestation that a consumer can verify back to this workflow, this repository
# and this tag. A token in a secret proves that whoever holds it can upload; an
# attestation proves where the artifact came from.
#
# The release runs in two jobs on purpose. `build` has no privileges and no
# id-token, so a compromised build dependency cannot reach the publishing
# identity; `publish` has the identity and runs nothing but the upload action.
name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# Least privilege at the top: a job that needs more says so itself.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_dispatch can be started from any ref, and everything below reads
    # GITHUB_REF_NAME as if it were a tag. A branch called v1.2.0 would have
    # satisfied the version check and published from it; --verify-tag only runs
    # afterwards, in attach-sbom, which is too late to stop an upload. Refuse
    # here, where nothing has been built yet.
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      # The gate below asks the API whether CI passed on this commit, which
      # needs more than the empty default at the top of this file. Without it
      # `gh run list` is a 403, `set -e` stops the job, and no release can be
      # built at all.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A tag can be put on any commit, including one that never reached a
      # pull request. The gates run on `main` and on pull requests, so a tag
      # off `main` is a tag nothing has tested. Checked before the build,
      # because the upload decision is made from these artifacts.
      #
      # This check is not the whole control and cannot be. A tag runs the
      # workflow as it existed at the tagged commit, so a tag placed on a
      # commit from before this step existed would not run it. What stops
      # that is outside the repository: a tag ruleset restricting who may
      # create `v*`, and required reviewers on the `pypi` environment, which
      # gate the upload itself. This step makes the common mistake
      # impossible; those settings make the deliberate one hard.
      - name: The tag is on main, and main has passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit that has been reviewed and merged."
            exit 1
          fi
          # --branch main --event push, because a pull-request run of CI on
          # this same commit says the branch passed, not that main did.
          conclusion=$(gh run list --workflow CI --commit "$GITHUB_SHA" \
            --branch main --event push \
            --json conclusion --jq '[.[].conclusion] | first // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $GITHUB_SHA is '$conclusion', not success. Publishing a commit whose gates did not pass is the one thing this workflow must not do."
            exit 1
          fi
          echo "$GITHUB_SHA is on main and its CI passed"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build the four pure-Python distributions
        run: |
          python -m pip install --upgrade pip build
          for package in structured-data-models-api structured-data-models-pql structured-data-models-client structured-data-models-connectors; do
            ( cd "packages/$package" && python -m build --outdir "$GITHUB_WORKSPACE/dist" . )
          done

      # The engine pins its four siblings by exact version, and at this point in
      # a release those versions exist only in dist/, not on PyPI
      # yet, and will not be until the publish job runs. cibuildwheel's test
      # environment resolves from PyPI unless told otherwise, so without this
      # the smoke test fails with "structured-data-models-api was not found" and the release stops
      # before it can publish anything. cibuildwheel copies the directory it
      # runs from, the repository root, into the container as /project, and
      # the engine's `[tool.cibuildwheel.linux]` points pip at
      # /project/_sibling_wheels.
      - name: Stage the sibling wheels where the engine's test env can see them
        run: |
          mkdir -p _sibling_wheels
          cp dist/*.whl _sibling_wheels/

      # aarch64 is built under emulation on the x86-64 runner, the same way the
      # GitLab `wheels` job builds it, so the two cannot disagree on the set.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      # The engine is a native build and needs one wheel per interpreter and
      # platform. It is not optional: structured-data-models-client[relational] pins it by exact
      # version, so publishing the other four without it makes that extra
      # uninstallable for the release it names. What is built, and the smoke
      # test each wheel must pass, is the engine's `[tool.cibuildwheel]`.
      - name: Build the relational engine's wheels
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: packages/structured-data-models-relational-engine
          output-dir: dist

      - name: Unstage them, so nothing but distributions reaches the upload
        if: always()
        run: rm -rf _sibling_wheels

      # The tag is the release. If it does not name the version the packages
      # carry, the wrong thing is about to be published under the right name.
      - name: The tag must match what the distributions declare
        run: |
          python - <<'EOF'
          import os, pathlib, re, sys

          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          built = sorted(p.name for p in pathlib.Path('dist').glob('*.whl'))
          print('\n'.join(built))

          # All five, every time. The four pure-Python distributions and the
          # engine are pinned to each other by exact version, so a release
          # missing one is a release whose extras cannot resolve. Read off the
          # tree rather than listed here, so adding or renaming one cannot
          # leave this behind.
          expected = {
              path.parent.name.replace('-', '_')
              for path in pathlib.Path('packages').glob('*/pyproject.toml')
          }
          if len(expected) != 5:
              sys.exit(f'expected 5 distributions, found {sorted(expected)}')
          present = {name.split('-')[0] for name in built}
          missing = expected - present
          if missing:
              sys.exit(f'refusing to publish without {sorted(missing)}')

          versions = {re.match(r'[^-]+-([^-]+)-', name).group(1) for name in built}
          if len(versions) != 1:
              sys.exit(f'distributions disagree on the version: {sorted(versions)}')
          built_version = versions.pop()
          if built_version != tag:
              sys.exit(f'tag v{tag} does not match the built version {built_version}')
          print(f'all five distributions built at {built_version}, matching the tag')
          EOF

      - name: Nothing malformed reaches the index
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # The dependency inventory a consumer needs before accepting this into
      # their own supply chain. Attached to the release, not regenerated later
      # from a tree that has moved on.
      - name: Software bill of materials
        run: |
          python -m pip install --upgrade cyclonedx-bom
          # --find-links dist for the same reason as the engine's test env: the
          # exact sibling pins resolve to the wheels just built, not to whatever
          # happens to be on PyPI. Without it this describes a previous release,
          # or fails outright before the first one.
          python -m pip install --find-links dist \
            "./packages/structured-data-models-client[relational,sqlite,duckdb,postgres,databricks,snowflake,s3]"
          cyclonedx-py environment --of JSON --validate -o dist/sbom.cyclonedx.json
          python -c "import json,sys; d=json.load(open('dist/sbom.cyclonedx.json')); names={c['name'] for c in d.get('components', [])}; missing={'structured-data-models-client','structured-data-models-api','structured-data-models-pql','structured-data-models-connectors','structured-data-models-relational-engine'} - names; print(f'{len(names)} components'); sys.exit(f'SBOM missing {sorted(missing)}' if missing else 0)"

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # a protected environment, so a release is reviewable
    permissions:
      id-token: write          # the only privilege here, and the reason there is no token
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      # The SBOM is a release asset, not something to upload to the index.
      - name: Keep only the distributions
        run: rm -f dist/sbom.cyclonedx.json

      - name: Publish with Trusted Publishing and attest the artifacts
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # The SBOM is generated during the build and stripped from the upload,
  # because PyPI takes distributions and nothing else. Without this job it
  # lived only in the Actions artifact, which expires, so the inventory a
  # consumer needs to accept this into their own supply chain existed for
  # ninety days and then did not. Attached to the release, where it lasts as
  # long as the release does.
  attach-sbom:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/

      - uses: actions/checkout@v7

      # The release's notes are the changelog's entry for this version, not a
      # list of the commits that happen to be in it. RELEASING.md already
      # requires the entry, so a tag without one is a release mistake, and
      # failing here is cheaper than a release that reads like a diff.
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 == "## " v || index($0, "## " v " - ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || {
            echo "CHANGELOG.md has no '## $version' entry" >&2
            exit 1
          }

      # Pushing a tag creates a tag, not a Release, and `gh release upload`
      # needs the Release to exist. Creating it here rather than asking the
      # releaser to do it by hand keeps RELEASING.md's promise that the tag is
      # the only manual step. `--verify-tag` refuses to invent a release for a
      # tag that is not really there.
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -s dist/sbom.cyclonedx.json
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/sbom.cyclonedx.json \
            --repo "$GITHUB_REPOSITORY" --clobber
