# Publishing to PyPI through Kitmaker.
#
# Kitmaker owns NVIDIA's PyPI organization, and this project's open source
# review record commits to releasing through it. Kitmaker does not accept an
# upload; it fetches an artifact from a URL and publishes it itself, to pypi.org
# and pypi.nvidia.com together. So the release here is two steps: attach every
# distribution to the GitHub Release, then ask Kitmaker's Portal to publish from
# those asset URLs.
#
# Two consequences worth stating rather than discovering.
#
# There is a stored credential now. Kitmaker's Portal authenticates with a
# long-lived bearer token, so `KITMAKER_API_TOKEN` sits in this repository's
# secrets, which the previous Trusted Publishing setup deliberately avoided.
# It is held by one job, behind a protected environment, and it can publish
# only to the five Portal projects it owns.
#
# This workflow no longer signs what it ships. PEP 740 attestations are issued
# to whoever uploads, and that is Kitmaker now, so nothing here produces one
# naming this repository. Whether Kitmaker supplies its own is Kitmaker's to
# say. A consumer is left with NVIDIA's ownership of the PyPI project, which
# SECURITY.md states rather than dressing up.
#
# `build` has `contents: read` to check the tree out and `actions: read` to ask
# whether CI passed, and nothing more, so a compromised build dependency cannot
# publish anything itself. It can still decide what gets published, because it
# is what produces the distributions. `release` holds `contents: write` and the
# Kitmaker token together, because the GitHub Release and the PyPI publish have
# to be one approval; it is the only job behind the protected environment.
name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# Least privilege at the top: a job that needs more says so itself.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_dispatch can be started from any ref, and everything below reads
    # GITHUB_REF_NAME as if it were a tag. A branch called v1.2.0 would have
    # satisfied the version check and published from it; --verify-tag only runs
    # afterwards, in attach-sbom, which is too late to stop an upload. Refuse
    # here, where nothing has been built yet.
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      # The gate below asks the API whether CI passed on this commit, which
      # needs more than the empty default at the top of this file. Without it
      # `gh run list` is a 403, `set -e` stops the job, and no release can be
      # built at all.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag can be put on any commit, including one that never reached a
      # pull request. The gates run on `main` and on pull requests, so a tag
      # off `main` is a tag nothing has tested. Checked before the build,
      # because the upload decision is made from these artifacts.
      #
      # This check is not the whole control and cannot be. A tag runs the
      # workflow as it existed at the tagged commit, so a tag placed on a
      # commit from before this step existed would not run it. What stops
      # that is outside the repository: a tag ruleset restricting who may
      # create `v*`, and required reviewers on the `pypi` environment, which
      # gate the upload itself. This step makes the common mistake
      # impossible; those settings make the deliberate one hard.
      - name: The tag is on main, and main has passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit that has been reviewed and merged."
            exit 1
          fi
          # --branch main --event push, because a pull-request run of CI on
          # this same commit says the branch passed, not that main did.
          conclusion=$(gh run list --workflow CI --commit "$GITHUB_SHA" \
            --branch main --event push \
            --json conclusion --jq '[.[].conclusion] | first // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $GITHUB_SHA is '$conclusion', not success. Publishing a commit whose gates did not pass is the one thing this workflow must not do."
            exit 1
          fi
          echo "$GITHUB_SHA is on main and its CI passed"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build the four pure-Python distributions
        run: |
          python -m pip install --upgrade pip build
          for package in structured-data-models-api structured-data-models-pql structured-data-models-client structured-data-models-connectors; do
            ( cd "packages/$package" && python -m build --outdir "$GITHUB_WORKSPACE/dist" . )
          done

      # The engine pins its four siblings by exact version, and at this point in
      # a release those versions exist only in dist/, not on PyPI
      # yet, and will not be until the publish job runs. cibuildwheel's test
      # environment resolves from PyPI unless told otherwise, so without this
      # the smoke test fails with "structured-data-models-api was not found" and the release stops
      # before it can publish anything. cibuildwheel copies the directory it
      # runs from, the repository root, into the container as /project, and
      # the engine's `[tool.cibuildwheel.linux]` points pip at
      # /project/_sibling_wheels.
      - name: Stage the sibling wheels where the engine's test env can see them
        run: |
          mkdir -p _sibling_wheels
          cp dist/*.whl _sibling_wheels/

      # aarch64 is built under emulation on the x86-64 runner, the same way the
      # GitLab `wheels` job builds it, so the two cannot disagree on the set.
      # The image is pinned as well as the action. Left to its default, this
      # step pulls `tonistiigi/binfmt:latest` and runs it with `--privileged`
      # on the runner that then builds the native wheels, so a moving tag on
      # that image reaches the release even though the action cannot. Nothing
      # updates this digest automatically, since dependabot does not read a
      # workflow input; it is raised by hand with the action.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      # The engine is a native build and needs one wheel per interpreter and
      # platform. It is not optional: structured-data-models-client[relational] pins it by exact
      # version, so publishing the other four without it makes that extra
      # uninstallable for the release it names. What is built, and the smoke
      # test each wheel must pass, is the engine's `[tool.cibuildwheel]`.
      - name: Build the relational engine's wheels
        uses: pypa/cibuildwheel@adba99c781d3746d38b3a09b1cf797965bcb7fe6 # v4.3.0
        with:
          package-dir: packages/structured-data-models-relational-engine
          output-dir: dist

      - name: Unstage them, so nothing but distributions reaches the upload
        if: always()
        run: rm -rf _sibling_wheels

      # The tag is the release. If it does not name the version the packages
      # carry, the wrong thing is about to be published under the right name.
      - name: The tag must match what the distributions declare
        run: |
          python - <<'EOF'
          import os, pathlib, sys

          tag = os.environ['GITHUB_REF_NAME'].lstrip('v')
          wheels = sorted(p.name for p in pathlib.Path('dist').glob('*.whl'))
          sdists = sorted(p.name for p in pathlib.Path('dist').glob('*.tar.gz'))
          built = wheels + sdists
          print('\n'.join(built))

          # All five, every time. The four pure-Python distributions and the
          # engine are pinned to each other by exact version, so a release
          # missing one is a release whose extras cannot resolve. Read off the
          # tree rather than listed here, so adding or renaming one cannot
          # leave this behind.
          expected = {
              path.parent.name.replace('-', '_')
              for path in pathlib.Path('packages').glob('*/pyproject.toml')
          }
          if len(expected) != 5:
              sys.exit(f'expected 5 distributions, found {sorted(expected)}')
          present = {name.split('-')[0] for name in wheels}
          missing = expected - present
          if missing:
              sys.exit(f'refusing to publish without {sorted(missing)}')

          # Every file, not only the wheels: an sdist carrying a different
          # version passes a wheels-only check and is published anyway.
          versions = {
              name.split('-')[1]
              if name.endswith('.whl')
              else name.rsplit('-', 1)[1].removesuffix('.tar.gz')
              for name in built
          }
          if len(versions) != 1:
              sys.exit(f'distributions disagree on the version: {sorted(versions)}')
          built_version = versions.pop()
          if built_version != tag:
              sys.exit(f'tag v{tag} does not match the built version {built_version}')
          print(f'all five distributions built at {built_version}, matching the tag')
          EOF

      - name: Nothing malformed reaches the index
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # The dependency inventory a consumer needs before accepting this into
      # their own supply chain. Attached to the release, not regenerated later
      # from a tree that has moved on.
      - name: Software bill of materials
        run: |
          python -m pip install --upgrade cyclonedx-bom
          # --find-links dist for the same reason as the engine's test env: the
          # exact sibling pins resolve to the wheels just built, not to whatever
          # happens to be on PyPI. Without it this describes a previous release,
          # or fails outright before the first one.
          python -m pip install --find-links dist \
            "./packages/structured-data-models-client[relational,sqlite,duckdb,postgres,databricks,snowflake,s3]"
          cyclonedx-py environment --of JSON --validate -o dist/sbom.cyclonedx.json
          python -c "import json,sys; d=json.load(open('dist/sbom.cyclonedx.json')); names={c['name'] for c in d.get('components', [])}; missing={'structured-data-models-client','structured-data-models-api','structured-data-models-pql','structured-data-models-connectors','structured-data-models-relational-engine'} - names; print(f'{len(names)} components'); sys.exit(f'SBOM missing {sorted(missing)}' if missing else 0)"

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            { line = $0; sub(/[ \t\r]+$/, "", line) }
            line == "## " v || index(line, "## " v " - ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || {
            echo "CHANGELOG.md has no '## $version' entry" >&2
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  # Kitmaker fetches artifacts from a URL rather than accepting an upload, so
  # the GitHub Release exists to give it public asset URLs. It refuses private
  # assets, so this cannot publish while the repository is internal.
  #
  # Creating the release and publishing it are one gated job because the
  # release cannot be a draft. Split, declining the approval still left a
  # public release marked Latest, created by the ungated job that ran first.
  # Together, declining means nothing was created at all. A publish that is
  # approved and then fails does leave the release standing, which is
  # deliberate: Kitmaker may already have fetched some of those assets, and
  # `kitmaker-summary.txt` records what PyPI holds for each project. The cost is the Kitmaker token
  # sharing a job with `contents: write`.
  release:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # a protected environment, so a release is reviewable
    permissions:
      contents: write
    steps:
      # Before the download, because checkout cleans the working directory.
      # `kitmaker_release.py` ships in the repository, not in the artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - name: Attach every distribution and the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/sbom.cyclonedx.json
          test -s dist/notes.md
          # Pushing a tag creates a tag, not a Release, and `gh release upload`
          # needs the Release to exist. `--verify-tag` refuses to invent one for
          # a tag that is not really there.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --notes-file dist/notes.md
          fi
          # The SBOM is a release asset and was never meant for the index; the
          # notes are already the release body.
          rm -f dist/notes.md

          # Deliberately not `--clobber`: these builds are not byte
          # reproducible, so re-running would swap the assets for new bytes
          # while PyPI keeps the old, breaking the GitHub-to-PyPI comparison
          # SECURITY.md asks a consumer to make. An attached asset is left
          # alone. See RELEASING.md on re-running.
          # Not a process substitution: its exit status is not the one
          # `mapfile` returns, so a failed query would read as "nothing is
          # attached" and `set -e` would never see it.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > attached.txt
          mapfile -t attached < attached.txt
          for path in dist/*; do
            name=$(basename "$path")
            for existing in ${attached+"${attached[@]}"}; do
              if [ "$name" = "$existing" ]; then
                echo "already attached, left alone: $name"
                continue 2
              fi
            done
            gh release upload "$GITHUB_REF_NAME" "$path" --repo "$GITHUB_REPOSITORY"
          done

      - name: Publish each distribution through Kitmaker
        env:
          GH_TOKEN: ${{ github.token }}
          KITMAKER_API_TOKEN: ${{ secrets.KITMAKER_API_TOKEN }}
          PIC: ${{ vars.KITMAKER_PIC }}
        run: |
          set -euo pipefail
          : "${KITMAKER_API_TOKEN:?KITMAKER_API_TOKEN is not set}"
          : "${PIC:?KITMAKER_PIC is not set}"
          # `gh release view` lists whatever is attached, which on a rerun can
          # include assets this run did not build. The artifact `build` handed
          # over is the authority for what may be published, so the asset list
          # is filtered down to exactly its filenames.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.name)\t\(.url)"' > assets.tsv
          test -s assets.tsv
          python3 .github/workflows/kitmaker_release.py

      # Into the job log, so a failed release says where it got to without
      # anyone opening an artifact. The GitHub Release body is the changelog
      # entry and is not touched.
      - name: Print what each project ended up with
        if: always()
        run: cat kitmaker-summary.txt 2>/dev/null || true
