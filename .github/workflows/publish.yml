# Publishing to PyPI through Kitmaker.
#
# Kitmaker owns NVIDIA's PyPI organization, and this project's open source
# review record commits to releasing through it. Kitmaker does not accept an
# upload; it fetches an artifact from a URL and publishes it itself, to pypi.org
# and pypi.nvidia.com together. This workflow's job is to produce those URLs:
# build every distribution and attach it to the GitHub Release. Asking Kitmaker
# to publish from them is a separate step that a person runs, because Kitmaker's
# Portal is on NVIDIA's internal network and a GitHub-hosted runner cannot
# resolve it, let alone reach it. RELEASING.md says who runs that step and
# what it has to do; the procedure itself is not kept in a public tree.
#
# Two consequences worth stating rather than discovering.
#
# Nothing here can publish to an index. There is no stored publishing
# credential and no environment secret; the most this workflow can do is attach
# files to a Release. The approval on `pypi` still gates the job, because
# attaching the distributions is what makes them public and Kitmaker refuses
# private assets, so that approval is the last point before the artifacts are
# visible to anyone.
#
# This workflow does not sign what it ships. PEP 740 attestations are issued
# to whoever uploads, and that is Kitmaker, so nothing here produces one
# naming this repository. Whether Kitmaker supplies its own is Kitmaker's to
# say. A consumer is left with NVIDIA's ownership of the PyPI project, which
# SECURITY.md states rather than dressing up.
#
# `build` has `contents: read` to check the tree out and `actions: read` to ask
# whether CI passed, and nothing more, so a compromised build dependency cannot
# publish anything itself. It can still decide what gets published, because it
# is what produces the distributions, and `engine-wheels` and `assemble` can
# too, for the same reason; both hold `contents: read` alone. `release` holds
# `contents: write` to create the Release and attach to it, and is the only job
# behind the protected environment.
name: publish

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

# Least privilege at the top: a job that needs more says so itself.
permissions: {}

# Two runs for one tag, say a tag push and a `workflow_dispatch`, would build
# that version twice and attach the results to one release. Nothing would fail:
# the second run finds the first's assets already there and leaves them, so the
# release ends up holding one build while the other run's artifact holds
# different bytes for the same filenames. Not cancel-in-progress: a run that
# has started attaching has to finish, or the release keeps part of a build.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_dispatch can be started from any ref, and everything below
    # reads GITHUB_REF_NAME as if it were a release tag. A branch called
    # v1.2.0 would have satisfied the version check and published from it.
    # Refused here, where nothing has been built yet; the shape of the tag is
    # checked again with the versions, since this only tests the prefix.
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: read
      # The gate below asks the API whether CI passed on this commit, which
      # needs more than the empty default at the top of this file. Without it
      # `gh run list` is a 403, `set -e` stops the job, and no release can be
      # built at all.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A tag can be put on any commit, including one that never reached a
      # pull request. The gates run on `main` and on pull requests, so a tag
      # off `main` is a tag nothing has tested. Checked before the build,
      # because the upload decision is made from these artifacts.
      #
      # This check is not the whole control and cannot be. A tag runs the
      # workflow as it existed at the tagged commit, so a tag placed on a
      # commit from before this step existed would not run it. What stops
      # that is outside the repository: a tag ruleset restricting who may
      # create `v*`, and required reviewers on the `pypi` environment, which
      # gate the upload itself. This step makes the common mistake
      # impossible; those settings make the deliberate one hard.
      - name: The tag is on main, and main has passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit that has been reviewed and merged."
            exit 1
          fi
          # --branch main --event push, because a pull-request run of CI on
          # this same commit says the branch passed, not that main did.
          conclusion=$(gh run list --workflow CI --commit "$GITHUB_SHA" \
            --branch main --event push \
            --json conclusion --jq '[.[].conclusion] | first // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI for $GITHUB_SHA is '$conclusion', not success. Publishing a commit whose gates did not pass is the one thing this workflow must not do."
            exit 1
          fi
          echo "$GITHUB_SHA is on main and its CI passed"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Build the four pure-Python distributions
        run: |
          python -m pip install --upgrade pip build
          for package in structured-data-models-api structured-data-models-pql structured-data-models-client structured-data-models-connectors; do
            ( cd "packages/$package" && python -m build --outdir "$GITHUB_WORKSPACE/dist" . )
          done

      # The engine's wheels cannot be built here: each is native to the
      # machine that builds it, and this job is one Linux machine.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pure-distributions
          path: dist/

  # The same matrix CI runs, so a tag uploads the set a pull request proved.
  # Native on every row, which retires the QEMU step that built aarch64 here
  # and the privileged container image it pulled into the release path.
  #
  # The engine is not optional. `structured-data-models-client[relational]` pins it by exact
  # version, so publishing the other four without it makes that extra
  # uninstallable for the release it names.
  engine-wheels:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            archs: CIBW_ARCHS_LINUX=x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            archs: CIBW_ARCHS_LINUX=aarch64
          - name: macos-arm64
            runner: macos-15
            archs: CIBW_ARCHS_MACOS=arm64
          # macos-13 was retired in December 2025. x86_64 macOS ends with the
          # macOS 15 image in autumn 2027, and this row ends with it.
          - name: macos-x86_64
            runner: macos-15-intel
            archs: CIBW_ARCHS_MACOS=x86_64
          - name: windows-amd64
            runner: windows-2022
            archs: CIBW_ARCHS_WINDOWS=AMD64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The engine pins its siblings by exact version, and at this point in a
      # release those versions exist only as the artifact `build` uploaded.
      # The engine's `before-test` installs them by file before the engine, so
      # the smoke test tests these and not a published release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: _sibling_wheels

      - name: Build only this row's architecture
        shell: bash
        run: echo "${{ matrix.archs }}" >> "$GITHUB_ENV"

      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          package-dir: packages/structured-data-models-relational-engine
          output-dir: wheelhouse

      # A wheel built by the wrong compiler passes every other check here, so
      # the evidence has to come from the wheel. MinGW's runtime travelling
      # inside one means CMake found GCC where MSVC was intended. Every wheel
      # is read, and an empty wheelhouse fails rather than reporting nothing
      # found.
      - name: No MinGW runtime rode along in a Windows wheel
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(wheelhouse/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::the Windows row produced no wheel to check"
            exit 1
          fi
          for wheel in "${wheels[@]}"; do
            names=$(unzip -Z1 "$wheel")
            if printf '%s\n' "$names" \
              | grep -qiE "lib(gcc_s_seh-1|stdc\+\+-6|winpthread-1)[^/]*\.dll"; then
              echo "::error::$(basename "$wheel") was built with MinGW, not MSVC"
              printf '%s\n' "$names" | grep -iE "\.dll$"
              exit 1
            fi
          done
          echo "${#wheels[@]} Windows wheels, no MinGW runtime in any of them"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: engine-wheels-${{ matrix.name }}
          path: wheelhouse/

  # Every distribution in one directory, checked as a set. Split out of `build`
  # only because the engine's wheels now come from five machines; the steps
  # below are the ones that used to run there, unchanged.
  assemble:
    needs: [build, engine-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pure-distributions
          path: dist

      # Every engine row merged into the same directory. A pattern rather than
      # one step per platform, so adding a row to the matrix above does not
      # need a matching step here to be published.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: engine-wheels-*
          merge-multiple: true
          path: dist

      # The tag is the release. If it does not name the version the packages
      # carry, the wrong thing is about to be published under the right name.
      - name: The tag must match what the distributions declare
        run: |
          python - <<'EOF'
          import os, pathlib, re, sys

          ref = os.environ['GITHUB_REF_NAME']
          # `lstrip` would also have accepted `vv1.0.0`, and a dispatch can be
          # aimed at a tag called `1.0.0`.
          if not re.fullmatch(r'v\d+\.\d+\.\d+', ref):
              sys.exit(f'{ref} is not a release tag of the form v1.2.3')
          tag = ref.removeprefix('v')
          wheels = sorted(p.name for p in pathlib.Path('dist').glob('*.whl'))
          sdists = sorted(p.name for p in pathlib.Path('dist').glob('*.tar.gz'))
          built = wheels + sdists
          print('\n'.join(built))

          # All five, every time. The four pure-Python distributions and the
          # engine are pinned to each other by exact version, so a release
          # missing one is a release whose extras cannot resolve. Read off the
          # tree rather than listed here, so adding or renaming one cannot
          # leave this behind.
          expected = {
              path.parent.name.replace('-', '_')
              for path in pathlib.Path('packages').glob('*/pyproject.toml')
          }
          if len(expected) != 5:
              sys.exit(f'expected 5 distributions, found {sorted(expected)}')
          present = {name.split('-')[0] for name in wheels}
          missing = expected - present
          if missing:
              sys.exit(f'refusing to publish without {sorted(missing)}')

          # Naming the engine is not the same as building it everywhere. One
          # wheel satisfies the check above, so a row of `engine-wheels` that
          # produced a subset would publish an engine installable on fewer
          # platforms than the release claims, and nothing downstream would
          # notice. The interpreters are read from the engine's own
          # `[tool.cibuildwheel] build`; the platforms are the matrix that
          # built them.
          import tomllib

          engine = pathlib.Path(
              'packages/structured-data-models-relational-engine/pyproject.toml'
          )
          selector = tomllib.loads(engine.read_text())['tool']['cibuildwheel']
          interpreters = {
              part.split('-')[0] for part in selector['build'].split()
          }
          platforms = {
              'manylinux.*_x86_64',
              'manylinux.*_aarch64',
              'macosx_.*_arm64',
              'macosx_.*_x86_64',
              'win_amd64',
          }
          engine_wheels = [
              name
              for name in wheels
              if name.startswith('structured_data_models_relational_engine-')
          ]
          absent = sorted(
              f'{interpreter} {platform}'
              for interpreter in interpreters
              for platform in platforms
              if not any(
                  re.fullmatch(
                      rf'.*-{interpreter}-{interpreter}-{platform}\.whl', name
                  )
                  for name in engine_wheels
              )
          )
          if absent:
              sys.exit(f'the engine wheel matrix is incomplete: {absent}')
          print(
              f'{len(engine_wheels)} engine wheels, '
              f'{len(interpreters)} interpreters on {len(platforms)} platforms'
          )

          # Every file, not only the wheels: an sdist carrying a different
          # version passes a wheels-only check and is published anyway.
          versions = {
              name.split('-')[1]
              if name.endswith('.whl')
              else name.rsplit('-', 1)[1].removesuffix('.tar.gz')
              for name in built
          }
          if len(versions) != 1:
              sys.exit(f'distributions disagree on the version: {sorted(versions)}')
          built_version = versions.pop()
          if built_version != tag:
              sys.exit(f'tag v{tag} does not match the built version {built_version}')
          print(f'all five distributions built at {built_version}, matching the tag')
          EOF

      - name: Nothing malformed reaches the index
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      # The dependency inventory a consumer needs before accepting this into
      # their own supply chain. Attached to the release, not regenerated later
      # from a tree that has moved on.
      - name: Software bill of materials
        run: |
          python -m pip install --upgrade cyclonedx-bom
          # Every distribution from dist/, never by name and version alone:
          # after a partial upload, PyPI's release of this version resolves as
          # readily as the wheels being released, and this would describe it.
          # The engine has a wheel per platform, so pip picks this runner's
          # from dist/ and nowhere else.
          version="${GITHUB_REF_NAME#v}"
          python -m pip install --no-index --no-deps --find-links dist \
            "structured-data-models-relational-engine==$version"
          python -m pip install \
            "dist/structured_data_models_client-$version-py3-none-any.whl[relational,sqlite,duckdb,postgres,databricks,snowflake,s3]" \
            dist/structured_data_models_{api,pql,connectors}-$version-py3-none-any.whl
          cyclonedx-py environment --of JSON --validate -o dist/sbom.cyclonedx.json
          python -c "import json,sys; d=json.load(open('dist/sbom.cyclonedx.json')); names={c['name'] for c in d.get('components', [])}; missing={'structured-data-models-client','structured-data-models-api','structured-data-models-pql','structured-data-models-connectors','structured-data-models-relational-engine'} - names; print(f'{len(names)} components'); sys.exit(f'SBOM missing {sorted(missing)}' if missing else 0)"

      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            { line = $0; sub(/[ \t\r]+$/, "", line) }
            line == "## " v || index(line, "## " v " - ") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || {
            echo "CHANGELOG.md has no '## $version' entry" >&2
            exit 1
          }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  # Kitmaker fetches artifacts from a URL rather than accepting an upload, so
  # the GitHub Release exists to give it public asset URLs. It refuses private
  # assets, so this cannot publish while the repository is internal.
  #
  # The Release is created behind the approval rather than before it. Creating
  # it in an earlier ungated job would make every distribution public whether
  # or not anyone approved, and it cannot be a draft instead, because a draft's
  # asset URLs are private and Kitmaker could not fetch them. Declining the
  # approval therefore means nothing was created at all.
  release:
    needs: assemble
    runs-on: ubuntu-latest
    environment: pypi          # a protected environment, so a release is reviewable
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/

      - name: Attach every distribution and the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s dist/sbom.cyclonedx.json
          test -s dist/notes.md
          # Pushing a tag creates a tag, not a Release, and `gh release upload`
          # needs the Release to exist. `--verify-tag` refuses to invent one for
          # a tag that is not really there.
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Not Latest yet. Kitmaker needs public asset URLs, so the
            # release cannot be a draft and has to exist before anything is
            # published from it. Marking it Latest here would advertise a
            # version that is not on the index, so that is done by hand once
            # the Kitmaker publish has worked. This only withholds the
            # promotion: with no earlier release to stay Latest, GitHub still
            # reports the newest non-draft release as the latest one.
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --latest=false \
              --notes-file dist/notes.md
          fi
          # The SBOM is a release asset and was never meant for the index; the
          # notes are already the release body.
          rm -f dist/notes.md

          # Deliberately not `--clobber`: these builds are not byte
          # reproducible, so re-running would swap the assets for new bytes
          # while PyPI keeps the old, breaking the GitHub-to-PyPI comparison
          # SECURITY.md asks a consumer to make. An attached asset is left
          # alone. See RELEASING.md on re-running.
          # Not a process substitution: its exit status is not the one
          # `mapfile` returns, so a failed query would read as "nothing is
          # attached" and `set -e` would never see it.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' > attached.txt
          mapfile -t attached < attached.txt
          for path in dist/*; do
            name=$(basename "$path")
            for existing in ${attached+"${attached[@]}"}; do
              if [ "$name" = "$existing" ]; then
                echo "already attached, left alone: $name"
                continue 2
              fi
            done
            gh release upload "$GITHUB_REF_NAME" "$path" --repo "$GITHUB_REPOSITORY"
          done

      # The release is built and attached, and the person who approved this is
      # the one who has to finish it. What the index holds is deliberately not
      # asserted here: this job never asks, and a dispatch against a tag that
      # was already published would make any claim about it wrong.
      - name: Say what is left to do
        run: |
          {
            echo "### Attached, not published"
            echo
            echo "\`$GITHUB_REF_NAME\` is on the Releases page with every"
            echo "distribution and the SBOM attached. This workflow publishes"
            echo "nothing to PyPI; that is a separate step, run from inside"
            echo "NVIDIA's network. RELEASING.md says who runs it and what it"
            echo "has to do."
            echo
            echo "Mark this release Latest once the index has all five."
          } >> "$GITHUB_STEP_SUMMARY"
