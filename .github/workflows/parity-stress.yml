name: Live stress

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful full CI run for this exact commit (also use for live parity).
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: parity-shared-resources
  cancel-in-progress: false

jobs:
  parity:
    # Never expose source/model credentials to pull requests or arbitrary refs.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rust-core'
    runs-on: ${{ fromJSON(vars.PARITY_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 180
    environment: parity-live
    env:
      GH_TOKEN: ${{ github.token }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      PARITY_RUNNER_LABELS: ${{ vars.PARITY_RUNNER_LABELS }}
      SDM_T136_LIVE_ENDPOINT: ${{ vars.PARITY_GIANT_ENDPOINT }}
      PARITY_GIANT_MODEL_VERSION: ${{ vars.PARITY_GIANT_MODEL_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require dedicated live configuration
        env:
          PARITY_DIR: ${{ runner.temp }}/parity
          PARITY_CONFIG: ${{ secrets.PARITY_CONFIG_JSON }}
        run: |
          set -euo pipefail
          echo "PARITY_DIR=$PARITY_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PARITY_DIR/evidence"
          if [ -z "$PARITY_CONFIG" ]; then
            echo '::error::Dedicated parity-live configuration is missing; coverage is incomplete.'
            exit 1
          fi
          if [ -z "$PARITY_RUNNER_LABELS" ] || [ -z "$SDM_T136_LIVE_ENDPOINT" ] || [ -z "$PARITY_GIANT_MODEL_VERSION" ]; then
            echo '::error::Explicit high-memory runner and giant endpoint/version configuration are required.'
            exit 1
          fi
          python3 - <<'PYMEM'
          import pathlib
          available = int(next(line.split()[1] for line in pathlib.Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))
          if available < 24 * 1024 * 1024:
              raise SystemExit('Giant parity requires at least 24 GiB available RAM; choose a larger dedicated runner.')
          PYMEM
          umask 077
          printenv PARITY_CONFIG > "$PARITY_DIR/config.json"
      - uses: ./.github/actions/parity-artifacts
        with:
          ci-run-id: ${{ inputs.ci_run_id }}
          config: ${{ secrets.PARITY_CONFIG_JSON }}
      - name: Authenticate the giant route before allocating large values
        run: |
          "$PARITY_DIR/candidate/bin/python" tests/parity/resource_preflight.py \
            --config "$PARITY_DIR/config.json" --giant-endpoint "$SDM_T136_LIVE_ENDPOINT" \
            --out "$PARITY_DIR/evidence/preflight.json" \
            > "$PARITY_DIR/private/preflight.log" 2>&1
      - name: Validate giant values against the real model sequentially
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          SDM_T136_BIG: '1'
        run: |
          set -euo pipefail
          umask 077
          # Reuse the selected full CI run's production artifacts; never rebuild natives.
          # Do not print raw test diagnostics: transport errors may contain private URLs.
          "$PARITY_DIR/candidate/bin/python" - <<'PYGIANT'
          import json, os, pathlib, subprocess, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ['PARITY_DIR'])
          node = 'contract/tests/test_t136_host2_values.py::test_big_a_value_past_int32_offsets_on_the_core[big.blob.large]'
          commands = [
              ('python', [str(root / 'candidate/bin/python'), '-m', 'pytest', node, '-q', '--junitxml=' + str(root / 'giant-python.xml')]),
              ('java', ['mvn', '-B', '-f', 'java/pom.xml', '-Dtest=DuckDbLargeValueTest',
                        '-Dsdm.test.giant=true', '-Dsdm.test.giant.endpoint=' + os.environ['SDM_T136_LIVE_ENDPOINT'],
                        '-Dsdm.native.library=' + os.environ['PARITY_NATIVE'], 'test']),
          ]
          reports = []
          for language, command in commands:
              report = (pathlib.Path('java/target/surefire-reports/TEST-com.nvidia.sdm.DuckDbLargeValueTest.xml')
                        if language == 'java' else root / ('giant-' + language + '.xml'))
              report.unlink(missing_ok=True)
              with (root / ('giant-' + language + '.log')).open('w') as log:
                  completed = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT, check=False)
              counts = {'tests': 0, 'skipped': 0, 'failures': 0, 'errors': 0}
              try:
                  cases = list(ET.parse(report).getroot().iter('testcase'))
                  counts['tests'] = len(cases)
                  for field, tag in [('skipped', 'skipped'), ('failures', 'failure'), ('errors', 'error')]:
                      counts[field] = sum(case.find(tag) is not None for case in cases)
              except (OSError, ET.ParseError):
                  counts['errors'] = 1
              passed = completed.returncode == 0 and counts == {'tests': 1, 'skipped': 0, 'failures': 0, 'errors': 0}
              reports.append({'client': language, 'exit_code': completed.returncode, **counts,
                              'status': 'passed' if passed else 'failed'})
              (root / 'evidence/giant.json').write_text(json.dumps({
                  'candidate_commit': os.environ['GITHUB_SHA'],
                  'model_version': os.environ['PARITY_GIANT_MODEL_VERSION'],
                  'artifacts': json.loads((root / 'evidence/artifacts.json').read_text()),
                  'java_execution': 'source-equivalent-with-verified-packaged-jni',
                  'results': reports}, indent=2) + '\n')
          if any(report['status'] != 'passed' for report in reports):
              raise SystemExit('Giant real-model acceptance failed; private runner diagnostics retained outside uploaded evidence.')
          PYGIANT
      - name: Retain sanitized observations and matrix
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-stress-${{ github.sha }}
          path: ${{ runner.temp }}/parity/evidence/
          if-no-files-found: error
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$PARITY_DIR/config.json"
