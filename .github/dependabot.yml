# Actions are referenced by commit digest, so a moving tag cannot change which
# action code runs. A digest goes stale rather than wrong, which is why this
# exists: `github-actions` updates arrive weekly as reviewable pull requests,
# and dependabot rewrites the digest and the version comment together. It does
# not read a workflow input, so the binfmt image `publish.yml` pins there is
# raised by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The required checks install what uv.lock records, so a new release reaches
  # them only through one of these; the nightly CI run resolves the newest
  # releases on its own. `lockfile-only` moves the lock and never a package's
  # own bounds, which say what a user may install and are changed by hand.
  # Minor and patch releases come as one pull request a week; a major one
  # alone.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    groups:
      minor-and-patch:
        update-types: [minor, patch]
