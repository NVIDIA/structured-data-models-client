# Actions are referenced by commit digest, so a moving tag cannot change which
# action code runs. A digest goes stale rather than wrong, which is why this
# exists: `github-actions` updates arrive weekly as reviewable pull requests,
# and dependabot rewrites the digest and the version comment together. It does
# not read a workflow input, so the binfmt image `publish.yml` pins there is
# raised by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /packages/structured-data-models-client
    schedule:
      interval: weekly
