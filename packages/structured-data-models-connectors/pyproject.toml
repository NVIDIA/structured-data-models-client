[project]
name = "structured-data-models-connectors"
dynamic = ["version"]
authors = [
    {name = "NVIDIA"},
]
description = "Shared data-source connectors (connect, read, SQL quoting) for the structured-data-models-client and its engines"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "structured-data",
    "connectors",
    "sql",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # 2.2.2 is the first pandas built against NumPy 2. Below it pip resolves
    # cleanly and `pip check` passes, and the import fails with
    # "numpy.dtype size changed", because the break is an ABI the metadata
    # does not describe. pandas declares the NumPy it needs, so this floor
    # still leaves pip free to pick a release fitting a NumPy already there.
    "pandas>=2.2.2",
    # pyarrow is deliberately unbounded. It does not declare that 16 and
    # above need NumPy 2, so a floor here is not satisfied by resolution
    # alone: where NumPy is held at 1, as a Databricks runtime holds it and
    # `docs/get-started/installation.md` says to, a floor evicts that
    # runtime's working pyarrow 14 or 15 for a 26 that refuses to import.
    # Unbounded, the preinstalled one satisfies this and is left alone, and
    # a fresh install still resolves the newest.
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/structured-data-models-client"
Source = "https://github.com/NVIDIA/structured-data-models-client"
Issues = "https://github.com/NVIDIA/structured-data-models-client/issues"
Changelog = "https://github.com/NVIDIA/structured-data-models-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sqlite = [
    "adbc-driver-sqlite",
]
duckdb = [
    "duckdb>=1.5.0",
]
snowflake = [
    # 5.0 empties `DEFAULT_CONFIGURATION` and rewrites keyword names through
    # several maps, leaving the set it accepts unreadable: `network_timeout`
    # is accepted but named nowhere. This package checks a caller's keywords
    # against that set to catch a typo. 5.0 also deprecates the `_paramstyle`
    # the server-side binding sets. Lifting this wants a live Snowflake.
    "snowflake-connector-python>=4.8,<5",
]
databricks = [
    # 4.1.3 is the first release whose SEA route sends a session's
    # QUERY_TAGS, which marks structured-data-models-client's statements as sampling. From 4.0.1
    # it reads `user_agent_entry`, which carries the partner identifier.
    "databricks-sql-connector>=4.1.3",
    # A metric view's definition is YAML, and reading one fails without a
    # parser. Databricks Runtime 14.3 LTS ships none, so the client's
    # `databricks` extra, which points here, has to bring it.
    #
    # 6.0.1 is the first release with a 3.12 wheel. Below it only the 6.0
    # sdist remains, and it does not build against a current Cython, so a
    # resolver backtracking this far stops at a compile error.
    "pyyaml>=6.0.1",
    # For `sdm_connectors.databricks.warehouse`, which looks the warehouse up as
    # the caller's workspace client.
    "databricks-sdk>=0.89,<1.0",
]
postgres = [
    "psycopg[binary]>=3.1",
]
# `sdm_connectors.databricks.lakebase`. Plain psycopg, since the binary wheel's
# OpenSSL aborts on Databricks' aarch64 FIPS hosts; 0.89 added `postgres`.
lakebase = [
    "psycopg>=3.1",
    "databricks-sdk>=0.89,<1.0",
]
s3 = [
    "s3fs>=2023.12.0",
]
all = [
    "structured-data-models-connectors[sqlite,duckdb,postgres,snowflake,databricks,lakebase,s3]",
]
test = [
    "pytest",
    "moto[server]>=5",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdm_connectors*"]

[tool.setuptools.package-data]
"sdm_connectors" = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "sdm_connectors._version.__version__"}

[tool.pytest.ini_options]
markers = [
    "live_warehouse: needs a real Snowflake or Databricks warehouse",
    "socket: binds a local socket; deselect where that is not permitted",
]
testpaths = ["tests"]
addopts = ["-q"]
# An xfail that starts passing is a fixed bug, and should fail the run so it
# gets un-marked rather than sitting there silently.
xfail_strict = true

[tool.ruff]
# Inherit the workspace lint baseline so this package cannot silently opt out of
# it; see the root pyproject.toml for the shared rule set.
extend = "../../pyproject.toml"
line-length = 80
target-version = "py310"
