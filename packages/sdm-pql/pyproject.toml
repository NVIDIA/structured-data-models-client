[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdm-pql"
# The version lives in exactly one place per distribution: `_version.py`, a
# module holding a single literal and importing nothing. setuptools reads it
# statically, so building the wheel never imports the package, which matters
# because importing these roots pulls pandas, and a build backend that has to
# import pandas to learn a version number cannot produce a wheel at all.
dynamic = ["version"]
description = "Predictive Query Language parser and validator used inside the NVIDIA Structured Data Models client; not a supported API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "NVIDIA" }]
keywords = ["predictive-query", "pql", "structured-data", "relational", "dsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# This package parses and validates text; it loads no model, reads no
# warehouse and opens no socket.
dependencies = [
    # 4.13.2 exactly: the checked-in parser is ANTLR 4.13.2 output, and a
    # serialized ATN is only readable by the runtime that emitted it. 4.9.3,
    # which this used to pin, is published as a source distribution only, so
    # an environment installing with `--only-binary=:all:` cannot resolve it.
    "antlr4-python3-runtime==4.13.2",
    "numpy",
    "pandas",
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/structured-data-models-client"
Source = "https://github.com/NVIDIA/structured-data-models-client"
Issues = "https://github.com/NVIDIA/structured-data-models-client/issues"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = {attr = "predictive_query._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["predictive_query*"]

[tool.setuptools.package-data]
"predictive_query" = ["py.typed"]
"predictive_query.grammar" = ["*.g4", "*.interp", "*.tokens"]

[tool.ruff]
extend = "../../pyproject.toml"
# ANTLR's output, regenerated from the grammar rather than edited.
extend-exclude = ["src/predictive_query/grammar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = ["--color=yes"]
