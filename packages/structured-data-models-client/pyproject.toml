# The client carries sdm_client._native, built from rust/bindings/sdm-py.
# Maturin produces one cp310-abi3 wheel per supported platform.
[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "structured-data-models-client"
# maturin reads the version from sdm-py's Cargo.toml, the workspace's
# version; `_version.py` still holds the same literal for code that reads it,
# and a test holds these and the other two distributions equal.
dynamic = ["version"]
description = "One Python client for NVIDIA's structured-data foundation model NIMs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES-RUST.txt"]
requires-python = ">=3.10"
authors = [{ name = "NVIDIA" }]
keywords = ["structured-data", "foundation-model", "tabular", "relational"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Both models use the bundled Rust core. Arrow carries columnar data across
# the native boundary through the PyCapsule interface (available since 14.0.1).
dependencies = [
    "structured-data-models-api==1.0.0",
    "pandas>=2.2.2",
    "numpy>=1.23.5",
    "pyarrow>=14.0.1",
    # IANA zones must also be available on Windows and minimal containers.
    "tzdata>=2024.1",
    # The existing relational validator floor also supplies its error formatter.
    "pydantic>=2.7",
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/structured-data-models-client"
Source = "https://github.com/NVIDIA/structured-data-models-client"
Issues = "https://github.com/NVIDIA/structured-data-models-client/issues"
Changelog = "https://github.com/NVIDIA/structured-data-models-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Keep the existing installation spelling; both models now use the base runtime.
relational = []
# Warehouse drivers remain opt-in through the shared connectors package.
sqlite = ["structured-data-models-connectors[sqlite]==1.0.0"]
duckdb = ["structured-data-models-connectors[duckdb]==1.0.0"]
snowflake = ["structured-data-models-connectors[snowflake]==1.0.0"]
databricks = ["structured-data-models-connectors[databricks]==1.0.0"]
postgres = ["structured-data-models-connectors[postgres]==1.0.0"]
lakebase = ["structured-data-models-connectors[lakebase]==1.0.0"]
s3 = ["structured-data-models-connectors[s3]==1.0.0"]
# Reaching a model served on Databricks Model Serving. The one extra that names
# a third-party package directly: the transport that imports it lives in this
# distribution, not in the engine or the connectors. It is a way to reach a
# model rather than a backend to read, so `all` does not carry it; ask for it by
# name.
databricks-serving = ["databricks-sdk>=0.68.0,<1.0"]
# Running the models in this process rather than reaching a NIM. Like
# `databricks-serving` it is a way to reach a model, and it brings PyTorch, so
# `all` does not carry it. structured-data-models needs Python 3.11; on 3.10
# the extra installs nothing, and `SDMClient.in_process()` says why. The marker
# is also what lets the workspace lock resolve.
in-process = ["structured-data-models>=0.2.1,<0.3; python_version >= '3.11'"]
all = [
    "structured-data-models-client[relational,sqlite,duckdb,postgres,snowflake,databricks,lakebase,s3]",
]
test = ["psutil; sys_platform == 'win32'", "pytest", "pytest-xdist", "pytz", "requests-mock", "jsonschema>=4.18", "pyyaml"]

# The Python package is src/sdm_client, py.typed and _native.pyi included;
# the extension module lands beside them. The shipped build has the
# production features only: `test-ops` is for the binding's own tests.
[tool.maturin]
manifest-path = "../../rust/bindings/sdm-py/Cargo.toml"
module-name = "sdm_client._native"
python-source = "src"
locked = true

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = ["--color=yes"]
markers = [
    "live_nim: needs a running NIM",
    "live_warehouse: needs a real Snowflake or Databricks warehouse",
    "socket: binds a local socket; deselect where that is not permitted",
]
