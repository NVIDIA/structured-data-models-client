[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdm-api"
version = "1.0.0"
description = "Universal TFM API wire types for the NVIDIA Structured Data Models client"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "NVIDIA" }]
keywords = ["structured-data", "foundation-model", "openapi", "wire-format"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Deliberately dependency-free. Anything that only needs the wire vocabulary --
# a NIM, a test harness, a future model engine -- picks this up without
# dragging in a parser runtime.
dependencies = []

[project.urls]
Homepage = "https://github.com/NVIDIA/structured-data-models-client"
Source = "https://github.com/NVIDIA/structured-data-models-client"
Issues = "https://github.com/NVIDIA/structured-data-models-client/issues"

[project.optional-dependencies]
test = ["pytest", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdm_api*"]

[tool.setuptools.package-data]
"sdm_api" = ["py.typed"]
"sdm_api.generated" = ["PROVENANCE.json"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = ["--color=yes"]
