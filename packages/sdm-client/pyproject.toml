[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdm-client"
version = "0.1.0"
description = "One Python client for NVIDIA's structured-data foundation model NIMs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "NVIDIA" }]
keywords = ["structured-data", "foundation-model", "tabular", "relational"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# What the base install carries: the wire vocabulary, the language, an HTTP
# session, and frames. A model that does heavy client-side work brings its own
# runtime through an extra instead.
dependencies = [
    "sdm-api==0.1.0",
    "sdm-pql==0.1.0",
    "pandas>=1.5",
    "numpy>=1.23",
    "requests>=2.28",
    "urllib3>=1.26",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/structured-data-models-client"
Source = "https://github.com/NVIDIA/structured-data-models-client"
Issues = "https://github.com/NVIDIA/structured-data-models-client/issues"

[project.optional-dependencies]
# A model that does heavy client-side work brings its own runtime; a warehouse
# driver is opt-in the same way, through the shared connectors package.
relational = ["sdm-relational-engine==0.1.0"]
sqlite = ["sdm-connectors[sqlite]==0.1.0"]
duckdb = ["sdm-connectors[duckdb]==0.1.0"]
snowflake = ["sdm-connectors[snowflake]==0.1.0"]
databricks = ["sdm-connectors[databricks]==0.1.0"]
s3 = ["sdm-connectors[s3]==0.1.0"]
all = [
    "sdm-client[relational,sqlite,duckdb,snowflake,databricks,s3]",
]
test = ["pytest", "requests-mock"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sdm_client*"]

[tool.setuptools.package-data]
"sdm_client" = ["py.typed"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = ["--color=yes"]
markers = [
    "live_nim: needs a running NIM",
    "socket: binds a local socket; deselect where that is not permitted",
]
