versions = ["6.0.0"]
jira = "NO-REF"
exception_status = "open"
exception_expiration = 2027-05-12
comment = "Build dependency of libduckdb-sys only. libduckdb-sys reaches this workspace only through sdm-testkit, the dev-only test host (publish = false). cargo tree -p sdm-py and -p sdm-jni with -e normal,build show no zip on any of the five release targets. No shipped wheel or native library contains it."

