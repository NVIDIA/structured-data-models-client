exclude: ^(packages/sdm-pql/src/predictive_query/|packages/sdm-api/src/sdm_api/generated/tfm_api\.py$|packages/sdm-relational-engine/src/sdm_relational_engine/rfm/assets/mermaid\.min\.js$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-toml
      - id: check-yaml
      - id: no-commit-to-branch

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: repo-hygiene
        name: repository hygiene
        entry: python scripts/check_repo_hygiene.py all
        # `python` rather than `system`: a system hook resolves `python` on
        # PATH, and a mac has only `python3`, so the hook fails to start
        # everywhere it is most likely to be run. The script is stdlib-only,
        # so the interpreter pre-commit provides is enough.
        language: python
        pass_filenames: false
