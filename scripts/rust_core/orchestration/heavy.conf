# The thresholds scripts/rust_core/orchestration/heavy admits a heavy job by
# (T3.0), for this 8-vCPU, 30 GiB machine with / and the local NVMe at
# /mnt/localssd. Two slots: past two, parallel heavy runs lengthen each run
# and push the machine into swap (phase-2/test-speed-investigation.md,
# section 6); a full contract/tests run holds 3.5 to 4 GiB per family file.
SLOTS=2
MIN_FREE_MEM_GB=6
MIN_FREE_DISK_GB=40
DISK=/ /mnt/localssd
POLL=20
CLEAN_EVERY=600
# The owner's rule: two packages at once on this machine ("2026-10-23
# overnight plan"; one from "2026-10-23 cut the tooling back", three from
# 2026-10-22). lane.py start refuses a third active lane; heavy reads
# nothing from it.
MAX_LANES=2
